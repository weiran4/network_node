    function bindEditorEditButtons() {
      editor.querySelectorAll("[data-edit-field]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          openFieldEditor(button.dataset.editField, button.dataset.editLabel, button.dataset.editMultiline === "1");
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
    }

    function bindEditorGroups() {
      editor.querySelectorAll("[data-editor-group]").forEach(group => {
        group.addEventListener("toggle", () => {
          state.editorGroups[group.dataset.editorGroup] = group.open;
        });
      });
    }

    function bindSourceModeButtons() {
      editor.querySelectorAll("[data-source-mode-option]").forEach(button => {
        const activate = event => {
          event.preventDefault();
          event.stopPropagation();
          updateBranchField("sourceMode", button.dataset.sourceModeOption);
        };
        button.addEventListener("pointerdown", event => {
          button.dataset.pointerHandled = "1";
          activate(event);
        });
        button.addEventListener("click", event => {
          if (button.dataset.pointerHandled) {
            delete button.dataset.pointerHandled;
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          activate(event);
        });
      });
    }

    function bindEditorInputs() {
      editor.querySelectorAll("[data-field]").forEach(input => {
        const field = input.dataset.field;
        const committedKey = () => {
          if (input.type === "checkbox") return String(input.checked);
          if (input.type === "radio") return `${input.checked}:${input.value}`;
          return input.value;
        };
        input.dataset.lastCommittedValue = committedKey();
        const commitInput = () => {
          if (input.type === "radio" && !input.checked) return;
          const nextValue = committedKey();
          if (input.dataset.lastCommittedValue === nextValue) return;
          updateBranchField(field, input.type === "checkbox" ? input.checked : input.value);
          input.dataset.lastCommittedValue = nextValue;
        };
        input.addEventListener("change", commitInput);
        if (input.tagName === "SELECT") {
          let selectMonitor = null;
          const stopSelectMonitor = () => {
            commitInput();
            if (selectMonitor) {
              clearInterval(selectMonitor);
              selectMonitor = null;
            }
          };
          const startSelectMonitor = () => {
            if (selectMonitor) return;
            selectMonitor = setInterval(() => {
              if (!input.isConnected) {
                clearInterval(selectMonitor);
                selectMonitor = null;
                return;
              }
              commitInput();
            }, 120);
          };
          input.addEventListener("input", commitInput);
          input.addEventListener("focus", startSelectMonitor);
          input.addEventListener("pointerdown", startSelectMonitor);
          input.addEventListener("blur", stopSelectMonitor);
          input.addEventListener("keyup", commitInput);
          input.addEventListener("pointerup", () => setTimeout(commitInput, 0));
          startSelectMonitor();
        }
        if (input.type === "radio") {
          const radioMonitor = setInterval(() => {
            if (!input.isConnected) {
              clearInterval(radioMonitor);
              return;
            }
            commitInput();
          }, 120);
        }
        input.addEventListener("keydown", keyEvent => {
          if (keyEvent.key === "Enter" && input.tagName !== "TEXTAREA") {
            keyEvent.preventDefault();
            updateBranchField(field, input.value);
            input.dataset.lastCommittedValue = input.value;
            input.blur();
          }
          if (keyEvent.key === "Escape") {
            input.value = input.dataset.lastCommittedValue || input.value;
            input.blur();
          }
        });
      });
      editor.querySelectorAll("[data-package-case-index]").forEach(input => {
        input.dataset.lastCommittedValue = input.value;
        input.addEventListener("change", () => {
          const branch = findBranch(state.selectedId);
          updatePackagedInnerCase(branch, Number(input.dataset.packageCaseIndex), input.value);
          input.dataset.lastCommittedValue = input.value;
        });
      });
      editor.querySelectorAll("[data-package-network-case-active]").forEach(input => {
        input.dataset.lastCommittedValue = input.value;
        input.addEventListener("change", () => {
          const branch = findBranch(state.selectedId);
          setActivePackageNetworkCase(branch, input.value);
          input.dataset.lastCommittedValue = input.value;
        });
      });
      editor.querySelectorAll("[data-package-network-action]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const branch = findBranch(state.selectedId);
          if (button.dataset.packageNetworkAction === "duplicate") duplicateActivePackageNetworkCase(branch);
          if (button.dataset.packageNetworkAction === "edit") startPackageCaseEdit(branch);
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
    }

    function bindAutoAlignPortsButton(branchId) {
      bindEditorActionButton("alignPortRoots", () => alignPortRoots(branchId));
      bindEditorActionButton("alignPortEnds", () => alignSameSidePortEnds(branchId));
    }

    function bindPackagedGConstButtons(branchId) {
      editor.querySelectorAll("[data-packaged-gconst-all]").forEach(button => {
        const action = () => setPackagedGConstAll(branchId, button.getAttribute("data-packaged-gconst-all") === "1");
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          button.dataset.pointerHandled = "1";
          action();
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          if (button.dataset.pointerHandled === "1") {
            delete button.dataset.pointerHandled;
            return;
          }
          action();
        });
      });
    }

    function bindEditorActionButton(id, action) {
      const button = document.getElementById(id);
      if (!button) return;
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();
        button.dataset.pointerHandled = "1";
        action();
      });
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (button.dataset.pointerHandled === "1") {
          delete button.dataset.pointerHandled;
          return;
        }
        action();
      });
    }

    function autoAlignPorts(branchId) {
      alignPortRoots(branchId);
      alignSameSidePortEnds(branchId);
    }

    function setPackagedGConstAll(branchId, isConstant) {
      const branch = findBranch(branchId);
      if (!branch?.packageOriginal) return;
      commitHistory();
      invalidateMathCaches();
      packagedGBranches(branch).forEach(({ inner }) => {
        inner.gIsConstant = Boolean(isConstant);
      });
      render();
    }

    function alignPortRoots(branchId) {
      const branch = findBranch(branchId);
      if (!branch || branch.kind !== "custom_n_port") return;
      commitHistory();
      const layout = customPortLayout(branch);
      const sides = ["left", "right", "top", "bottom"];
      const bySide = new Map(sides.map(side => [side, []]));
      layout.forEach((item, index) => {
        const position = terminalDrawPosition(branch, item.id);
        const side = inferPortSideFromPosition(branch, position);
        bySide.get(side).push({
          ...item,
          side,
          order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
          sortValue: side === "left" || side === "right" ? position.y : position.x
        });
      });
      const nextLayout = [];
      const nextAnchors = {};
      sides.forEach(side => {
        const items = bySide.get(side).sort((a, b) => a.sortValue - b.sortValue || a.order - b.order);
        return items.map((item, index) => (
          {
            id: item.id,
            side,
            t: alignedPortTFromCurrentPosition(branch, side, item.sortValue),
            axis: item.axis,
            order: index
          }
        )).forEach(item => {
          nextLayout.push(item);
          nextAnchors[item.id] = { ...alignedLeadAnchor(branch, item.side, item.t), side: item.side };
        });
      });
      branch.portLayout = nextLayout;
      branch.leadAnchors = nextAnchors;
      render();
    }

    function alignSameSidePortEnds(branchId) {
      const branch = findBranch(branchId);
      if (!branch || branch.kind !== "custom_n_port") return;
      commitHistory();
      const layout = customPortLayout(branch);
      const sides = ["left", "right", "top", "bottom"];
      const bySide = new Map(sides.map(side => [side, []]));
      layout.forEach((item, index) => {
        const position = terminalDrawPosition(branch, item.id);
        const side = inferPortSideFromPosition(branch, position);
        bySide.get(side).push({
          ...item,
          side,
          order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
          sortValue: side === "left" || side === "right" ? position.y : position.x
        });
      });
      const nextLayout = [];
      const nextTerminalLayout = { ...(branch.terminalLayout || {}) };
      sides.forEach(side => {
        const items = bySide.get(side).sort((a, b) => a.sortValue - b.sortValue || a.order - b.order);
        const axis = alignedOuterAxisWorld(branch, side, items);
        items.forEach((item, index) => {
          const position = terminalDrawPosition(branch, item.id);
          const nextPosition = side === "left" || side === "right"
            ? { x: axis, y: position.y }
            : { x: position.x, y: axis };
          nextTerminalLayout[item.id] = {
            x: Math.round((nextPosition.x - branch.x) * 10) / 10,
            y: Math.round((nextPosition.y - branch.y) * 10) / 10
          };
          nextLayout.push({
            ...item,
            side,
            order: index
          });
        });
      });
      branch.portLayout = nextLayout;
      branch.terminalLayout = nextTerminalLayout;
      render();
    }

    function inferPortSideFromPosition(branch, point) {
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      const outside = [
        { side: "left", distance: left - point.x },
        { side: "right", distance: point.x - right },
        { side: "top", distance: top - point.y },
        { side: "bottom", distance: point.y - bottom }
      ].filter(item => item.distance > 0)
        .sort((a, b) => b.distance - a.distance);
      if (outside.length) return outside[0].side;
      const nearest = [
        { side: "left", distance: Math.abs(point.x - left) },
        { side: "right", distance: Math.abs(point.x - right) },
        { side: "top", distance: Math.abs(point.y - top) },
        { side: "bottom", distance: Math.abs(point.y - bottom) }
      ].sort((a, b) => a.distance - b.distance);
      return nearest[0].side;
    }

    function alignedOuterAxis(branch, side, items) {
      const worldAxis = alignedOuterAxisWorld(branch, side, items);
      return portAxisLocal(branch, side, worldAxis);
    }

    function alignedOuterAxisWorld(branch, side, items) {
      if (!items.length) return null;
      const axisValues = items.map(item => {
        const position = terminalDrawPosition(branch, item.id);
        return side === "left" || side === "right" ? position.x : position.y;
      });
      return Math.min(...axisValues);
    }

    function alignedPortTFromCurrentPosition(branch, side, coordinate) {
      const left = branch.x - branch.width / 2;
      const top = branch.y - branch.height / 2;
      const raw = side === "left" || side === "right"
        ? (coordinate - top) / branch.height
        : (coordinate - left) / branch.width;
      return Math.max(0.08, Math.min(0.92, raw));
    }

    function alignedLeadAnchor(branch, side, t) {
      const x = side === "left"
        ? -branch.width / 2
        : side === "right"
          ? branch.width / 2
          : -branch.width / 2 + t * branch.width;
      const y = side === "top"
        ? -branch.height / 2
        : side === "bottom"
          ? branch.height / 2
          : -branch.height / 2 + t * branch.height;
      return {
        x: Math.round(x * 10) / 10,
        y: Math.round(y * 10) / 10
      };
    }

    function parsePortLayout(value, branch) {
      try {
        const parsed = JSON.parse(value);
        if (!Array.isArray(parsed)) throw new Error();
        const ports = new Set(terminalSides(branch));
        return parsed
          .filter(item => item && ports.has(item.id))
          .map((item, index) => ({
            id: item.id,
            side: ["left", "right", "top", "bottom"].includes(item.side) ? item.side : "left",
            t: Number.isFinite(Number(item.t)) ? Math.max(0.08, Math.min(0.92, Number(item.t))) : undefined,
            axis: Number.isFinite(Number(item.axis)) ? Number(item.axis) : undefined,
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index
          }));
      } catch {
        return branch.portLayout;
      }
    }

    function validateCustomBranch(branch) {
      const warnings = [];
      if (branch.packageOriginal) return warnings;
      const ports = terminalSides(branch);
      const gRows = parseMatrixRows(branchValue(branch, "gMatrix"));
      const ihisRows = parseMatrixRows(branchValue(branch, "ihisVector"));
      if (gRows.length !== ports.length || gRows.some(row => row.length !== ports.length)) {
        warnings.push(optText(
          `局部 G 矩阵尺寸应为 ${ports.length} x ${ports.length}，并与端口顺序 ${ports.join(", ")} 对应。`,
          `Local G matrix must be ${ports.length} x ${ports.length} and match port order ${ports.join(", ")}.`
        ));
      }
      if (ihisRows.length !== ports.length || ihisRows.some(row => row.length !== 1)) {
        warnings.push(optText(
          `局部 Ihis 向量尺寸应为 ${ports.length} x 1。`,
          `Local Ihis vector must be ${ports.length} x 1.`
        ));
      }
      return warnings;
    }

    function validateCustomCurrent(branch, current, index) {
      const warnings = [];
      const ports = new Set(terminalSides(branch));
      const knownLabels = new Set(terminalSides(branch).map(side => branch.nodes?.[side]).filter(Boolean));
      const known = value => ports.has(value) || knownLabels.has(value);
      if (!branch.packageOriginal && !known(current.from)) warnings.push(optText(
        `观测支路 ${index + 1}: from 必须是端口名或节点名之一。`,
        `Observed branch ${index + 1}: from must be a port name or node name.`
      ));
      if (!branch.packageOriginal && !known(current.to)) warnings.push(optText(
        `观测支路 ${index + 1}: to 必须是端口名或节点名之一。`,
        `Observed branch ${index + 1}: to must be a port name or node name.`
      ));
      if (branch.packageOriginal) {
        const packagedPorts = new Set(packagedPortDisplayMap(branch).keys());
        extractVoltageRefs(current.expression).forEach(ref => {
          if (!packagedPorts.has(ref)) warnings.push(optText(
            `观测支路 ${index + 1}: 公式中 V_${ref} 没有对应打包节点。`,
            `Observed branch ${index + 1}: V_${ref} in the formula has no matching packaged node.`
          ));
        });
      }
      return warnings;
    }

    function customObserverNodeId(branch, value) {
      const raw = String(value || "").trim();
      const ports = terminalSides(branch);
      if (ports.includes(raw)) return raw;
      const netMatched = ports.find(side => terminalNetName(terminalKey(branch.id, side)) === raw);
      if (netMatched) return netMatched;
      const matched = ports.find(side => branch.nodes?.[side] === raw);
      return matched || raw;
    }

    function customObserverDisplayName(branch, value) {
      const id = customObserverNodeId(branch, value);
      if (terminalSides(branch).includes(id)) return terminalNetName(terminalKey(branch.id, id));
      return value || id;
    }

    function customObserverFormulaPreview(branch, current) {
      const name = current.name || "observer";
      const from = customObserverDisplayName(branch, current.from);
      const to = customObserverDisplayName(branch, current.to);
      const g = current.g || "0";
      const ihis = current.ihis || "0";
      return `i_${name}_${from}_to_${to} = (${g}) * (V_${from} - V_${to}) + ${ihis}`;
    }

    function observerFormulaPreviewCard(branch, current) {
      const line = customObserverFormulaPreview(branch, current);
      return `
        <div class="inline-formula-preview">
          <div class="formula-name">${escapeHtml(tr("公式"))}</div>
          <div class="formula-line">
            <span class="formula-lhs">${formatLhs(line.slice(0, line.indexOf("=")).trim())}</span>
            <span class="formula-eq">=</span>
            <span class="formula-rhs">${formatMath(line.slice(line.indexOf("=") + 1).trim())}</span>
          </div>
        </div>
      `;
    }

    function buildBlackBoxValidationPayload(branch) {
      const ports = terminalSides(branch);
      return {
        nodes: ports,
        G_bb: parseMatrixRows(branchValue(branch, "gMatrix")),
        Ihis_bb: parseMatrixRows(branchValue(branch, "ihisVector")).map(row => row[0] ?? "0"),
        observers: (branch.currents || []).map(current => ({
          name: current.name || "observer",
          from_node: customObserverNodeId(branch, current.from),
          to_node: customObserverNodeId(branch, current.to),
          G: current.g || "0",
          Ihis: current.ihis || "0",
          description: current.description || ""
        }))
      };
    }

    function blackBoxValidationStatusMessage(status, backendMessages = []) {
      if (state.language === "en") return backendMessages.join(" ");
      if (status === "floating") return "该黑盒未定义支路电流观测器，因此支路电流不可观测/悬空。";
      if (status === "matched") return "用户定义的支路电流观测器可以完整复现黑盒 G/Ihis。";
      if (status === "mismatch") {
        return "用户定义的支路电流观测器不能完整复现黑盒 G/Ihis。节点消元仍使用用户输入的 G/Ihis；但支路电流 observers 可能不完整或不一致。";
      }
      return backendMessages.join(" ");
    }

    function blackBoxValidationWarnings(warnings = []) {
      if (state.language === "en") return warnings;
      return warnings.map(warning =>
        warning.replace(
          "Observer uses symbols not present in the black-box G/Ihis:",
          "Observer 使用了未出现在黑盒 G/Ihis 中的符号："
        )
      );
    }

    function renderBlackBoxValidationResult(branch, result) {
      const statusClass = result.status === "matched"
        ? "validation-success"
        : (result.status === "floating" ? "validation-neutral" : "validation-warning");
      const statusText = blackBoxValidationStatusMessage(result.status, result.messages || []);
      const rows = result.observer_rows || [];
      const observerLines = rows.map(row => {
        const from = customObserverDisplayName(branch, row.from_node);
        const to = customObserverDisplayName(branch, row.to_node);
        return `i_${row.name}_${from}_to_${to} = ${row.expression}`;
      });
      return `
        <div class="${statusClass}">
          <strong>${escapeHtml(result.status || "unknown")}</strong><br>
          ${escapeHtml(statusText)}
        </div>
        ${(result.warnings || []).length ? `<div class="validation-neutral">${blackBoxValidationWarnings(result.warnings).map(escapeHtml).join("<br>")}</div>` : ""}
        <div class="formula-list">
          <div class="formula-card">
            <div class="formula-name">G_obs</div>
            <div class="matrix-equation">${renderMatrix(result.G_obs || [])}</div>
          </div>
          <div class="formula-card">
            <div class="formula-name">Ihis_obs</div>
            <div class="matrix-equation">${renderVectorMatrix(result.Ihis_obs || [])}</div>
          </div>
          <div class="formula-card">
            <div class="formula-name">Delta_G</div>
            <div class="matrix-equation">${renderMatrix(result.Delta_G || [])}</div>
          </div>
          <div class="formula-card">
            <div class="formula-name">Delta_Ihis</div>
            <div class="matrix-equation">${renderVectorMatrix(result.Delta_Ihis || [])}</div>
          </div>
          ${observerLines.length ? observerLines.map(line => renderFormulaCard(line)).join("") : ""}
        </div>
      `;
    }

    function renderBlackBoxValidationAsync(branchId) {
      const branch = findBranch(branchId);
      const target = document.getElementById("blackBoxValidationResult");
      if (!branch || !target || branch.kind !== "custom_n_port" || branch.packageOriginal) return;
      target.innerHTML = `<div class="formula-empty">${escapeHtml(tr("正在校验黑盒支路电流观测器..."))}</div>`;
      requestBlackBoxValidation(buildBlackBoxValidationPayload(branch))
        .then(result => {
          const current = findBranch(branchId);
          const nextTarget = document.getElementById("blackBoxValidationResult");
          if (!current || !nextTarget || state.selectedId !== branchId) return;
          nextTarget.innerHTML = renderBlackBoxValidationResult(current, result);
        })
        .catch(error => {
          const nextTarget = document.getElementById("blackBoxValidationResult");
          if (nextTarget) nextTarget.innerHTML = `<div class="validation-warning">${escapeHtml(error.message || String(error))}</div>`;
        });
    }

    function packagedInfo(branch) {
      const pkg = branch.packageOriginal;
      if (!pkg) return "";
      const externalGroups = pkg.externalGroups || [];
      const external = externalGroups.map(group => group.display);
      const externalNow = externalGroups.map((group, index) => branch.nodes?.[group.port] || terminalSides(branch)[index] || group.display);
      const internal = (pkg.internalGroups || []).map(group => group.display);
      const noneText = state.language === "en" ? "none" : "无";
      const externalMapping = externalGroups.length
        ? externalGroups.map((group, index) => {
          const port = group.port || terminalSides(branch)[index] || "";
          return state.language === "en" ? `${group.display} maps to port ${port}` : `${group.display} 对应端口 ${port}`;
        }).join(state.language === "en" ? "; " : "；")
        : noneText;
      const recovery = internal.length
        ? `<div class="ybox-formula">${internal.map((name, row) => {
          const voltageTerms = external.map((externalName, col) => {
            const coeff = pkg.K_v?.[row]?.[col] || "0";
            return isZero(coeff) ? "" : `(${coeff})*V_${externalName}`;
          }).filter(Boolean);
          const history = pkg.K_h?.[row] || "0";
          if (!isZero(history)) voltageTerms.push(history);
          const rhs = voltageTerms.length ? voltageTerms.join(" + ") : "0";
          return `<div class="ybox-formula-line">${formatMath(`V_${name}`)} = ${formatMath(rhs)}</div>`;
        }).join("")}</div>`
        : `<div>${escapeHtml(tr("这个打包黑盒没有内部消去节点。"))}</div>`;
      const internalText = internal.length
        ? state.language === "en"
          ? `Internal node${internal.length > 1 ? "s" : ""}: ${internal.join(", ")} are hidden by default. Expose them from the node list when they need to connect to external circuits.`
          : `内部节点：${internal.join(", ")} 默认隐藏；需要与外部电路连接时，可在节点列表中选择暴露。`
        : "";
      return `
        <div class="ybox-info">
          <div class="ybox-info-title">${escapeHtml(tr("Y 节点黑盒说明"))}</div>
          <div>${escapeHtml(tr("当前外部端口"))}: ${escapeHtml(externalNow.join(", ") || noneText)}</div>
          <div>${escapeHtml(tr("打包来源"))}: ${escapeHtml(externalMapping)}</div>
          ${internalText ? `<div>${escapeHtml(internalText)}</div>` : ""}
          ${recovery}
        </div>
      `;
    }

    function extractVoltageRefs(expression) {
      const refs = new Set();
      String(expression || "").replace(/\bV_([A-Za-z][A-Za-z0-9_]*)\b/g, (_, name) => {
        refs.add(name);
        return "";
      });
      return Array.from(refs);
    }

    function parseMatrixRows(text) {
      try {
        const inner = stripOuterBrackets(String(text || "").trim());
        if (!inner) return [];
        return splitTopLevel(inner).map(row => splitTopLevel(stripOuterBrackets(row.trim())));
      } catch {
        return [];
      }
    }

    function groupHasDummyTerminal(group) {
      return (group?.members || []).some(member => terminalIsDummyNode(member));
    }

    function renderNetList() {
      sanitizeDummyProtectedInternalNodes();
      const groups = mergePackagedRowsInOriginalOrder(orderedNetGroups(), packagedHiddenNodeRows());
      if (!groups.length) {
        netList.innerHTML = `<div class="empty">暂无节点。</div>`;
        return;
      }
      const rowName = group => group.virtualInternal ? group.display : nodeDisplayName(group.id);
      const rowColor = group => group.virtualInternal ? group.color : netColor(group.id);
      const groundSet = new Set(groundNodesFromGroups(groups));
      const dummyProtectedIds = dummyProtectedNetIds();
      const isolatedDummyIds = dummyNodeBlockNetIds();
      const rowGround = group => !group.virtualInternal && groundSet.has(group.id);
      const rowInternal = group => !rowGround(group) && !dummyProtectedIds.has(group.id) && (group.virtualInternal || state.internalNodes.includes(group.id));
      const rowDummy = group => Boolean(group.isolatedDummyInternal) || (!group.virtualInternal && (dummyProtectedIds.has(group.id) || groupHasDummyTerminal(group)));
      const rowExposure = group => group.virtualInternal
        ? (group.customHidden
          ? { custom: true, branchId: group.branchId, port: group.port, exposed: false }
          : { branchId: group.branchId, kind: group.packageKind || "internal", index: group.internalIndex, exposed: false })
        : (() => {
          for (const member of group.members || []) {
            const parsed = parseTerminal(member);
            const branch = findBranch(parsed.branchId);
            if (branch?.kind === "custom_n_port" && !branch.packageOriginal) {
              return { custom: true, branchId: branch.id, port: parsed.side, exposed: true };
            }
          }
          const info = exposedPackagedNodeForGroup(group);
          return info ? { branchId: info.branch.id, kind: info.kind, index: info.index, exposed: true } : null;
        })();
      const rowInternalButtonAttr = group => {
        if (rowGround(group) || isolatedDummyIds.has(group.id) || dummyProtectedIds.has(group.id)) return "disabled";
        if (group.virtualInternal) {
          return group.customHidden
            ? `data-custom-node-external="${group.branchId}:${group.port}"`
            : `data-packaged-node-external="${group.branchId}:${group.packageKind || "internal"}:${group.internalIndex}"`;
        }
        return `data-internal-node="${group.id}"`;
      };
      const rowInternalButtonTitle = group => {
        if (rowGround(group)) return tr("Ground / V=0");
        if (isolatedDummyIds.has(group.id) || group.isolatedDummyInternal) return tr("N-Dummy 节点会在 C 导出时强制消去。");
        if (dummyProtectedIds.has(group.id)) return tr("Dummy anchor 不能被设为内部节点。");
        if (group.virtualInternal) return tr("隐藏节点会强制作为内部节点参与消元。");
        return tr("切换外部/内部节点");
      };
      const terminalMappingHtml = groups.map(group => {
        if (group.virtualInternal) {
          return `<div class="field"><label>${escapeHtml(rowName(group))}</label><input readonly value="${escapeHtml(`${tr("未暴露")} - ${group.branchName}`)}"></div>`;
        }
        const names = group.members.map(key => {
          const parsed = parseTerminal(key);
          const branch = findBranch(parsed.branchId);
          return `${branch.name}.${parsed.side}`;
        }).join(", ");
        return `<div class="field"><label>${escapeHtml(nodeDisplayName(group.id))}</label><input readonly value="${escapeHtml(names)}"></div>`;
      }).join("");
      netList.innerHTML = `
        <div class="field">
          <label>${escapeHtml(tr("节点顺序"))}</label>
          <div class="node-order-list" id="nodeOrderList">
            ${groups.map(group => `
              <div class="node-order-item ${state.hoverNetId === group.id ? "hovering" : ""} ${(state.selectedNetIds || []).includes(group.id) ? "selected" : ""}" ${group.virtualInternal ? "" : `data-node-id="${group.id}"`} data-hover-net="${group.id}">

                  <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                ${!group.virtualInternal && state.colorPickerNodeId === group.id ? `
                  <div class="node-color-palette" data-node-color-palette="${group.id}" aria-label="${escapeHtml(tr("节点颜色"))}">
                    ${NODE_COLOR_PALETTE.map(color => `
                      <button class="node-color-swatch ${netColor(group.id) === color ? "active" : ""}" data-node-color="${group.id}" data-color="${color}" type="button" draggable="false" style="background:${color}" title="${escapeHtml(tr("节点颜色"))}" aria-label="${escapeHtml(tr("节点颜色"))}"></button>
                    `).join("")}
                  </div>
                ` : ""}
              </div>
            `).join("")}
          </div>
        </div>
        <details class="editor-group node-terminal-map">
          <summary>${escapeHtml(tr("节点端子映射"))}</summary>
          <div class="editor-group-body">
            <div class="field-caption">${escapeHtml(tr("主要用于检查后端节点组装；通常不需要展开。"))}</div>
            ${terminalMappingHtml}
          </div>
        </details>
      `;
      bindNodeOrderDrag();
      netList.querySelectorAll("[data-hover-net]").forEach(item => {
        item.addEventListener("pointerdown", event => {
          if (event.target.closest("button") || event.target.closest(".node-drag-handle")) return;
          event.preventDefault();
          event.stopPropagation();
          const id = item.dataset.hoverNet;
          if (!id || id.startsWith("pkg-internal:")) return;
          const selected = new Set(event.shiftKey ? (state.selectedNetIds || []) : []);
          if (selected.has(id)) selected.delete(id); else selected.add(id);
          state.selectedNetIds = [...selected];
          state.selectedIds = [];
          state.selectedId = null;
          state.selectedWireId = null;
          render();
        });
        item.addEventListener("pointerenter", () => {
          state.hoverNetId = item.dataset.hoverNet;
          renderBranches();
          item.classList.add("hovering");
        });
        item.addEventListener("pointerleave", () => {
          if (state.hoverNetId === item.dataset.hoverNet) state.hoverNetId = null;
          renderBranches();
          item.classList.remove("hovering");
        });
      });
      netList.querySelectorAll("[data-node-color-menu]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          state.colorPickerNodeId = state.colorPickerNodeId === button.dataset.nodeColorMenu ? null : button.dataset.nodeColorMenu;
          renderNetList();
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-node-color]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          setNodeColor(button.dataset.nodeColor, button.dataset.color);
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-rename-node]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          renameNode(button.dataset.renameNode);
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-packaged-node-expose]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const [branchId, kind, indexText, action] = button.dataset.packagedNodeExpose.split(":");
          setPackagedNodeExposure(branchId, kind, Number(indexText), action === "show");
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-packaged-node-external]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const [branchId, kind, indexText] = button.dataset.packagedNodeExternal.split(":");
          exposePackagedNodeAsExternal(branchId, kind, Number(indexText));
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-custom-node-expose]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const [branchId, port, action] = button.dataset.customNodeExpose.split(":");
          setCustomPortExposure(branchId, port, action === "show");
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-custom-node-external]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const [branchId, port] = button.dataset.customNodeExternal.split(":");
          exposeCustomPortAsExternal(branchId, port);
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
      netList.querySelectorAll("[data-internal-node]").forEach(input => {
        input.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          const id = input.dataset.internalNode;
          if (!state.internalNodes.includes(id)) {
            if (dummyProtectedNetIds().has(id)) {
              alert(dummyNetIds().has(id)
                ? optText("Dummy 节点不能被设为内部节点。", "Dummy node cannot be marked as an internal node.")
                : optText("Dummy anchor 不能被设为内部节点。", "Dummy anchor cannot be marked as an internal node."));
              return;
            }
            if (!state.internalNodes.includes(id)) state.internalNodes.push(id);
          } else {
            state.internalNodes = state.internalNodes.filter(item => item !== id);
          }
          invalidateMathCaches();
          renderNetList();
          renderOutput();
        });
        input.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
        });
      });
    }

    function bindNodeOrderDrag() {
      const list = document.getElementById("nodeOrderList");
      if (!list) return;
      let draggedId = null;
      let draggedIds = [];

      list.querySelectorAll(".node-order-item[data-node-id]").forEach(item => {
        const handle = item.querySelector(".node-drag-handle");
        handle.addEventListener("dragstart", event => {
          draggedId = item.dataset.nodeId;
          const selectedNodes = new Set(state.selectedNetIds || []);
          draggedIds = selectedNodes.has(draggedId) && selectedNodes.size > 1
            ? Array.from(list.querySelectorAll(".node-order-item[data-node-id]")).map(row => row.dataset.nodeId).filter(id => selectedNodes.has(id))
            : [draggedId];
          draggedIds.forEach(id => list.querySelector(`.node-order-item[data-node-id="${CSS.escape(id)}"]`)?.classList.add("dragging"));
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedIds.join(","));
        });
        handle.addEventListener("dragend", () => {
          list.querySelectorAll(".node-order-item.dragging").forEach(row => row.classList.remove("dragging"));
          state.nodeOrder = Array.from(list.querySelectorAll(".node-order-item[data-node-id]")).map(row => row.dataset.nodeId);
          invalidateMathCaches();
          draggedId = null;
          draggedIds = [];
          renderNetList();
          renderOutput();
        });
      });
      list.addEventListener("dragover", event => {
        event.preventDefault();
        const draggingRows = draggedIds
          .map(id => list.querySelector(`.node-order-item[data-node-id="${CSS.escape(id)}"]`))
          .filter(Boolean);
        if (!draggingRows.length || !draggedId) return;
        const after = nodeOrderDropTarget(list, event.clientY);
        if (after) {
          draggingRows.forEach(row => list.insertBefore(row, after));
        } else {
          draggingRows.forEach(row => list.appendChild(row));
        }
      });
    }

    function nodeOrderDropTarget(list, y) {
      return Array.from(list.querySelectorAll(".node-order-item[data-node-id]:not(.dragging)"))
        .map(item => {
          const box = item.getBoundingClientRect();
          return { item, offset: y - box.top - box.height / 2 };
        })
        .filter(entry => entry.offset < 0)
        .sort((a, b) => b.offset - a.offset)[0]?.item || null;
    }

    function branchCurrentHighlight(branch) {
      if (!state.hoverCurrent || state.hoverCurrent.branchId !== branch.id) return null;
      return state.hoverCurrent.part || "whole";
    }

    function currentIndexFromHighlight(highlight) {
      const match = String(highlight || "").match(/^current:(\d+)$/);
      return match ? Number(match[1]) : -1;
    }

    function transformerHoverArea(branch, highlight, left, top, width, height) {
      if (!highlight) return "";
      const normalized = String(highlight).toLowerCase();
      if (!normalized.includes("primary") && !normalized.includes("secondary")) return "";
      const x = normalized.includes("primary") ? left : branch.x;
      return `<rect class="current-hover-area" x="${x}" y="${top}" width="${width / 2}" height="${height}" rx="8"></rect>`;
    }

    function netHoverClass(netId) {
      return netId && netId === state.hoverNetId ? " net-hover-highlight" : "";
    }

    function customPortForDisplayLabel(branch, label, fallbackSide = "") {
      const ports = terminalSides(branch);
      if (ports.includes(label)) return label;
      const direct = ports.find(side => branch.nodes?.[side] === label);
      if (direct) return direct;
      const mapped = branch.packageOriginal?.externalGroups?.find(group =>
        group.display === label || branch.nodes?.[group.port] === label
      );
      if (mapped?.port && ports.includes(mapped.port)) return mapped.port;
      return ports.includes(fallbackSide) ? fallbackSide : "";
    }

    function customInsidePortPoint(branch, side) {
      const port = terminalDrawPosition(branch, side);
      const layout = customPortLayout(branch).find(item => item.id === side);
      const edge = layout?.side || "left";
      const anchor = customLeadInnerPoint(branch, port.x, port.y, edge, side);
      const inset = 16;
      if (edge === "left") return { x: Math.min(anchor.x + inset, branch.x - 8), y: anchor.y };
      if (edge === "right") return { x: Math.max(anchor.x - inset, branch.x + 8), y: anchor.y };
      if (edge === "top") return { x: anchor.x, y: Math.min(anchor.y + inset, branch.y - 8) };
      return { x: anchor.x, y: Math.max(anchor.y - inset, branch.y + 8) };
    }

    function customFloatingObserverLabels(branch) {
      const labels = [];
      const add = label => {
        if (!label || labels.includes(label)) return;
        if (customPortForDisplayLabel(branch, label)) return;
        labels.push(label);
      };
      (branch.packageOriginal?.internalGroups || []).forEach(group => add(group.display));
      (branch.currents || []).forEach(current => {
        add(current.fromLabel);
        add(current.toLabel);
      });
      return labels;
    }

    function customInternalObserverLabels(branch) {
      return (branch.packageOriginal?.internalGroups || [])
        .map(group => group.display)
        .filter(Boolean);
    }

    function customFloatingLabelPoint(branch, label) {
      const internalLabels = customInternalObserverLabels(branch);
      const labels = internalLabels.includes(label) ? internalLabels : customFloatingObserverLabels(branch);
      let index = labels.indexOf(label);
      if (index < 0) {
        index = Math.abs(String(label || "").split("").reduce((sum, char) => sum + char.charCodeAt(0), 0)) % 9;
      }
      const count = Math.max(labels.length, index + 1, 1);
      const cols = Math.min(3, Math.ceil(Math.sqrt(count)));
      const rows = Math.ceil(count / cols);
      const col = index % cols;
      const row = Math.floor(index / cols);
      const internal = internalLabels.includes(label);
      const xStep = Math.min(internal ? 36 : 46, Math.max(28, branch.width / (cols + 1)));
      const yStep = Math.min(internal ? 28 : 34, Math.max(22, branch.height / (rows + 2)));
      return {
        x: branch.x + (col - (cols - 1) / 2) * xStep,
        y: branch.y + (internal ? 6 : -6) + (row - (rows - 1) / 2) * yStep
      };
    }

    function customObserverEndpointVisual(branch, current, endpoint) {
      const side = current?.[endpoint];
      const explicitLabel = current?.[`${endpoint}Label`];
      const label = explicitLabel || branch.nodes?.[side] || side;
      const port = customPortForDisplayLabel(branch, label, explicitLabel ? "" : side);
      return {
        label,
        point: port ? customInsidePortPoint(branch, port) : customFloatingLabelPoint(branch, label)
      };
    }

    function customCurrentHoverOverlay(branch, highlight) {
      const index = currentIndexFromHighlight(highlight);
      const current = branch.currents?.[index];
      if (!current) return "";
      const from = customObserverEndpointVisual(branch, current, "from");
      const to = customObserverEndpointVisual(branch, current, "to");
      const midX = (from.point.x + to.point.x) / 2;
      const midY = (from.point.y + to.point.y) / 2;
      const lift = Math.max(18, Math.min(44, Math.abs(from.point.x - to.point.x) * 0.16 + Math.abs(from.point.y - to.point.y) * 0.08));
      const c1 = { x: (from.point.x + midX) / 2, y: midY - lift };
      const c2 = { x: (to.point.x + midX) / 2, y: midY - lift };
      const path = `M ${from.point.x} ${from.point.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${to.point.x} ${to.point.y}`;
      const label = item => {
        const text = String(item.label || "");
        const w = Math.max(24, Math.min(72, text.length * 7 + 14));
        return `
          <circle class="box-current-node" cx="${item.point.x}" cy="${item.point.y}" r="8"></circle>
          <rect class="box-current-node-label-bg" x="${item.point.x - w / 2}" y="${item.point.y - 27}" width="${w}" height="18" rx="5"></rect>
          <text class="box-current-node-label" x="${item.point.x}" y="${item.point.y - 18}">${escapeSvg(text)}</text>
        `;
      };
      return `
        <path class="box-current-path" d="${path}" marker-end="url(#arrow)"></path>
        ${label(from)}
        ${from.label === to.label ? "" : label(to)}
      `;
    }

    function packagedInternalHoverOverlay(branch) {
      if (!branch.packageOriginal || !state.hoverNetId) return "";
      const groups = branch.packageOriginal.internalGroups || [];
      const index = groups.findIndex((group, i) => packagedInternalNodeId(branch, group, i) === state.hoverNetId);
      if (index < 0) return "";
      const label = groups[index].display || groups[index].id || `internal_${index + 1}`;
      const point = customFloatingLabelPoint(branch, label);
      const width = Math.max(28, Math.min(80, String(label).length * 8 + 16));
      return `
        <circle class="box-current-node" cx="${point.x}" cy="${point.y}" r="10"></circle>
        <rect class="box-current-node-label-bg" x="${point.x - width / 2}" y="${point.y - 31}" width="${width}" height="20" rx="5"></rect>
        <text class="box-current-node-label" x="${point.x}" y="${point.y - 18}">${escapeSvg(label)}</text>
      `;
    }

    function renderBranches() {
      branchLayer.innerHTML = "";
      const nets = netLookup();
      state.branches.forEach(branch => {
        const selected = state.selectedIds.includes(branch.id) || state.selectedId === branch.id;
        if (branch.kind === "single_phase_transformer") {
          renderTransformer(branch, selected, nets);
          return;
        }
        if (branch.kind === "custom_n_port") {
          renderCustomNPort(branch, selected, nets);
          return;
        }
        if (branch.kind === "dummy_node_block") {
          renderDummyNodeBlock(branch, selected, nets);
          return;
        }
        if (branch.kind === "current_source") {
          renderCurrentSource(branch, selected, nets);
          return;
        }
        if (branch.kind === "voltage_source_series_r") {
          renderVoltageSourceSeriesR(branch, selected, nets);
          return;
        }
        if (branch.kind === "ground") {
          renderGround(branch, selected, nets);
          return;
        }
        const bodyWidth = Math.max(50, (branch.width || 150) - 56);
        const bodyHeight = Math.max(32, branch.height || 48);
        const bodyX = branch.x - bodyWidth / 2;
        const bodyY = branch.y - bodyHeight / 2;
        const posA = terminalDrawPosition(branch, "A");
        const posB = terminalDrawPosition(branch, "B");
        const netAId = nets.get(terminalKey(branch.id, "A")) || "";
        const netBId = nets.get(terminalKey(branch.id, "B")) || "";
        const netA = nodeDisplayName(netAId);
        const netB = nodeDisplayName(netBId);
        const colorA = netColor(netAId);
        const colorB = netColor(netBId);
        const arrowSpan = Math.max(28, Math.min(48, bodyWidth * 0.58));
        const arrowPath = branch.direction === "AtoB"
          ? `M ${branch.x - arrowSpan / 2} ${branch.y} L ${branch.x + arrowSpan / 2} ${branch.y}`
          : `M ${branch.x + arrowSpan / 2} ${branch.y} L ${branch.x - arrowSpan / 2} ${branch.y}`;
        const gText = branchValue(branch, "g");

        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const currentHighlight = branchCurrentHighlight(branch);
        const canvasHighlight = branchCanvasHighlight(branch);
        group.setAttribute("class", `branch${selected ? " selected" : ""}${currentHighlight ? " current-hover" : ""}${canvasHighlight.className}`);
        if (canvasHighlight.style) group.setAttribute("style", canvasHighlight.style);
        group.setAttribute("transform", `rotate(${branch.rotation} ${branch.x} ${branch.y})`);
        group.dataset.branchId = branch.id;

        group.innerHTML = `
          <rect class="hitbox" x="${bodyX - BRANCH_HIT_PAD_X}" y="${bodyY - BRANCH_HIT_PAD_Y}" width="${bodyWidth + BRANCH_HIT_PAD_X * 2}" height="${bodyHeight + BRANCH_HIT_PAD_Y * 2}" rx="8"></rect>
          <line class="lead" x1="${posA.x}" y1="${posA.y}" x2="${bodyX}" y2="${branch.y}"></line>
          <line class="lead" x1="${bodyX + bodyWidth}" y1="${branch.y}" x2="${posB.x}" y2="${posB.y}"></line>
          <rect class="branch-body" x="${bodyX}" y="${bodyY}" width="${bodyWidth}" height="${bodyHeight}" rx="4"></rect>
          <path class="direction" d="${arrowPath}"></path>
          <text class="branch-label" x="${branch.x}" y="${branch.y - 6}">${escapeSvg(branch.name)}</text>
          <text class="component-subtext" x="${branch.x}" y="${branch.y + 15}">${escapeSvg(gText)}</text>
          ${switchCaseLabelSvg(branch, 20)}
          ${resizeHandlesSvg(branch, selected)}
          <circle class="port-drag-hit" cx="${posA.x}" cy="${posA.y}" r="${PORT_DRAG_HIT_RADIUS}" data-port-side="A"></circle>
          <circle class="port-drag-hit" cx="${posB.x}" cy="${posB.y}" r="${PORT_DRAG_HIT_RADIUS}" data-port-side="B"></circle>
          <circle class="terminal ${state.pendingTerminal === terminalKey(branch.id, "A") ? "hot" : ""}${netHoverClass(netAId)}" cx="${posA.x}" cy="${posA.y}" r="8" data-terminal="${terminalKey(branch.id, "A")}" data-port-side="A"></circle>
          <circle class="terminal ${isDummyTerminal(branch, "B") ? "dummy-terminal" : ""} ${state.pendingTerminal === terminalKey(branch.id, "B") ? "hot" : ""}${netHoverClass(netBId)}" cx="${posB.x}" cy="${posB.y}" r="8" data-terminal="${terminalKey(branch.id, "B")}" data-port-side="B"></circle>
          <rect class="net-badge-bg${netHoverClass(netAId)}" data-net-id="${netAId}" data-port-side="A" x="${posA.x - 17}" y="${posA.y - 42}" width="34" height="18" rx="5" fill="${colorA}"></rect>
          <rect class="net-badge-bg${netHoverClass(netBId)}" data-net-id="${netBId}" data-port-side="B" x="${posB.x - 17}" y="${posB.y - 42}" width="34" height="18" rx="5" fill="${colorB}"></rect>
          <text class="net-badge" data-net-id="${netAId}" data-port-side="A" x="${posA.x}" y="${posA.y - 33}">${escapeSvg(netA)}</text>
          <text class="net-badge" data-net-id="${netBId}" data-port-side="B" x="${posB.x}" y="${posB.y - 33}">${escapeSvg(netB)}</text>
          ${state.showLocalLabels ? `<text class="node-label" data-port-side="A" x="${posA.x}" y="${posA.y + 24}">${escapeSvg(branch.nodeA)}</text>` : ""}
          ${state.showLocalLabels ? `<text class="node-label" data-port-side="B" x="${posB.x}" y="${posB.y + 24}">${escapeSvg(branch.nodeB)}</text>` : ""}
        `;

        group.querySelectorAll("[data-net-id]").forEach(item => {
          item.addEventListener("pointerdown", event => {
            if (state.tool === "select" && item.dataset.portSide) {
              startCustomPortDrag(branch, item.dataset.portSide);
              event.stopPropagation();
              return;
            }
            event.stopPropagation();
          });
          item.addEventListener("click", event => {
            renameNode(item.dataset.netId);
            event.stopPropagation();
          });
          item.addEventListener("dblclick", event => {
            renameNode(item.dataset.netId);
            event.stopPropagation();
          });
        });

        group.addEventListener("pointerdown", event => {
          const resizeHandle = event.target.dataset.resizeHandle;
          if (state.tool === "select" && resizeHandle) {
            startResizeDrag(branch, resizeHandle, event);
            return;
          }
          const terminal = event.target.dataset.terminal;
          const portSide = event.target.dataset.portSide;
          if (isDummyTerminal(branch, portSide)) {

            return;
          }
          if (state.tool === "select" && portSide) {
            startCustomPortDrag(branch, portSide);
            event.stopPropagation();
            return;
          }
          if (terminal) {
            handleTerminalClick(terminal);
            event.stopPropagation();
            return;
          }
          if (state.tool === "select") {
            if (event.shiftKey) {
              toggleBranchSelection(branch.id);
              render();
              event.stopPropagation();
              return;
            }
            const ids = selectedBranchIdsForDrag(branch.id);
            state.selectedIds = ids;
            state.selectedId = ids[0];
            state.selectedNetIds = [];
            state.selectedWireId = null;
            state.drag = {

                const item = findBranch(id);
                return [id, { x: item.x, y: item.y }];
              })),
              before: snapshot()
            };
          } else {
            selectBranch(branch.id);
          }
          render();
          event.stopPropagation();
        });

        branchLayer.appendChild(group);
      });

      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

        const p = terminalDrawPosition(branch, side);

      });
      const terminalBySide = Object.fromEntries(terminals.map(([side, x, y]) => [side, { x, y }]));
      const pPos = terminalBySide.P;
      const nPos = terminalBySide.N;
      const sPos = terminalBySide.S;
      const tPos = terminalBySide.T;
      const boxLeft = branch.x - width / 2;
      const boxTop = branch.y - height / 2;

      const coilTop = branch.y - coilHeight / 2;
      const coilBottom = branch.y + coilHeight / 2;
      const coreGap = Math.max(8, Math.min(11, width * 0.06));
      const coreLeft = branch.x - coreGap / 2;
      const coreRight = branch.x + coreGap / 2;
      const coilOffset = Math.max(17, Math.min(24, width * 0.125));
      const leftCoilX = coreLeft - coilOffset;
      const rightCoilX = coreRight + coilOffset;
      const coilBulge = Math.max(13, Math.min(18, width * 0.1));
      const leftTopLead = { x: boxLeft + 20, y: coilTop };
      const leftBottomLead = { x: boxLeft + 20, y: coilBottom };
      const rightTopLead = { x: boxRight - 20, y: coilTop };
      const rightBottomLead = { x: boxRight - 20, y: coilBottom };
      const symbolLeft = Math.min(boxLeft, pPos.x, nPos.x);
      const symbolRight = Math.max(boxRight, sPos.x, tPos.x);
      const symbolTop = Math.min(boxTop, pPos.y, sPos.y) - 8;
      const symbolBottom = Math.max(boxBottom, nPos.y, tPos.y) + 10;
      const coilPath = (x, direction) => {
        const turns = 5;
        const step = coilHeight / turns;
        let d = `M ${x} ${coilTop}`;
        for (let i = 0; i < turns; i++) {
          const y0 = coilTop + i * step;
          const y1 = y0 + step;
          d += ` C ${x + direction * coilBulge} ${y0 + step * 0.05}, ${x + direction * coilBulge} ${y1 - step * 0.05}, ${x} ${y1}`;
        }
        return d;
      };

        const from = current?.from || topSide;
        const to = current?.to || bottomSide;
        const arrowTop = branch.y - Math.min(26, coilHeight * 0.34);
        const arrowBottom = branch.y + Math.min(26, coilHeight * 0.34);
        return from === bottomSide && to === topSide
          ? `M ${x} ${arrowBottom} L ${x} ${arrowTop}`
          : `M ${x} ${arrowTop} L ${x} ${arrowBottom}`;
      };
      const primaryArrow = transformerArrowPath(currentSpec("primary"), "P", "N", leftCoilX - coilBulge - 14);
      const secondaryArrow = transformerArrowPath(currentSpec("secondary"), "S", "T", rightCoilX + coilBulge + 14);
      const firstArcStep = coilHeight / 5;

        <line class="lead" x1="${rightTopLead.x}" y1="${rightTopLead.y}" x2="${sPos.x}" y2="${sPos.y}"></line>
        <line class="lead" x1="${rightBottomLead.x}" y1="${rightBottomLead.y}" x2="${tPos.x}" y2="${tPos.y}"></line>
        <line class="lead" x1="${leftTopLead.x}" y1="${leftTopLead.y}" x2="${leftCoilX}" y2="${coilTop}"></line>
        <line class="lead" x1="${leftBottomLead.x}" y1="${leftBottomLead.y}" x2="${leftCoilX}" y2="${coilBottom}"></line>
        <line class="lead" x1="${rightCoilX}" y1="${coilTop}" x2="${rightTopLead.x}" y2="${rightTopLead.y}"></line>
        <line class="lead" x1="${rightCoilX}" y1="${coilBottom}" x2="${rightBottomLead.x}" y2="${rightBottomLead.y}"></line>
        <path class="transformer-coil" d="${coilPath(leftCoilX, 1)}"></path>

        <line class="transformer-core" x1="${coreLeft}" y1="${coilTop - 8}" x2="${coreLeft}" y2="${coilBottom + 8}"></line>
        <line class="transformer-core" x1="${coreRight}" y1="${coilTop - 8}" x2="${coreRight}" y2="${coilBottom + 8}"></line>
        <circle class="dot" cx="${leftCoilX + firstArcDotOffset}" cy="${firstArcDotY}" r="4"></circle>
        <circle class="dot" cx="${rightCoilX - firstArcDotOffset}" cy="${firstArcDotY}" r="4"></circle>
        <path class="direction" d="${primaryArrow}"></path>
        <path class="direction" d="${secondaryArrow}"></path>
        <text class="branch-label" x="${branch.x}" y="${coilTop - 14}">${escapeSvg(branch.name)}</text>

        ${resizeHandlesSvg(branch, selected)}

            <rect class="net-badge-bg${netHoverClass(netId)}" data-net-id="${netId}" data-port-side="${side}" x="${x - 17}" y="${y - 34}" width="34" height="18" rx="5" fill="${color}"></rect>

      bindBranchGroupInteractions(group, branch);
