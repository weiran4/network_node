    function tr(text) {
      if (state.language === "zh") return text;
      return translateText(text);
    }

    function translateText(text) {
      const source = String(text || "").trim();
      if (!source) return text;
      if (zhToEn[source]) return zhToEn[source];
      const editMatch = source.match(/^编辑\s+(.+)$/);
      if (editMatch) return `Edit ${translateText(editMatch[1])}`;
      const nodeMatch = source.match(/^(.+)\s+节点$/);
      if (nodeMatch) return `${nodeMatch[1]} Node`;
      const currentMatch = source.match(/^观测电流\s+(\d+)$/);
      if (currentMatch) return `Observed Current ${currentMatch[1]}`;
      const observedBranchMatch = source.match(/^观测支路\s+(\d+)\s+名称$/);
      if (observedBranchMatch) return `Observed Branch ${observedBranchMatch[1]} Name`;
      const selectedMatch = source.match(/^已选中\s+(\d+)\s+个元件(，组合\s+(.+))?。拖动任意选中元件可整体移动。$/);
      if (selectedMatch) {
        return selectedMatch[3]
          ? `${selectedMatch[1]} elements selected, group ${selectedMatch[3]}. Drag any selected element to move them together.`
          : `${selectedMatch[1]} elements selected. Drag any selected element to move them together.`;
      }
      return text;
    }

    function canTranslate(text) {
      return translateText(text) !== text;
    }

    function canvasDisplayName(item) {
      const name = item?.name || "画布";
      if (state.language === "zh") return name;
      const canvasMatch = String(name).match(/^画布\s*(\d+)$/);
      if (canvasMatch) return `Canvas ${canvasMatch[1]}`;
      return zhToEn[name] || name;
    }

    function defaultCanvasName(canvasId) {
      const index = state.canvases.findIndex(item => item.id === canvasId);
      return `画布 ${index >= 0 ? index + 1 : state.canvases.length + 1}`;
    }

    function applyLanguage(root = document) {
      const langButton = document.getElementById("languageTool");
      if (langButton) {
        langButton.textContent = state.language === "zh" ? "EN" : "中";
        langButton.title = state.language === "zh" ? "切换到英文" : "Switch to Chinese";
        langButton.setAttribute("aria-label", langButton.title);
      }
      const localLabelButton = document.getElementById("localLabelTool");
      if (localLabelButton) {
        const label = state.showLocalLabels ? "隐藏局部端口标签" : "显示局部端口标签";
        localLabelButton.setAttribute("title", tr(label));
        localLabelButton.setAttribute("aria-label", tr(label));
      }
      root.querySelectorAll("[title]").forEach(el => {
        if (el.id === "languageTool") return;
        if (!el.dataset.zhTitle) el.dataset.zhTitle = el.getAttribute("title") || "";
        el.setAttribute("title", tr(el.dataset.zhTitle));
      });
      root.querySelectorAll("[aria-label]").forEach(el => {
        if (el.id === "languageTool") return;
        if (!el.dataset.zhAria) el.dataset.zhAria = el.getAttribute("aria-label") || "";
        el.setAttribute("aria-label", tr(el.dataset.zhAria));
      });
      const walker = document.createTreeWalker(root.body || root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent || ["SCRIPT", "STYLE", "SVG", "PATH"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
          const text = node.textContent.trim();
          return (parent.dataset.zhText || (text && canTranslate(text))) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        if (!node.parentElement.dataset.zhText) node.parentElement.dataset.zhText = node.textContent.trim();
        const original = node.parentElement.dataset.zhText;
        const leading = (node.textContent.match(/^\s*/) || [""])[0];
        const trailing = (node.textContent.match(/\s*$/) || [""])[0];
        node.textContent = `${leading}${tr(original)}${trailing}`;
      });
    }

    function clampPanelWidth(width) {
      const mainWidth = mainLayout?.getBoundingClientRect().width || 0;
      const maxByLayout = mainWidth ? Math.max(280, mainWidth - 420 - 12) : 560;
      return Math.max(280, Math.min(maxByLayout, Number(width) || 380));
    }

    function applyPanelWidth(width = state.panelWidth) {
      if (!mainLayout) return;
      if (width == null || width === "") {
        state.panelWidth = null;
        mainLayout.style.removeProperty("--panel-width");
        return;
      }
      const nextWidth = clampPanelWidth(width);
      state.panelWidth = nextWidth;
      mainLayout.style.setProperty("--panel-width", `${nextWidth}px`);
    }

    function startPanelResize(event) {
      if (!panelResizeBar || event.button !== 0) return;
      const startX = event.clientX;
      const panel = document.querySelector(".panel");
      const startWidth = panel?.getBoundingClientRect().width || state.panelWidth || 380;
      state.panelResizeDrag = { pointerId: event.pointerId, startX, startWidth };
      panelResizeBar.classList.add("dragging");
      panelResizeBar.setPointerCapture?.(event.pointerId);

      function move(moveEvent) {
        if (!state.panelResizeDrag) return;
        const nextWidth = state.panelResizeDrag.startWidth - (moveEvent.clientX - state.panelResizeDrag.startX);
        applyPanelWidth(nextWidth);
        moveEvent.preventDefault();
      }

      function finish(finishEvent) {
        if (panelResizeBar.hasPointerCapture?.(event.pointerId)) {
          panelResizeBar.releasePointerCapture(event.pointerId);
        }
        panelResizeBar.classList.remove("dragging");
        state.panelResizeDrag = null;
        panelResizeBar.removeEventListener("pointermove", move);
        panelResizeBar.removeEventListener("pointerup", finish);
        panelResizeBar.removeEventListener("pointercancel", finish);
        finishEvent?.preventDefault?.();
      }

      panelResizeBar.addEventListener("pointermove", move);
      panelResizeBar.addEventListener("pointerup", finish);
      panelResizeBar.addEventListener("pointercancel", finish);
      event.preventDefault();
      event.stopPropagation();
    }

    function rectsIntersect(a, b) {
      return a.left <= b.right && a.right >= b.left && a.top <= b.bottom && a.bottom >= b.top;
    }

    function branchSelectionBounds(branch) {
      const bounds = componentBounds(branch);
      return { left: bounds.left, right: bounds.right, top: bounds.top, bottom: bounds.bottom };
    }

    function updateSelectionBox() {
      if (!state.marquee) {
        selectionBox.setAttribute("visibility", "hidden");
        return;
      }
      const x = Math.min(state.marquee.start.x, state.marquee.current.x);
      const y = Math.min(state.marquee.start.y, state.marquee.current.y);
      const width = Math.abs(state.marquee.current.x - state.marquee.start.x);
      const height = Math.abs(state.marquee.current.y - state.marquee.start.y);
      selectionBox.setAttribute("x", x);
      selectionBox.setAttribute("y", y);
      selectionBox.setAttribute("width", width);
      selectionBox.setAttribute("height", height);
      selectionBox.setAttribute("visibility", "visible");
    }

    function finishMarqueeSelection() {
      if (!state.marquee) return;
      const x1 = Math.min(state.marquee.start.x, state.marquee.current.x);
      const y1 = Math.min(state.marquee.start.y, state.marquee.current.y);
      const x2 = Math.max(state.marquee.start.x, state.marquee.current.x);
      const y2 = Math.max(state.marquee.start.y, state.marquee.current.y);
      const moved = Math.abs(x2 - x1) > 6 || Math.abs(y2 - y1) > 6;
      if (!moved) {
        state.selectedId = null;
        state.selectedIds = [];
        state.selectedNetIds = [];
        state.selectedWireId = null;
      } else {
        const box = { left: x1, top: y1, right: x2, bottom: y2 };
        const ids = state.branches
          .filter(branch => rectsIntersect(branchSelectionBounds(branch), box))
          .map(branch => branch.id);
        state.selectedIds = ids;
        state.selectedId = ids[0] || null;
        state.selectedNetIds = [];
        state.selectedWireId = null;
      }
      state.marquee = null;
      updateSelectionBox();
    }

    function groupSelectedBranches() {
      const ids = [...new Set(state.selectedIds)].filter(id => findBranch(id));
      if (ids.length < 2) return;
      commitHistory();
      state.groups = state.groups.filter(group => !group.ids.some(id => ids.includes(id)));
      state.groups.push({ id: `G${state.nextGroup++}`, ids });
      state.selectedIds = ids;
      state.selectedId = ids[0];
      state.selectedWireId = null;
      render();
    }

    function selectedBranchSet() {
      return new Set((state.selectedIds.length ? state.selectedIds : (state.selectedId ? [state.selectedId] : [])).filter(id => findBranch(id)));
    }

    function selectedBranches() {
      const ids = selectedBranchSet();
      return state.branches.filter(branch => ids.has(branch.id));
    }

    function currentSelectedGroup() {
      if (!state.selectedIds.length && !state.selectedId) return null;
      const selectedSet = new Set(state.selectedIds.length ? state.selectedIds : [state.selectedId]);
      return state.groups.find(group => group.ids.some(id => selectedSet.has(id))) || null;
    }

    function ungroupSelectedBranches() {
      const group = currentSelectedGroup();
      if (!group) return;
      commitHistory();
      state.groups = state.groups.filter(item => item.id !== group.id);
      state.selectedIds = group.ids.filter(id => findBranch(id));
      state.selectedId = state.selectedIds[0] || null;
      state.selectedWireId = null;
      render();
    }

    function setTool(tool) {
      state.tool = tool;
      state.pendingTerminal = null;
      Object.entries(toolButtons).forEach(([key, button]) => {
        button.classList.toggle("active", key === tool);
      });
      statusEl.textContent = tr(tool === "wire"
        ? "连接节点：依次点击两个端子"
        : tool === "branch"
          ? "点击画布添加二端口支路"
          : tool === "currentSource"
            ? "点击画布添加电流源"
            : tool === "voltageSource"
              ? "点击画布添加电压源串联 G"
              : tool === "ground"
                ? "点击画布添加 Ground"
                : tool === "transformer"
                  ? "点击画布添加单相变压器"
                  : tool === "custom"
                    ? "点击画布添加自定义 N 节点支路"
                    : tool === "pan"
                      ? "拖动画布平移"
                      : "选择 / 拖动");
      render();
    }

    function terminalPosition(branch, side) {
      const local = terminalLocalPosition(branch, side);
      return rotateLocal(branch.x, branch.y, local.x, local.y, branch.rotation * Math.PI / 180);
    }

    function componentBounds(branch) {
      const radians = branch.rotation * Math.PI / 180;
      const points = terminalSides(branch).map(side => terminalPosition(branch, side));
      const bodyHalfWidth = (branch.width || 150) / 2;
      const bodyHalfHeight = (branch.height || 48) / 2;
      [
        [-bodyHalfWidth, -bodyHalfHeight],
        [bodyHalfWidth, -bodyHalfHeight],
        [bodyHalfWidth, bodyHalfHeight],
        [-bodyHalfWidth, bodyHalfHeight]
      ].forEach(([x, y]) => points.push(rotateLocal(branch.x, branch.y, x, y, radians)));
      const xs = points.map(point => point.x);
      const ys = points.map(point => point.y);
      return {
        left: Math.min(...xs),
        right: Math.max(...xs),
        top: Math.min(...ys),
        bottom: Math.max(...ys)
      };
    }

    function clampComponent(branch) {
      const margin = 28;
      const bounds = componentBounds(branch);
      expandWorldForBounds(bounds, margin);
      if (bounds.left < margin) branch.x += margin - bounds.left;
      if (bounds.top < margin) branch.y += margin - bounds.top;
    }

    function componentResizeBox(branch) {
      if (branch.kind === "two_node_branch" || branch.kind === "dummy_dimension_branch" || !branch.kind) {
        return {
          width: Math.max(50, (branch.width || 150) - 56),
          height: Math.max(32, branch.height || 48)
        };
      }
      if (branch.kind === "ground") {
        return {
          width: Math.max(42, branch.width || 50),
          height: Math.max(38, branch.height || 42)
        };
      }
      return {
        width: branch.width || 150,
        height: branch.height || 48
      };
    }

    function applyResizeBoxSize(branch, width, height) {
      if (branch.kind === "two_node_branch" || branch.kind === "dummy_dimension_branch" || !branch.kind) {
        branch.width = Math.round(width + 56);
        branch.height = Math.round(height);
        return;
      }
      branch.width = Math.round(width);
      branch.height = Math.round(height);
    }

    function resizeHandlesSvg(branch, selected) {
      if (!selected || state.tool !== "select") return "";
      const { width, height } = componentResizeBox(branch);
      const size = 10;
      const handles = [
        ["nw", branch.x - width / 2, branch.y - height / 2],
        ["ne", branch.x + width / 2, branch.y - height / 2],
        ["se", branch.x + width / 2, branch.y + height / 2],
        ["sw", branch.x - width / 2, branch.y + height / 2]
      ];
      return handles.map(([handle, x, y]) => `
        <rect class="resize-handle" data-resize-handle="${handle}" x="${x - size / 2}" y="${y - size / 2}" width="${size}" height="${size}" rx="2"></rect>
      `).join("");
    }

    function resizeMinSize(branch, axis) {
      if (branch.kind === "single_phase_transformer") return axis === "width" ? 120 : 82;
      if (branch.kind === "current_source") return axis === "width" ? 90 : 54;
      if (branch.kind === "voltage_source_series_r") return axis === "width" ? 100 : 54;
      if (branch.kind === "custom_n_port") return axis === "width" ? 90 : 70;
      if (branch.kind === "ground") return axis === "width" ? 42 : 38;
      return axis === "width" ? 70 : 40;
    }

    function expandWorldForBounds(bounds, margin = 80) {
      let changed = false;
      const nextWidth = bounds.right + margin;
      const nextHeight = bounds.bottom + margin;
      if (nextWidth > WORLD.width) {
        WORLD.width = Math.ceil(nextWidth / 200) * 200;
        changed = true;
      }
      if (nextHeight > WORLD.height) {
        WORLD.height = Math.ceil(nextHeight / 200) * 200;
        changed = true;
      }
      if (changed) state.viewCenter = clampViewCenter(state.viewCenter);
    }

    function terminalSides(branch) {
      if (branch.kind === "ground") return ["G"];
      if (branch.kind === "single_phase_transformer") return ["P", "N", "S", "T"];
      if (branch.kind === "voltage_source_series_r") return ["P", "N"];
      if (branch.kind === "dummy_node_block") return branch.ports || Object.keys(branch.nodes || {});
      if (branch.kind === "custom_n_port") return branch.ports || Object.keys(branch.nodes || {});
      return ["A", "B"];
    }

    function branchNodeForSide(branch, side) {
      if (branch.kind === "ground") return branch.nodeG;
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port" || branch.kind === "dummy_node_block" || branch.kind === "voltage_source_series_r") return branch.nodes?.[side];
      if (branch.kind === "dummy_dimension_branch") return side === (branch.dummyTerminalSide || "B") ? branch.nodeB : branch.nodeA;
      return side === "A" ? branch.nodeA : branch.nodeB;
    }

    function isDummyTerminal(branch, side) {
      return branch?.kind === "dummy_dimension_branch" && side === (branch.dummyTerminalSide || "B");
    }

    function isDummyNodeBlockTerminal(branch, side) {
      return branch?.kind === "dummy_node_block" && terminalSides(branch).includes(side);
    }

    function visibleTerminalSides(branch) {
      const sides = terminalSides(branch);
      if (branch.kind !== "custom_n_port" || branch.packageOriginal) return sides;
      const hidden = new Set(branch.hiddenPorts || []);
      return sides.filter(side => !hidden.has(side));
    }

    function rotateLocal(cx, cy, x, y, radians) {
      const cos = Math.cos(radians);
      const sin = Math.sin(radians);
      return {
        x: cx + x * cos - y * sin,
        y: cy + x * sin + y * cos
      };
    }

    function terminalLocalPosition(branch, side) {
      if (branch.kind === "custom_n_port" || branch.kind === "dummy_node_block") {
        const position = customPortPosition(branch, side);
        return { x: position.x - branch.x, y: position.y - branch.y };
      }
      const saved = branch.terminalLayout?.[side];
      if (saved && Number.isFinite(Number(saved.x)) && Number.isFinite(Number(saved.y))) {
        return { x: Number(saved.x), y: Number(saved.y) };
      }
      if (branch.kind === "single_phase_transformer") {
        const leadOut = Math.max(26, Math.min(34, branch.width * 0.18));
        const yOffset = Math.max(32, Math.min(branch.height * 0.39, branch.height / 2 - 12));
        const points = {
          P: [-branch.width / 2 - leadOut, -yOffset],
          N: [-branch.width / 2 - leadOut, yOffset],
          S: [branch.width / 2 + leadOut, -yOffset],
          T: [branch.width / 2 + leadOut, yOffset]
        };
        const [x, y] = points[side];
        return { x, y };
      }
      if (branch.kind === "ground") return { x: 0, y: -(Math.max(38, branch.height || 42) / 2 + 16) };
      if (branch.kind === "voltage_source_series_r") return { x: side === "P" ? -branch.width / 2 : branch.width / 2, y: 0 };
      return { x: side === "A" ? -branch.width / 2 : branch.width / 2, y: 0 };
    }

    function terminalDrawPosition(branch, side) {
      const local = terminalLocalPosition(branch, side);
      return { x: branch.x + local.x, y: branch.y + local.y };
    }

    function rotatedDrawPoint(branch, point) {
      return rotateLocal(
        branch.x,
        branch.y,
        point.x - branch.x,
        point.y - branch.y,
        branch.rotation * Math.PI / 180
      );
    }

    function toBranchLocalPoint(branch, point) {
      const radians = -branch.rotation * Math.PI / 180;
      const x = point.x - branch.x;
      const y = point.y - branch.y;
      const cos = Math.cos(radians);
      const sin = Math.sin(radians);
      return {
        x: x * cos - y * sin,
        y: x * sin + y * cos
      };
    }

    function terminalKey(branchId, side) {
      return `${branchId}.${side}`;
    }

    function customPortLayout(branch) {
      const ports = visibleTerminalSides(branch);
      let layout = Array.isArray(branch.portLayout) ? branch.portLayout : [];
      if (typeof branch.portLayout === "string") {
        try {
          layout = JSON.parse(branch.portLayout);
        } catch {
          layout = [];
        }
      }
      const byId = new Map(layout.map((item, index) => [item.id, {
        id: item.id,
        side: ["left", "right", "top", "bottom"].includes(item.side) ? item.side : "left",
        t: Number.isFinite(Number(item.t)) ? Math.max(0.08, Math.min(0.92, Number(item.t))) : null,
        axis: Number.isFinite(Number(item.axis)) ? Number(item.axis) : null,
        order: Number.isFinite(Number(item.order)) ? Number(item.order) : index
      }]));
      const half = Math.ceil(ports.length / 2);
      return ports.map((id, index) => byId.get(id) || {
        id,
        side: index < half ? "left" : "right",
        t: ((index < half ? index : index - half) + 1) / ((index < half ? half : ports.length - half) + 1),
        order: index
      });
    }

    function customPortPosition(branch, side) {
      const saved = branch.terminalLayout?.[side];
      if (saved && Number.isFinite(Number(saved.x)) && Number.isFinite(Number(saved.y))) {
        return { x: branch.x + Number(saved.x), y: branch.y + Number(saved.y) };
      }
      const layout = customPortLayout(branch);
      const item = layout.find(port => port.id === side) || { id: side, side: "left", order: 0 };
      const sameSide = layout
        .filter(port => port.side === item.side)
        .sort((a, b) => a.order - b.order);
      const index = Math.max(0, sameSide.findIndex(port => port.id === side));
      const count = Math.max(1, sameSide.length);
      const t = item.t ?? (index + 1) / (count + 1);
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      const gap = 26;
      const axis = portAxisWorld(branch, item.side, item.axis);
      if (item.side === "right") return { x: axis ?? right + gap, y: top + t * branch.height };
      if (item.side === "top") return { x: left + t * branch.width, y: axis ?? top - gap };
      if (item.side === "bottom") return { x: left + t * branch.width, y: axis ?? bottom + gap };
      return { x: axis ?? left - gap, y: top + t * branch.height };
    }

    function portAxisWorld(branch, side, value) {
      if (!Number.isFinite(Number(value))) return null;
      const axis = Number(value);
      const localWorld = side === "left" || side === "right" ? branch.x + axis : branch.y + axis;
      if (validPortAxisWorld(branch, side, localWorld)) return localWorld;
      if (validPortAxisWorld(branch, side, axis)) return axis;
      return null;
    }

    function portAxisLocal(branch, side, worldAxis) {
      return Math.round((worldAxis - (side === "left" || side === "right" ? branch.x : branch.y)) * 10) / 10;
    }

    function validPortAxisWorld(branch, side, axis) {
      if (!Number.isFinite(Number(axis)) || Math.abs(Number(axis)) < 1e-9) return false;
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      if (side === "left") return axis < left;
      if (side === "right") return axis > right;
      if (side === "top") return axis < top;
      if (side === "bottom") return axis > bottom;
      return false;
    }

    function findBranch(id) {
      return state.branches.find(branch => branch.id === id);
    }

    function parseTerminal(key) {
      const [branchId, side] = key.split(".");
      return { branchId, side };
    }

    function branchTerminalNode(key) {
      const parsed = parseTerminal(key);
      const branch = findBranch(parsed.branchId);
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port" || branch.kind === "voltage_source_series_r") return branch.nodes[parsed.side];
      if (branch.kind === "ground") return branch.nodeG;
      return parsed.side === "A" ? branch.nodeA : branch.nodeB;
    }

    function terminalIsDummyNode(key) {
      const parsed = parseTerminal(key);
      const branch = findBranch(parsed.branchId);
      return Boolean(branch && (isDummyTerminal(branch, parsed.side) || isDummyNodeBlockTerminal(branch, parsed.side) || isPackagedDummyTerminal(branch, parsed.side)));
    }

    function packagedDummyPortSides(branch) {
      if (!branch?.packageOriginal) return new Set();
      const pkg = branch.packageOriginal;
      const cases = Array.isArray(pkg.networkCases) ? pkg.networkCases : [];
      const index = Math.max(0, Math.min(cases.length - 1, Number(pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0));
      const active = cases[index] || {};
      const sourceBranches = active.branches || pkg.branches || [];
      const dummyKeys = new Set([
        ...dummyBranchesForPackCase(sourceBranches).map(item => terminalKey(item.id, item.dummyTerminalSide || "B")),
        ...dummyNodeBlocksForPackCase(sourceBranches).flatMap(item => terminalSides(item).map(side => terminalKey(item.id, side)))
      ]);
      if (!dummyKeys.size) return new Set();
      const groups = active.superExternalGroups || active.externalGroups || pkg.superExternalGroups || pkg.externalGroups || [];
      const sides = new Set();
      groups.forEach((group, groupIndex) => {
        if (!(group.members || []).some(member => dummyKeys.has(member))) return;
        const side = group.port || branch.ports?.[groupIndex];
        if (side) sides.add(side);
      });
      return sides;
    }

    function packagedDummyAnchorPortSides(branch) {
      if (!branch?.packageOriginal) return new Set();
      const pkg = branch.packageOriginal;
      const cases = Array.isArray(pkg.networkCases) ? pkg.networkCases : [];
      const index = Math.max(0, Math.min(cases.length - 1, Number(pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0));
      const active = cases[index] || {};
      const sourceBranches = active.branches || pkg.branches || [];
      const anchorKeys = new Set(dummyBranchesForPackCase(sourceBranches).map(item => terminalKey(item.id, item.anchorTerminalSide || "A")));
      if (!anchorKeys.size) return new Set();
      const groups = active.superExternalGroups || active.externalGroups || pkg.superExternalGroups || pkg.externalGroups || [];
      const sides = new Set();
      groups.forEach((group, groupIndex) => {
        if (!(group.members || []).some(member => anchorKeys.has(member))) return;
        const side = group.port || branch.ports?.[groupIndex];
        if (side) sides.add(side);
      });
      return sides;
    }

    function isPackagedDummyTerminal(branch, side) {
      return packagedDummyPortSides(branch).has(side);
    }

    function terminalIsDummyAnchor(key) {
      const parsed = parseTerminal(key);
      const branch = findBranch(parsed.branchId);
      return Boolean(branch?.kind === "dummy_dimension_branch" && parsed.side === (branch.anchorTerminalSide || "A"));
    }

    function dummyNetIds() {
      const lookup = netLookup();
      const ids = new Set();
      state.branches.forEach(branch => {
        terminalSides(branch).forEach(side => {
          if (!isDummyTerminal(branch, side) && !isPackagedDummyTerminal(branch, side)) return;
          const netId = lookup.get(terminalKey(branch.id, side));
          if (netId) ids.add(netId);
        });
      });
      return ids;
    }

    function dummyAnchorNetIds() {
      const lookup = netLookup();
      const ids = new Set();
      dummyBranchesForPackCase().forEach(branch => {
        const netId = lookup.get(terminalKey(branch.id, branch.anchorTerminalSide || "A"));
        if (netId) ids.add(netId);
      });
      state.branches.forEach(branch => {
        terminalSides(branch).forEach(side => {
          if (!packagedDummyAnchorPortSides(branch).has(side)) return;
          const netId = lookup.get(terminalKey(branch.id, side));
          if (netId) ids.add(netId);
        });
      });
      return ids;
    }

    function dummyNodeBlockNetIds() {
      const lookup = netLookup();
      const ids = new Set();
      state.branches.forEach(branch => {
        if (branch.kind !== "dummy_node_block") return;
        terminalSides(branch).forEach(side => {
          const netId = lookup.get(terminalKey(branch.id, side));
          if (netId) ids.add(netId);
        });
      });
      return ids;
    }

    function dummyProtectedNetIds() {
      return new Set([...dummyNetIds(), ...dummyAnchorNetIds()]);
    }

    function sanitizeDummyProtectedInternalNodes() {
      const protectedIds = dummyProtectedNetIds();
      if (!protectedIds.size) return false;
      const before = state.internalNodes.length;
      state.internalNodes = state.internalNodes.filter(id => !protectedIds.has(id));
      const changed = state.internalNodes.length !== before;
      if (changed) invalidateMathCaches();
      return changed;
    }

    function terminalNetId(key) {
      return netLookup().get(key);
    }

    function connectTerminals(from, to) {
      if (from === to) return;
      if (terminalIsDummyNode(from) || terminalIsDummyNode(to)) {
        statusEl.textContent = optText("Dummy 节点不可连接。", "Dummy node is not connectable.");
        state.pendingTerminal = null;
        render();
        return;
      }
      const internalSet = new Set(state.internalNodes || []);
      const fromNet = terminalNetId(from);
      const toNet = terminalNetId(to);
      if (
        (terminalIsDummyAnchor(from) && (internalSet.has(fromNet) || internalSet.has(toNet))) ||
        (terminalIsDummyAnchor(to) && (internalSet.has(toNet) || internalSet.has(fromNet)))
      ) {
        statusEl.textContent = optText("Dummy anchor 不能被设为内部节点。", "Dummy anchor cannot be marked as an internal node.");
        state.pendingTerminal = null;
        render();
        return;
      }
      const exists = state.wires.some(wire =>
        (wire.from === from && wire.to === to) || (wire.from === to && wire.to === from)
      );
      if (!exists) {
        const beforeNodeState = captureNodeDisplayState();
        commitHistory();
        state.wires.push({ id: `W${state.nextWire++}`, from, to, mid: null });
        applyNodeDisplayState(beforeNodeState);
      }
      state.pendingTerminal = null;
      render();
    }

    const WIRE_SNAP_DISTANCE = 12;
    const BRANCH_LEAD_SNAP_DISTANCE = 18;
    const AUTO_GLUE_FLOATING_TERMINAL_DISTANCE = 20;

    function wireEndpointPosition(terminal) {
      const parsed = parseTerminal(terminal);
      const branch = findBranch(parsed.branchId);
      return branch ? terminalPosition(branch, parsed.side) : null;
    }

    function wireOtherTerminal(wire, terminal) {
      if (wire.from === terminal) return wire.to;
      if (wire.to === terminal) return wire.from;
      return null;
    }

    function snapPointToAxis(point, target) {
      const dx = target.x - point.x;
      const dy = target.y - point.y;
      const horizontal = Math.abs(dy) <= WIRE_SNAP_DISTANCE && Math.abs(dy) <= Math.abs(dx);
      const vertical = Math.abs(dx) <= WIRE_SNAP_DISTANCE && Math.abs(dx) < Math.abs(dy);
      if (horizontal) return { ...point, y: target.y };
      if (vertical) return { ...point, x: target.x };
      return point;
    }

    function setTerminalWorldPosition(branch, side, point) {
      const local = toBranchLocalPoint(branch, point);
      branch.terminalLayout = {
        ...(branch.terminalLayout || {}),
        [side]: {
          x: Math.round(local.x * 10) / 10,
          y: Math.round(local.y * 10) / 10
        }
      };
    }

    function autoSnapTerminalToOwnBody(branch, side) {
      if (branch.kind !== "two_node_branch" && branch.kind !== "dummy_dimension_branch" && branch.kind !== "single_phase_transformer" && branch.kind !== "current_source" && branch.kind !== "voltage_source_series_r") return;
      const point = terminalPosition(branch, side);
      const anchorDraw = componentLeadAnchor(branch, side, terminalDrawPosition(branch, side));
      const anchor = anchorDraw ? rotatedDrawPoint(branch, anchorDraw) : null;
      if (!anchor) return;
      const next = snapPointToAnchorAxis(point, anchor);
      if (next.x !== point.x || next.y !== point.y) setTerminalWorldPosition(branch, side, next);
    }

    function autoSnapBranchLeadsToOwnBody(branch) {
      if (branch.kind !== "two_node_branch" && branch.kind !== "dummy_dimension_branch" && branch.kind !== "single_phase_transformer" && branch.kind !== "current_source" && branch.kind !== "voltage_source_series_r") return;
      terminalSides(branch).forEach(side => autoSnapTerminalToOwnBody(branch, side));
    }

    function componentLeadAnchor(branch, side, point = terminalDrawPosition(branch, side)) {
      if (branch.kind === "two_node_branch" || branch.kind === "dummy_dimension_branch" || branch.kind === "current_source") {
        const bodyWidth = Math.max(50, Math.min(120, (branch.width || 150) * 0.5));
        const x = side === "A" ? branch.x - bodyWidth / 2 : branch.x + bodyWidth / 2;
        return { x, y: branch.y };
      }
      if (branch.kind === "voltage_source_series_r") {
        const bodyWidth = Math.max(74, (branch.width || 160) - 70);
        const x = side === "P" ? branch.x - bodyWidth / 2 : branch.x + bodyWidth / 2;
        return { x, y: branch.y };
      }
      if (branch.kind === "single_phase_transformer") {
        const width = branch.width || 170;
        const height = branch.height || 112;
        const left = branch.x - width / 2;
        const right = branch.x + width / 2;
        const top = branch.y - height / 2;
        const bottom = branch.y + height / 2;
        const x = side === "P" || side === "N" ? left : right;
        return { x, y: Math.max(top, Math.min(bottom, point.y)) };
      }
      return null;
    }

    function snapPointToAnchorAxis(point, anchor) {
      const next = { ...point };
      const dx = Math.abs(point.x - anchor.x);
      const dy = Math.abs(point.y - anchor.y);
      if (dy <= BRANCH_LEAD_SNAP_DISTANCE && dy <= dx) next.y = anchor.y;
      if (dx <= BRANCH_LEAD_SNAP_DISTANCE && dx < dy) next.x = anchor.x;
      return next;
    }

    function autoSnapCustomTerminalToLeadAnchor(branch, side) {
      if (branch.kind !== "custom_n_port") return;
      const drawPoint = terminalDrawPosition(branch, side);
      const point = terminalPosition(branch, side);
      const layoutSide = customPortLayout(branch).find(port => port.id === side)?.side || inferPortSideFromPosition(branch, drawPoint);
      const anchorDraw = customLeadInnerPoint(branch, drawPoint.x, drawPoint.y, layoutSide, side);
      const anchor = rotatedDrawPoint(branch, anchorDraw);
      const next = snapPointToAnchorAxis(point, anchor);
      if (next.x !== point.x || next.y !== point.y) setTerminalWorldPosition(branch, side, next);
    }

    function autoSnapTerminalToConnectedWire(branch, side) {
      const terminal = terminalKey(branch.id, side);
      const point = terminalPosition(branch, side);
      let best = null;
      state.wires.forEach(wire => {
        const otherTerminal = wireOtherTerminal(wire, terminal);
        if (!otherTerminal) return;
        const other = wireEndpointPosition(otherTerminal);
        if (!other) return;
        const snapped = snapPointToAxis(point, other);
        const delta = Math.abs(snapped.x - point.x) + Math.abs(snapped.y - point.y);
        if (delta > 0 && (!best || delta < best.delta)) best = { point: snapped, delta };
      });
      if (best) setTerminalWorldPosition(branch, side, best.point);
    }

    function autoSnapDraggedBranches(branchIds) {
      const selected = new Set(branchIds);
      branchIds.forEach(id => {
        const branch = findBranch(id);
        if (!branch) return;
        autoSnapBranchLeadsToOwnBody(branch);
        let bestDx = null;
        let bestDy = null;
        terminalSides(branch).forEach(side => {
          const terminal = terminalKey(branch.id, side);
          const point = terminalPosition(branch, side);
          state.wires.forEach(wire => {
            const otherTerminal = wireOtherTerminal(wire, terminal);
            if (!otherTerminal) return;
            const parsedOther = parseTerminal(otherTerminal);
            if (selected.has(parsedOther.branchId)) return;
            const other = wireEndpointPosition(otherTerminal);
            if (!other) return;
            const dx = other.x - point.x;
            const dy = other.y - point.y;
            if (Math.abs(dy) <= WIRE_SNAP_DISTANCE && Math.abs(dy) <= Math.abs(dx)) {
              if (!bestDy || Math.abs(dy) < Math.abs(bestDy)) bestDy = dy;
            }
            if (Math.abs(dx) <= WIRE_SNAP_DISTANCE && Math.abs(dx) < Math.abs(dy)) {
              if (!bestDx || Math.abs(dx) < Math.abs(bestDx)) bestDx = dx;
            }
          });
        });
        if (bestDx !== null) branch.x += bestDx;
        if (bestDy !== null) branch.y += bestDy;
      });
    }

    function terminalIsFloatingForAutoGlue(terminal, lookup = netLookup(), groups = orderedNetGroups()) {
      if (terminalIsDummyNode(terminal)) return false;
      if (state.wires.some(wire => wire.from === terminal || wire.to === terminal)) return false;
      const netId = lookup.get(terminal);
      const group = (groups.find(item => item.id === netId)?.members || [terminal]);
      return group.length === 1;
    }

    function terminalCanReceiveAutoGlue(terminal) {
      return !terminalIsDummyNode(terminal);
    }

    function autoGlueConnectionForPair(terminal, candidate, lookup, groups) {
      if (!terminalCanReceiveAutoGlue(terminal) || !terminalCanReceiveAutoGlue(candidate)) return null;
      const terminalFloating = terminalIsFloatingForAutoGlue(terminal, lookup, groups);
      const candidateFloating = terminalIsFloatingForAutoGlue(candidate, lookup, groups);
      if (!terminalFloating && !candidateFloating) return null;
      return terminalFloating
        ? { from: terminal, to: candidate }
        : { from: candidate, to: terminal };
    }

    function distancePointToSegment(point, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq <= 0.0001) return Math.hypot(point.x - a.x, point.y - a.y);
      const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lenSq));
      const x = a.x + t * dx;
      const y = a.y + t * dy;
      return Math.hypot(point.x - x, point.y - y);
    }

    function nearestWireTerminalToGlue(terminal, excludedBranchIds = new Set()) {
      const lookup = netLookup();
      const groups = orderedNetGroups();
      if (!terminalCanReceiveAutoGlue(terminal)) return null;
      if (!terminalIsFloatingForAutoGlue(terminal, lookup, groups)) return null;
      const point = wireEndpointPosition(terminal);
      if (!point) return null;
      let best = null;
      state.wires.forEach(wire => {
        const p1 = wireEndpointPosition(wire.from);
        const p2 = wireEndpointPosition(wire.to);
        if (!p1 || !p2) return;
        const fromParsed = parseTerminal(wire.from);
        const toParsed = parseTerminal(wire.to);
        const candidates = [wire.from, wire.to].filter(candidate => {
          const parsed = parseTerminal(candidate);
          return !excludedBranchIds.has(parsed.branchId) && terminalCanReceiveAutoGlue(candidate);
        });
        if (!candidates.length) return;
        if (excludedBranchIds.has(fromParsed.branchId) && excludedBranchIds.has(toParsed.branchId)) return;
        const mid = snappedWireMid(wire, wire.mid || { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });
        const distance = Math.min(distancePointToSegment(point, p1, mid), distancePointToSegment(point, mid, p2));
        if (distance > AUTO_GLUE_FLOATING_TERMINAL_DISTANCE) return;
        const target = candidates
          .map(candidate => ({ terminal: candidate, point: wireEndpointPosition(candidate) }))
          .filter(item => item.point)
          .sort((a, b) => Math.hypot(a.point.x - point.x, a.point.y - point.y) - Math.hypot(b.point.x - point.x, b.point.y - point.y))[0];
        if (!target) return;
        if (!best || distance < best.distance) {
          best = { terminal: target.terminal, connection: { from: terminal, to: target.terminal }, distance, ambiguous: false };
        } else if (Math.abs(distance - best.distance) < 0.001 && best.terminal !== target.terminal) best.ambiguous = true;
      });
      return best && !best.ambiguous ? best : null;
    }

    function nearestFloatingTerminalToGlue(terminal, excludedBranchIds = new Set()) {
      const lookup = netLookup();
      const groups = orderedNetGroups();
      if (!terminalCanReceiveAutoGlue(terminal)) return null;
      const point = wireEndpointPosition(terminal);
      if (!point) return null;
      let best = null;
      state.branches.forEach(branch => {
        if (excludedBranchIds.has(branch.id)) return;
        visibleTerminalSides(branch).forEach(side => {
          const candidate = terminalKey(branch.id, side);
          if (candidate === terminal) return;
          const connection = autoGlueConnectionForPair(terminal, candidate, lookup, groups);
          if (!connection) return;
          const candidatePoint = wireEndpointPosition(candidate);
          if (!candidatePoint) return;
          const distance = Math.hypot(candidatePoint.x - point.x, candidatePoint.y - point.y);
          if (distance > AUTO_GLUE_FLOATING_TERMINAL_DISTANCE) return;
          if (!best || distance < best.distance) {
            best = { terminal: candidate, connection, distance, ambiguous: false };
          } else if (Math.abs(distance - best.distance) < 0.001) best.ambiguous = true;
        });
      });
      if (best) return best.ambiguous ? null : best;
      return nearestWireTerminalToGlue(terminal, excludedBranchIds);
    }

    function updateAutoGluePreview(branchIds) {
      const moved = new Set(branchIds);
      let nextPreview = null;
      branchIds.some(id => {
        const branch = findBranch(id);
        if (!branch) return false;
        return visibleTerminalSides(branch).some(side => {
          const terminal = terminalKey(branch.id, side);
          const match = nearestFloatingTerminalToGlue(terminal, moved);
          if (!match) return false;
          nextPreview = { terminal: match.connection.from, match: match.connection.to };
          return true;
        });
      });
      state.autoGluePreview = nextPreview;
    }

    function clearAutoGluePreview() {
      state.autoGluePreview = null;
    }

    function showAutoGlueFlash(pairs) {
      if (!pairs.length) return;
      state.autoGlueFlash = { pairs };
      statusEl.textContent = pairs.length === 1
        ? optText("已自动连接悬空端点", "Floating terminals auto-connected")
        : optText(`已自动连接 ${pairs.length} 组悬空端点`, `${pairs.length} floating terminal pairs auto-connected`);
      if (state.autoGlueFlashTimer) window.clearTimeout(state.autoGlueFlashTimer);
      state.autoGlueFlashTimer = window.setTimeout(() => {
        state.autoGlueFlash = null;
        state.autoGlueFlashTimer = null;
        render();
      }, 900);
      render();
    }

    function autoGlueDraggedFloatingTerminals(branchIds) {
      const moved = new Set(branchIds);
      const glued = new Set();
      const pairs = [];
      branchIds.forEach(id => {
        const branch = findBranch(id);
        if (!branch) return;
        visibleTerminalSides(branch).forEach(side => {
          const terminal = terminalKey(branch.id, side);
          if (glued.has(terminal)) return;
          const match = nearestFloatingTerminalToGlue(terminal, moved);
          if (!match || glued.has(match.connection.from) || glued.has(match.connection.to)) return;
          glued.add(match.connection.from);
          glued.add(match.connection.to);
          connectTerminals(match.connection.from, match.connection.to);
          pairs.push({ from: match.connection.from, to: match.connection.to });
        });
      });
      clearAutoGluePreview();
      showAutoGlueFlash(pairs);
      return pairs.length;
    }

    function autoGlueFeedbackPairs() {
      const pairs = [];
      if (state.autoGluePreview) {
        pairs.push({ from: state.autoGluePreview.terminal, to: state.autoGluePreview.match, kind: "preview" });
      }
      (state.autoGlueFlash?.pairs || []).forEach(pair => pairs.push({ ...pair, kind: "flash" }));
      return pairs;
    }

    function snappedWireMid(wire, fallbackMid) {
      const p1 = wireEndpointPosition(wire.from);
      const p2 = wireEndpointPosition(wire.to);
      if (!p1 || !p2) return fallbackMid;
      const mid = { ...fallbackMid };
      const nearP1Y = Math.abs(mid.y - p1.y) <= WIRE_SNAP_DISTANCE;
      const nearP2Y = Math.abs(mid.y - p2.y) <= WIRE_SNAP_DISTANCE;
      const nearP1X = Math.abs(mid.x - p1.x) <= WIRE_SNAP_DISTANCE;
      const nearP2X = Math.abs(mid.x - p2.x) <= WIRE_SNAP_DISTANCE;
      if (nearP1Y && nearP2Y) mid.y = Math.abs(mid.y - p1.y) <= Math.abs(mid.y - p2.y) ? p1.y : p2.y;
      if (nearP1X && nearP2X) mid.x = Math.abs(mid.x - p1.x) <= Math.abs(mid.x - p2.x) ? p1.x : p2.x;
      return mid;
    }

    function netGroups() {
      const parent = new Map();
      const all = [];

      state.branches.forEach(branch => visibleTerminalSides(branch).forEach(side => all.push(terminalKey(branch.id, side))));

      function add(x) {
        if (!parent.has(x)) parent.set(x, x);
      }

      function find(x) {
        add(x);
        const p = parent.get(x);
        if (p !== x) parent.set(x, find(p));
        return parent.get(x);
      }

      function union(a, b) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent.set(rb, ra);
      }

      all.forEach(add);
      state.wires.forEach(wire => union(wire.from, wire.to));

      const groups = new Map();
      all.forEach(key => {
        const root = find(key);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(key);
      });

      return Array.from(groups.values()).map((members, index) => ({
        id: `N${index + 1}`,
        members
      }));
    }

    function orderedNetGroups() {
      const groups = netGroups();
      const byId = new Map(groups.map(group => [group.id, group]));
      const ordered = [];
      state.nodeOrder.forEach(id => {
        if (byId.has(id)) {
          ordered.push(byId.get(id));
          byId.delete(id);
        }
      });
      return ordered.concat(Array.from(byId.values()).sort((a, b) => Number(a.id.slice(1)) - Number(b.id.slice(1))));
    }

    function currentNodeOrder() {
      return orderedNetGroups().map(group => group.id);
    }

    function nodeDisplayName(id) {
      return state.nodeLabels[id] || id;
    }

    function cleanupAutoYBoxNodeLabels() {
      Object.entries(state.nodeLabels).forEach(([id, label]) => {
        if (/^Y?Box\d+(?:_\d+)?$/i.test(String(label || ""))) delete state.nodeLabels[id];
      });
    }

    function captureNodeDisplayState() {
      return netGroups().map(group => ({
        id: group.id,
        display: nodeDisplayName(group.id),
        color: state.nodeColors?.[group.id] || null,
        internal: state.internalNodes.includes(group.id),
        members: [...group.members]
      }));
    }

    function applyNodeDisplayState(previousStates = [], explicitDisplays = []) {
      const currentGroups = netGroups();
      const explicitByTerminal = new Map(explicitDisplays.map(item => [item.terminal, item]));
      const nextLabels = {};
      const nextColors = {};
      const nextInternal = [];
      const previousIdByCurrent = new Map();

      currentGroups.forEach(group => {
        let display = null;
        let color = null;
        let internal = false;
        const explicitItem = group.members.map(member => explicitByTerminal.get(member)).find(Boolean);
        const explicit = typeof explicitItem === "object" ? explicitItem.display : explicitItem;
        if (explicit) {
          display = explicit;
          color = typeof explicitItem === "object" ? explicitItem.color : null;
          internal = Boolean(typeof explicitItem === "object" && explicitItem.internal);
        } else {
          let best = null;
          previousStates.forEach(previous => {
            const previousMembers = new Set(previous.members || []);
            const overlap = group.members.filter(member => previousMembers.has(member)).length;
            if (overlap > 0 && (!best || overlap > best.overlap)) {
              best = { id: previous.id, overlap, display: previous.display, color: previous.color, internal: previous.internal };
            }
          });
          display = best?.display || null;
          color = best?.color || null;
          internal = Boolean(best?.internal);
          if (best?.id) previousIdByCurrent.set(group.id, best.id);
        }
        if (!color && state.nodeColors?.[group.id]) color = state.nodeColors[group.id];
        if (display && display !== group.id) nextLabels[group.id] = display;
        if (color) nextColors[group.id] = color;
        if (internal) nextInternal.push(group.id);
      });

      state.nodeLabels = nextLabels;
      state.nodeColors = nextColors;
      state.internalNodes = nextInternal;
      state.nodeOrder = remapNodeOrderAfterTopologyChange(state.nodeOrder, currentGroups, previousIdByCurrent);
      cleanupAutoYBoxNodeLabels();
    }

    function remapNodeOrderAfterTopologyChange(previousOrder, currentGroups, previousIdByCurrent) {
      const ordered = [];
      const currentIds = new Set(currentGroups.map(group => group.id));
      const currentByPrevious = new Map();
      currentGroups.forEach(group => {
        const previousId = previousIdByCurrent.get(group.id);
        if (previousId && !currentByPrevious.has(previousId)) currentByPrevious.set(previousId, group.id);
      });
      (previousOrder || []).forEach(previousId => {
        const mapped = currentByPrevious.get(previousId) || (currentIds.has(previousId) ? previousId : null);
        if (mapped && !ordered.includes(mapped)) ordered.push(mapped);
      });
      currentGroups.forEach(group => {
        if (!ordered.includes(group.id)) ordered.push(group.id);
      });
      return ordered;
    }

    function captureVisibleNodeOrderRows() {
      return mergePackagedRowsInOriginalOrder(orderedNetGroups(), packagedHiddenNodeRows()).map(row => {
        const exposed = row.virtualInternal ? null : exposedPackagedNodeForGroup(row);
        const packagedBranch = row.virtualInternal ? findBranch(row.branchId) : null;
        const packageGroup = exposed?.group || (packagedBranch ? packagedNodeGroup(packagedBranch, row.packageKind || "internal", row.internalIndex) : null);
        return {
          id: row.id,
          display: row.virtualInternal ? row.display : (exposed?.group.display || nodeDisplayName(row.id)),
          originalNet: exposed?.group.globalNet || row.originalNet || row.id,
          members: [...(row.members || []), ...(packageGroup?.members || [])]
        };
      });
    }

    function restoreNodeOrderFromRows(previousRows, remapTerminal = terminal => terminal) {
      const currentGroups = orderedNetGroups();
      const candidates = currentGroups.map(group => ({
        id: group.id,
        display: nodeDisplayName(group.id),
        members: new Set(group.members || [])
      }));
      const used = new Set();
      const ordered = [];

      previousRows.forEach(row => {
        const rowMembers = (row.members || []).map(remapTerminal).filter(Boolean);
        let best = null;
        candidates.forEach(candidate => {
          if (used.has(candidate.id)) return;
          let score = 0;
          if (row.originalNet && row.originalNet === candidate.id) score += 1000;
          if (row.display && row.display === candidate.display) score += 100;
          rowMembers.forEach(member => {
            if (candidate.members.has(member)) score += 10;
          });
          if (score > 0 && (!best || score > best.score)) best = { id: candidate.id, score };
        });
        if (best) {
          used.add(best.id);
          ordered.push(best.id);
        }
      });

      candidates.forEach(candidate => {
        if (!used.has(candidate.id)) ordered.push(candidate.id);
      });
      state.nodeOrder = ordered;
    }

    function setNodeColor(id, color) {
      if (!id || !NODE_COLOR_PALETTE.includes(color)) return;
      commitHistory();
      state.nodeColors[id] = color;
      state.colorPickerNodeId = null;
      render();
    }

    function renameNode(id) {
      renamingNodeId = id;
      renamingCanvasId = null;
      renameTitle.textContent = tr("重命名节点");
      renameInputLabel.textContent = tr("节点名");
      renameNodeInput.value = nodeDisplayName(id);
      renameDialog.classList.add("open");
      renameNodeInput.focus();
      renameNodeInput.select();
    }

    function renameCanvas(id) {
      const canvasState = state.canvases.find(item => item.id === id);
      if (!canvasState) return;
      saveActiveCanvas();
      renamingNodeId = null;
      renamingCanvasId = id;
      renameTitle.textContent = tr("重命名画布");
      renameInputLabel.textContent = tr("画布名");
      renameNodeInput.value = canvasState.name || defaultCanvasName(id);
      renameDialog.classList.add("open");
      renameNodeInput.focus();
      renameNodeInput.select();
    }

    function saveRenameNode() {
      if (!renamingNodeId && !renamingCanvasId) return;
      const next = renameNodeInput.value;
      const clean = next.trim();
      if (renamingCanvasId) {
        const canvasState = state.canvases.find(item => item.id === renamingCanvasId);
        if (canvasState) {
          const name = clean || defaultCanvasName(renamingCanvasId);
          canvasState.name = name;
          canvasState.data = canvasState.data || blankCanvasData(name);
          canvasState.data.name = name;
        }
        closeRenameDialog();
        render();
        return;
      }
      if (!clean) {
        delete state.nodeLabels[renamingNodeId];
      } else {
        state.nodeLabels[renamingNodeId] = clean;
      }
      syncPackagedExposedNodeDisplay(renamingNodeId);
      invalidateMathCaches();
      closeRenameDialog();
      render();
    }

    function resetRenameNode() {
      if (!renamingNodeId && !renamingCanvasId) return;
      if (renamingCanvasId) {
        const canvasState = state.canvases.find(item => item.id === renamingCanvasId);
        if (canvasState) {
          const name = defaultCanvasName(renamingCanvasId);
          canvasState.name = name;
          canvasState.data = canvasState.data || blankCanvasData(name);
          canvasState.data.name = name;
        }
        closeRenameDialog();
        render();
        return;
      }
      delete state.nodeLabels[renamingNodeId];
      syncPackagedExposedNodeDisplay(renamingNodeId);
      invalidateMathCaches();
      closeRenameDialog();
      render();
    }

    function syncPackagedExposedNodeDisplay(nodeId) {
      const group = orderedNetGroups().find(item => item.id === nodeId);
      const info = group ? exposedPackagedNodeForGroup(group) : null;
      if (!info?.group) return;
      const display = nodeDisplayName(nodeId);
      info.group.display = display;
      if (info.port && info.branch?.nodes) info.branch.nodes[info.port] = display;
    }

    function closeRenameDialog() {
      renameDialog.classList.remove("open");
      renamingNodeId = null;
      renamingCanvasId = null;
    }

    function editableField(label, field, value, multiline = false) {
      const displayLabel = tr(label);
      const editTitle = tr(`编辑 ${label}`);
      return `
        <div class="field">
          <label>${escapeHtml(displayLabel)}</label>

            <button class="node-edit-button" type="button" data-edit-field="${escapeHtml(field)}" data-edit-label="${escapeHtml(displayLabel)}" data-edit-multiline="${multiline ? "1" : "0"}" title="${escapeHtml(editTitle)}" aria-label="${escapeHtml(editTitle)}">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

    function selectField(label, field, value, options) {

    function checkboxField(label, field, checked, helpText = "") {
      return `

          <label class="compact-check">
            <input data-field="${escapeHtml(field)}" type="checkbox" ${checked ? "checked" : ""}>

          </label>
          ${helpText ? `<div class="modal-help">${escapeHtml(tr(helpText))}</div>` : ""}
        </div>
      `;
    }

    const G_SYMBOL_RESERVED = new Set([
      "Abs", "False", "None", "PI", "True", "V", "I", "Ihis",
      "acos", "asin", "atan", "cos", "cosh", "exp", "log",
      "pow", "sin", "sinh", "sqrt", "tan", "tanh"
    ]);

    function extractExpressionSymbols(text) {
      const symbols = new Set();
      String(text || "").replace(/\b[A-Za-z_]\w*\b/g, name => {
        if (!G_SYMBOL_RESERVED.has(name)) symbols.add(name);
        return name;
      });
      return symbols;
    }

    function parseSymbolList(text) {
      const symbols = new Set();
      String(text || "").split(/[\s,;，；]+/).forEach(item => {
        const clean = item.trim();
        if (/^[A-Za-z_]\w*$/.test(clean) && !G_SYMBOL_RESERVED.has(clean)) symbols.add(clean);
      });
      return symbols;
    }

    function branchGExpressions(branch) {
      if (branch.kind === "dummy_node_block") return [branch.fixedConductance || "G_EPSILON"];
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") return [branchValue(branch, "gMatrix")];
      if (branch.kind === "current_source") return currentSourceControlRows(branch).map(row => row.coefficient || "");
      if (branch.kind === "voltage_source_series_r") return [voltageSourceSeriesConductance(branch)];
      return [branchValue(branch, "g")];
    }

    function branchGIsConstant(branch) {
      const activeCase = activeSwitchCase(branch);
      return activeCase?.gIsConstant ?? branch.gIsConstant ?? true;
    }

    function branchConstantGSymbolsText(branch) {
      const activeCase = activeSwitchCase(branch);
      return activeCase?.constantGSymbols ?? branch.constantGSymbols ?? "";
    }

    function branchConstantGSymbols(branch) {
      const manual = parseSymbolList(branchConstantGSymbolsText(branch));
      if (branch.packageOriginal) {
        const symbols = new Set(manual);
        packagedGBranches(branch).forEach(({ inner }) => {
          branchConstantGSymbols(inner).forEach(symbol => symbols.add(symbol));
        });
        return symbols;
      }
      if (branchGIsConstant(branch) === false) return manual;
      const symbols = new Set(manual);
      branchGExpressions(branch).forEach(expr => {
        extractExpressionSymbols(expr).forEach(symbol => symbols.add(symbol));
      });
      return symbols;
    }

    function runtimeMutableGConstantNotice() {
      return `
        <div class="runtime-gconst-notice">
          ${escapeHtml(tr("运行时工况切换时，常数/变量归属由后端按所有 case 自动分析；这里的手动常数设置不会用于该导出路径。"))}
        </div>
      `;
    }

    function constantGEditor(branch, compact = false) {
      const checked = branchGIsConstant(branch);
      const inferred = [...branchConstantGSymbols(branch)].sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
      const help = compact
        ? "勾选时会把当前 G 表达式中的符号默认视为常数；下方可补充常数符号。"
        : "按变量名判断常数。若 G[0][0] = X + Y + Z 且只填 Z，则只有 Z 可进入 RAM；X/Y 留在 CODE。";
      if (isRuntimeMutableCaseGroup(branch)) {
        return `
          ${runtimeMutableGConstantNotice()}
          <div class="field">
            <label class="compact-check">
              <input data-field="gIsConstant" disabled type="checkbox" ${checked ? "checked" : ""}>
              <span>${escapeHtml(tr("G 是否为常数？"))}</span>
            </label>
          </div>
          <div class="field">
            <label>${escapeHtml(tr("常数 G 符号"))}</label>
            <input data-field="constantGSymbols" disabled value="${escapeHtml(branchConstantGSymbolsText(branch))}">
          </div>
          <div class="modal-help">${escapeHtml(tr("当前识别为常数的 G 符号"))}: ${escapeHtml(inferred.join(", ") || tr("无"))}</div>
        `;
      }
      return `
        ${checkboxField("G 是否为常数？", "gIsConstant", checked, help)}
        ${editableField("常数 G 符号", "constantGSymbols", branchConstantGSymbolsText(branch), false)}
        <div class="modal-help">${escapeHtml(tr("可选：主要用于 G 表达式里常数和变量混合的情况；普通单支路通常不用填写。"))}</div>
        <div class="modal-help">${escapeHtml(tr("当前识别为常数的 G 符号"))}: ${escapeHtml(inferred.join(", ") || tr("无"))}</div>
      `;
    }

    function transformerTerminalDisplayName(branch, side) {
      const netId = netLookup().get(terminalKey(branch.id, side)) || "";
      return nodeDisplayName(netId) || branch.nodes?.[side] || side;
    }

    function readonlyField(label, value) {
      return `
        <div class="field">
          <label>${escapeHtml(label)}</label>
          <input readonly value="${escapeHtml(value)}">
        </div>
      `;
    }

    function readonlyMultilineField(label, value) {
      return `
        <div class="field">
          <label>${escapeHtml(label)}</label>
          <textarea class="readonly-math-field" readonly>${escapeHtml(value)}</textarea>
        </div>
      `;
    }

    function editorGroup(key, title, body, openByDefault = true) {
      if (!String(body || "").trim()) return "";
      const isOpen = state.editorGroups[key] ?? openByDefault;
      return `
        <details class="editor-group" data-editor-group="${escapeHtml(key)}" ${isOpen ? "open" : ""}>
          <summary>${escapeHtml(tr(title))}</summary>
          <div class="editor-group-body">${body}</div>
        </details>
      `;
    }

    function editorGroupList(groups) {
      return `<div class="editor-groups">${groups.filter(Boolean).join("")}</div>`;
    }

    function openFieldEditor(field, label, multiline) {
      const branch = findBranch(state.selectedId);
      if (!branch) return;
      editingField = { field, multiline };
      const value = getBranchFieldValue(branch, field);
      fieldTitle.textContent = state.language === "en" ? `Edit ${translateText(label)}` : `编辑 ${label}`;
      fieldInputLabel.textContent = tr(label);
      fieldInput.style.display = multiline ? "none" : "block";
      fieldTextarea.style.display = multiline ? "block" : "none";
      if (multiline) {
        fieldTextarea.value = value;
      } else {
        fieldInput.value = value;
      }
      fieldDialog.classList.add("open");
      const target = multiline ? fieldTextarea : fieldInput;
      target.focus();
      target.select();
    }

    function getBranchFieldValue(branch, field) {
      if (field === "switchCaseName") return activeSwitchCase(branch)?.name || "";
      if (field === "packageNetworkCaseName") return activePackageNetworkCaseName(branch);
      if (field === "constantGSymbols") return branchConstantGSymbolsText(branch);
      if (field.startsWith("controlRow.")) {
        const [, index, key] = field.split(".");
        return currentSourceControlRows(branch)[Number(index)]?.[key] || "";
      }
      if (field.startsWith("node.")) return branch.nodes[field.slice(5)] || "";
      if (field.startsWith("current.")) {
        const [, index, key] = field.split(".");
        const current = branch.currents[Number(index)] || {};
        if (branch.kind === "custom_n_port" && key === "fromNode") return customObserverDisplayName(branch, current.from);
        if (branch.kind === "custom_n_port" && key === "toNode") return customObserverDisplayName(branch, current.to);
        return current[key] || "";
      }
      if (field === "portLayout") return JSON.stringify(customPortLayout(branch), null, 2);
      if (switchedValueFields(branch).includes(field)) return branchValue(branch, field);
      return branch[field] || "";
    }

    function saveFieldEditor() {
      if (!editingField) return;
      const value = editingField.multiline ? fieldTextarea.value : fieldInput.value;
      updateBranchField(editingField.field, value);
      closeFieldEditor();
      render();
    }

    function closeFieldEditor() {
      fieldDialog.classList.remove("open");
      editingField = null;
    }

    function netLookup() {
      const lookup = new Map();
      orderedNetGroups().forEach(group => {
        group.members.forEach(member => lookup.set(member, group.id));
      });
      return lookup;
    }

    const NODE_COLOR_PALETTE = [
      "#2563eb",
      "#15803d",
      "#b42318",
      "#a16207",
      "#7c3aed",
      "#0f766e",
      "#be185d",
      "#475569",
      "#ea580c",
      "#0891b2",
      "#4f46e5",
      "#65a30d",
      "#dc2626",
      "#16a34a",
      "#9333ea",
      "#0284c7",
      "#ca8a04",
      "#db2777",
      "#64748b",
      "#0d9488",
      "#7c2d12",
      "#1d4ed8",
      "#84cc16",
      "#f97316",
      "#06b6d4",
      "#8b5cf6",
      "#f43f5e",
      "#10b981",
      "#f59e0b",
      "#334155"
    ];

    function defaultNetColor(netName) {
      const colors = [
        "#2563eb",
        "#15803d",
        "#b42318",
        "#a16207",
        "#7c3aed",
        "#0f766e",
        "#be185d",
        "#475569"
      ];
      const index = Math.max(0, Number(netName.replace("N", "")) - 1);
      return colors[index % colors.length];
    }

    function netColor(netName) {
      return state.nodeColors?.[netName] || defaultNetColor(netName);
    }

    function packagedInternalNodeId(branch, group, index) {
      return `pkg-internal:${branch.id}:${index}`;
    }

    function packagedHiddenNodeId(branch, kind, index) {
      return kind === "internal" ? packagedInternalNodeId(branch, null, index) : `pkg-external:${branch.id}:${index}`;
    }

    function packagedNodeGroup(branch, kind, index) {
      return kind === "internal"
        ? branch.packageOriginal?.internalGroups?.[index]
        : branch.packageOriginal?.externalGroups?.[index];
    }

    function packagedNodeExposePort(branch, kind, index) {
      const group = packagedNodeGroup(branch, kind, index);
      if (!group) return "";
      const port = kind === "internal" ? group.exposePort : group.port;
      return port && terminalSides(branch).includes(port) ? port : "";
    }

    function packagedHiddenNodeRows() {
      const rows = [];
      state.branches.forEach(branch => {
        if (branch.kind === "custom_n_port" && !branch.packageOriginal) {
          (branch.hiddenPorts || []).forEach((port, index) => {
            if (!terminalSides(branch).includes(port)) return;
            const display = branch.nodes?.[port] || port;
            rows.push({
              id: customHiddenNodeId(branch, port),
              virtualInternal: true,
              customHidden: true,
              branchId: branch.id,
              branchName: branch.name,
              port,
              internalIndex: index,
              originalGroupId: port,
              originalNet: port,
              display,
              members: [terminalKey(branch.id, port)],
              color: defaultNetColor(`N${index + 1}`)
            });
          });
          return;
        }
        if (branch.kind !== "custom_n_port" || !branch.packageOriginal) return;
        (branch.packageOriginal.externalGroups || []).forEach((group, index) => {
          if (packagedNodeExposePort(branch, "external", index)) return;
          const display = group.display || group.id || `external_${index + 1}`;
          rows.push({
            id: packagedHiddenNodeId(branch, "external", index),
            virtualInternal: true,
            packageKind: "external",
            branchId: branch.id,
            branchName: branch.name,
            internalIndex: index,
            originalGroupId: group.id,
            originalNet: group.globalNet,
            display,
            members: [],
            isolatedDummyInternal: Boolean(group.isolatedDummyInternal),
            color: state.nodeColors?.[group.globalNet] || state.nodeColors?.[group.id] || defaultNetColor(`N${index + 1}`)
          });
        });
        (branch.packageOriginal.internalGroups || []).forEach((group, index) => {
          if (packagedNodeExposePort(branch, "internal", index)) return;
          const display = group.display || group.id || `internal_${index + 1}`;
          rows.push({
            id: packagedHiddenNodeId(branch, "internal", index),
            virtualInternal: true,
            packageKind: "internal",
            branchId: branch.id,
            branchName: branch.name,
            internalIndex: index,
            originalGroupId: group.id,
            originalNet: group.globalNet,
            display,
            members: [],
            color: state.nodeColors?.[group.globalNet] || state.nodeColors?.[group.id] || defaultNetColor(`N${index + 1}`)
          });
        });
      });
      return rows;
    }

    function customHiddenNodeId(branch, port) {
      return `custom-hidden:${branch.id}:${port}`;
    }

    function customHiddenPortForGroup(group) {
      if (!group?.customHidden) return null;
      const branch = findBranch(group.branchId);
      if (!branch) return null;
      return { branch, port: group.port, group };
    }

    function packagedInternalExposePort(branch, index) {
      return packagedNodeExposePort(branch, "internal", index);
    }

    function exposedPackagedNodeForGroup(group) {
      for (const member of group.members || []) {
        const parsed = parseTerminal(member);
        const branch = findBranch(parsed.branchId);
        if (!branch?.packageOriginal) continue;
        const externalIndex = (branch.packageOriginal.externalGroups || []).findIndex(item => item.port === parsed.side);
        if (externalIndex >= 0) return { branch, kind: "external", index: externalIndex, port: parsed.side, group: branch.packageOriginal.externalGroups[externalIndex] };
        const index = (branch.packageOriginal.internalGroups || []).findIndex(item => item.exposePort === parsed.side);
        if (index >= 0) return { branch, kind: "internal", index, port: parsed.side, group: branch.packageOriginal.internalGroups[index] };
      }
      return null;
    }

    function setPackagedNodeExposure(branchId, kind, index, exposed, options = {}) {
      const branch = findBranch(branchId);
      const group = packagedNodeGroup(branch, kind, index);
      if (!branch || !group) return;
      const port = kind === "internal" ? (group.exposePort || `I${index + 1}`) : (group.port || `P${index + 1}`);
      const netId = netLookup().get(terminalKey(branch.id, port));
      const wasInternal = state.internalNodes.includes(netId);
      if (!exposed && kind === "external" && !wasInternal) {
        const ok = window.confirm(tr("隐藏外部节点会强制将它作为内部节点参与消元，可能导致支路电流观测不完整或方向理解发生变化。是否继续？"));
        if (!ok) return;
      }
      const beforeNodeState = captureNodeDisplayState();
      commitHistory();
      if (exposed) {
        if (kind === "internal") group.exposePort = port;
        if (kind === "external") group.hidden = false;
        branch.ports = [...new Set([...(branch.ports || []), port])];
        branch.nodes = { ...(branch.nodes || {}), [port]: group.display || group.id || port };
        if (!branch.portLayout?.some(item => item.id === port)) {
          branch.portLayout = [...customPortLayout(branch), { id: port, side: "bottom", t: 0.5, order: 999 }];
        }
        state.selectedId = branch.id;
        state.selectedIds = [branch.id];
        state.selectedNetIds = [];
      } else {
        branch.ports = (branch.ports || []).filter(item => item !== port);
        delete branch.nodes?.[port];
        delete branch.terminalLayout?.[port];
        delete branch.leadAnchors?.[port];
        branch.portLayout = (branch.portLayout || []).filter(item => item.id !== port);
        if (kind === "internal") group.exposePort = "";
        if (kind === "external") group.hidden = true;
        group.hiddenInternal = true;
        state.wires = state.wires.filter(wire => wire.from !== terminalKey(branch.id, port) && wire.to !== terminalKey(branch.id, port));
      }
      const nextInternal = options.forceExternal ? false : Boolean(group.hiddenInternal ?? kind === "internal");
      applyNodeDisplayState(beforeNodeState, exposed ? [{ terminal: terminalKey(branch.id, port), display: group.display || port, internal: nextInternal }] : []);
      invalidateMathCaches();
      render();
    }

    function exposePackagedNodeAsExternal(branchId, kind, index) {
      setPackagedNodeExposure(branchId, kind, index, true, { forceExternal: true });
    }

    function setPackagedInternalExposure(branchId, index, exposed) {
      setPackagedNodeExposure(branchId, "internal", index, exposed);
    }

    function setCustomPortExposure(branchId, port, exposed, options = {}) {
      const branch = findBranch(branchId);
      if (!branch || branch.kind !== "custom_n_port" || branch.packageOriginal || !terminalSides(branch).includes(port)) return;
      const beforeNodeState = captureNodeDisplayState();
      const netId = netLookup().get(terminalKey(branch.id, port));
      const wasInternal = state.internalNodes.includes(netId);
      if (!exposed && !wasInternal) {
        const ok = window.confirm(tr("隐藏外部节点会强制将它作为内部节点参与消元，可能导致支路电流观测不完整或方向理解发生变化。是否继续？"));
        if (!ok) return;
      }
      commitHistory();
      branch.hiddenPorts = (branch.hiddenPorts || []).filter(item => item !== port);
      branch.hiddenPortStates = { ...(branch.hiddenPortStates || {}) };
      if (exposed) {
        const stateItem = branch.hiddenPortStates[port] || {};
        delete branch.hiddenPortStates[port];
        const internal = options.forceExternal ? false : Boolean(stateItem.internal ?? true);
        applyNodeDisplayState(beforeNodeState, [{ terminal: terminalKey(branch.id, port), display: branch.nodes?.[port] || port, internal }]);
      } else {
        branch.hiddenPorts.push(port);
        branch.hiddenPortStates[port] = { internal: true };
        state.wires = state.wires.filter(wire => wire.from !== terminalKey(branch.id, port) && wire.to !== terminalKey(branch.id, port));
        applyNodeDisplayState(beforeNodeState);
      }
      invalidateMathCaches();
      render();
    }

    function exposeCustomPortAsExternal(branchId, port) {
      setCustomPortExposure(branchId, port, true, { forceExternal: true });
    }

    function mergePackagedRowsInOriginalOrder(realRows, hiddenRows) {
      let rows = [...realRows, ...hiddenRows];
      state.branches.forEach(branch => {
        if (!branch.packageOriginal) return;
        const currentPackageRows = rows.filter(row => {
          if (row.branchId === branch.id) return true;
          const info = !row.virtualInternal ? exposedPackagedNodeForGroup(row) : null;
          return info?.branch.id === branch.id;
        });
        if (
          currentPackageRows.length &&
          currentPackageRows.every(row => state.nodeOrder.includes(row.id))
        ) {
          return;
        }
        const packageRows = [];
        const rowIds = new Set();
        const addRow = row => {
          if (!row || rowIds.has(row.id)) return;
          rowIds.add(row.id);
          packageRows.push(row);
        };
        (branch.packageOriginal.nodeState || []).forEach(saved => {
          const displayed = saved.display || saved.id;
          const hidden = hiddenRows.find(row => row.branchId === branch.id && (row.display === displayed || row.originalNet === saved.id));
          if (hidden) {
            addRow(hidden);
            return;
          }
          const exposed = realRows.find(row => {
            const info = exposedPackagedNodeForGroup(row);
            return info?.branch.id === branch.id && (info.group.display === displayed || info.group.globalNet === saved.id);
          });
          addRow(exposed);
        });
        if (!packageRows.length) return;
        const firstIndex = rows.findIndex(row => rowIds.has(row.id));
        rows = rows.filter(row => !rowIds.has(row.id));
        rows.splice(firstIndex >= 0 ? firstIndex : rows.length, 0, ...packageRows);
      });
      return rows;
    }

    function terminalNetName(key) {
      const groups = netGroups();
      const group = groups.find(item => item.members.includes(key));
      return group ? nodeDisplayName(group.id) : branchTerminalNode(key);
    }

    function groupByTerminalMap(groups = netGroups()) {
      const map = new Map();
      groups.forEach(group => group.members.forEach(key => map.set(key, group)));
      return map;
    }

    function terminalNetNameFromMap(key, groupByTerminal) {
      const group = groupByTerminal?.get(key);
      return group ? nodeDisplayName(group.id) : terminalNetName(key);
    }

    function packagedPortDisplayMap(branch) {
      const map = new Map();
      const lookup = netLookup();
      const displayForPort = (port, fallback) => {
        const netId = port ? lookup.get(terminalKey(branch.id, port)) : null;
        return netId ? nodeDisplayName(netId) : fallback;
      };
      (branch.packageOriginal?.externalGroups || []).forEach(group => {
        if (group.port) map.set(group.port, displayForPort(group.port, group.display || group.port));
      });
      (branch.packageOriginal?.internalGroups || []).forEach((group, index) => {
        const port = group.exposePort || `I${index + 1}`;
        map.set(port, displayForPort(port, group.display || port));
      });
      return map;
    }

    function packagedExpressionForDisplay(branch, expression) {
      let result = expression || "0";
      packagedPortDisplayMap(branch).forEach((display, port) => {
        result = result.replace(new RegExp(`\\bV_${escapeRegExp(port)}\\b`, "g"), `V_${display}`);
      });
      return result;
    }

    function currentEndpointLabel(branch, current, endpoint, groupByTerminal = null) {
      const explicit = current?.[`${endpoint}Label`];
      if (explicit) return explicit;
      const side = current?.[endpoint];
      return terminalNetNameFromMap(terminalKey(branch.id, side), groupByTerminal);
    }

    function branchUsesMatrix(branch) {
      return branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port";
    }

    function switchedValueFields(branch) {
      return branchUsesMatrix(branch) ? ["gMatrix", "ihisVector"] : ["g", "ihis"];
    }

    function switchCaseFromBranch(branch, index = 0) {
      const item = {
        name: `Case ${index + 1}`,
        gIsConstant: branch.gIsConstant !== false,
        constantGSymbols: branch.constantGSymbols || ""
      };
      switchedValueFields(branch).forEach(field => {
        item[field] = branch[field] || (field === "g" ? "1/R" : field === "ihis" ? "0" : "[]");
      });
      return item;
    }

    function packageInternalWiresForBranches(branches, wires = []) {
      const ids = new Set((branches || []).map(item => item.id));
      return (wires || []).filter(wire => ids.has(parseTerminal(wire.from).branchId) && ids.has(parseTerminal(wire.to).branchId));
    }

    function packageNetworkCaseFromBranch(branch, index = 0) {
      const pkg = branch.packageOriginal || {};
      const gMatrix = branch.gMatrix || "[]";
      const ihisVector = branch.ihisVector || "[]";
      return {
        name: `Case ${index + 1}`,
        branches: structuredClone(pkg.branches || []),
        wires: structuredClone(packageInternalWiresForBranches(pkg.branches || [], pkg.wires || [])),
        nodeState: structuredClone(pkg.nodeState || []),
        nodeOrder: structuredClone(pkg.nodeOrder || []),
        externalGroups: structuredClone(pkg.externalGroups || []),
        internalGroups: structuredClone(pkg.internalGroups || []),
        K_v: structuredClone(pkg.K_v || []),
        K_h: structuredClone(pkg.K_h || []),
        gMatrix,
        ihisVector,
        superExternalGroups: structuredClone(pkg.superExternalGroups || pkg.externalGroups || []),
        superInternalGroups: structuredClone(pkg.superInternalGroups || pkg.internalGroups || []),
        superK_v: structuredClone(pkg.superK_v || pkg.K_v || []),
        superK_h: structuredClone(pkg.superK_h || pkg.K_h || []),
        superGMatrix: branch.superGMatrix || gMatrix,
        superIhisVector: branch.superIhisVector || ihisVector,
        finalExternalGroups: structuredClone(pkg.finalExternalGroups || pkg.externalGroups || []),
        finalInternalGroups: structuredClone(pkg.finalInternalGroups || pkg.internalGroups || []),
        finalK_v: structuredClone(pkg.finalK_v || pkg.K_v || []),
        finalK_h: structuredClone(pkg.finalK_h || pkg.K_h || []),
        finalGMatrix: branch.finalGMatrix || gMatrix,
        finalIhisVector: branch.finalIhisVector || ihisVector,
        dummyNodeBlocks: structuredClone(pkg.dummyNodeBlocks || []),
        currents: structuredClone(branch.currents || []),
        gIsConstant: branch.gIsConstant !== false,
        constantGSymbols: branch.constantGSymbols || ""
      };
    }
