        <text class="component-subtext" x="${branch.x}" y="${branch.y + 12}">${escapeSvg(tr("N-Dummy 节点块"))}</text>
        <text class="switch-label" x="${branch.x}" y="${branch.y + 30}">${escapeSvg(tr("强制消去"))}</text>
        ${resizeHandlesSvg(branch, selected)}
        ${terminals.map(([side, x, y, edge]) => {
          const netId = nets.get(terminalKey(branch.id, side)) || "";
          const net = nodeDisplayName(netId);
          const color = netColor(netId);
          const labelY = edge === "top" ? y - 13 : (edge === "bottom" ? y + 28 : y + 24);
          const badgeY = edge === "bottom" ? y + 10 : y - 34;
          return `
            <circle class="terminal dummy-terminal${netHoverClass(netId)}" cx="${x}" cy="${y}" r="8" data-terminal="${terminalKey(branch.id, side)}" data-port-side="${side}"></circle>
            <rect class="net-badge-bg${netHoverClass(netId)}" data-net-id="${netId}" data-port-side="${side}" x="${x - 17}" y="${badgeY}" width="34" height="18" rx="5" fill="${color}"></rect>
            <text class="net-badge" data-net-id="${netId}" data-port-side="${side}" x="${x}" y="${badgeY + 9}">${escapeSvg(net)}</text>
            ${state.showLocalLabels ? `<text class="node-label" data-port-side="${side}" x="${x}" y="${labelY}">${escapeSvg(branch.nodes?.[side] || side)}</text>` : ""}
          `;
        }).join("")}
      `;

      bindBranchGroupInteractions(group, branch);
      branchLayer.appendChild(group);
    }

    function renderCustomNPort(branch, selected, nets) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const currentHighlight = branchCurrentHighlight(branch);
      const canvasHighlight = branchCanvasHighlight(branch);
      group.setAttribute("class", `branch${selected ? " selected" : ""}${currentHighlight ? " current-hover" : ""}${canvasHighlight.className}`);
      if (canvasHighlight.style) group.setAttribute("style", canvasHighlight.style);
      group.setAttribute("transform", `rotate(${branch.rotation} ${branch.x} ${branch.y})`);
      group.dataset.branchId = branch.id;

      const left = branch.x - branch.width / 2;
      const top = branch.y - branch.height / 2;
      const layout = customPortLayout(branch);
      const terminals = layout.map(port => {
        const p = terminalDrawPosition(branch, port.id);
        return [port.id, p.x, p.y, port.side];
      });
      group.setAttribute("class", `branch${selected ? " selected" : ""}${currentHighlight ? " current-hover" : ""}${canvasHighlight.className}`);

      group.innerHTML = `
        <rect class="hitbox" x="${left - BRANCH_HIT_PAD_X}" y="${top - BRANCH_HIT_PAD_Y}" width="${branch.width + BRANCH_HIT_PAD_X * 2}" height="${branch.height + BRANCH_HIT_PAD_Y * 2}" rx="8"></rect>
        <rect class="branch-body" x="${left}" y="${top}" width="${branch.width}" height="${branch.height}" rx="4"></rect>
        ${customCurrentHoverOverlay(branch, currentHighlight)}
        ${packagedInternalHoverOverlay(branch)}
        <text class="branch-label" x="${branch.x}" y="${branch.y - 5}">${escapeSvg(branch.name)}</text>
        ${switchCaseLabelSvg(branch, 22) || `<text class="component-subtext" x="${branch.x}" y="${branch.y + 16}">${escapeSvg(terminalSides(branch).length)}-port network</text>`}
        ${resizeHandlesSvg(branch, selected)}
        ${terminals.map(([side, x, y, edge]) => {
          const netId = nets.get(terminalKey(branch.id, side)) || "";
          const net = nodeDisplayName(netId);
          const color = netColor(netId);
          const inner = customLeadInnerPoint(branch, x, y, edge, side);
          const labelY = edge === "top" ? y - 13 : (edge === "bottom" ? y + 28 : y + 24);
          const badgeY = edge === "bottom" ? y + 10 : y - 34;
          const isDummyPort = packagedDummyPortSides(branch).has(side);
          return `
            <circle class="port-drag-hit" cx="${x}" cy="${y}" r="${PORT_DRAG_HIT_RADIUS}" data-port-side="${side}"></circle>
            <line class="lead" x1="${x}" y1="${y}" x2="${inner.x}" y2="${inner.y}"></line>
            <circle class="port-pin lead-anchor" cx="${inner.x}" cy="${inner.y}" r="5" data-lead-anchor-side="${side}"></circle>
            <circle class="terminal ${isDummyPort ? "dummy-terminal" : ""} ${state.pendingTerminal === terminalKey(branch.id, side) ? "hot" : ""}${netHoverClass(netId)}" cx="${x}" cy="${y}" r="8" data-terminal="${terminalKey(branch.id, side)}" data-port-side="${side}"></circle>
            <rect class="net-badge-bg${netHoverClass(netId)}" data-net-id="${netId}" data-port-side="${side}" x="${x - 17}" y="${badgeY}" width="34" height="18" rx="5" fill="${color}"></rect>
            <text class="net-badge" data-net-id="${netId}" data-port-side="${side}" x="${x}" y="${badgeY + 9}">${escapeSvg(net)}</text>
            ${state.showLocalLabels ? `<text class="node-label" data-port-side="${side}" x="${x}" y="${labelY}">${escapeSvg(branch.nodes[side] || side)}</text>` : ""}
          `;
        }).join("")}
      `;

      bindBranchGroupInteractions(group, branch);
      branchLayer.appendChild(group);
    }

    function customLeadInnerPoint(branch, x, y, side, portId) {
      const saved = branch.leadAnchors?.[portId];
      if (saved && Number.isFinite(Number(saved.x)) && Number.isFinite(Number(saved.y))) {
        const savedPoint = { x: branch.x + Number(saved.x), y: branch.y + Number(saved.y) };
        return saved.side ? clampLeadAnchorToBoxEdge(branch, saved.side, savedPoint) : projectLeadAnchorToBoxEdge(branch, savedPoint);
      }
      return customDefaultLeadAnchor(branch, x, y, side);
    }

    function projectLeadAnchorToBoxEdge(branch, point) {
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      const clampX = Math.max(left, Math.min(right, point.x));
      const clampY = Math.max(top, Math.min(bottom, point.y));
      const candidates = [
        { side: "left", x: left, y: clampY },
        { side: "right", x: right, y: clampY },
        { side: "top", x: clampX, y: top },
        { side: "bottom", x: clampX, y: bottom }
      ].map(item => ({
        ...item,
        distance: (point.x - item.x) ** 2 + (point.y - item.y) ** 2
      })).sort((a, b) => a.distance - b.distance);
      const best = candidates[0];
      return { side: best.side, x: best.x, y: best.y };
    }

    function clampLeadAnchorToBoxEdge(branch, side, point) {
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      const x = Math.max(left, Math.min(right, point.x));
      const y = Math.max(top, Math.min(bottom, point.y));
      if (side === "right") return { x: right, y };
      if (side === "top") return { x, y: top };
      if (side === "bottom") return { x, y: bottom };
      return { x: left, y };
    }

    function customDefaultLeadAnchor(branch, x, y, side) {
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      if (side === "right") return { x: right, y: Math.max(top, Math.min(bottom, y)) };
      if (side === "top") return { x: Math.max(left, Math.min(right, x)), y: top };
      if (side === "bottom") return { x: Math.max(left, Math.min(right, x)), y: bottom };
      return { x: left, y: Math.max(top, Math.min(bottom, y)) };
    }

    function saveLeadAnchor(branch, side, point) {
      const projected = projectLeadAnchorToBoxEdge(branch, point);
      branch.leadAnchors = {
        ...(branch.leadAnchors || {}),
        [side]: {
          x: Math.round((projected.x - branch.x) * 10) / 10,
          y: Math.round((projected.y - branch.y) * 10) / 10,
          side: projected.side
        }
      };
    }

    function updateCustomPortDrag(point) {
      const drag = state.portDrag;
      if (!drag) return;
      const branch = findBranch(drag.branchId);
      if (!branch) return;
      if (drag.netTerminals?.length > 1) {
        const origin = drag.netOrigins?.[terminalKey(drag.branchId, drag.side)];
        if (!origin) return;
        const dx = point.x - origin.x;
        const dy = point.y - origin.y;
        drag.netTerminals.forEach(item => {
          const target = findBranch(item.branchId);
          const start = drag.netOrigins?.[terminalKey(item.branchId, item.side)];
          if (!target || !start) return;
          setTerminalWorldPosition(target, item.side, { x: start.x + dx, y: start.y + dy });
        });
        render();
        return;
      }
      const local = toBranchLocalPoint(branch, point);
      branch.terminalLayout = {
        ...(branch.terminalLayout || {}),
        [drag.side]: {
          x: Math.round(local.x * 10) / 10,
          y: Math.round(local.y * 10) / 10
        }
      };
      autoSnapTerminalToOwnBody(branch, drag.side);
      autoSnapCustomTerminalToLeadAnchor(branch, drag.side);
      autoSnapTerminalToConnectedWire(branch, drag.side);
      if (branch.kind !== "custom_n_port") {
        render();
        return;
      }
      const left = branch.x - branch.width / 2;
      const right = branch.x + branch.width / 2;
      const top = branch.y - branch.height / 2;
      const bottom = branch.y + branch.height / 2;
      const distances = [
        { side: "left", value: Math.abs(point.x - left) },
        { side: "right", value: Math.abs(point.x - right) },
        { side: "top", value: Math.abs(point.y - top) },
        { side: "bottom", value: Math.abs(point.y - bottom) }
      ].sort((a, b) => a.value - b.value);
      const edge = distances[0].side;
      const t = edge === "left" || edge === "right"
        ? Math.max(0.08, Math.min(0.92, (point.y - top) / branch.height))
        : Math.max(0.08, Math.min(0.92, (point.x - left) / branch.width));
      const layout = customPortLayout(branch).map(port => (
        port.id === drag.side ? { ...port, side: edge, t } : port
      ));
      ["left", "right", "top", "bottom"].forEach(side => {
        layout
          .filter(port => port.side === side)
          .sort((a, b) => (a.t ?? 0.5) - (b.t ?? 0.5))
          .forEach((port, index) => {
            port.order = index;
          });
      });
      branch.portLayout = layout;
      render();
    }

    function setTerminalWorldPosition(branch, side, point) {
      const local = toBranchLocalPoint(branch, point);
      branch.terminalLayout = {
        ...(branch.terminalLayout || {}),
        [side]: {
          x: Math.round(local.x * 10) / 10,
          y: Math.round(local.y * 10) / 10
        }
      };
      if (branch.kind !== "custom_n_port") return;
      const left = branch.x - branch.width / 2;
      const top = branch.y - branch.height / 2;
      const edge = inferPortSideFromPosition(branch, point);
      const t = edge === "left" || edge === "right"
        ? Math.max(0.08, Math.min(0.92, (point.y - top) / branch.height))
        : Math.max(0.08, Math.min(0.92, (point.x - left) / branch.width));
      branch.portLayout = customPortLayout(branch).map(port => (
        port.id === side ? { ...port, side: edge, t } : port
      ));
    }

    function updateLeadAnchorDrag(point) {
      const drag = state.leadAnchorDrag;
      if (!drag) return;
      const branch = findBranch(drag.branchId);
      if (!branch || branch.kind !== "custom_n_port") return;
      saveLeadAnchor(branch, drag.side, point);
      render();
    }

    function bindBranchGroupInteractions(group, branch) {
      group.querySelectorAll("[data-net-id]").forEach(item => {
        item.addEventListener("pointerdown", event => {
          if (event.button === 1 || (state.tool === "pan" && event.button === 0)) {
            event.preventDefault();
            event.stopPropagation();
            startPanDrag(event);
            return;
          }
          if (state.tool === "select" && item.dataset.portSide) {
            startCustomPortDrag(branch, item.dataset.portSide);
            event.stopPropagation();
            return;
          }
          event.stopPropagation();
        });
        item.addEventListener("click", event => {
          if (state.tool === "pan") {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          renameNode(item.dataset.netId);
          event.stopPropagation();
        });
        item.addEventListener("dblclick", event => {
          renameNode(item.dataset.netId);
          event.stopPropagation();
        });
      });

      group.addEventListener("pointerdown", event => {
        if (event.button === 1 || (state.tool === "pan" && event.button === 0)) {
          event.preventDefault();
          event.stopPropagation();
          startPanDrag(event);
          return;
        }
        const resizeHandle = event.target.dataset.resizeHandle;
        if (state.tool === "select" && resizeHandle) {
          startResizeDrag(branch, resizeHandle, event);
          return;
        }
        const leadAnchorSide = event.target.dataset.leadAnchorSide;
        if (state.tool === "select" && leadAnchorSide) {
          startLeadAnchorDrag(branch, leadAnchorSide);
          event.stopPropagation();
          return;
        }
        const terminal = event.target.dataset.terminal;
        const portSide = event.target.dataset.portSide;
        if (state.tool === "select" && portSide) {
          startCustomPortDrag(branch, portSide);
          event.stopPropagation();
          return;
        }
        if (terminal) {
          handleTerminalClick(terminal);
          event.stopPropagation();
          return;
        }
        if (state.tool === "select") {
          if (event.shiftKey) {
            toggleBranchSelection(branch.id);
            render();
            event.stopPropagation();
            return;
          }
          const ids = selectedBranchIdsForDrag(branch.id);
          state.selectedIds = ids;
          state.selectedId = ids[0];
          state.selectedNetIds = [];
          state.selectedWireId = null;
          state.drag = {
            id: branch.id,
            start: toSvgPoint(event),
            origins: Object.fromEntries(ids.map(id => {
              const item = findBranch(id);
              return [id, { x: item.x, y: item.y }];
            })),
            before: snapshot()
          };
        } else {
          selectBranch(branch.id);
        }
        render();
        event.stopPropagation();
      });

    }

    function startCustomPortDrag(branch, side) {
      const netId = netLookup().get(terminalKey(branch.id, side));
      const selectedNets = new Set(state.selectedNetIds || []);
      const linkedTerminals = selectedNets.has(netId)
        ? terminalsForSelectedNets(selectedNets)
        : [];
      if (!linkedTerminals.length) selectBranch(branch.id);
      if (branch.kind === "custom_n_port" && !branch.leadAnchors?.[side]) {
        const terminal = terminalDrawPosition(branch, side);
        const layout = customPortLayout(branch).find(port => port.id === side);
        const anchor = customDefaultLeadAnchor(branch, terminal.x, terminal.y, layout?.side || "left");
        saveLeadAnchor(branch, side, anchor);
      }
      state.portDrag = {
        branchId: branch.id,
        side,
        netTerminals: linkedTerminals,
        netOrigins: Object.fromEntries(linkedTerminals.map(item => [`${item.branchId}.${item.side}`, terminalDrawPosition(findBranch(item.branchId), item.side)])),
        before: snapshot()
      };
    }

    function terminalsForSelectedNets(selectedNets) {
      const nets = netLookup();
      const terminals = [];
      state.branches.forEach(branch => {
        terminalSides(branch).forEach(side => {
          const key = terminalKey(branch.id, side);
          if (selectedNets.has(nets.get(key))) terminals.push({ branchId: branch.id, side });
        });
      });
      return terminals;
    }

    function startLeadAnchorDrag(branch, side) {
      selectBranch(branch.id);
      state.leadAnchorDrag = {
        branchId: branch.id,
        side,
        before: snapshot()
      };
    }

    function branchResizeLocalFromPoint(origin, point) {
      const radians = -(origin.rotation || 0) * Math.PI / 180;
      return rotateLocal(0, 0, point.x - origin.x, point.y - origin.y, radians);
    }

function startResizeDrag(branch, handle, event) {
      selectBranch(branch.id);
      const resizeBox = componentResizeBox(branch);
      state.resizeDrag = {
        branchId: branch.id,
        handle,
        origin: {
          x: branch.x,
          y: branch.y,
          width: resizeBox.width,
          height: resizeBox.height,
          branchWidth: branch.width || 150,
          branchHeight: branch.height || 48,
          rotation: branch.rotation || 0
        },
        before: snapshot()
      };
      event.preventDefault();
      event.stopPropagation();
    }

    function updateResizeDrag(point) {
      const drag = state.resizeDrag;
      if (!drag) return;
      const branch = findBranch(drag.branchId);
      if (!branch) return;
      const local = branchResizeLocalFromPoint(drag.origin, point);
      const halfW = drag.origin.width / 2;
      const halfH = drag.origin.height / 2;
      let left = -halfW;
      let right = halfW;
      let top = -halfH;
      let bottom = halfH;
      const minW = resizeMinSize(branch, "width");
      const minH = resizeMinSize(branch, "height");
      const maxW = 420;
      const maxH = 360;

      if (drag.handle.includes("w")) left = Math.max(right - maxW, Math.min(right - minW, local.x));
      if (drag.handle.includes("e")) right = Math.max(left + minW, Math.min(left + maxW, local.x));
      if (drag.handle.includes("n")) top = Math.max(bottom - maxH, Math.min(bottom - minH, local.y));
      if (drag.handle.includes("s")) bottom = Math.max(top + minH, Math.min(top + maxH, local.y));

      const width = right - left;
      const height = bottom - top;
      const centerLocal = { x: (left + right) / 2, y: (top + bottom) / 2 };
      const centerWorld = rotateLocal(drag.origin.x, drag.origin.y, centerLocal.x, centerLocal.y, (drag.origin.rotation || 0) * Math.PI / 180);
      branch.x = centerWorld.x;
      branch.y = centerWorld.y;
      applyResizeBoxSize(branch, width, height);
      clampComponent(branch);
      render();
    }

    function renderAutoGlueFeedbackLines() {
      autoGlueFeedbackPairs().forEach(pair => {
        const p1 = wireEndpointPosition(pair.from);
        const p2 = wireEndpointPosition(pair.to);
        if (!p1 || !p2) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `auto-glue-feedback-line ${pair.kind === "preview" ? "preview" : "flash"}`);
        path.setAttribute("d", `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`);
        wireLayer.appendChild(path);
      });
    }

    function renderWires() {
      wireLayer.innerHTML = "";
      state.wires.forEach(wire => {
        const a = parseTerminal(wire.from);
        const b = parseTerminal(wire.to);
        const branchA = findBranch(a.branchId);
        const branchB = findBranch(b.branchId);
        if (!branchA || !branchB) return;
        const p1 = terminalPosition(branchA, a.side);
        const p2 = terminalPosition(branchB, b.side);
        const mid = snappedWireMid(wire, wire.mid || { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `wire${state.selectedWireId === wire.id ? " selected" : ""}`);
        path.setAttribute("d", `M ${p1.x} ${p1.y} L ${mid.x} ${mid.y} L ${p2.x} ${p2.y}`);
        path.dataset.wireId = wire.id;
        path.addEventListener("pointerdown", event => {
          if (event.button === 1 || (state.tool === "pan" && event.button === 0)) {
            event.preventDefault();
            event.stopPropagation();
            startPanDrag(event);
            return;
          }
          selectWire(wire.id);
          render();
          event.stopPropagation();
        });
        wireLayer.appendChild(path);

        if (state.selectedWireId === wire.id) {
          const handle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          handle.setAttribute("class", "wire-handle");
          handle.setAttribute("cx", mid.x);
          handle.setAttribute("cy", mid.y);
          handle.setAttribute("r", 7);
          handle.addEventListener("pointerdown", event => {
            state.wireDrag = {
              id: wire.id,
              start: toSvgPoint(event),
              origin: { x: mid.x, y: mid.y },
              before: snapshot()
            };
            event.stopPropagation();
          });
          wireLayer.appendChild(handle);
        }
      });
      renderAutoGlueFeedbackLines();
    }

    function applyAutoGlueTerminalFeedback() {
      branchLayer.querySelectorAll(".terminal.auto-glue-preview, .terminal.auto-glue-flash").forEach(item => {
        item.classList.remove("auto-glue-preview", "auto-glue-flash");
      });
      autoGlueFeedbackPairs().forEach(pair => {
        [pair.from, pair.to].forEach(terminal => {
          const node = branchLayer.querySelector(`[data-terminal="${terminal}"]`);
          if (node) node.classList.add(pair.kind === "preview" ? "auto-glue-preview" : "auto-glue-flash");
        });
      });
    }

    function render() {
      applyPanelWidth();
      renderCanvasTabs();
      applyCanvasView();
      renderWires();
      renderBranches();
      applyAutoGlueTerminalFeedback();
      renderPackageCaseEditOverlay();
      renderEditor();
      renderNetList();
      renderOutput();
      document.getElementById("flipTool").disabled = !state.selectedId || !["two_node_branch", "current_source"].includes(findBranch(state.selectedId)?.kind);
      document.getElementById("rotateTool").disabled = !state.selectedId;
      document.getElementById("deleteTool").disabled = state.selectedIds.length === 0 && !state.selectedWireId;
      document.getElementById("copyTool").disabled = selectedBranchSet().size === 0;
      document.getElementById("pasteTool").disabled = !state.clipboard?.branches?.length;
      document.getElementById("groupTool").disabled = state.selectedIds.length < 2;
      document.getElementById("ungroupTool").disabled = !currentSelectedGroup();
      document.getElementById("packYTool").disabled = state.packageCaseEdit ? state.branches.length === 0 : selectedBranchSet().size === 0;
      document.getElementById("unpackYTool").disabled = Boolean(state.packageCaseEdit) || !findBranch(state.selectedId)?.packageOriginal;
      document.getElementById("localLabelTool").classList.toggle("active", state.showLocalLabels);
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.output === state.activeOutput));
      document.getElementById("undoTool").disabled = state.history.length === 0;
      document.getElementById("redoTool").disabled = state.future.length === 0;
      applyLanguage();
    }

    function renderCanvasTabs() {
      const drag = state.canvasTabDrag;
      canvasTabs.innerHTML = `
        ${state.canvases.map((item, index) => {
          const isDragged = drag?.id === item.id && drag.dragging;
          const dropClass = drag?.dropIndex === index ? " drop-before" : "";
          const classes = [
            "canvas-tab",
            item.id === state.activeCanvasId ? "active" : "",
            isDragged ? "dragging" : "",
            dropClass
          ].filter(Boolean).join(" ");
          return `
          <button class="${classes}" type="button" data-canvas-id="${item.id}" title="${escapeHtml(canvasDisplayName(item))}" aria-label="${escapeHtml(canvasDisplayName(item))}">
            <span>${escapeHtml(canvasDisplayName(item))}</span>
            ${state.canvases.length > 1 ? `
              <span class="canvas-tab-delete" data-canvas-action="delete" data-canvas-id="${item.id}" title="${escapeHtml(tr("删除画布"))}" aria-label="${escapeHtml(tr("删除画布"))}">×</span>
            ` : ""}
          </button>
        `}).join("")}
        <button class="canvas-tab add" id="addCanvasTab" type="button" data-canvas-action="add">${escapeHtml(tr("+ 新建画布"))}</button>
      `;
    }

    function handleCanvasTabPointerDown(event) {
      const button = event.target.closest(".canvas-tab");
      if (!button || !canvasTabs.contains(button)) return;
      if (event.button === 2) return;
      event.preventDefault();
      event.stopPropagation();
      if (button.dataset.canvasAction === "add") {
        createNewCanvas();
        return;
      }
      if (event.target.closest("[data-canvas-action='delete']")) {
        deleteCanvas(event.target.closest("[data-canvas-action='delete']").dataset.canvasId);
        return;
      }
      if (!button.dataset.canvasId) return;
      const drag = {
        id: button.dataset.canvasId,
        startX: event.clientX,
        startY: event.clientY,
        dragging: false,
        saved: false,
        dropIndex: null
      };
      state.canvasTabDrag = drag;
      const move = moveEvent => {
        const dx = moveEvent.clientX - drag.startX;
        const dy = moveEvent.clientY - drag.startY;
        const horizontalIntent = Math.abs(dx) >= 14 && Math.abs(dx) > Math.abs(dy) * 1.2;
        if (!drag.dragging && !horizontalIntent) return;
        if (!drag.dragging) {
          drag.dragging = true;
          drag.saved = true;
          saveActiveCanvas();
        }
        moveEvent.preventDefault();
        const dropIndex = canvasTabDropIndex(moveEvent.clientX);
        if (dropIndex === drag.dropIndex) return;
        drag.dropIndex = dropIndex;
        reorderCanvas(drag.id, dropIndex);
        renderCanvasTabs();
      };
      const up = upEvent => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up, true);
        if (state.canvasTabDrag !== drag) return;
        const wasDragging = drag.dragging;
        state.canvasTabDrag = null;
        if (wasDragging) {
          statusEl.textContent = optText("已调整画布顺序", "Canvas order updated");
          renderCanvasTabs();
        } else {
          switchCanvas(drag.id);
        }
        upEvent.preventDefault();
        upEvent.stopPropagation();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up, true);
    }

    function canvasTabDropIndex(x) {
      const tabs = Array.from(canvasTabs.querySelectorAll(".canvas-tab[data-canvas-id]"));
      const draggedId = state.canvasTabDrag?.id;
      const visible = tabs.filter(tab => tab.dataset.canvasId !== draggedId);
      const before = visible.find(tab => {
        const box = tab.getBoundingClientRect();
        return x < box.left + box.width / 2;
      });
      if (!before) return state.canvases.length;
      const beforeId = before.dataset.canvasId;
      const index = state.canvases.findIndex(item => item.id === beforeId);
      return index < 0 ? state.canvases.length : index;
    }

    function reorderCanvas(id, dropIndex) {
      const from = state.canvases.findIndex(item => item.id === id);
      if (from < 0) return;
      const [item] = state.canvases.splice(from, 1);
      const adjusted = from < dropIndex ? dropIndex - 1 : dropIndex;
      const target = Math.max(0, Math.min(adjusted, state.canvases.length));
      state.canvases.splice(target, 0, item);
      if (state.canvasTabDrag) state.canvasTabDrag.dropIndex = target;
    }

    function handleCanvasTabContextMenu(event) {
      const button = event.target.closest(".canvas-tab[data-canvas-id]");
      if (!button || !canvasTabs.contains(button)) return;
      if (event.target.closest("[data-canvas-action='delete']")) return;
      event.preventDefault();
      event.stopPropagation();
      renameCanvas(button.dataset.canvasId);
    }

    function applyCanvasView() {
      const width = Math.min(WORLD.width, BASE_VIEW.width / state.zoom);
      const height = Math.min(WORLD.height, BASE_VIEW.height / state.zoom);
      const x = Math.max(0, Math.min(WORLD.width - width, state.viewCenter.x - width / 2));
      const y = Math.max(0, Math.min(WORLD.height - height, state.viewCenter.y - height / 2));
      state.viewCenter = { x: x + width / 2, y: y + height / 2 };
      canvas.setAttribute("viewBox", `${x} ${y} ${width} ${height}`);
      statusEl.textContent = `${tr("缩放")} ${Math.round(state.zoom * 100)}%`;
      canvas.style.cursor = state.panDrag ? "grabbing" : (state.tool === "pan" ? "grab" : "");
    }

    function clampViewCenter(center) {
      const width = Math.min(WORLD.width, BASE_VIEW.width / state.zoom);
      const height = Math.min(WORLD.height, BASE_VIEW.height / state.zoom);
      const halfWidth = width / 2;
      const halfHeight = height / 2;
      return {
        x: Math.max(halfWidth, Math.min(WORLD.width - halfWidth, center.x)),
        y: Math.max(halfHeight, Math.min(WORLD.height - halfHeight, center.y))
      };
    }

    function startPanDrag(event) {
      const inverse = canvas.getScreenCTM().inverse();
      const start = canvas.createSVGPoint();
      start.x = event.clientX;
      start.y = event.clientY;
      const startSvg = start.matrixTransform(inverse);
      state.panDrag = {
        pointerId: event.pointerId,
        start: startSvg,
        inverse,
        originCenter: { ...state.viewCenter }
      };
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor = "grabbing";
    }

    function updatePanDrag(event) {
      const point = canvas.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const current = point.matrixTransform(state.panDrag.inverse);
      state.viewCenter = clampViewCenter({
        x: state.panDrag.originCenter.x - (current.x - state.panDrag.start.x),
        y: state.panDrag.originCenter.y - (current.y - state.panDrag.start.y)
      });
      applyCanvasView();
    }

    function setZoom(nextZoom, anchorPoint = null) {
      const oldZoom = state.zoom;
      const clamped = Math.max(0.35, Math.min(3, nextZoom));
      if (Math.abs(clamped - oldZoom) < 0.001) return;
      if (anchorPoint) {
        const oldCenter = state.viewCenter;
        state.viewCenter = {
          x: anchorPoint.x - (anchorPoint.x - oldCenter.x) * oldZoom / clamped,
          y: anchorPoint.y - (anchorPoint.y - oldCenter.y) * oldZoom / clamped
        };
      }
      state.zoom = clamped;
      render();
    }

    function resetZoom() {
      state.zoom = 1;
      state.viewCenter = clampViewCenter({ x: BASE_VIEW.width / 2, y: BASE_VIEW.height / 2 });
      render();
    }

    function handleTerminalClick(terminal) {
      if (state.tool !== "wire") {
        const parsed = parseTerminal(terminal);
        selectBranch(parsed.branchId);
        return;
      }
      if (!state.pendingTerminal) {
        state.pendingTerminal = terminal;
      } else {
        connectTerminals(state.pendingTerminal, terminal);
      }
      render();
    }

    function toSvgPoint(event) {
      const point = canvas.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(canvas.getScreenCTM().inverse());
    }

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      const point = toSvgPoint(event);
      const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
      setZoom(state.zoom * factor, point);
    }, { passive: false });

    document.addEventListener("keydown", event => {
      if (isTextEditingTarget(event.target)) return;

      }
      if (event.key === "Delete" || event.key === "Backspace") {

      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();

        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "y") {
        event.preventDefault();

        return;
      }
      if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === "r") {
        event.preventDefault();

        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a") {
        event.preventDefault();

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "c") {

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "v") {

      }
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeSvg(value) {

    canvas.addEventListener("pointerdown", event => {
      if (event.button === 1 || (state.tool === "pan" && event.button === 0)) {
        event.preventDefault();
        event.stopPropagation();
        startPanDrag(event);
        return;
      }
      if (event.target !== canvas) return;
      const point = toSvgPoint(event);
      if (state.tool === "branch") {
        createBranch(point.x, point.y);
        setTool("select");
        return;
      }
      if (state.tool === "currentSource") {
        createCurrentSource(point.x, point.y);
        setTool("select");
        return;
      }
      if (state.tool === "voltageSource") {
        createVoltageSourceSeriesR(point.x, point.y);
        setTool("select");
        return;
      }
      if (state.tool === "ground") {
        createGround(point.x, point.y);
        setTool("select");
        return;
      }
      if (state.tool === "transformer") {
        createTransformer(point.x, point.y);
        setTool("select");
        return;
      }
      if (state.tool === "custom") {
        openCustomNPortDialog(point.x, point.y);
        return;
      }
      if (state.tool === "select") {
        state.marquee = { start: point, current: point };
        updateSelectionBox();
        return;
      }
      state.selectedId = null;
      state.selectedIds = [];
      state.selectedNetIds = [];
      state.selectedWireId = null;
      state.pendingTerminal = null;
      render();
    });

    canvas.addEventListener("pointermove", event => {
      if (state.panDrag) {
        updatePanDrag(event);
        return;
      }
      const point = toSvgPoint(event);
      if (state.marquee) {
        state.marquee.current = point;
        updateSelectionBox();
        return;
      }
      if (state.wireDrag) {
        const wire = state.wires.find(item => item.id === state.wireDrag.id);
        if (!wire) return;
        const rawMid = {
          x: Math.max(28, Math.min(WORLD.width - 28, state.wireDrag.origin.x + point.x - state.wireDrag.start.x)),
          y: Math.max(28, Math.min(WORLD.height - 28, state.wireDrag.origin.y + point.y - state.wireDrag.start.y))
        };
        wire.mid = snappedWireMid(wire, rawMid);
        render();
        return;
      }
      if (state.portDrag) {
        updateCustomPortDrag(point);
        return;
      }
      if (state.leadAnchorDrag) {
        updateLeadAnchorDrag(point);
        return;
      }
      if (state.resizeDrag) {
        updateResizeDrag(point);
        return;
      }
      if (!state.drag) return;
      const dx = point.x - state.drag.start.x;
      const dy = point.y - state.drag.start.y;
      Object.entries(state.drag.origins).forEach(([id, origin]) => {
        const branch = findBranch(id);
        if (!branch) return;
        branch.x = origin.x + dx;
        branch.y = origin.y + dy;
        clampComponent(branch);
      });
      autoSnapDraggedBranches(Object.keys(state.drag.origins));
      updateAutoGluePreview(Object.keys(state.drag.origins));
      render();
    });

    outputResizeBar.addEventListener("pointerdown", event => {
      const startY = event.clientY;
      const startHeight = document.querySelector(".output").getBoundingClientRect().height;
      const workspaceHeight = workspace.getBoundingClientRect().height;
      outputResizeBar.setPointerCapture(event.pointerId);

      function move(moveEvent) {
        const nextHeight = Math.max(120, Math.min(workspaceHeight - 280, startHeight - (moveEvent.clientY - startY)));
        workspace.style.gridTemplateRows = `auto minmax(260px, 1fr) 8px ${nextHeight}px`;
      }

      function up(upEvent) {
        outputResizeBar.releasePointerCapture(upEvent.pointerId);
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });

    window.addEventListener("pointerup", () => {
      const hadInteraction = Boolean(state.marquee || state.drag || state.wireDrag || state.portDrag || state.leadAnchorDrag || state.resizeDrag || state.panDrag);
      if (!hadInteraction) return;
      if (state.marquee) {
        finishMarqueeSelection();
        render();
        return;
      }
      if (state.drag) {
        const moved = Object.entries(state.drag.origins).some(([id, origin]) => {
          const branch = findBranch(id);
          return branch && (branch.x !== origin.x || branch.y !== origin.y);
        });
        if (moved) {
          state.history.push(state.drag.before);
          state.future = [];
          autoGlueDraggedFloatingTerminals(Object.keys(state.drag.origins));
        } else {
          clearAutoGluePreview();
        }
      }
      if (state.wireDrag) {
        const wire = state.wires.find(item => item.id === state.wireDrag.id);
        if (wire && wire.mid && (wire.mid.x !== state.wireDrag.origin.x || wire.mid.y !== state.wireDrag.origin.y)) {
          state.history.push(state.wireDrag.before);
          state.future = [];
        }
      }
      if (state.portDrag) {
        state.history.push(state.portDrag.before);
        state.future = [];
      }
      if (state.leadAnchorDrag) {
        state.history.push(state.leadAnchorDrag.before);
        state.future = [];
      }
      if (state.resizeDrag) {
        const branch = findBranch(state.resizeDrag.branchId);
        const origin = state.resizeDrag.origin;
        const resized = branch && (
          branch.x !== origin.x ||
          branch.y !== origin.y ||
          branch.width !== origin.branchWidth ||
          branch.height !== origin.branchHeight
        );
        if (resized) {
          state.history.push(state.resizeDrag.before);
          state.future = [];
        }
      }
      if (state.panDrag && canvas.hasPointerCapture?.(state.panDrag.pointerId)) {
        canvas.releasePointerCapture(state.panDrag.pointerId);
      }
      state.drag = null;
      state.wireDrag = null;
      state.portDrag = null;
      state.leadAnchorDrag = null;
      state.resizeDrag = null;
      state.panDrag = null;
      render();
    });

    function handleCodeDraftKeydown(event) {
      const code = event.target.closest?.("[data-c-draft-code]");
      if (!code) return;
      const isCopy = (event.ctrlKey || event.metaKey) && event.key?.toLowerCase() === "c";
      if (!isCopy) return;
      const selection = window.getSelection?.();
      const hasCodeSelection = selection && !selection.isCollapsed && code.contains(selection.anchorNode) && code.contains(selection.focusNode);
      if (hasCodeSelection) return;
      event.preventDefault();
      copyTextToClipboard(code.textContent || "", code).then(ok => {
        statusEl.textContent = ok ? optText("已复制 C 草稿", "C draft copied") : optText("复制 C 草稿失败", "Failed to copy C draft");
      });
    }

    function elementFromSelectionNode(node) {
      if (!node) return null;
      return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    }

    function codeDraftFromSelection(selection) {
      if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
      const anchorCode = elementFromSelectionNode(selection.anchorNode)?.closest?.("[data-c-draft-code]");
      const focusCode = elementFromSelectionNode(selection.focusNode)?.closest?.("[data-c-draft-code]");
      if (anchorCode && anchorCode === focusCode) return anchorCode;
      const rangeCode = elementFromSelectionNode(selection.getRangeAt(0).commonAncestorContainer)?.closest?.("[data-c-draft-code]");
      return rangeCode || null;
    }

    function handleCodeDraftCopy(event) {
      const selection = window.getSelection?.();
      const code = codeDraftFromSelection(selection);
      if (!code) return;
      const text = selection.toString();
      if (!text) return;
      event.preventDefault();
      event.clipboardData?.setData("text/plain", text);
      statusEl.textContent = optText("已复制选中的 C 草稿", "Selected C draft copied");

    document.getElementById("createCustomPort").addEventListener("click", confirmCustomNPortDialog);
    document.addEventListener("pointerdown", event => {
      const button = event.target.closest && event.target.closest(".node-edit-button");
      if (!button) return;
      if (button.dataset.editField) return;
      event.preventDefault();
      event.stopPropagation();
      renameNode(button.dataset.renameNode);
    }, true);
    renameNodeInput.addEventListener("keydown", event => {
      if (event.key === "Enter") saveRenameNode();
      if (event.key === "Escape") closeRenameDialog();
    });
    renameDialog.addEventListener("pointerdown", event => {
      if (event.target === renameDialog) closeRenameDialog();
    });
    fieldInput.addEventListener("keydown", event => {
      if (event.key === "Enter") saveFieldEditor();
      if (event.key === "Escape") closeFieldEditor();
    });
    fieldTextarea.addEventListener("keydown", event => {
      if (event.key === "Escape") closeFieldEditor();
    });
    fieldDialog.addEventListener("pointerdown", event => {
      if (event.target === fieldDialog) closeFieldEditor();
    });
    customPortDialog.addEventListener("pointerdown", event => {
      if (event.target === customPortDialog) closeCustomNPortDialog();
    });
    customPortCount.addEventListener("keydown", event => {
      if (event.key === "Enter") confirmCustomNPortDialog();
      if (event.key === "Escape") closeCustomNPortDialog();
    });
    customCurrentCount.addEventListener("keydown", event => {
      if (event.key === "Enter") confirmCustomNPortDialog();
      if (event.key === "Escape") closeCustomNPortDialog();
    });
    exportDialog.addEventListener("pointerdown", event => {
      if (event.target === exportDialog) closeExportDialog();
    });
    document.getElementById("importTool").addEventListener("click", () => importFile.click());
    document.getElementById("zoomOutTool").addEventListener("click", () => setZoom(state.zoom / 1.18));
    document.getElementById("zoomInTool").addEventListener("click", () => setZoom(state.zoom * 1.18));
    document.getElementById("zoomResetTool").addEventListener("click", resetZoom);
    document.getElementById("panTool").addEventListener("click", () => setTool("pan"));
    document.getElementById("localLabelTool").addEventListener("click", () => {
      state.showLocalLabels = !state.showLocalLabels;
      render();
    });
    importFile.addEventListener("change", () => {
      const file = importFile.files && importFile.files[0];
      if (file) importCircuitFile(file);
    });
    document.getElementById("addBranchTool").addEventListener("click", () => setTool("branch"));
    document.getElementById("addCurrentSourceTool").addEventListener("click", () => setTool("currentSource"));
    document.getElementById("addVoltageSourceTool").addEventListener("click", () => setTool("voltageSource"));
    document.getElementById("addGroundTool").addEventListener("click", () => setTool("ground"));
    document.getElementById("addTransformerTool").addEventListener("click", () => setTool("transformer"));
    document.getElementById("addCustomTool").addEventListener("click", () => {
      setTool("select");
      openCustomNPortDialog(state.viewCenter.x, state.viewCenter.y);
    });
    document.getElementById("wireTool").addEventListener("click", () => setTool("wire"));
    document.getElementById("flipTool").addEventListener("click", () => {
      const branch = findBranch(state.selectedId);
      if (!branch) return;
      commitHistory();
      branch.direction = branch.direction === "AtoB" ? "BtoA" : "AtoB";
      render();
    });
    document.getElementById("rotateTool").addEventListener("click", () => {
      rotateSelectedBranches();
    });
    document.getElementById("deleteTool").addEventListener("click", deleteSelection);
    document.getElementById("undoTool").addEventListener("click", undo);
    document.getElementById("redoTool").addEventListener("click", redo);

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        state.activeOutput = button.dataset.output;
        document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab === button));
        renderOutput();
      });
    });

    function snapshot() {
      return JSON.stringify({
          branches: state.branches,
          wires: state.wires,
          selectedId: state.selectedId,
          selectedIds: state.selectedIds,
          selectedNetIds: state.selectedNetIds,
        selectedWireId: state.selectedWireId,
        groups: state.groups,
        portDrag: state.portDrag,
        nextGroup: state.nextGroup,
        nodeOrder: state.nodeOrder,
        nodeLabels: state.nodeLabels,
        nodeColors: state.nodeColors,
        internalNodes: state.internalNodes,
        nextBranch: state.nextBranch,
        nextTransformer: state.nextTransformer,
        nextCustom: state.nextCustom,
        nextWire: state.nextWire
      });
    }

    function restore(serialized) {
      const data = JSON.parse(serialized);
      state.branches = data.branches;
      state.wires = data.wires;
      state.selectedId = data.selectedId;
      state.selectedIds = data.selectedIds || (data.selectedId ? [data.selectedId] : []);
      state.selectedNetIds = data.selectedNetIds || [];
      state.selectedWireId = data.selectedWireId;
      state.groups = data.groups || [];
      state.nextGroup = data.nextGroup || 1;
      state.nodeOrder = data.nodeOrder || [];
      state.nodeLabels = data.nodeLabels || {};
      state.nodeColors = data.nodeColors || {};
      cleanupAutoYBoxNodeLabels();
      state.internalNodes = data.internalNodes || [];
      state.pendingTerminal = null;
      state.drag = null;
      state.wireDrag = null;
      state.portDrag = null;
      state.leadAnchorDrag = null;
      state.resizeDrag = null;
      state.autoGluePreview = null;
      state.autoGlueFlash = null;
      state.nextBranch = data.nextBranch;
      state.nextTransformer = data.nextTransformer;
      state.nextCustom = data.nextCustom || inferNextNumber(state.branches, "C");
      state.nextWire = data.nextWire;
      syncNextCounters();
      render();
    }

    function commitHistory() {
      if (state.restoring) return;
      const current = snapshot();
      if (state.history[state.history.length - 1] !== current) {
        state.history.push(current);
        if (state.history.length > 100) state.history.shift();
      }
      state.future = [];
    }

    function undo() {
      if (!state.history.length) return;
      state.future.push(snapshot());
      const previous = state.history.pop();
      state.restoring = true;
      restore(previous);
      state.restoring = false;
    }

    function redo() {
      if (!state.future.length) return;
      state.history.push(snapshot());
      const next = state.future.pop();
      state.restoring = true;
      restore(next);
      state.restoring = false;
    }

    globalThis.branchBuilderApi = {
      circuitStateJson,
      loadCircuitState,
      appendCircuitState,
      modelJson,
      state
    };

    function initializeDefaultDemo() {
      createBranch(300, 210);
      createBranch(570, 330);
      connectTerminals("B1.B", "B2.A");
      state.history = [];
      state.future = [];
      selectBranch("B1");
      state.canvases = [{ id: "canvas1", name: "画布 1", data: currentCanvasData() }];
      state.activeCanvasId = "canvas1";
      state.nextCanvas = 2;
      render();
    }

    async function initializeStartupCircuit() {
      try {
        const response = await fetch("/exports/multi_branch_test.json", { cache: "no-store" });
        if (!response.ok) throw new Error("multi_branch_test.json not found");
        const data = await response.json();
        loadCircuitState(data);
        state.history = [];
        state.future = [];
        saveActiveCanvas();
      } catch (error) {
        initializeDefaultDemo();
      }
    }

    initializeStartupCircuit();
  </script>
</body>
</html>
