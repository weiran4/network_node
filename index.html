<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-Port Branch Builder</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #15202b;
      --muted: #637083;
      --line: #d8dee7;
      --line-strong: #c4ccd8;
      --grid: #d7e9dd;
      --blue: #2563eb;
      --green: #15803d;
      --red: #b42318;
      --gold: #a16207;
      --output-bg: #0d1720;
      --output-panel: #13212c;
      --output-line: #2d4050;
      --output-muted: #a9bac8;
      --shadow: 0 12px 30px rgba(17, 24, 39, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: 0;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 52px;
      padding: 8px 14px 9px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset, 0 8px 22px rgba(15, 23, 42, 0.05);
      position: relative;
      z-index: 2;
    }

    .brand {
      font-weight: 850;
      margin-right: 4px;
      padding-top: 9px;
      padding-right: 14px;
      border-right: 1px solid var(--line);
      white-space: nowrap;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      min-width: 0;
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .toolbar-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      padding: 0 4px;
      white-space: nowrap;
    }

    .tool {
      width: 36px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #d4dbe5;
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease, background 0.14s ease;
    }

    .tool:hover:not(:disabled) {
      border-color: #9fb0c3;
      background: #f8fafc;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .tool.text-tool {
      width: auto;
      min-width: 42px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .tool.active {
      border-color: var(--blue);
      color: var(--blue);
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }

    .tool:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .main {
      display: grid;
      --panel-width: 380px;
      grid-template-columns: minmax(420px, 1fr) 8px minmax(280px, var(--panel-width));
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(260px, 1fr) 8px 230px;
      min-width: 0;
      min-height: 0;
    }

    .canvas-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      overflow-x: auto;
    }

    .canvas-tab {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-tab.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.16);
    }

    .canvas-tab:hover:not(.active) {
      border-color: #aeb9c8;
      background: #f8fafc;
    }

    .canvas-tab.dragging {
      opacity: 0.62;
      cursor: grabbing;
    }

    .canvas-tab.drop-before {
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .canvas-tab.drop-after {
      box-shadow: inset -3px 0 0 var(--blue);
    }

    .canvas-tab.add {
      color: var(--muted);
    }

    .canvas-tab-delete {
      width: 16px;
      height: 16px;
      border: 0;
      border-radius: 4px;
      display: grid;
      place-items: center;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      opacity: 0.78;
    }

    .canvas-tab-delete:hover {
      background: rgba(255, 255, 255, 0.22);
      opacity: 1;
    }

    .resize-bar {
      background: #cfd8e3;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      cursor: row-resize;
    }

    .resize-bar:hover {
      background: #aebdcb;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #eef8f1;
    }

    .package-case-overlay {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 7;
      width: min(420px, calc(100% - 28px));
      display: none;
      gap: 10px;
      padding: 12px;
      border: 1px solid #9bb7d6;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
    }

    .package-case-overlay.open {
      display: grid;
    }

    .package-case-overlay-title {
      font-size: 13px;
      font-weight: 850;
      color: #102033;
    }

    .package-case-overlay-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .package-case-overlay-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
    }

    .wire {
      stroke: #53616b;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire.pending {
      stroke: var(--gold);
      stroke-dasharray: 6 6;
    }

    .wire.selected {
      stroke: var(--blue);
      stroke-width: 4;
    }

    .wire-handle {
      fill: #fff;
      stroke: var(--blue);
      stroke-width: 2;
      cursor: move;
    }

    .selection-box {
      fill: rgba(37, 99, 235, 0.08);
      stroke: var(--blue);
      stroke-width: 2;
      stroke-dasharray: 8 6;
      pointer-events: none;
    }

    .branch-body {
      fill: #fff;
      stroke: #485761;
      stroke-width: 2;
    }

    .hitbox {
      fill: transparent;
      stroke: none;
      cursor: move;
      pointer-events: all;
    }

    .transformer-coil {
      fill: none;
      stroke: #485761;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .transformer-core {
      stroke: #7a8a94;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .port-pin {
      fill: #fffefa;
      stroke: #485761;
      stroke-width: 2;
    }

    .dot {
      fill: #172026;
      stroke: none;
    }

    .component-subtext {
      font-size: 11px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .branch.selected .branch-body {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .branch.selected .transformer-coil {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .branch.selected .transformer-core,
    .branch.selected .port-pin {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .branch.selected .dot {
      stroke: var(--blue);
      stroke-width: 2;
    }

    .ground-symbol {
      fill: none;
      stroke: #485761;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .voltage-source-symbol,
    .source-plus,
    .resistor-symbol {
      fill: none;
      stroke: #485761;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-label {
      font-size: 11px;
      font-weight: 700;
      fill: #485761;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .branch.selected .ground-symbol {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .branch.selected .voltage-source-symbol,
    .branch.selected .source-plus,
    .branch.selected .resistor-symbol {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .branch.selected .source-label {
      fill: var(--blue);
    }

    .branch.current-hover .branch-body {
      stroke: #f59e0b;
      stroke-width: 4;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.45));
    }

    .branch.current-hover .lead,
    .branch.current-hover .terminal,
    .branch.current-hover .transformer-coil,
    .branch.current-hover .transformer-core,
    .branch.current-hover .port-pin,
    .branch.current-hover .voltage-source-symbol,
    .branch.current-hover .source-plus,
    .branch.current-hover .resistor-symbol {
      stroke: #f59e0b;
      stroke-width: 4;
    }

    .branch.current-hover .dot {
      fill: #f59e0b;
    }

    .branch.formula-highlight .branch-body {
      stroke: var(--branch-highlight-color, #ef4444);
      stroke-width: 4;
      filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.45));
    }

    .branch.formula-highlight .lead,
    .branch.formula-highlight .terminal,
    .branch.formula-highlight .transformer-coil,
    .branch.formula-highlight .transformer-core,
    .branch.formula-highlight .port-pin,
    .branch.formula-highlight .ground-symbol,
    .branch.formula-highlight .voltage-source-symbol,
    .branch.formula-highlight .source-plus,
    .branch.formula-highlight .resistor-symbol {
      stroke: var(--branch-highlight-color, #ef4444);
      stroke-width: 4;
    }

    .branch.formula-highlight .dot {
      fill: var(--branch-highlight-color, #ef4444);
    }

    .branch.formula-highlight .source-label {
      fill: var(--branch-highlight-color, #ef4444);
    }

    .current-hover-area {
      fill: rgba(245, 158, 11, 0.16);
      stroke: #f59e0b;
      stroke-width: 3;
      pointer-events: none;
    }

    .box-current-path {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4));
      pointer-events: none;
    }

    .box-current-node {
      fill: #fff7ed;
      stroke: #f59e0b;
      stroke-width: 3;
      pointer-events: none;
    }

    .box-current-node-label {
      font-size: 11px;
      font-weight: 800;
      fill: #92400e;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .box-current-node-label-bg {
      fill: #fff7ed;
      stroke: #f59e0b;
      stroke-width: 1.5;
      pointer-events: none;
    }

    .lead {
      stroke: #485761;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .terminal {
      fill: #fff;
      stroke: #172026;
      stroke-width: 2;
      cursor: crosshair;
    }

    .port-drag-hit {
      fill: transparent;
      stroke: none;
      cursor: move;
      pointer-events: all;
    }

    .lead-anchor {
      fill: #fff;
      stroke: var(--blue);
      stroke-width: 2;
      cursor: move;
      pointer-events: all;
    }

    .resize-handle {
      fill: #fffefa;
      stroke: var(--blue);
      stroke-width: 2;
      cursor: nwse-resize;
      pointer-events: all;
    }

    .resize-handle[data-resize-handle="ne"],
    .resize-handle[data-resize-handle="sw"] {
      cursor: nesw-resize;
    }

    .terminal.external {
      stroke: var(--green);
      stroke-width: 3;
    }

    .terminal.hot {
      fill: #fff7ed;
      stroke: var(--gold);
      stroke-width: 3;
    }

    .terminal.dummy-terminal {
      fill: #fff1f2;
      stroke: #db2777;
      stroke-width: 3;
      cursor: not-allowed;
    }

    .net-badge {
      font-size: 11px;
      font-weight: 800;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .net-badge-bg {
      stroke: #fff;
      stroke-width: 2;
      pointer-events: none;
    }

    .node-order-list {
      display: grid;
      gap: 8px;
    }

    .node-order-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      user-select: none;
    }

    .node-order-item:hover {
      border-color: #aeb9c8;
      background: #f8fafc;
    }

    .node-order-item.dragging {
      opacity: 0.45;
    }

    .node-chip {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .node-color-button {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 999px;
      box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px var(--line);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .node-color-palette {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0 0 26px;
    }

    .node-color-swatch {
      width: 22px;
      height: 22px;
      border: 2px solid #fff;
      border-radius: 5px;
      box-shadow: 0 0 0 1px var(--line);
      cursor: pointer;
    }

    .node-color-swatch.active {
      box-shadow: 0 0 0 2px var(--blue);
    }

    .node-drag-handle {
      width: 18px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: grab;
      flex: 0 0 auto;
    }

    .node-drag-handle:active {
      cursor: grabbing;
    }

    .node-order-name {
      font-size: 13px;
      font-weight: 700;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      cursor: text;
    }

    .node-order-id {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .node-internal-button {
      min-width: 42px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .node-internal-button.active {
      border-color: var(--red);
      color: #fff;
      background: var(--red);
    }

    .node-dummy-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border: 1px solid #f9a8d4;
      border-radius: 999px;
      background: #fdf2f8;
      color: #be185d;
      font-size: 11px;
      font-weight: 850;
      flex: 0 0 auto;
    }

    .node-edit-button {
      width: 26px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .node-edit-button:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    .editable-value {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-width: 0;
      min-height: 35px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 8px;
      background: #ffffff;
      overflow: hidden;
    }

    .editable-text {
      display: block;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      color: var(--ink);
    }

    .editable-value.multiline-field {
      align-items: stretch;
    }

    .editable-value.multiline-field .editable-text {
      max-height: 150px;
      overflow: auto;
      overscroll-behavior: contain;
      padding-bottom: 2px;
      resize: vertical;
      scrollbar-gutter: stable both-edges;
      text-overflow: clip;
      white-space: pre;
    }

    textarea.readonly-math-field {
      overflow: auto;
      white-space: pre;
      scrollbar-gutter: stable both-edges;
      resize: vertical;
    }

    .branch-label {
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .switch-label {
      font-size: 11px;
      font-weight: 800;
      fill: var(--green);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .node-label {
      font-size: 11px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .terminal.net-hover-highlight {
      stroke: #f59e0b;
      stroke-width: 4;
      fill: #fff7ed;
      filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.45));
    }

    .terminal.auto-glue-preview {
      stroke: #0ea5e9;
      stroke-width: 4;
      fill: #ecfeff;
      filter: drop-shadow(0 0 7px rgba(14, 165, 233, 0.5));
    }

    .terminal.auto-glue-flash {
      stroke: #22c55e;
      stroke-width: 5;
      fill: #ecfdf5;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.55));
      animation: autoGluePulse 0.85s ease-out 1;
    }

    .auto-glue-feedback-line {
      fill: none;
      stroke: #22c55e;
      stroke-width: 4;
      stroke-dasharray: 7 6;
      stroke-linecap: round;
      pointer-events: none;
      filter: drop-shadow(0 0 7px rgba(34, 197, 94, 0.45));
    }

    .auto-glue-feedback-line.preview {
      stroke: #0ea5e9;
      filter: drop-shadow(0 0 7px rgba(14, 165, 233, 0.45));
    }

    @keyframes autoGluePulse {
      0% { r: 8; opacity: 0.55; }
      45% { r: 13; opacity: 1; }
      100% { r: 8; opacity: 1; }
    }

    .net-badge-bg.net-hover-highlight {
      stroke: #f59e0b;
      stroke-width: 3;
      filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.35));
    }

    .node-order-item.hovering {
      border-color: #f59e0b;
      background: #fff7ed;
    }

    .node-order-item.selected {
      border-color: var(--accent);
      background: #eff6ff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .node-terminal-map {
      margin-top: 12px;
    }

    .node-terminal-map .field:last-child {
      margin-bottom: 0;
    }

    .direction {
      stroke: var(--red);
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }

    .panel {
      min-width: 0;
      border-left: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      box-shadow: -10px 0 24px rgba(15, 23, 42, 0.035);
    }

    .panel-resize-bar {
      background: #d8e1eb;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      cursor: col-resize;
      min-width: 8px;
    }

    .panel-resize-bar:hover,
    .panel-resize-bar.dragging {
      background: #aebdcb;
    }

    .panel-section {
      padding: 14px 16px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 12px;
      text-transform: uppercase;
      color: #263442;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title::before {
      content: "";
      width: 3px;
      height: 14px;
      border-radius: 999px;
      background: var(--blue);
      display: inline-block;
    }

    .field {
      display: grid;
      gap: 5px;
      margin-bottom: 12px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field-caption {
      margin: 4px 0 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .runtime-case-card {
      margin: 8px 0 12px;
      padding: 9px 10px;
      border: 1px solid #d4e2f4;
      border-radius: 8px;
      background: #f8fbff;
      box-shadow: inset 3px 0 0 #94a3b8;
    }

    .runtime-case-card.active {
      border-color: #9ec5fe;
      background: #eff6ff;
      box-shadow: inset 3px 0 0 #2563eb;
    }

    .runtime-case-card-toggle {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .runtime-case-card-toggle input {
      margin: 0;
      margin-top: 2px;
    }

    .runtime-case-card-copy {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .runtime-case-card-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .runtime-case-card-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .runtime-case-card-pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .runtime-case-card-help,
    .runtime-gconst-notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .runtime-gconst-notice {
      margin: 8px 0 12px;
      padding: 10px 12px;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      background: #f5f8ff;
      color: #475569;
    }

    .editor-groups {
      display: grid;
      gap: 10px;
    }

    .editor-group {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .editor-group summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 38px;
      padding: 9px 10px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 800;
      color: #243446;
      list-style: none;
      background: linear-gradient(180deg, #ffffff 0%, #eef3f8 100%);
      border-bottom: 1px solid #c8d4e0;
      box-shadow: inset 3px 0 0 #2f6fed;
    }

    .editor-group summary::-webkit-details-marker {
      display: none;
    }

    .editor-group summary::after {
      content: "▾";
      color: var(--muted);
      font-size: 12px;
      transform: rotate(-90deg);
      transition: transform 0.16s ease;
    }

    .editor-group[open] summary::after {
      transform: rotate(0deg);
    }

    .editor-group:not([open]) summary {
      border-bottom-color: transparent;
    }

    .editor-group-body {
      padding: 0 10px 10px;
    }

    .editor-group-body > :last-child {
      margin-bottom: 0;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 9px;
      background: #ffffff;
      color: var(--ink);
      min-width: 0;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #8fb4ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      color: var(--ink);
      font-size: 13px;
    }

    .check-row input {
      width: auto;
    }

    .highlight-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(68px, auto);
      align-items: end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .compact-check {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      white-space: normal;
    }

    .compact-check input {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      margin: 0;
      padding: 0;
    }

    .compact-check span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .color-chip-field {
      display: grid;
      gap: 4px;
      min-width: 84px;
    }

    input[type="color"].color-chip {
      width: 42px;
      height: 34px;
      min-width: 42px;
      padding: 2px;
      border-radius: 6px;
      cursor: pointer;
    }

    .color-chip-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .color-chip-value {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .packaged-case-list {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .packaged-case-row {
      display: grid;
      grid-template-columns: minmax(70px, 0.8fr) minmax(110px, 1.2fr);
      gap: 8px;
      align-items: center;
    }

    .packaged-case-row label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 2px 0;
    }

    .output {
      position: relative;
      border-top: 1px solid var(--line);
      background: var(--output-bg);
      color: #eaf0f4;
      min-height: 0;
      display: grid;
      grid-template-rows: 42px 1fr;
      box-shadow: 0 -12px 30px rgba(15, 23, 42, 0.10);
    }

    .output-tabs {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px 5px;
      border-bottom: 1px solid var(--output-line);
      background: linear-gradient(180deg, #111f2a 0%, #0c1720 100%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.035) inset;
    }

    .tab {
      border: 1px solid var(--output-line);
      background: #122230;
      color: #d8e2e8;
      border-radius: 6px;
      padding: 6px 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }

    .tab.active {
      border-color: #5fb3ff;
      color: #fff;
      background: #12324b;
      box-shadow: inset 0 -2px 0 #65cfff, 0 0 0 1px rgba(101, 207, 255, 0.14);
    }

    .tab:hover:not(.active) {
      border-color: #486173;
      background: #182a38;
    }

    .output-action {
      margin-left: auto;
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--output-line);
      background: #122230;
      color: #d8e2e8;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }

    .output-action + .output-action {
      margin-left: 0;
    }

    .output-action.text-action {
      width: auto;
      min-width: 0;
      padding: 0 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .output-action.active {
      border-color: #5fb3ff;
      color: #fff;
      background: #102b42;
    }

    .output-action:hover {
      border-color: #5fb3ff;
      color: #ffffff;
    }

    .output-body {
      margin: 0;
      overflow: auto;
      padding: 14px;
      min-height: 0;
      background:
        radial-gradient(circle at top left, rgba(101, 207, 255, 0.055), transparent 360px),
        var(--output-bg);
    }

    .output.has-minimap .output-body {
      padding-right: 86px;
    }

    .modal.output-modal.has-minimap .modal-output-body {
      padding-right: 86px;
    }

    .output.has-minimap .output-body-formulas {
      padding-right: 14px;
    }

    .output-minimap {
      position: absolute;
      top: 50px;
      right: 10px;
      bottom: 10px;
      width: 58px;
      display: none;
      border: 1px solid rgba(93, 124, 148, 0.58);
      border-radius: 7px;
      background: rgba(6, 15, 22, 0.72);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04) inset,
        0 8px 18px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      cursor: pointer;
      z-index: 4;
      user-select: none;
    }

    .output.has-minimap .output-minimap {
      display: block;
    }

    .modal.output-modal.has-minimap .output-minimap {
      display: block;
      top: 58px;
    }

    .output-minimap-content {
      position: absolute;
      inset: 4px;
      overflow: hidden;
    }

    .output-minimap-mark {
      position: absolute;
      left: 6px;
      right: 6px;
      min-height: 2px;
      border-radius: 2px;
      background: rgba(159, 178, 192, 0.46);
    }

    .output-minimap-mark.matrix {
      background: rgba(101, 207, 255, 0.58);
    }

    .output-minimap-mark.warning {
      background: rgba(248, 113, 113, 0.72);
    }

    .output-minimap-thumb {
      position: absolute;
      left: 2px;
      top: 2px;
      min-height: 20px;
      min-width: 16px;
      border: 1px solid rgba(101, 207, 255, 0.9);
      border-radius: 6px;
      background: rgba(101, 207, 255, 0.14);
      box-shadow: 0 0 0 1px rgba(101, 207, 255, 0.16) inset;
      pointer-events: none;
    }

    .output-body.code {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .output pre.code,
    .modal-output-body pre.code,
    .output [data-c-draft-code],
    .modal-output-body [data-c-draft-code] {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid rgba(71, 96, 116, 0.74);
      border-radius: 7px;
      background: #0a131b;
      color: #e5edf4;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
      overflow: auto;
    }

    .formula-list {
      display: grid;
      gap: 12px;
      padding-bottom: 8px;
      width: 100%;
      min-width: 0;
    }

    .output-body-formulas .formula-list {
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      align-items: stretch;
      width: 100%;
      min-width: 0;
    }

    .modal-output-body .formula-list {
      width: 100%;
      min-width: 0;
    }

    .formula-card {
      display: grid;
      gap: 16px;
      padding: 12px 14px 14px;
      border: 1px solid rgba(71, 96, 116, 0.92);
      border-radius: 8px;
      background: linear-gradient(180deg, #152532 0%, var(--output-panel) 100%);
      width: auto;
      min-width: 0;
      max-width: 100%;
      overflow-x: auto;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.045) inset,
        0 8px 18px rgba(0, 0, 0, 0.10);
    }

    .output-body-formulas .formula-card {
      width: auto;
      min-width: 0;
      align-content: start;
      padding: 10px 12px 12px;
    }

    .modal-output-body .formula-card {
      width: auto;
      min-width: 0;
      max-width: 100%;
      overflow-x: auto;
    }

    .output .formula-card > .formula-name:first-child,
    .modal-output-body .formula-card > .formula-name:first-child {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(93, 124, 148, 0.42);
    }

    .output .formula-card > .formula-name:first-child::before,
    .modal-output-body .formula-card > .formula-name:first-child::before {
      content: "";
      width: 3px;
      height: 14px;
      border-radius: 999px;
      background: #65cfff;
      box-shadow: 0 0 12px rgba(101, 207, 255, 0.38);
      flex: 0 0 auto;
    }

    .formula-card[data-hover-branch-id] {
      cursor: crosshair;
    }

    .formula-card.current-hover {
      border-color: #f59e0b;
      background: #182b31;
      box-shadow: inset 3px 0 0 #f59e0b;
    }

    .optimized-summary-grid {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(300px, 0.75fr);
      gap: 10px;
      align-items: start;
      width: 100%;
      min-width: min(100%, 980px);
    }

    .optimized-summary-grid > .formula-card {
      width: auto;
      min-width: 0;
      overflow-x: auto;
    }

    .analysis-table {
      border-collapse: collapse;
      font-size: 14px;
      min-width: 260px;
      color: #f7fbff;
    }

    .stage-summary-table {
      table-layout: fixed;
      width: min(100%, 920px);
      min-width: 0;
    }

    .analysis-table th,
    .analysis-table td {
      border: 1px solid #42586a;
      padding: 6px 10px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    .stage-summary-table th,
    .stage-summary-table td {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      vertical-align: top;
      white-space: normal;
      word-break: break-word;
    }

    .analysis-table th {
      color: #c5d2dc;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.035);
    }

    .analysis-table td {
      font-family: "Cambria Math", "Times New Roman", serif;
    }

    .gkk-analysis-layout {
      display: grid;
      grid-template-columns: minmax(320px, max-content) minmax(260px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .ihis-block-preview {
      display: inline-grid;
      grid-template-columns: auto max-content max-content auto;
      gap: 10px;
      align-items: center;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      padding: 12px;
      border: 1px solid rgba(71, 96, 116, 0.74);
      border-radius: 8px;
      background: rgba(7, 20, 30, 0.34);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .ihis-block-vector {
      position: relative;
      display: grid;
      grid-template-columns: minmax(62px, max-content);
      padding: 10px 14px;
      font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", serif;
      color: #f7fbff;
      border-radius: 6px;
      background: rgba(11, 25, 35, 0.28);
    }

    .ihis-block-vector::before,
    .ihis-block-vector::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      border-top: 2px solid #dce8ef;
      border-bottom: 2px solid #dce8ef;
      pointer-events: none;
    }

    .ihis-block-vector::before {
      left: 0;
      border-left: 2px solid #dce8ef;
    }

    .ihis-block-vector::after {
      right: 0;
      border-right: 2px solid #dce8ef;
    }

    .ihis-block-cell {
      min-height: 34px;
      min-width: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 16px;
      font-size: 17px;
      white-space: nowrap;
    }

    .ihis-block-cell.split-top {
      border-top: 2px dashed rgba(101, 207, 255, 0.92);
    }

    .ihis-block-labels {
      display: grid;
      align-items: center;
      color: #9fd5ff;
      font-size: 12px;
      font-weight: 700;
      font-family: system-ui, sans-serif;
    }

    .ihis-block-label {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .ihis-block-label::before {
      content: "}";
      color: #dce8ef;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 0.7;
    }

    .inline-formula-preview {
      display: grid;
      gap: 5px;
      margin-bottom: 12px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      overflow-x: auto;
    }

    .inline-formula-preview .formula-name {
      color: var(--muted);
    }

    .inline-formula-preview .formula-line {
      color: var(--ink);
      font-size: 16px;
    }

    .inline-formula-preview .formula-rhs,
    .inline-formula-preview .formula-lhs,
    .inline-formula-preview .formula-eq {
      color: var(--ink);
    }

    .formula-name {
      color: var(--output-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .formula-line {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 2px;
      font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.45;
      white-space: nowrap;
      width: max-content;
    }

    .output-body-formulas .formula-line {
      display: grid;
      grid-template-columns: max-content 16px max-content;
      align-items: center;
      justify-content: start;
      column-gap: 8px;
      width: 100%;
      min-width: 0;
      padding-top: 2px;
      font-size: 16px;
      line-height: 1.35;
    }

    .matrix-equation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 2px;
      font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.35;
      white-space: nowrap;
      width: max-content;
    }

    .matrix {
      display: inline-grid;
      gap: 8px 18px;
      position: relative;
      padding: 8px 14px;
      color: #f7fbff;
    }

    .matrix::before,
    .matrix::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 7px;
      border-top: 2px solid #dce8ef;
      border-bottom: 2px solid #dce8ef;
    }

    .matrix::before {
      left: 0;
      border-left: 2px solid #dce8ef;
    }

    .matrix::after {
      right: 0;
      border-right: 2px solid #dce8ef;
    }

    .matrix-cell {
      min-width: 58px;
      text-align: center;
      padding: 1px 4px;
    }

    .matrix-cell.dummy-pruned-cell,
    .actual-block-cell.dummy-pruned-cell {
      color: #ffd7e8;
      background: rgba(219, 39, 119, 0.18);
      outline: 1px dashed rgba(244, 114, 182, 0.78);
      outline-offset: -2px;
      border-radius: 5px;
    }

    .actual-block-preview {
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 6px 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(71, 96, 116, 0.74);
      border-radius: 8px;
      background: rgba(7, 20, 30, 0.34);
      font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", "Times New Roman", serif;
      color: #f7fbff;
      width: max-content;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .modal-output-body .actual-block-preview {
      display: grid;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
    }

    .actual-block-column-labels,
    .actual-block-bottom-labels {
      grid-column: 1;
      display: grid;
      align-items: center;
      color: #9fd5ff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-align: center;
    }

    .actual-block-bottom-labels {
      padding-top: 2px;
    }

    .actual-block-label {
      white-space: nowrap;
    }

    .actual-block-matrix-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .actual-block-matrix {
      position: relative;
      display: grid;
      gap: 0;
      padding: 12px 16px;
      border-radius: 6px;
      background: rgba(11, 25, 35, 0.28);
    }

    .actual-block-matrix::before,
    .actual-block-matrix::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      border-top: 2px solid #dce8ef;
      border-bottom: 2px solid #dce8ef;
      pointer-events: none;
    }

    .actual-block-matrix::before {
      left: 0;
      border-left: 2px solid #dce8ef;
    }

    .actual-block-matrix::after {
      right: 0;
      border-right: 2px solid #dce8ef;
    }

    .actual-block-cell {
      min-width: 180px;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      text-align: center;
      font-size: 17px;
      line-height: 1.18;
      white-space: nowrap;
      width: max-content;
    }

    .actual-block-cell *,
    .actual-block-label *,
    .actual-block-side-label * {
      white-space: nowrap;
    }

    .actual-block-cell.split-left {
      border-left: 2px dashed rgba(101, 207, 255, 0.92);
    }

    .actual-block-cell.split-top {
      border-top: 2px dashed rgba(101, 207, 255, 0.92);
    }

    .actual-block-cell.block-ellipsis {
      color: #9fd5ff;
      font-size: 22px;
      width: auto;
      min-width: 64px;
    }

    .actual-block-side-labels {
      display: grid;
      align-items: center;
      color: #9fd5ff;
      font-size: 12px;
      font-weight: 700;
      font-family: system-ui, sans-serif;
    }

    .actual-block-side-label {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .actual-block-side-label::before {
      content: "}";
      color: #dce8ef;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 0.7;
    }

    .actual-block-order-panel {
      align-self: stretch;
      display: grid;
      gap: 0;
      min-width: 180px;
      max-width: 260px;
      padding: 12px;
      border: 1px solid rgba(101, 207, 255, 0.38);
      border-radius: 7px;
      background: rgba(10, 27, 39, 0.72);
      color: #dce8ef;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }

    .actual-block-order-title {
      color: #cdefff;
      font-size: 12px;
      font-weight: 800;
      align-self: start;
      padding-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .actual-block-order-line {
      display: grid;
      grid-template-columns: 24px minmax(64px, 1fr);
      align-items: center;
      align-content: center;
      column-gap: 12px;
      min-height: 0;
    }

    .actual-block-order-label {
      color: #9fb2c0;
      font-size: 11px;
      font-weight: 800;
      text-transform: lowercase;
    }

    .actual-block-order-value {
      display: grid;
      gap: 3px;
      justify-items: start;
      color: #22c55e;
      font-size: 16px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .actual-block-order-node {
      display: block;
      white-space: nowrap;
      line-height: 1.35;
    }

    .formula-title-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .formula-title-row .formula-name {
      margin: 0;
    }

    .copy-draft-button {
      flex: 0 0 auto;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid rgba(101, 207, 255, 0.45);
      border-radius: 6px;
      background: #102b42;
      color: #d8f2ff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }

    .copy-draft-button:hover {
      border-color: #65cfff;
      color: #fff;
      background: #123650;
    }

    .copy-draft-button.copied {
      border-color: #22c55e;
      color: #86efac;
      background: #0f3328;
    }

    .actual-block-caption {
      grid-column: 1 / -1;
      color: var(--output-muted);
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.45;
    }

    .actual-block-dummy-pruned-notice {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      max-width: min(920px, 100%);
      margin: 4px 0 8px;
      padding: 7px 10px;
      border: 1px solid rgba(244, 114, 182, 0.72);
      border-radius: 7px;
      background: rgba(80, 18, 47, 0.46);
      color: #ffd7e8;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .multi-case-template-grid {
      display: grid;
      grid-template-columns: minmax(320px, max-content);
      gap: 16px;
      align-items: start;
      width: max-content;
      max-width: 100%;
    }

    .multi-case-template-block {
      display: grid;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
    }

    .multi-case-template-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: min(980px, 100%);
      color: #d9ecff;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.45;
    }

    .multi-case-template-flow span {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid rgba(101, 207, 255, 0.38);
      border-radius: 7px;
      background: rgba(8, 31, 45, 0.48);
    }

    .math-branch-highlight {
      color: var(--branch-highlight-color, #ef4444);
    }

    .math-frac {
      display: inline-grid;
      grid-template-rows: auto auto;
      align-items: center;
      vertical-align: middle;
      line-height: 1.05;
      margin: 0 2px;
      min-width: 1.2em;
    }

    .math-frac-num {
      display: block;
      padding: 0 4px 2px;
      border-bottom: 1px solid currentColor;
    }

    .math-frac-den {
      display: block;
      padding: 2px 4px 0;
    }

    .formula-line sub {
      font-size: 0.68em;
      line-height: 0;
    }

    .formula-lhs {
      color: #eaf0f4;
      font-style: italic;
      flex: 0 0 auto;
    }

    .output-body-formulas .formula-lhs {
      min-width: 82px;
      text-align: right;
    }

    .formula-eq {
      color: #8fb8ff;
      flex: 0 0 auto;
      text-align: center;
    }

    .formula-rhs {
      color: #f7fbff;
    }

    .output-body-formulas .formula-rhs {
      min-width: 0;
      overflow-x: auto;
      padding: 1px 2px 3px;
    }

    .formula-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 4px 0;
      line-height: 1.5;
    }

    .output .formula-empty,
    .modal-output-body .formula-empty {
      color: var(--output-muted);
      padding: 7px 9px;
      border: 1px solid rgba(71, 96, 116, 0.54);
      border-radius: 7px;
      background: rgba(8, 31, 45, 0.34);
    }

    .output-body > .formula-empty {
      display: inline-block;
      margin: 2px;
    }

    .validation-warning {
      border: 1px solid #ef4444;
      background: #fff1f2;
      color: #b42318;
      border-radius: 6px;
      padding: 8px 9px;
      font-size: 12px;
      line-height: 1.45;
      margin: 6px 0 12px;
    }

    .output .formula-card.validation-warning,
    .modal-output-body .formula-card.validation-warning {
      border-color: rgba(248, 113, 113, 0.72);
      background: linear-gradient(180deg, rgba(69, 26, 32, 0.92), rgba(45, 19, 25, 0.92));
      color: #fecaca;
    }

    .output .formula-card.validation-warning .formula-name,
    .modal-output-body .formula-card.validation-warning .formula-name {
      color: #fecaca;
    }

    .output .formula-card.validation-warning .formula-empty,
    .modal-output-body .formula-card.validation-warning .formula-empty {
      border-color: rgba(248, 113, 113, 0.32);
      background: rgba(127, 29, 29, 0.18);
      color: #fecaca;
    }

    .validation-success {
      border: 1px solid #16a34a;
      background: #f0fdf4;
      color: #166534;
      border-radius: 6px;
      padding: 8px 9px;
      font-size: 12px;
      line-height: 1.45;
      margin: 6px 0 12px;
    }

    .stamp-preview {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      border-radius: 6px;
      padding: 8px 9px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mode-options {
      display: grid;
      gap: 8px;
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .mode-option {
      cursor: pointer;
      text-align: left;
    }

    .mode-option.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
      color: #1d4ed8;
    }

    .validation-neutral {
      border: 1px solid #f59e0b;
      background: #fffbeb;
      color: #92400e;
      border-radius: 6px;
      padding: 8px 9px;
      font-size: 12px;
      line-height: 1.45;
      margin: 6px 0 12px;
    }

    .ybox-info {
      border: 1px solid #93c5fd;
      background: #eff6ff;
      color: #1e3a5f;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 12px;
      line-height: 1.5;
      margin: 6px 0 12px;
    }

    .ybox-info-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .ybox-formula {
      margin-top: 8px;
      display: grid;
      gap: 5px;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 16px;
      color: #172026;
      overflow-x: auto;
    }

    .ybox-formula-line {
      white-space: nowrap;
    }

    .status {
      margin-left: auto;
      padding-top: 10px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(16, 24, 32, 0.42);
      z-index: 20;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(820px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .modal-title {
      font-weight: 800;
      margin-right: auto;
    }

    .modal-body {
      padding: 14px;
      min-height: 0;
    }

    .modal-body textarea {
      min-height: 420px;
      height: 100%;
      display: none;
    }

    .modal.output-modal {
      width: min(1180px, calc(100vw - 48px));
      height: min(820px, calc(100vh - 48px));
    }

    .modal.output-modal.fullscreen {
      width: calc(100vw - 12px);
      height: calc(100vh - 12px);
      max-height: calc(100vh - 12px);
      border-radius: 6px;
    }

    .modal-output-body {
      min-height: 0;
      overflow: auto;
      background: #101820;
      color: #eaf0f4;
      padding: 14px;
    }

    .modal-help {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .text-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 11px;
      cursor: pointer;
    }

    .text-button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    @media (min-width: 1700px) and (min-height: 850px), (min-width: 1400px) and (min-height: 1100px) {
      .topbar {
        gap: 12px;
        min-height: 62px;
        padding: 10px 18px;
      }

      .brand {
        font-size: 17px;
        padding-top: 10px;
      }

      .toolbar {
        gap: 8px;
      }

      .toolbar-group {
        gap: 5px;
        padding: 4px 6px;
      }

      .toolbar-label {
        font-size: 11px;
      }

      .tool {
        width: 42px;
        height: 40px;
      }

      .tool.text-tool,
      .tab,
      .output-action.text-action,
      .text-button {
        font-size: 13px;
      }

      .main {
        --panel-width: 410px;
        grid-template-columns: minmax(520px, 1fr) 9px minmax(300px, var(--panel-width));
      }

      .workspace {
        grid-template-rows: auto minmax(320px, 1fr) 9px 270px;
      }

      .canvas-tabs {
        gap: 8px;
        padding: 9px 12px;
      }

      .canvas-tab {
        padding: 7px 12px;
        font-size: 13px;
      }

      .canvas-tab-delete {
        width: 18px;
        height: 18px;
      }

      .panel-section {
        padding: 18px;
      }

      .panel-title {
        font-size: 14px;
        margin-bottom: 14px;
      }

      label,
      .field-caption,
      .compact-check,
      .node-order-id,
      .node-internal-button,
      .editable-text,
      .formula-empty,
      .modal-help,
      .status {
        font-size: 13px;
      }

      input,
      textarea,
      select {
        padding: 9px 10px;
      }

      textarea,
      .output-body.code {
        font-size: 13px;
      }

      .editor-group summary {
        min-height: 42px;
        padding: 10px 12px;
        font-size: 13px;
      }

      .editor-group-body {
        padding: 0 12px 12px;
      }

      .node-order-item {
        min-height: 40px;
        padding: 8px 10px;
      }

      .node-order-name {
        font-size: 14px;
      }

      .node-edit-button {
        width: 30px;
        height: 28px;
      }

      .output {
        grid-template-rows: 44px 1fr;
      }

      .output-tabs {
        gap: 8px;
        padding: 6px 10px;
      }

      .tab {
        padding: 7px 12px;
      }

      .output-action {
        width: 34px;
        height: 32px;
      }

      .formula-name {
        font-size: 12px;
      }

      .formula-line,
      .matrix-equation {
        font-size: 20px;
      }

      .matrix-cell {
        min-width: 66px;
      }
    }

    @media (min-width: 2400px) and (min-height: 1200px) {
      .topbar {
        min-height: 70px;
        padding: 12px 22px;
      }

      .brand {
        font-size: 19px;
      }

      .tool {
        width: 48px;
        height: 46px;
      }

      .main {
        --panel-width: 460px;
        grid-template-columns: minmax(620px, 1fr) 10px minmax(340px, var(--panel-width));
      }

      .workspace {
        grid-template-rows: auto minmax(360px, 1fr) 10px 310px;
      }

      .toolbar-label {
        font-size: 12px;
      }

      .canvas-tab,
      .panel-title,
      .node-order-name {
        font-size: 15px;
      }

      label,
      .field-caption,
      .compact-check,
      .tool.text-tool,
      .tab,
      .output-action.text-action,
      .text-button,
      .editable-text,
      .formula-empty,
      .modal-help,
      .status {
        font-size: 14px;
      }

      textarea,
      .output-body.code {
        font-size: 14px;
      }

      .editor-group summary {
        min-height: 46px;
        font-size: 14px;
      }

      .output {
        grid-template-rows: 50px 1fr;
      }

      .formula-line,
      .matrix-equation {
        font-size: 22px;
      }
    }

    @media (max-width: 920px) {
      body {
        min-width: 0;
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .topbar {
        align-items: flex-start;
        padding: 8px 10px;
      }

      .brand {
        margin-right: 4px;
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toolbar {
        align-items: flex-start;
      }

      .toolbar-group {
        padding: 3px 4px;
      }

      .tool {
        width: 34px;
        height: 32px;
      }

      .main {
        grid-template-columns: 1fr;
        overflow: visible;
        min-height: 0;
      }

      .panel-resize-bar {
        display: none;
      }

      .panel {
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: none;
        overflow: visible;
      }

      .workspace {
        grid-template-rows: auto 260px 8px minmax(220px, auto);
        min-height: 0;
      }

      .canvas-wrap {
        min-height: 260px;
      }

      .output {
        min-height: 220px;
      }

      .output-body {
        overflow: auto;
      }

      .formula-card {
        max-width: calc(100vw - 28px);
        overflow-x: auto;
      }

      .optimized-summary-grid {
        grid-template-columns: 1fr;
      }

      .multi-case-template-grid {
        grid-template-columns: 1fr;
      }

      .matrix-equation {
        min-width: max-content;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Branch Builder</div>
      <div class="toolbar" role="toolbar" aria-label="工具">
        <div class="toolbar-group">
          <span class="toolbar-label">语言</span>
          <button class="tool text-tool" id="languageTool" title="切换到英文" aria-label="切换到英文">EN</button>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">历史</span>
        <button class="tool" id="undoTool" title="撤销" aria-label="撤销">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4v5M4 12c2.5-4 6-6 10-5 3.6.9 6 3.8 6 7.5 0 1.5-.4 2.9-1.2 4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="redoTool" title="反撤销" aria-label="反撤销">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h5v5M20 12c-2.5-4-6-6-10-5-3.6.9-6 3.8-6 7.5 0 1.5.4 2.9 1.2 4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">选择</span>
        <button class="tool" id="selectAllTool" title="全选元件" aria-label="全选元件">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="copyTool" title="复制选中元件" aria-label="复制选中元件">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v12H8zM6 16H4V4h10v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="pasteTool" title="粘贴元件" aria-label="粘贴元件">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1 2h3v14H5V6h3zM8 11h8M8 15h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="groupTool" title="组合选中元件" aria-label="组合选中元件">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v8H8zM4 4h6M14 4h6M4 20h6M14 20h6M4 4v6M20 4v6M4 14v6M20 14v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="ungroupTool" title="取消组合" aria-label="取消组合">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h6v6H9zM4 4h5M15 4h5M4 20h5M15 20h5M4 4v5M20 4v5M4 15v5M20 15v5M7 12H3M21 12h-4M12 7V3M12 21v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">封装</span>
        <button class="tool" id="packYTool" title="打包为Y节点黑盒" aria-label="打包为Y节点黑盒">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12v14H6zM2 8h4M2 16h4M18 8h4M18 16h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="unpackYTool" title="拆包Y节点黑盒" aria-label="拆包Y节点黑盒">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM3 12h4M17 12h4M12 3v4M12 17v4M5 5l14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">文件</span>
        <button class="tool" id="exportTool" title="导出电路组合" aria-label="导出电路组合">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="importTool" title="导入电路组合" aria-label="导入电路组合">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
        <div class="toolbar-group">

  <script>
    const state = {
      tool: "select",
      branches: [],
      wires: [],
      selectedId: null,
      selectedIds: [],
      selectedNetIds: [],
      selectedWireId: null,
      groups: [],
      nextGroup: 1,
      nodeOrder: [],
      nodeLabels: {},
      nodeColors: {},
      internalNodes: [],
      colorPickerNodeId: null,
      pendingTerminal: null,
      drag: null,
      wireDrag: null,
      portDrag: null,
      leadAnchorDrag: null,
      resizeDrag: null,
      panelResizeDrag: null,
      panelWidth: null,
      hoverCurrent: null,
      hoverNetId: null,
      autoGluePreview: null,
      autoGlueFlash: null,
      autoGlueFlashTimer: null,
      showLocalLabels: false,
      showReducedBranchCurrents: false,
      panDrag: null,
      marquee: null,
      clipboard: null,
      pasteCount: 0,
      canvases: [],
      activeCanvasId: "canvas1",
      nextCanvas: 2,
      canvasTabDrag: null,
      language: "zh",
      activeOutput: "formulas",
      optimizedEliminationDisplay: "compact",
      optimizedEliminationSimplify: "light",
      optimizedEliminationAssumeSpd: true,
      optimizedEliminationUseSuggestedOrder: true,
      optimizedSymbolDependencyOverrides: "",
      multiCaseProfilesText: "",
      multiCaseProfilesKey: "",
      multiCaseIdSymbol: "case_id",
      nextBranch: 1,
      nextTransformer: 1,
      nextCustom: 1,
      nextWire: 1,
      zoom: 1,
      viewCenter: { x: 800, y: 500 },
      editorGroups: {},
      history: [],
      future: [],
      restoring: false,
      packageCaseEdit: null
    };
    let reducedRenderToken = 0;
    let branchCurrentRenderToken = 0;
    let pythonDraftRenderToken = 0;
    let optimizedEliminationRenderToken = 0;
    let multiCaseExportRenderToken = 0;
    let mathPrecomputeToken = 0;
    let mathPrecomputeTimer = null;
    const CACHE_LIMIT = 16;
    const REDUCED_CACHE_VERSION = "reduced-safe-simplified-v1";
    const reducedCache = new Map();
    const branchCurrentCache = new Map();
    const pythonDraftCache = new Map();
    const optimizedEliminationCache = new Map();
    const multiCaseExportCache = new Map();

    function cacheGet(cache, key) {
      const value = cache.get(key);
      if (!value) return null;
      cache.delete(key);
      cache.set(key, value);
      return value;
    }

    function cacheSet(cache, key, value) {
      if (cache.has(key)) cache.delete(key);
      cache.set(key, value);
      while (cache.size > CACHE_LIMIT) {
        const oldest = cache.keys().next().value;
        cache.delete(oldest);
      }
    }

    function reducedCacheKey(payload) {
      return JSON.stringify({ version: REDUCED_CACHE_VERSION, language: state.language, payload });
    }

    function migratedReducedCacheKey(key) {
      try {
        const parsed = JSON.parse(key);
        if (!parsed?.payload || parsed.version === REDUCED_CACHE_VERSION) return null;
        return JSON.stringify({
          version: REDUCED_CACHE_VERSION,
          language: parsed.language || state.language,
          payload: parsed.payload
        });
      } catch {
        return null;
      }
    }

    function invalidateMathCaches() {
      reducedRenderToken += 1;
      branchCurrentRenderToken += 1;
      pythonDraftRenderToken += 1;
      optimizedEliminationRenderToken += 1;
      multiCaseExportRenderToken += 1;
      mathPrecomputeToken += 1;
      scheduleMathPrecompute();
    }

    function blankCanvasData(name = "画布") {
      return {
        name,
        branches: [],
        wires: [],
        groups: [],
        nodeOrder: [],
        nodeLabels: {},
        nodeColors: {},
        internalNodes: [],
        selectedId: null,
        selectedIds: [],
        selectedNetIds: [],
        selectedWireId: null,
        nextBranch: 1,
        nextTransformer: 1,
        nextCustom: 1,
        nextWire: 1,
        nextGroup: 1,
        zoom: 1,
        viewCenter: { x: WORLD.width / 2, y: WORLD.height / 2 },
        reducedEquationCache: [],
        branchCurrentCache: [],
        pythonDraftCache: [],
        packageCaseEdit: null,
        history: [],
        future: []
      };
    }

    function currentCanvasData() {
      return {
        name: currentCanvas()?.name || "画布",
        branches: structuredClone(state.branches),
        wires: structuredClone(state.wires),
        groups: structuredClone(state.groups),
        nodeOrder: structuredClone(state.nodeOrder),
        nodeLabels: structuredClone(state.nodeLabels),
        nodeColors: structuredClone(state.nodeColors),
        internalNodes: structuredClone(state.internalNodes),
        selectedId: state.selectedId,
        selectedIds: structuredClone(state.selectedIds),
        selectedNetIds: structuredClone(state.selectedNetIds || []),
        selectedWireId: state.selectedWireId,
        nextBranch: state.nextBranch,
        nextTransformer: state.nextTransformer,
        nextCustom: state.nextCustom,
        nextWire: state.nextWire,
        nextGroup: state.nextGroup,
        zoom: state.zoom,
        viewCenter: structuredClone(state.viewCenter),
        reducedEquationCache: currentReducedCacheSnapshot(),
        branchCurrentCache: currentCacheSnapshot(branchCurrentCache, ["html"]),
        pythonDraftCache: currentCacheSnapshot(pythonDraftCache, ["result"]),
        packageCaseEdit: structuredClone(state.packageCaseEdit),
        history: structuredClone(state.history),
        future: structuredClone(state.future)
      };
    }

    function applyCanvasData(data) {
      state.branches = structuredClone(data.branches || []);
      state.wires = structuredClone(data.wires || []);
      state.groups = structuredClone(data.groups || []);
      state.nodeOrder = structuredClone(data.nodeOrder || []);
      state.nodeLabels = structuredClone(data.nodeLabels || {});
      state.nodeColors = structuredClone(data.nodeColors || {});
      cleanupAutoYBoxNodeLabels();
      state.internalNodes = structuredClone(data.internalNodes || []);
      state.colorPickerNodeId = null;
      state.selectedId = data.selectedId || null;
      state.selectedIds = structuredClone(data.selectedIds || (data.selectedId ? [data.selectedId] : []));
      state.selectedNetIds = structuredClone(data.selectedNetIds || []);
      state.selectedWireId = data.selectedWireId || null;
      state.nextBranch = data.nextBranch || inferNextNumber(state.branches, "B");
      state.nextTransformer = data.nextTransformer || inferNextNumber(state.branches, "T");
      state.nextCustom = data.nextCustom || inferNextNumber(state.branches, "C");
      state.nextWire = data.nextWire || inferNextNumber(state.wires, "W");
      state.nextGroup = data.nextGroup || inferNextNumber(state.groups, "G");
      syncNextCounters();
      state.zoom = data.zoom || 1;
      state.viewCenter = structuredClone(data.viewCenter || { x: WORLD.width / 2, y: WORLD.height / 2 });
      restoreReducedCacheSnapshot(data.reducedEquationCache || []);
      restoreCacheSnapshot(branchCurrentCache, data.branchCurrentCache || [], ["html"]);
      restoreCacheSnapshot(pythonDraftCache, data.pythonDraftCache || [], ["result"]);
      state.history = structuredClone(data.history || []);
      state.future = structuredClone(data.future || []);
      state.packageCaseEdit = structuredClone(data.packageCaseEdit || null);
      state.pendingTerminal = null;
      state.drag = null;
      state.wireDrag = null;
      state.portDrag = null;
      state.leadAnchorDrag = null;
      state.resizeDrag = null;
      state.hoverCurrent = null;
      state.panDrag = null;
      state.marquee = null;
      state.canvasTabDrag = null;
      state.autoGluePreview = null;
      state.autoGlueFlash = null;
      invalidateMathCaches();
    }

    function currentCanvas() {
      return state.canvases.find(item => item.id === state.activeCanvasId) || null;
    }

    function normalizeCanvasState(canvasState, index = 0) {
      const id = canvasState?.id || `canvas${index + 1}`;
      const name = canvasState?.name || canvasState?.data?.name || `画布 ${index + 1}`;
      return {
        id,
        name,
        data: structuredClone(canvasState?.data || blankCanvasData(name))
      };
    }

    function currentReducedCacheSnapshot() {
      try {
        return Array.from(reducedCache.entries())
          .filter(([, value]) => value?.html)
          .map(([key, value]) => ({
            key,
            html: value.html,
            result: value.result || null,
            savedAt: new Date().toISOString()
          }));
      } catch {
        return [];
      }
    }

    function currentCacheSnapshot(cache, fields) {
      try {
        return Array.from(cache.entries())
          .map(([key, value]) => {
            if (!value || value.pending) return null;
            const entry = { key, savedAt: new Date().toISOString() };
            fields.forEach(field => {
              if (value[field] !== undefined && value[field] !== null) entry[field] = value[field];
            });
            return Object.keys(entry).length > 2 ? entry : null;
          })
          .filter(Boolean);
      } catch {
        return [];
      }
    }

    function restoreReducedCacheSnapshot(entries = []) {
      (Array.isArray(entries) ? entries : []).forEach(entry => {
        if (!entry?.key || !entry?.html) return;
        const value = {
          html: entry.html,
          result: entry.result || null,
          pending: null,
          restored: true
        };
        cacheSet(reducedCache, entry.key, value);
        const migratedKey = migratedReducedCacheKey(entry.key);
        if (migratedKey) cacheSet(reducedCache, migratedKey, value);
      });
    }

    function restoreCacheSnapshot(cache, entries = [], fields = []) {
      (Array.isArray(entries) ? entries : []).forEach(entry => {
        if (!entry?.key) return;
        const value = { pending: null, restored: true };
        fields.forEach(field => {
          if (entry[field] !== undefined && entry[field] !== null) value[field] = entry[field];
        });
        if (Object.keys(value).length > 2) cacheSet(cache, entry.key, value);
      });
    }

    function saveActiveCanvas() {
      const canvasState = currentCanvas();
      if (canvasState) canvasState.data = currentCanvasData();
    }

    function syncCanvasOrderFromTabs() {
      if (!canvasTabs) return;
      const ids = Array.from(canvasTabs.querySelectorAll(".canvas-tab[data-canvas-id]"))
        .map(tab => tab.dataset.canvasId)
        .filter(Boolean);
      if (!ids.length || ids.length !== state.canvases.length) return;
      const byId = new Map(state.canvases.map(item => [item.id, item]));
      if (ids.some(id => !byId.has(id))) return;
      state.canvases = ids.map(id => byId.get(id));
    }

    function switchCanvas(id) {
      if (id === state.activeCanvasId) return;
      saveActiveCanvas();
      const next = state.canvases.find(item => item.id === id);
      if (!next) return;
      state.activeCanvasId = id;
      applyCanvasData(next.data);
      render();
    }

    function createNewCanvas() {
      saveActiveCanvas();
      const id = `canvas${state.nextCanvas++}`;
      const name = `画布 ${state.canvases.length + 1}`;
      state.canvases.push({ id, name, data: blankCanvasData(name) });
      state.activeCanvasId = id;
      applyCanvasData(blankCanvasData(name));
      render();
    }

    function deleteCanvas(id) {
      if (state.canvases.length <= 1) return;
      saveActiveCanvas();
      const index = state.canvases.findIndex(item => item.id === id);
      if (index < 0) return;
      state.canvases.splice(index, 1);
      if (state.activeCanvasId === id) {
        const next = state.canvases[Math.max(0, index - 1)] || state.canvases[0];
        state.activeCanvasId = next.id;
        applyCanvasData(next.data || blankCanvasData(next.name));
      }
      render();
    }
