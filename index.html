          ${renderMatrix(result.K_v)}
          ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
          <span class="formula-eq">+</span>
          ${renderVectorMatrix(result.K_h)}
        </div>
      `;
    }

    function hasReducedTaggedResult(result) {
      return Boolean(
        result?.G_red_tagged || result?.Ihis_red_tagged || result?.K_v_tagged || result?.K_h_tagged
      );
    }

    function renderReducedSourceHighlightVersion(result, externalNames, internalNames) {
      if (!hasReducedTaggedResult(result) || !activeHighlightedBranches().length) return "";
      return `
        <div class="formula-card">
          <div class="formula-name">${escapeHtml(tr("来源高亮版本"))}</div>
          ${reducedHighlightWarning(result)}
          <div class="matrix-equation">
            ${renderVectorMatrix(externalNames.map(name => `I_${name}`))}
            <span class="formula-eq">=</span>
            ${renderMatrix(result.G_red, null, result.G_red_tagged)}
            ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
            <span class="formula-eq">+</span>
            ${renderVectorMatrix(result.Ihis_red, result.Ihis_red_tagged)}
          </div>
          <div class="matrix-equation">
            ${renderVectorMatrix(internalNames.map(name => `V_${name}`))}
            <span class="formula-eq">=</span>
            ${renderMatrix(result.K_v, null, result.K_v_tagged)}
            ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
            <span class="formula-eq">+</span>
            ${renderVectorMatrix(result.K_h, result.K_h_tagged)}
          </div>
        </div>
      `;
    }

    function reducedHighlightWarning(result) {
      const hasTaggedResult = Boolean(
        result?.G_red_tagged || result?.Ihis_red_tagged || result?.K_v_tagged || result?.K_h_tagged
      );
      if (!hasTaggedResult || !activeHighlightedBranches().length) return "";
      return `
        <div class="formula-empty">
          <strong>${escapeHtml(tr("高亮来源提示"))}:</strong>
          ${escapeHtml(tr("用于追踪支路来源；主数学结果以上方普通排版为准。"))}
        </div>
      `;
    }

    function renderReducedEquations() {
      const assembled = constrainedAssembledSystem(assembleGlobalSystem({ expandPackaged: true }));
      const forcedInternal = new Set(assembled.forcedInternalNodes || []);
      const internal = assembled.nodes.filter(node => state.internalNodes.includes(node) || forcedInternal.has(node));
      const external = assembled.nodes.filter(node => !state.internalNodes.includes(node) && !forcedInternal.has(node));
      const groundNames = (assembled.groundNodes || []).map(node => displayNameForAssembledNode(assembled.originalAssembled || assembled, node));

      if (!internal.length) {
        return `<div class="formula-empty">${escapeHtml(tr("请在右侧网络节点列表中勾选至少一个“内部”节点。"))}</div>`;
      }
      if (!external.length) {
        return `<div class="formula-empty">${escapeHtml(tr("至少需要保留一个外部节点。"))}</div>`;
      }
      if (assembled.warnings?.length) {
        return `<div class="formula-empty">${assembled.warnings.map(escapeHtml).join("<br>")}</div>`;
      }

      const block = partitionSystem(assembled, external, internal);
      const reduced = reducePartition(block);
      const externalNames = external.map(node => displayNameForAssembledNode(assembled, node));
      const internalNames = internal.map(node => displayNameForAssembledNode(assembled, node));

      return `
        <div class="formula-list">
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("节点划分"))}</div>
            <div class="formula-line">
              <span class="formula-rhs">${escapeHtml(tr("外部"))}: ${escapeHtml(externalNames.join(", "))}; ${escapeHtml(tr("内部"))}: ${escapeHtml(internalNames.join(", "))}${groundNames.length ? `; ${escapeHtml(tr("Ground 节点"))}: ${escapeHtml(groundNames.join(", "))}` : ""}</span>
            </div>
          </div>
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("节点方程消去版本"))}</div>
            <div class="matrix-equation">
              ${renderVectorMatrix(externalNames.map(name => `I_${name}`))}
              <span class="formula-eq">=</span>
              ${renderMatrix(reduced.Geq)}
              ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
              <span class="formula-eq">+</span>
              ${renderVectorMatrix(reduced.Jeq)}
            </div>
          </div>
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("内部节点电压恢复公式"))}</div>
            <div class="matrix-equation">
              ${renderVectorMatrix(internalNames.map(name => `V_${name}`))}
              <span class="formula-eq">=</span>
              ${renderMatrix(reduced.ViA)}
              ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
              <span class="formula-eq">-</span>
              ${renderVectorMatrix(reduced.VibNeg)}
            </div>
          </div>
          ${internal.length === 1 ? renderSingleInternalFormula(reduced, externalNames, internalNames[0]) : ""}
        </div>
      `;
    }

    function renderMatrixSymbol(symbol) {
      return `<span class="matrix" style="grid-template-columns: 1fr;"><span class="matrix-cell">${formatMath(symbol)}</span></span>`;
    }

    function partitionSystem(assembled, external, internal) {
      const index = new Map(assembled.nodes.map((node, i) => [node, i]));
      const ids = nodes => nodes.map(node => index.get(node));
      const e = ids(external);
      const m = ids(internal);
      const pickG = (rows, cols) => rows.map(r => cols.map(c => sumTerms(assembled.G[r][c])));
      const pickJ = rows => rows.map(r => sumTerms(assembled.Ihis[r]));
      return {
        Gee: pickG(e, e),
        Gei: pickG(e, m),
        Gie: pickG(m, e),
        Gii: pickG(m, m),
        Je: pickJ(e),
        Ji: pickJ(m)
      };
    }

    function reducePartition(block) {
      const invGii = inverseMatrix(block.Gii);
      const GeiInv = matMul(block.Gei, invGii);
      const Geq = matSub(block.Gee, matMul(GeiInv, block.Gie));
      const Jeq = vecSub(block.Je, matVec(GeiInv, block.Ji));
      const invGiiGie = matMul(invGii, block.Gie);
      const ViA = invGiiGie.map(row => row.map(exprNeg));
      const VibNeg = matVec(invGii, block.Ji);
      return { Geq, Jeq, ViA, VibNeg };
    }

    function renderSingleInternalFormula(reduced, externalNames, internalName) {
      const K_v = reduced.K_v || reduced.ViA;
      const K_h = reduced.K_h || (reduced.VibNeg || []).map(exprNeg);
      const voltageSum = K_v[0]
        .map((g, index) => isZero(g) ? "" : `(${g})*V_${externalNames[index]}`)
        .filter(Boolean);
      const rhsTerms = voltageSum.concat(isZero(K_h[0]) ? [] : [K_h[0]]);
      const rhs = rhsTerms.length ? rhsTerms.join(" + ") : "0";
      return `
        <div class="formula-card">
          <div class="formula-name">${escapeHtml(tr("单内部节点展开式"))}</div>
          <div class="formula-line">
            <span class="formula-lhs">V<sub>${escapeHtml(internalName)}</sub></span>
            <span class="formula-eq">=</span>
            <span class="formula-rhs">${formatMath(rhs)}</span>
          </div>
        </div>
      `;
    }

    function isZero(expr) {
      return !expr || String(expr).trim() === "0";
    }

    function exprWrap(expr) {
      return String(expr || "0").trim();
    }

    function exprNeg(expr) {
      expr = exprWrap(expr);
      if (isZero(expr)) return "0";
      if (expr.startsWith("-(") && expr.endsWith(")")) return expr.slice(2, -1);
      return `-(${expr})`;
    }

    function exprAdd(a, b) {
      a = exprWrap(a);
      b = exprWrap(b);
      if (isZero(a)) return b;
      if (isZero(b)) return a;
      return `${a} + ${b}`;
    }

    function exprSub(a, b) {
      return exprAdd(a, exprNeg(b));
    }

    function exprMul(a, b) {
      a = exprWrap(a);
      b = exprWrap(b);
      if (isZero(a) || isZero(b)) return "0";
      if (a === "1") return b;
      if (b === "1") return a;
      return `(${a})*(${b})`;
    }

    function exprDiv(a, b) {
      a = exprWrap(a);
      b = exprWrap(b);
      if (isZero(a)) return "0";
      if (b === "1") return a;
      return `(${a})/(${b})`;
    }

    function matMul(A, B) {
      const rows = A.length;
      const cols = B[0]?.length || 0;
      const inner = B.length;
      const out = Array.from({ length: rows }, () => Array.from({ length: cols }, () => "0"));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let sum = "0";
          for (let k = 0; k < inner; k++) sum = exprAdd(sum, exprMul(A[r][k], B[k][c]));
          out[r][c] = sum;
        }
      }
      return out;
    }

    function matVec(A, v) {
      return A.map(row => row.reduce((sum, item, index) => exprAdd(sum, exprMul(item, v[index])), "0"));
    }

    function matSub(A, B) {
      return A.map((row, r) => row.map((item, c) => exprSub(item, B[r][c])));
    }

    function vecSub(a, b) {
      return a.map((item, index) => exprSub(item, b[index]));
    }

    function inverseMatrix(A) {
      const n = A.length;
      if (n === 1) return [[exprDiv("1", A[0][0])]];
      if (n === 2) {
        const det = exprSub(exprMul(A[0][0], A[1][1]), exprMul(A[0][1], A[1][0]));
        return [
          [exprDiv(A[1][1], det), exprDiv(exprNeg(A[0][1]), det)],
          [exprDiv(exprNeg(A[1][0]), det), exprDiv(A[0][0], det)]
        ];
      }
      const det = determinant(A);
      const cofactors = [];
      for (let r = 0; r < n; r++) {
        cofactors[r] = [];
        for (let c = 0; c < n; c++) {
          const sign = (r + c) % 2 === 0 ? "1" : "-1";
          cofactors[r][c] = exprMul(sign, determinant(minorMatrix(A, r, c)));
        }
      }
      return transpose(cofactors).map(row => row.map(item => exprDiv(item, det)));
    }

    function determinant(A) {
      const n = A.length;
      if (n === 1) return A[0][0];
      if (n === 2) return exprSub(exprMul(A[0][0], A[1][1]), exprMul(A[0][1], A[1][0]));
      let sum = "0";
      for (let c = 0; c < n; c++) {
        const sign = c % 2 === 0 ? "1" : "-1";
        sum = exprAdd(sum, exprMul(exprMul(sign, A[0][c]), determinant(minorMatrix(A, 0, c))));
      }
      return sum;
    }

    function minorMatrix(A, row, col) {
      return A.filter((_, r) => r !== row).map(items => items.filter((_, c) => c !== col));
    }

    function transpose(A) {
      return A[0].map((_, c) => A.map(row => row[c]));
    }

    function assembleGlobalSystem(options = {}) {
      const expandPackaged = Boolean(options.expandPackaged);
      const groups = orderedNetGroups();
      if (expandPackaged) {
        packagedHiddenNodeRows().forEach(row => {
          if (!groups.some(item => item.id === row.id)) groups.push(row);
        });
      }
      const nodes = groups.map(group => group.id);
      const displayByNode = new Map(groups.map(group => [group.id, group.display || nodeDisplayName(group.id)]));
      const forcedInternalNodes = groups
        .filter(group => group.virtualInternal)
        .map(group => group.id);
      const netByTerminal = new Map();
      groups.forEach(group => group.members.forEach(member => netByTerminal.set(member, group.id)));
      const nodeIndex = new Map(nodes.map((node, index) => [node, index]));
      const size = nodes.length;
      const G = Array.from({ length: size }, () => Array.from({ length: size }, () => []));
      const Ihis = Array.from({ length: size }, () => []);
      const GSymbolUsage = [];
      const elementStamps = [];
      const warnings = [];

      const nodeLookup = nodeLookupFromGroups(groups);
      state.branches.forEach(branch => {
        if (branch.kind === "ground") return;
        if (expandPackaged && branch.packageOriginal) {
          const stampRecord = createElementStampRecord(branch);
          stampPackagedOriginal(branch, netByTerminal, nodeIndex, G, Ihis, GSymbolUsage, stampRecord);
          pushElementStamp(elementStamps, stampRecord);
          return;
        }
        if (branch.kind === "current_source") {
          const stampRecord = createElementStampRecord(branch);
          stampCurrentSourceBranch(branch, side => netByTerminal.get(terminalKey(branch.id, side)), nodeLookup, nodeIndex, G, Ihis, warnings, GSymbolUsage, stampRecord);
          pushElementStamp(elementStamps, stampRecord);
          return;
        }
        if (branch.kind === "voltage_source_series_r") {
          const stampRecord = createElementStampRecord(branch);
          stampVoltageSourceSeriesRBranch(branch, side => netByTerminal.get(terminalKey(branch.id, side)), nodeIndex, G, Ihis, warnings, GSymbolUsage, stampRecord);
          pushElementStamp(elementStamps, stampRecord);
          return;
        }
        const stampRecord = createElementStampRecord(branch);
        const sourceId = branch.id;
        const sides = terminalSides(branch);
        const localG = localGMatrix(branch);
        const localIhis = localIhisVector(branch);

        sides.forEach((rowSide, r) => {
          const rowNet = netByTerminal.get(terminalKey(branch.id, rowSide));
          const row = nodeIndex.get(rowNet);
          if (row === undefined) return;

          addTerm(Ihis[row], localIhis[r], sourceId);
          recordElementIhis(stampRecord, rowNet, localIhis[r], sourceId);

          sides.forEach((colSide, c) => {
            const colNet = netByTerminal.get(terminalKey(branch.id, colSide));
            const col = nodeIndex.get(colNet);
            if (col === undefined) return;
            const term = localG[r]?.[c] || "0";
            addTerm(G[row][col], term, sourceId);
            recordElementG(stampRecord, rowNet, colNet, term, sourceId);
            recordGSymbolUsage(GSymbolUsage, branch, term, rowNet, colNet);
          });
        });
        pushElementStamp(elementStamps, stampRecord);
      });

      return { nodes, G, Ihis, GSymbolUsage, elementStamps, displayByNode, forcedInternalNodes, groundNodes: groundNodesFromGroups(groups), warnings };
    }

    function groundNodesFromGroups(groups) {
      const groundTerminals = new Set(
        state.branches
          .filter(branch => branch.kind === "ground")
          .map(branch => terminalKey(branch.id, "G"))
      );
      return groups
        .filter(group => !group.virtualInternal && (group.members || []).some(member => groundTerminals.has(member)))
        .map(group => group.id);
    }

    function groundNodesForBranchesInGroups(branches, groups) {
      const groundTerminals = new Set(
        (branches || [])
          .filter(branch => branch.kind === "ground")
          .map(branch => terminalKey(branch.id, "G"))
      );
      return (groups || [])
        .filter(group => (group.members || []).some(member => groundTerminals.has(member)))
        .map(group => group.id);
    }

    function createElementStampRecord(branch) {
      return {
        id: branch.id,
        name: branch.name || branch.id,
        support: new Set(),
        G: [],
        Ihis: []
      };
    }

    function recordElementSupport(record, ...nodes) {
      if (!record) return;
      nodes.filter(Boolean).forEach(node => record.support.add(node));
    }

    function recordElementG(record, rowNode, colNode, expr, sourceId = null, taggedExpr = null) {
      const cleaned = cleanExpr(expr);
      if (!record || !cleaned || cleaned === "0") return;
      recordElementSupport(record, rowNode, colNode);
      record.G.push({
        row: rowNode,
        col: colNode,
        expr: cleaned,
        tagged: taggedExpr || tagExprForSource(cleaned, sourceId || record.id)
      });
    }

    function recordElementIhis(record, rowNode, expr, sourceId = null, taggedExpr = null) {
      const cleaned = cleanExpr(expr);
      if (!record || !cleaned || cleaned === "0") return;
      recordElementSupport(record, rowNode);
      record.Ihis.push({
        row: rowNode,
        expr: cleaned,
        tagged: taggedExpr || tagExprForSource(cleaned, sourceId || record.id)
      });
    }

    function pushElementStamp(records, record) {
      if (!record || (!record.G.length && !record.Ihis.length)) return;
      records.push({
        id: record.id,
        name: record.name,
        support_nodes: [...record.support],
        G: record.G,
        Ihis: record.Ihis
      });
    }

    function constrainedAssembledSystem(assembled) {
      const groundSet = new Set(assembled.groundNodes || []);
      if (!groundSet.size) return assembled;
      const keep = assembled.nodes
        .map((node, index) => ({ node, index }))
        .filter(item => !groundSet.has(item.node));
      const keptIndices = keep.map(item => item.index);
      const displayByNode = new Map();
      assembled.displayByNode?.forEach((value, key) => displayByNode.set(key, value));
      return {
        ...assembled,
        originalAssembled: assembled,
        nodes: keep.map(item => item.node),
        G: keptIndices.map(row => keptIndices.map(col => assembled.G[row][col])),
        Ihis: keptIndices.map(row => assembled.Ihis[row]),
        displayByNode,
        forcedInternalNodes: (assembled.forcedInternalNodes || []).filter(node => !groundSet.has(node)),
        warnings: assembled.warnings || []
      };
    }

    function nodeLookupFromGroups(groups) {
      const lookup = new Map();
      groups.forEach(group => {
        if (!lookup.has(group.id)) lookup.set(group.id, group.id);
        const display = group.display || nodeDisplayName(group.id);
        if (display && !lookup.has(display)) lookup.set(display, group.id);
      });
      return lookup;
    }

    function stampCurrentSourceBranch(branch, netForSide, nodeLookup, nodeIndex, G, Ihis, warnings = null, GSymbolUsage = null, stampRecord = null) {
      const fromSide = branch.direction === "AtoB" ? "A" : "B";
      const toSide = branch.direction === "AtoB" ? "B" : "A";
      const fromNode = netForSide(fromSide);
      const toNode = netForSide(toSide);
      const fromRow = nodeIndex.get(fromNode);
      const toRow = nodeIndex.get(toNode);
      if (fromRow === undefined || toRow === undefined) return;

      parseCurrentSourceControlTerms(branch).forEach(term => {
        if (term.error) {
          warnings?.push(`${branch.name}: ${term.error}`);
          return;
        }
        const controlNode = nodeLookup.get(term.node);
        const col = nodeIndex.get(controlNode);
        if (col === undefined) {
          warnings?.push(`${branch.name}: ${tr("受控电流源控制节点不存在")}: ${term.node}`);
          return;
        }
        addTerm(G[fromRow][col], term.coefficient, branch.id);
        recordElementG(stampRecord, fromNode, controlNode, term.coefficient, branch.id);
        recordGSymbolUsage(GSymbolUsage, branch, term.coefficient, fromNode, controlNode);
        const negated = negateExpr(term.coefficient);
        addTerm(G[toRow][col], negated, branch.id);
        recordElementG(stampRecord, toNode, controlNode, negated, branch.id);
        recordGSymbolUsage(GSymbolUsage, branch, negated, toNode, controlNode);
      });
      const ihis = currentSourceIhis(branch);
      addTerm(Ihis[fromRow], ihis, branch.id);
      recordElementIhis(stampRecord, fromNode, ihis, branch.id);
      addTerm(Ihis[toRow], negateExpr(ihis), branch.id);
      recordElementIhis(stampRecord, toNode, negateExpr(ihis), branch.id);
    }

    function stampVoltageSourceSeriesRBranch(branch, netForSide, nodeIndex, G, Ihis, warnings = null, GSymbolUsage = null, stampRecord = null) {
      validateVoltageSourceSeriesR(branch).forEach(message => warnings?.push(`${branch.name}: ${message}`));
      const pNode = netForSide("P");
      const nNode = netForSide("N");
      const pRow = nodeIndex.get(pNode);
      const nRow = nodeIndex.get(nNode);
      if (pRow === undefined || nRow === undefined) return;
      const gs = voltageSourceSeriesConductance(branch);
      const j = voltageSourceSeriesIhis(branch);
      addTerm(G[pRow][pRow], gs, branch.id);
      recordElementG(stampRecord, pNode, pNode, gs, branch.id);
      recordGSymbolUsage(GSymbolUsage, branch, gs, pNode, pNode);
      const negGs = negateExpr(gs);
      addTerm(G[pRow][nRow], negGs, branch.id);
      recordElementG(stampRecord, pNode, nNode, negGs, branch.id);
      recordGSymbolUsage(GSymbolUsage, branch, negGs, pNode, nNode);
      addTerm(G[nRow][pRow], negGs, branch.id);
      recordElementG(stampRecord, nNode, pNode, negGs, branch.id);
      recordGSymbolUsage(GSymbolUsage, branch, negGs, nNode, pNode);
      addTerm(G[nRow][nRow], gs, branch.id);
      recordElementG(stampRecord, nNode, nNode, gs, branch.id);
      recordGSymbolUsage(GSymbolUsage, branch, gs, nNode, nNode);
      addTerm(Ihis[pRow], j, branch.id);
      recordElementIhis(stampRecord, pNode, j, branch.id);
      addTerm(Ihis[nRow], negateExpr(j), branch.id);
      recordElementIhis(stampRecord, nNode, negateExpr(j), branch.id);
    }

    function displayNameForAssembledNode(assembled, node) {
      return assembled.displayByNode?.get(node) || nodeDisplayName(node);
    }

    function stampPackagedOriginal(branch, netByTerminal, nodeIndex, G, Ihis, GSymbolUsage = null, stampRecord = null) {
      const packed = packagedOriginalSystem(branch, netByTerminal);
      if (!packed) return false;
      let stamped = false;
      const nodeIdByLocalId = new Map((packed.localNodeIds || []).map((id, index) => [id, packed.nodeIds[index]]));
      packed.nodeIds.forEach((rowNode, r) => {
        const row = nodeIndex.get(rowNode);
        if (row === undefined) return;
        const beforeIhis = Ihis[row].length;
        addTerms(Ihis[row], packed.Ihis[r] || []);
        const ihisExpr = sumTerms(packed.Ihis[r] || []);
        const ihisTagged = taggedSumTerms(packed.Ihis[r] || []);
        recordElementIhis(stampRecord, rowNode, ihisExpr, branch.id, ihisTagged);
        if (Ihis[row].length !== beforeIhis) stamped = true;
        packed.nodeIds.forEach((colNode, c) => {
          const col = nodeIndex.get(colNode);
          if (col === undefined) return;
          const beforeG = G[row][col].length;
          addTerms(G[row][col], packed.G[r]?.[c] || []);
          const gExpr = sumTerms(packed.G[r]?.[c] || []);
          const gTagged = taggedSumTerms(packed.G[r]?.[c] || []);
          recordElementG(stampRecord, rowNode, colNode, gExpr, branch.id, gTagged);
          if (G[row][col].length !== beforeG) stamped = true;
        });
      });
      (packed.GSymbolUsage || []).forEach(record => {
        const rowNode = nodeIdByLocalId.get(record.row_node);
        const colNode = nodeIdByLocalId.get(record.col_node);
        if (!rowNode || !colNode) return;
        GSymbolUsage?.push({
          ...record,
          row_node: rowNode,
          col_node: colNode,
          packaged_source_id: branch.id,
          packaged_source_name: branch.name
        });
      });
      return stamped;
    }

    function packagedOriginalSystem(branch, netByTerminal) {
      normalizePackageNetworkCases(branch);
      const pkg = branch.packageOriginal;
      const originalBranches = pkg?.branches || [];
      if (!originalBranches.length) return null;
      const selectedIds = new Set(originalBranches.map(item => item.id));
      const parent = new Map();
      const add = key => {
        if (!parent.has(key)) parent.set(key, key);
      };
      const find = key => {
        add(key);
        const p = parent.get(key);
        if (p !== key) parent.set(key, find(p));
        return parent.get(key);
      };
      const union = (a, b) => {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent.set(rb, ra);
      };
      originalBranches.forEach(item => terminalSides(item).forEach(side => add(terminalKey(item.id, side))));
      (pkg.wires || []).forEach(wire => {
        const a = parseTerminal(wire.from);
        const b = parseTerminal(wire.to);
        if (selectedIds.has(a.branchId) && selectedIds.has(b.branchId)) union(wire.from, wire.to);
      });
      const byRoot = new Map();
      Array.from(parent.keys()).forEach(key => {
        const root = find(key);
        if (!byRoot.has(root)) byRoot.set(root, []);
        byRoot.get(root).push(key);
      });
      const annotated = Array.from(byRoot.values()).map(members => {
        const best = bestSavedPackageNodeState(members, pkg.nodeState || []);
        return {
          members,
          display: best?.display || "",
          globalNet: best?.id || "",
          internal: Boolean(best?.internal)
        };
      });
      const ordered = [];
      const used = new Set();
      const pick = stored => {
        const storedMembers = new Set(stored.members || []);
        let bestIndex = -1;
        let bestScore = -1;
        annotated.forEach((item, index) => {
          if (used.has(index)) return;
          let score = 0;
          if (stored.display && item.display === stored.display) score += 1000;
          if (stored.globalNet && item.globalNet === stored.globalNet) score += 1000;
          score += item.members.filter(member => storedMembers.has(member)).length * 10;
          if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });
        if (bestIndex >= 0) {
          used.add(bestIndex);
          return annotated[bestIndex];
        }
        return null;
      };
      (pkg.externalGroups || []).forEach((group, index) => {
        const item = pick(group);
        const exposed = Boolean(packagedNodeExposePort(branch, "external", index));
        if (item) ordered.push({ ...item, id: group.id, packageGroup: group, packageKind: "external", virtual: !exposed, virtualIndex: index });
      });
      (pkg.internalGroups || []).forEach((group, index) => {
        const item = pick(group);
        const exposed = Boolean(packagedNodeExposePort(branch, "internal", index));
        if (item) ordered.push({ ...item, id: group.id, packageGroup: group, packageKind: "internal", virtual: !exposed, virtualIndex: index });
      });
      annotated.forEach((item, index) => {
        if (!used.has(index)) ordered.push({ ...item, id: item.globalNet || item.display || `pkg-extra:${branch.id}:${index}`, virtual: item.internal, virtualIndex: ordered.length });
      });
      const groupByTerminal = new Map();
      ordered.forEach((group, index) => group.members.forEach(member => groupByTerminal.set(member, index)));
      const orderedNodeIndex = new Map(ordered.map((group, index) => [group.id, index]));
      const orderedNodeLookup = nodeLookupFromGroups(ordered);
      const size = ordered.length;
      const localG = Array.from({ length: size }, () => Array.from({ length: size }, () => []));
      const localIhis = Array.from({ length: size }, () => []);
      const GSymbolUsage = [];
      originalBranches.forEach(item => {
        if (item.kind === "current_source") {
          stampCurrentSourceBranch(item, side => {
            const index = groupByTerminal.get(terminalKey(item.id, side));
            return index === undefined ? null : ordered[index]?.id;
          }, orderedNodeLookup, orderedNodeIndex, localG, localIhis, null, GSymbolUsage);
          return;
        }
        if (item.kind === "voltage_source_series_r") {
          stampVoltageSourceSeriesRBranch(item, side => {
            const index = groupByTerminal.get(terminalKey(item.id, side));
            return index === undefined ? null : ordered[index]?.id;
          }, orderedNodeIndex, localG, localIhis, null, GSymbolUsage);
          return;
        }
        const sourceId = item.id;
        const sides = terminalSides(item);
        const g = localGMatrix(item);
        const ihis = localIhisVector(item);
        sides.forEach((rowSide, r) => {
          const row = groupByTerminal.get(terminalKey(item.id, rowSide));
          if (row === undefined) return;
          addTerm(localIhis[row], ihis[r], sourceId);
          sides.forEach((colSide, c) => {
            const col = groupByTerminal.get(terminalKey(item.id, colSide));
            if (col === undefined) return;
            const term = g[r]?.[c] || "0";
            addTerm(localG[row][col], term, sourceId);
            recordGSymbolUsage(GSymbolUsage, item, term, ordered[row]?.id, ordered[col]?.id);
          });
        });
      });
      const nodeIds = ordered.map(group => {
        if (group.virtual) {
          if (group.packageKind === "external") return packagedHiddenNodeId(branch, "external", group.virtualIndex);
          const internalIndex = Math.max(0, (pkg.internalGroups || []).findIndex(item =>
            item.display === group.packageGroup?.display || item.globalNet === group.packageGroup?.globalNet
          ));
          return packagedInternalNodeId(branch, group.packageGroup || group, Number.isFinite(group.virtualIndex) ? group.virtualIndex : internalIndex);
        }
        const port = group.packageKind === "internal" ? group.packageGroup?.exposePort : group.packageGroup?.port;
        return port ? netByTerminal.get(terminalKey(branch.id, port)) : null;
      });
      return { nodeIds, localNodeIds: ordered.map(group => group.id), G: localG, Ihis: localIhis, GSymbolUsage };
    }

    function bestSavedPackageNodeState(members, nodeState) {
      let best = null;
      nodeState.forEach(stateItem => {
        const saved = new Set(stateItem.members || []);
        const overlap = members.filter(member => saved.has(member)).length;
        if (overlap > 0 && (!best || overlap > best.overlap)) best = { ...stateItem, overlap };
      });
      return best;
    }

    function localGMatrix(branch) {
      if (branch.kind === "ground") return [["0"]];
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") {
        const n = terminalSides(branch).length;
        return parseMatrixLiteral(branchValue(branch, "gMatrix"), n, n);
      }
      if (branch.kind === "dummy_node_block") {
        const n = terminalSides(branch).length;
        return Array.from({ length: n }, (_, row) =>
          Array.from({ length: n }, (_, col) => row === col ? (branch.fixedConductance || "G_EPSILON") : "0")
        );
      }
      if (branch.kind === "dummy_dimension_branch") {
        return [
          ["G_EPSILON", "-(G_EPSILON)"],
          ["-(G_EPSILON)", "G_EPSILON"]
        ];
      }
      if (branch.kind === "current_source") {
        return [["0", "0"], ["0", "0"]];
      }
      if (branch.kind === "voltage_source_series_r") {
        const gs = voltageSourceSeriesConductance(branch);
        return [
          [gs, negateExpr(gs)],
          [negateExpr(gs), gs]
        ];
      }
      const g = wrapExpr(branchValue(branch, "g") || "0");
      return [
        [g, negateExpr(g)],
        [negateExpr(g), g]
      ];
    }

    function localIhisVector(branch) {
      if (branch.kind === "ground") return ["0"];
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") {
        return parseVectorLiteral(branchValue(branch, "ihisVector"), terminalSides(branch).length);
      }
      if (branch.kind === "dummy_node_block") return terminalSides(branch).map(() => "0");
      if (branch.kind === "dummy_dimension_branch") return ["0", "0"];
      if (branch.kind === "current_source") {
        return ["0", "0"];
      }
      if (branch.kind === "voltage_source_series_r") {
        const j = voltageSourceSeriesIhis(branch);
        return [j, negateExpr(j)];
      }
      const j = wrapExpr(branchValue(branch, "ihis") || "0");
      return [j, negateExpr(j)];
    }

    function parseMatrixLiteral(text, rows, cols) {
      const inner = stripOuterBrackets(text.trim());
      const rowStrings = splitTopLevel(inner).map(row => stripOuterBrackets(row.trim()));
      const result = [];
      for (let r = 0; r < rows; r++) {
        const items = rowStrings[r] ? splitTopLevel(rowStrings[r]) : [];
        result.push([]);
        for (let c = 0; c < cols; c++) result[r].push(wrapExpr(items[c] || "0"));
      }
      return result;
    }

    function parseVectorLiteral(text, rows) {
      const matrix = parseMatrixLiteral(text, rows, 1);
      return matrix.map(row => row[0]);
    }

    function stripOuterBrackets(text) {
      const trimmed = text.trim();
      if (trimmed.startsWith("[") && trimmed.endsWith("]")) return trimmed.slice(1, -1);
      return trimmed;
    }

    function splitTopLevel(text) {
      const parts = [];
      let depth = 0;
      let current = "";
      for (const ch of text) {
        if (ch === "[") depth += 1;
        if (ch === "]") depth -= 1;
        if (ch === "," && depth === 0) {
          parts.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      if (current.trim()) parts.push(current.trim());
      return parts;
    }

    function addTerm(list, term, sourceIds = null) {
      const cleaned = cleanExpr(term);
      if (!cleaned || cleaned === "0") return;
      const ids = Array.isArray(sourceIds) ? sourceIds.filter(Boolean) : (sourceIds ? [sourceIds] : []);
      list.push(ids.length ? { expr: cleaned, sourceIds: ids } : cleaned);
    }

    function recordGSymbolUsage(records, branch, expr, rowNode, colNode) {
      if (!records || !branch) return;
      const constantSymbols = branchConstantGSymbols(branch);
      extractExpressionSymbols(expr).forEach(symbol => {
        records.push({
          symbol,
          row_node: rowNode,
          col_node: colNode,
          source_id: branch.id,
          source_name: branch.name,
          is_constant: constantSymbols.has(symbol)
        });
      });
    }

    function globallyConstantGSymbols(records) {
      const bySymbol = new Map();
      (records || []).forEach(record => {
        if (!record.symbol) return;
        const current = bySymbol.get(record.symbol);
        bySymbol.set(record.symbol, current === undefined ? Boolean(record.is_constant) : current && Boolean(record.is_constant));
      });
      return [...bySymbol.entries()]
        .filter(([, isConstant]) => isConstant)
        .map(([symbol]) => symbol)
        .sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
    }

    function parseSymbolDependencyOverrides() {
      const text = String(state.optimizedSymbolDependencyOverrides || "").trim();
      if (!text) return {};
      try {
        const parsed = JSON.parse(text);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
        return Object.fromEntries(Object.entries(parsed).map(([symbol, category]) => [symbol, String(category || "").trim().toUpperCase()]));
      } catch {
        return {};
      }
    }

    function buildSymbolDependencyTable(payload) {
      const table = {};
      const constantG = new Set(payload.G_constant_symbols || []);
      const addSymbols = (items, category, overwrite = false) => {
        (items || []).forEach(item => {
          extractExpressionSymbols(item).forEach(symbol => {
            if (overwrite || !table[symbol]) table[symbol] = category;
          });
        });
      };
      const gItems = (payload.G_full || []).flat();
      addSymbols(gItems, "CODE_VARIABLE", true);
      constantG.forEach(symbol => {
        if (symbol) table[symbol] = "RAM_CONSTANT";
      });
      addSymbols(payload.Ihis_full || [], "STEP_HISTORY", false);
      Object.entries(parseSymbolDependencyOverrides()).forEach(([symbol, category]) => {
        if (/^[A-Za-z_]\w*$/.test(symbol) && ["RAM_CONSTANT", "CODE_VARIABLE", "STEP_HISTORY", "UNKNOWN"].includes(category)) {
          table[symbol] = category;
        }
      });
      return Object.fromEntries(Object.entries(table).sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true })));
    }

    function buildTaggedSymbolDependencyTable(payload) {
      const table = { ...(payload.symbol_dependency_table || {}) };
      (payload.G_symbol_usage || []).forEach(record => {
        if (!record?.symbol || !record?.source_id) return;
        table[`${record.symbol}${sourceMarkerForBranch(record.source_id)}`] = record.is_constant ? "RAM_CONSTANT" : "CODE_VARIABLE";
      });
      (payload.Ihis_full_tagged || []).forEach(expr => {
        extractExpressionSymbols(expr).forEach(symbol => {
          if (!table[symbol]) table[symbol] = "STEP_HISTORY";
        });
      });
      Object.entries(parseSymbolDependencyOverrides()).forEach(([symbol, category]) => {
        if (!["RAM_CONSTANT", "CODE_VARIABLE", "STEP_HISTORY", "UNKNOWN"].includes(category)) return;
        Object.keys(table).forEach(key => {
          if (key === symbol || key.startsWith(`${symbol}__bbsrc_`)) table[key] = category;
        });
      });
      return Object.fromEntries(Object.entries(table).sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true })));
    }

    function addTerms(list, terms, fallbackSourceId = null) {
      (terms || []).forEach(term => {
        const sourceIds = termSourceIds(term);
        if (sourceIds.length) addTerm(list, termExpr(term), sourceIds);
        else addTerm(list, termExpr(term), fallbackSourceId);
      });
    }

    function cleanExpr(term) {
      return String(term || "").trim();
    }

    function termExpr(term) {
      return typeof term === "object" && term !== null ? cleanExpr(term.expr) : cleanExpr(term);
    }

    function termSourceIds(term) {
      if (typeof term !== "object" || term === null) return [];
      return Array.isArray(term.sourceIds) ? term.sourceIds.filter(Boolean) : [];
    }

    function wrapExpr(term) {
      return cleanExpr(term) || "0";
    }

    function negateExpr(term) {
      const cleaned = cleanExpr(term);
      if (!cleaned || cleaned === "0") return "0";
      if (cleaned.startsWith("-")) return cleaned.slice(1).trim();
      return `-(${cleaned})`;
    }

    function sumTerms(terms) {
      return sumTermItems(terms).map((item, index) => formatCombinedTerm(item.term, item.coeff, index)).join("") || "0";
    }

    function taggedSumTerms(terms) {
      const taggedItems = [];
      (terms || []).flatMap(expandAddSubTerms).forEach(({ coeff, term, sourceIds }) => {
        if (!term || term === "0" || coeff === 0) return;
        const taggedTerm = sourceIds.length ? tagExprForSource(term, sourceIds[0]) : term;
        taggedItems.push(formatCombinedTerm(taggedTerm, coeff, taggedItems.length));
      });
      return taggedItems.join("") || "0";
    }

    function tagExprForSource(expr, sourceId) {
      const tag = sourceMarkerForBranch(sourceId);
      let foundIdentifier = false;
      const ignored = new Set(["Abs", "sin", "cos", "tan", "exp", "log", "sqrt", "asin", "acos", "atan", "sinh", "cosh", "tanh"]);
      const tagged = String(expr || "0").replace(/\b[A-Za-z_]\w*\b/g, name => {
        if (ignored.has(name)) return name;
        foundIdentifier = true;
        return `${name}${tag}`;
      });
      return foundIdentifier ? tagged : `(${tag})*(${tagged})`;
    }

    function sumTermItems(terms) {
      const totals = new Map();
      terms.flatMap(expandAddSubTerms).forEach(({ coeff, term }) => {
        const key = normalizeLikeTerm(term);
        if (!key || key === "0" || coeff === 0) return;
        const existing = totals.get(key) || { coeff: 0, sourceIds: new Set() };
        existing.coeff += coeff;
        totals.set(key, existing);
        if (existing.coeff === 0) totals.delete(key);
      });
      terms.flatMap(expandAddSubTerms).forEach(({ coeff, term, sourceIds }) => {
        const key = normalizeLikeTerm(term);
        if (!key || key === "0" || coeff === 0 || !totals.has(key)) return;
        sourceIds.forEach(id => totals.get(key).sourceIds.add(id));
      });
      return Array.from(totals.entries()).map(([term, item]) => ({
        term,
        coeff: item.coeff,
        sourceIds: [...item.sourceIds]
      }));
    }

    function renderTermSum(terms) {
      const items = sumTermItems(terms);
      if (!items.length) return "0";
      return items.map((item, index) => {
        const parts = formatCombinedTermParts(item.term, item.coeff, index);
        const branch = activeSourceHighlightBranch(item.sourceIds);
        let bodyHtml = formatMathNoHighlight(parts.body);
        if (parts.prefix.trim() === "-" && isWrappedExpression(parts.body)) {
          const inner = parts.body.slice(1, -1).trim();
          if (hasTopLevelAddSub(inner)) bodyHtml = `(${formatMathNoHighlight(inner)})`;
        }
        return `${parts.prefix}${wrapMathSourceHighlight(branch, bodyHtml)}`;
      }).join("");
    }

    function expandAddSubTerms(term) {
      const cleaned = termExpr(term);
      if (!cleaned || cleaned === "0") return [];
      const sourceIds = termSourceIds(term);
      return splitAddSub(cleaned).map(part => {
        const normalized = normalizeLikeTerm(part.term);
        const factor = parseIntegerFactor(normalized);
        return {
          coeff: (part.sign === "-" ? -1 : 1) * factor.coeff,
          term: factor.term,
          sourceIds
        };
      });
    }

    function normalizeLikeTerm(term) {
      let result = cleanExpr(term);
      while (isWrappedExpression(result)) result = result.slice(1, -1).trim();
      return result;
    }

    function isWrappedExpression(expr) {
      if (!expr.startsWith("(") || !expr.endsWith(")")) return false;
      let depth = 0;
      for (let i = 0; i < expr.length; i += 1) {
        if (expr[i] === "(") depth += 1;
        if (expr[i] === ")") depth -= 1;
        if (depth === 0 && i < expr.length - 1) return false;
      }
      return depth === 0;
    }

    function parseIntegerFactor(term) {
      const match = String(term).match(/^([+-]?\d+)\s*\*\s*(.+)$/);
      if (!match) return { coeff: 1, term };
      return { coeff: Number(match[1]), term: normalizeLikeTerm(match[2]) };
    }

    function formatCombinedTerm(term, coeff, index) {
      const parts = formatCombinedTermParts(term, coeff, index);
      return `${parts.prefix}${parts.body}`;
    }

    function formatCombinedTermParts(term, coeff, index) {
      const abs = Math.abs(coeff);
      const normalizedTerm = normalizeLikeTerm(term);
      const groupedTerm = hasTopLevelAddSub(normalizedTerm) ? `(${normalizedTerm})` : normalizedTerm;
      const body = abs === 1 ? groupedTerm : `${abs}*${groupedTerm}`;
      if (index === 0) return { prefix: coeff < 0 ? "-" : "", body };
      return { prefix: coeff < 0 ? " - " : " + ", body };
    }

    function nodeEquationRhs(assembled, row) {
      const voltageTerms = assembled.nodes.map((node, col) => {
        const g = sumTerms(assembled.G[row][col]);
        if (g === "0") return "";
        return `(${g})*V_${nodeDisplayName(node)}`;
      }).filter(Boolean);
      const ihis = sumTerms(assembled.Ihis[row]);
      if (ihis !== "0") voltageTerms.push(ihis);
      return voltageTerms.length ? voltageTerms.join(" + ") : "0";
    }

    function updateBranchField(field, value) {
      const branch = findBranch(state.selectedId);
      if (!branch) return;
      commitHistory();
      invalidateMathCaches();
      if (field === "switchCount") {
        setSwitchCaseCount(branch, value);
        render();
        return;
      }
      if (field === "switchActive") {
        setActiveSwitchCase(branch, value);
        render();
        return;
      }
      if (field === "switchCaseName") {
        const activeCase = activeSwitchCase(branch);
        if (activeCase) activeCase.name = value.trim() || `Case ${(branch.activeSwitchCase || 0) + 1}`;
        render();
        return;
      }
      if (field === "runtimeMutableCaseGroup") {
        normalizeSwitchCases(branch);
        branch.runtimeMutableCaseGroup = Boolean(value) && Array.isArray(branch.switchCases) && branch.switchCases.length > 1;
        invalidateMathCaches();
        render();
        return;
      }
      if (field === "packageNetworkCaseName") {
        normalizePackageNetworkCases(branch);
        const pkg = branch.packageOriginal;
        const index = activePackageNetworkCaseIndex(branch);
        const name = String(value || "").trim() || `Case ${index + 1}`;
        if (pkg?.networkCases?.[index]) pkg.networkCases[index].name = name;
        if (branch.switchCases?.[index]) branch.switchCases[index].name = name;
        render();
        return;
      }
      if (field === "formulaHighlightEnabled") {
        branch.formulaHighlightEnabled = Boolean(value);
        if (!branch.formulaHighlightColor) branch.formulaHighlightColor = "#ef4444";
        render();
        return;
      }
      if (field === "formulaHighlightCanvas") {
        branch.formulaHighlightCanvas = Boolean(value);
        render();
        return;
      }
      if (field === "formulaHighlightColor") {
        branch.formulaHighlightColor = /^#[0-9A-Fa-f]{6}$/.test(String(value)) ? String(value) : "#ef4444";
        render();
        return;
      }
      if (field.startsWith("packedG.")) {
        const [, indexText, key] = field.split(".");
        const inner = branch.packageOriginal?.branches?.[Number(indexText)];
        if (inner) {
          if (isFixedDummyGElement(inner)) {
            inner.gIsConstant = true;
            inner.constantGSymbols = "G_EPSILON";
          }
          else if (key === "gIsConstant") inner.gIsConstant = value === true || value === "1" || value === "true";
          else if (key === "constantGSymbols") inner.constantGSymbols = String(value || "").trim();
        }
        renderAfterSidePanelEdit();
        return;
      }
      if (field === "gIsConstant") {
        const activeCase = activeSwitchCase(branch);
        if (activeCase) activeCase.gIsConstant = Boolean(value);
        else branch.gIsConstant = Boolean(value);
        renderAfterSidePanelEdit();
        return;
      }
      if (field === "constantGSymbols") {
        const activeCase = activeSwitchCase(branch);
        if (activeCase) activeCase.constantGSymbols = value.trim();
        else branch.constantGSymbols = value.trim();
        renderAfterSidePanelEdit();
        return;
      }
      if (field === "width" || field === "height") {
        const min = field === "width" ? 70 : 40;
        const max = field === "width" ? 420 : 360;
        const next = Math.max(min, Math.min(max, Number(value)));
        if (Number.isFinite(next)) branch[field] = next;
        clampComponent(branch);
        renderAfterSidePanelEdit();
        return;
      }
      if (branch.kind === "dummy_node_block") {
        if (field === "name") branch.name = value.trim();
        else if (field.startsWith("node.")) {
          const side = field.slice(5);
          const next = value.trim() || side;
          branch.nodes = { ...(branch.nodes || {}), [side]: next };
          const node = (branch.dummyNodes || []).find(item => item.id === side || item.side === side);
          if (node) {
            node.node_id = next;
            node.display_name = next;
            node.dummy_role = "isolated_dummy_internal";
          }
        }
        renderAfterSidePanelEdit();
        return;
      }
      if (branch.kind === "ground") {
        if (field === "name" || field === "nodeG") branch[field] = value.trim();
        renderAfterSidePanelEdit();
        return;
      }
      if (branch.kind === "current_source") {
        if (field === "sourceMode") {
          branch.sourceMode = value === "node_voltage" ? "node_voltage" : "independent";
          if (branch.sourceMode === "node_voltage" && currentSourceControlRows(branch).length === 0) {
            setCurrentSourceControlRowCount(branch, 2);
          }
        } else if (field === "controlRowCount") {
          setCurrentSourceControlRowCount(branch, value);
        } else if (field.startsWith("controlRow.")) {
          const [, indexText, key] = field.split(".");
          const index = Number(indexText);
          if (Number.isFinite(index) && ["node", "coefficient"].includes(key)) {
            const rows = currentSourceControlRows(branch);
            while (rows.length <= index) rows.push({ node: "", coefficient: rows.length === 0 ? "gm" : "0" });
            rows[index][key] = value.trim();
            branch.controlRows = rows;
            branch.controlTerms = "";
            branch.controlPositive = "";
            branch.controlNegative = "";
          }
        } else if (field === "name") {
          branch[field] = value.trim();
        } else if (field === "currentExpression" || field === "sourceIhis" || field === "controlTerms" || field === "gain" || field === "controlPositive" || field === "controlNegative" || field === "description" || field === "nodeA" || field === "nodeB") {
          branch[field] = value.trim();
        } else if (field === "direction") {
          branch.direction = value === "BtoA" ? "BtoA" : "AtoB";
        }
        render();
        return;
      }
      if (branch.kind === "voltage_source_series_r") {
        if (field.startsWith("node.")) branch.nodes[field.slice(5)] = value.trim();
        else if (field === "name" || field === "voltage" || field === "conductance") branch[field] = value.trim();
        renderAfterSidePanelEdit();
        return;
      }
      if (branch.kind === "single_phase_transformer") {
        if (field.startsWith("node.")) branch.nodes[field.slice(5)] = value.trim();
        else if (field === "ihisVector") {
          const oldIhisVector = branchValue(branch, "ihisVector");
          if (!setBranchSwitchedValue(branch, field, value.trim())) {
            branch.ihisVector = value.trim();
            syncTransformerCurrentHistoryTerms(branch, oldIhisVector);
          }
        }
        else if (field === "gMatrix") {
          if (!setBranchSwitchedValue(branch, field, value.trim())) branch[field] = value.trim();
        }
        else if (field === "name") branch[field] = value.trim();
        else if (field.startsWith("current.")) {
          const [, index, key] = field.split(".");
          const current = branch.currents[Number(index)];
          if (key === "direction") {
            const pair = Number(index) === 0 ? ["P", "N"] : ["S", "T"];
            if (value === `${pair[1]}to${pair[0]}`) {
              current.from = pair[1];
              current.to = pair[0];
            } else {
              current.from = pair[0];
              current.to = pair[1];
            }
          } else {
            current[key] = value.trim();
          }
        }
        renderAfterSidePanelEdit();
        return;
      }
      if (branch.kind === "custom_n_port") {
        if (field.startsWith("node.")) branch.nodes[field.slice(5)] = value.trim();
        else if (field === "gMatrix" || field === "ihisVector") {
          if (!setBranchSwitchedValue(branch, field, value.trim())) branch[field] = value.trim();
        }
        else if (field === "name") branch[field] = value.trim();
        else if (field === "portLayout") branch.portLayout = parsePortLayout(value, branch);
        else if (field === "observerCount") resizeCustomObservers(branch, value);
        else if (field.startsWith("current.")) {
          const [, index, key] = field.split(".");
          const current = branch.currents[Number(index)];
          if (key === "fromNode") current.from = customObserverNodeId(branch, value);
          else if (key === "toNode") current.to = customObserverNodeId(branch, value);
          else current[key] = value.trim();
        }
        renderAfterSidePanelEdit();
        return;
      }
      if (field === "g" || field === "ihis") {
        if (!setBranchSwitchedValue(branch, field, value.trim())) branch[field] = value.trim();
        renderAfterSidePanelEdit();
        return;
      }
      if (field === "externalA" || field === "externalB") {
        branch[field] = value;
      } else {
        branch[field] = value.trim();
      }
      renderAfterSidePanelEdit();
    }

    async function updatePackagedInnerCase(branch, innerIndex, caseIndex) {
      if (!branch?.packageOriginal?.branches?.[innerIndex]) return;
      const inner = branch.packageOriginal.branches[innerIndex];
      normalizeSwitchCases(inner);
      if (!inner.switchCases?.length) return;
      const nextIndex = Math.max(0, Math.min(inner.switchCases.length - 1, Number(caseIndex) || 0));
      if ((Number(inner.activeSwitchCase) || 0) === nextIndex) return;
      commitHistory();
      inner.activeSwitchCase = nextIndex;
      const caseName = inner.switchCases[nextIndex]?.name || `Case ${nextIndex + 1}`;
      statusEl.textContent = state.language === "en"
        ? `${branch.name}: ${inner.name || inner.id} switch -> ${caseName}`
        : `${branch.name}: ${inner.name || inner.id} 已切换到 ${caseName}`;
      try {
        await recomputePackagedBox(branch);
        render();
      } catch (error) {
        statusEl.textContent = optText(
          `打包黑盒重算失败：${error.message || String(error)}`,
          `Packed box recompute failed: ${error.message || String(error)}`
        );
        render();
      }
    }

    function packageCaseGroupSignature(groups = []) {
      return groups.map(group => String(group.display || group.id || "").trim());
    }

    function packageCasePortRows(groups = []) {
      return (groups || []).map((group, index) => {
        const name = String(group.display || group.id || "").trim() || `N${index + 1}`;
        const netId = String(group.globalNet || group.id || `N${index + 1}`).trim() || `N${index + 1}`;
        return `${netId}. ${name}`;
      });
    }

    function packageCasePortMismatchMessage(expectedGroups, actualGroups, message) {
      const expected = packageCasePortRows(expectedGroups || []);
      const current = packageCasePortRows(actualGroups || []);
      const same = expected.length === current.length && expected.every((row, index) => {
        const expectedName = packageCaseGroupSignature(expectedGroups || [])[index] || "";
        const currentName = packageCaseGroupSignature(actualGroups || [])[index] || "";
        return expectedName === currentName;
      });
      if (same) return "";
      return `${tr(message)}\nExpected: ${expected.join(", ") || "-"}\nCurrent: ${current.join(", ") || "-"}`;
    }

    function validatePackageCaseExternalSignature(branch, subsystem) {
      const expectedExternalPortRows = packageCasePortRows(branch.packageOriginal?.externalGroups || []);
      const currentExternalPortRows = packageCasePortRows(subsystem.externalGroups || []);
      const compare = (expectedGroups, actualGroups, message) => {
        const expected = packageCaseGroupSignature(expectedGroups);
        const actual = packageCaseGroupSignature(actualGroups);
        const same = expected.length === actual.length && expected.every((name, index) => name === actual[index]);
        return same ? "" : `${tr(message)}：${expected.join(", ") || "-"} != ${actual.join(", ") || "-"}`;
      };
      return packageCasePortMismatchMessage(branch.packageOriginal?.externalGroups || [], subsystem.externalGroups || [], "外部端口不一致，不能完成这个 Pack 工况")
        || (expectedExternalPortRows.length !== currentExternalPortRows.length ? `${tr("外部端口不一致，不能完成这个 Pack 工况")}\nExpected: ${expectedExternalPortRows.join(", ") || "-"}\nCurrent: ${currentExternalPortRows.join(", ") || "-"}` : "")
        || compare(branch.packageOriginal?.internalGroups || [], subsystem.internalGroups || [], "内部节点不一致，不能完成这个 Pack 工况");
    }

    function dummyBranchesForPackCase(branches = state.branches) {
      return (branches || []).filter(branch => branch.kind === "dummy_dimension_branch" || branch.element_type === "dummy_branch" || branch.dummy_role === true);
    }

    function validateDummyBranchesForPackCase(shell, subsystem) {
      const edit = state.packageCaseEdit || {};
      const pkg = shell?.packageOriginal || {};
      const caseName = pkg.networkCases?.[edit.caseIndex]?.name || `Case ${Number(edit.caseIndex || 0) + 1}`;
      const packName = shell?.name || shell?.id || "Pack";
      const errors = [];

      dummyBranchesForPackCase(subsystem.sourceBranches || state.branches).forEach(branch => {
        const dummySide = branch.dummyTerminalSide || "B";
        const anchorSide = branch.anchorTerminalSide || "A";
        const dummyKey = terminalKey(branch.id, dummySide);
        const anchorKey = terminalKey(branch.id, anchorSide);
        const dummyGroup = subsystem.groupByTerminal?.get(dummyKey);
        const anchorGroup = subsystem.groupByTerminal?.get(anchorKey);
        const dummyName = dummyGroup?.display || branchNodeForSide(branch, dummySide) || dummySide;
        const prefix = `${packName} / ${caseName} / ${branch.name || branch.id} / ${dummyName}`;

        if (!dummyGroup || !anchorGroup) {
          errors.push(`${prefix}: ${tr("Dummy 支路端点缺失。")}`);
          return;
        }
        if ((dummyGroup.members || []).length !== 1 || dummyGroup.members[0] !== dummyKey) {
          errors.push(`${prefix}: ${tr("Dummy 节点只能连接自己的 Dummy 支路，不能接线或并入其他节点。")}`);
        }
        if (internalGroupIds.has(anchorGroup.id)) {
          errors.push(`${prefix}: ${tr("Dummy anchor 必须连接公共 retained/reference 节点，不能连接内部消去节点。")}`);
        }
        if (String(branch.ihis || "0").trim() !== "0") {
          errors.push(`${prefix}: ${tr("Dummy Ihis 必须固定为 0。")}`);
        }
        if (String(branch.g || "G_EPSILON").trim() !== "G_EPSILON") {
          errors.push(`${prefix}: ${tr("Dummy G 必须固定为 G_EPSILON。")}`);
        }
        if (branch.recoverable !== false || branch.forced_final_elimination !== true) {
          errors.push(`${prefix}: ${tr("Dummy 必须标记为强制最终消去且不恢复电压。")}`);
        }
      });

      return errors;
    }

    function dummyNodeBlocksForPackCase(branches = state.branches) {
      return (branches || []).filter(branch => branch.kind === "dummy_node_block" || branch.element_type === "dummy_node_block" || branch.dummy_role === "isolated_dummy_internal");
    }

    function validateDummyNodeBlocksForPackCase(shell, subsystem) {
      const edit = state.packageCaseEdit || {};
      const pkg = shell?.packageOriginal || {};
      const caseName = pkg.networkCases?.[edit.caseIndex]?.name || `Case ${Number(edit.caseIndex || 0) + 1}`;
      const packName = shell?.name || shell?.id || "Pack";
      const errors = [];

      dummyNodeBlocksForPackCase(subsystem.sourceBranches || state.branches).forEach(branch => {
        terminalSides(branch).forEach(side => {
          const key = terminalKey(branch.id, side);
          const group = subsystem.groupByTerminal?.get(key);
          const nodeName = group?.display || branchNodeForSide(branch, side) || side;
          const prefix = `${packName} / ${caseName} / ${branch.name || branch.id} / ${nodeName}`;
          if (!group) {
            errors.push(`${prefix}: ${tr("N-Dummy 节点块端点缺失。")}`);
            return;
          }
          if ((group.members || []).length !== 1 || group.members[0] !== key) {
            errors.push(`${prefix}: ${tr("N-Dummy 节点必须保持孤立，不能接线或并入其他节点。")}`);
          }
        });
        if (branch.recoverable !== false || branch.forced_elimination !== true || branch.dummy_role !== "isolated_dummy_internal") {
          errors.push(`${packName} / ${caseName} / ${branch.name || branch.id}: ${tr("N-Dummy 节点会强制作为内部节点参与维度补齐。")}`);
        }
      });

      return errors;
    }

    function dummyNodeBlockPayloadForCase(sourceBranches, groups = []) {
      const groupByTerminal = new Map();
      (groups || []).forEach(group => (group.members || []).forEach(member => groupByTerminal.set(member, group)));
      return dummyNodeBlocksForPackCase(sourceBranches).map(branch => ({
        element_type: "dummy_node_block",
        block_id: branch.name || branch.id || "N-Dummy",
        source_branch_id: branch.id,
        dimension: terminalSides(branch).length,
        fixed_conductance: branch.fixedConductance || "G_EPSILON",
        forced_elimination: true,
        recoverable: false,
        dummy_nodes: terminalSides(branch).map(side => {
          const group = groupByTerminal.get(terminalKey(branch.id, side));
          return {
            side,
            node_id: group?.id || branchNodeForSide(branch, side) || side,
            display_name: group?.display || branchNodeForSide(branch, side) || side,
            dummy_role: "isolated_dummy_internal"
          };
        })
      }));
    }

    function buildDummyAdjustedPackReduction(shell, subsystem) {
      const dummyGroups = [];
      const dummyGroupIds = new Set();
      dummyBranchesForPackCase(subsystem.sourceBranches || state.branches).forEach(branch => {
        const dummySide = branch.dummyTerminalSide || "B";
        const dummyGroup = subsystem.groupByTerminal?.get(terminalKey(branch.id, dummySide));
        if (dummyGroup && !dummyGroupIds.has(dummyGroup.id)) {
          dummyGroupIds.add(dummyGroup.id);
          dummyGroups.push(dummyGroup);
        }
      });

      const physicalInternalGroups = subsystem.internalGroups || [];
      if (!dummyGroups.length) {
        return {
          hasDummy: false,
          reductionPayload: subsystem.payload,
          finalSubsystem: subsystem,
          physicalInternalCount: physicalInternalGroups.length,
          trimResult: result => result,
          superResult: null,
          trimmedResult: null
        };
      }

      const finalExternalGroups = (subsystem.externalGroups || []).filter(group => !dummyGroupIds.has(group.id));
      const finalSubsystem = {
        ...subsystem,
        externalGroups: finalExternalGroups
      };
      const reductionPayload = {
        ...subsystem.payload,
        external_nodes: finalExternalGroups.map(group => group.id),
        internal_nodes: [
          ...physicalInternalGroups.map(group => group.id),
          ...dummyGroups.map(group => group.id)
        ]
      };
      const physicalInternalCount = physicalInternalGroups.length;
      const trimResult = result => ({
        ...result,
        K_v: (result.K_v || []).slice(0, physicalInternalCount),
        K_h: (result.K_h || []).slice(0, physicalInternalCount),
        effective_internal_nodes: (result.effective_internal_nodes || []).slice(0, physicalInternalCount)
      });
      return {
        hasDummy: true,
        reductionPayload,
        finalSubsystem,
        physicalInternalCount,
        trimResult,
        superResult: null,
        trimmedResult: null
      };
    }

    function setActivePackageNetworkCase(branch, caseIndex) {
      if (!branch?.packageOriginal) return;
      normalizePackageNetworkCases(branch);
      const nextIndex = Math.max(0, Math.min(branch.packageOriginal.networkCases.length - 1, Number(caseIndex) || 0));
      if ((Number(branch.packageOriginal.activeNetworkCase) || 0) === nextIndex) return;
      commitHistory();
      applyPackageNetworkCase(branch, nextIndex);
      invalidateMathCaches();
      render();
    }

    function duplicateActivePackageNetworkCase(branch) {
      if (!branch?.packageOriginal) return;
      normalizePackageNetworkCases(branch);
      commitHistory();
      const pkg = branch.packageOriginal;
      const activeIndex = Number(pkg.activeNetworkCase) || 0;
      const copy = structuredClone(pkg.networkCases[activeIndex] || packageNetworkCaseFromBranch(branch, 0));
      copy.name = `Case ${pkg.networkCases.length + 1}`;
      pkg.networkCases.push(copy);
      applyPackageNetworkCase(branch, pkg.networkCases.length - 1);
      invalidateMathCaches();
      render();
    }

    function startPackageCaseEdit(branch, caseIndex = null) {
      if (!branch?.packageOriginal) return;
      normalizePackageNetworkCases(branch);
      const pkg = branch.packageOriginal;
      const index = Math.max(0, Math.min(pkg.networkCases.length - 1, Number(caseIndex ?? pkg.activeNetworkCase) || 0));
      const caseData = pkg.networkCases[index] || packageNetworkCaseFromBranch(branch, index);
      saveActiveCanvas();
      const returnData = currentCanvasData();
      state.packageCaseEdit = {
        outerCanvasId: state.activeCanvasId,
        returnActiveCanvasId: state.activeCanvasId,
        returnCanvases: structuredClone(state.canvases),
        packageBranchId: branch.id,
        caseIndex: index,
        packageShell: structuredClone(branch),
        returnData
      };
      state.branches = structuredClone(caseData.branches || []);
      state.wires = structuredClone(packageInternalWiresForBranches(state.branches, caseData.wires || []));
      state.groups = [];
      state.nodeLabels = {};
      state.nodeColors = {};
      state.internalNodes = [];
      state.nodeOrder = structuredClone(caseData.nodeOrder || []);
      state.selectedIds = state.branches.map(item => item.id);
      state.selectedId = state.selectedIds[0] || null;
      state.selectedNetIds = [];
      state.selectedWireId = null;
      syncNextCounters();
      applyNodeDisplayState(caseData.nodeState || []);
      remapNodeOrderAfterTopologyChange(state.nodeOrder, orderedNetGroups(), new Map());
      statusEl.textContent = tr("正在编辑 Pack 内部工况。完成前请保持外部端口数量、名字和顺序不变。");
      render();
    }

    function cancelPackageCaseEdit() {
      const edit = state.packageCaseEdit;
      if (!edit) return;
      restorePackageCaseEditOuterCanvas(edit);
      render();
    }

    function restorePackageCaseEditOuterCanvas(edit) {
      state.canvases = structuredClone(edit.returnCanvases || state.canvases);
      state.activeCanvasId = edit.returnActiveCanvasId || edit.outerCanvasId || state.activeCanvasId;
      const canvasState = currentCanvas();
      const returnData = structuredClone(canvasState?.data || edit.returnData || blankCanvasData());
      state.packageCaseEdit = null;
      applyCanvasData(returnData);
      state.packageCaseEdit = null;
    }

    function renderPackageCasePortReminder(shell) {
      const rows = packageCasePortRows(shell.packageOriginal?.externalGroups || []);
      if (!rows.length) return "";
      return `
        <div class="package-case-overlay-text">
          <strong>${escapeHtml(tr("Pack 外部节点必须保持"))}</strong>
          <div>${rows.map(row => escapeHtml(row)).join("<br>")}</div>
          <div>${escapeHtml(tr("完成保存前，外部节点数量、名字、顺序必须与上表一致。"))}</div>
        </div>
      `;
    }

    function packagedCaseGroupRows(groups, ports) {
      return (groups || []).map((group, index) => ({
        id: group.id,
        display: group.display,
        globalNet: group.globalNet,
        members: [...(group.members || [])],
        port: ports[index] || `P${index + 1}`,
        internal: Boolean(group.internal),
        boundary: Boolean(group.boundary)
      }));
    }

    function packagedCaseInternalRows(groups) {
      return (groups || []).map(group => ({
        id: group.id,
        display: group.display,
        globalNet: group.globalNet,
        members: [...(group.members || [])],
        isolatedDummyInternal: Boolean(group.isolatedDummyInternal)
      }));
    }

    function packagedCaseFromReduction(branch, subsystem, result, observerEntries, caseName, finalData = null) {
      const ports = branch.ports || [];
      const finalSubsystem = finalData?.subsystem || subsystem;
      const finalResult = finalData?.result || result;
      const superExternalGroups = packagedCaseGroupRows(subsystem.externalGroups, ports);
      const superInternalGroups = packagedCaseInternalRows(subsystem.internalGroups);
      const superGMatrix = matrixLiteral(result.G_red);
      const superIhisVector = vectorLiteral(result.Ihis_red);
      const finalExternalGroups = packagedCaseGroupRows(finalSubsystem.externalGroups, ports);
      const finalInternalGroups = packagedCaseInternalRows(finalSubsystem.internalGroups);
      const finalGMatrix = matrixLiteral(finalResult.G_red);
      const finalIhisVector = vectorLiteral(finalResult.Ihis_red);
      const dummyNodeBlocks = dummyNodeBlockPayloadForCase(subsystem.sourceBranches || [], subsystem.allGroups || []);
      const currents = (result.reduced_observers || []).map((item, index) => {
        const source = observerEntries[index] || {};
        return {
          name: observerNameFromLhs(source.lhs || item.lhs, index),
          from: ports[0],
          to: ports[Math.min(1, ports.length - 1)],
          fromLabel: source.fromLabel || ports[0],
          toLabel: source.toLabel || ports[Math.min(1, ports.length - 1)],
          fromEliminated: Boolean(source.fromEliminated),
          toEliminated: Boolean(source.toEliminated),
          expression: replaceExternalVoltages(item.rhs, subsystem.externalGroups, ports)
        };
      });
      return {
        name: caseName,
        branches: structuredClone(subsystem.sourceBranches || []),
        wires: structuredClone(packageInternalWiresForBranches(subsystem.sourceBranches || [], subsystem.sourceWires || [])),
        nodeState: structuredClone(captureNodeDisplayState()),
        nodeOrder: structuredClone(currentNodeOrder()),
        externalGroups: superExternalGroups,
        internalGroups: superInternalGroups,
        K_v: result.K_v,
        K_h: result.K_h,
        gMatrix: superGMatrix,
        ihisVector: superIhisVector,
        superExternalGroups,
        superInternalGroups,
        superK_v: result.K_v,
        superK_h: result.K_h,
        superGMatrix,
        superIhisVector,
        finalExternalGroups,
        finalInternalGroups,
        finalK_v: finalResult.K_v,
        finalK_h: finalResult.K_h,
        finalGMatrix,
        finalIhisVector,
        dummyNodeBlocks,
        currents,
        gIsConstant: branch.gIsConstant !== false,
        constantGSymbols: branch.constantGSymbols || ""
      };
    }

    async function finishPackageCaseEdit() {
      const edit = state.packageCaseEdit;
      if (!edit) return false;
      const sourceBranches = structuredClone(state.branches);
      const sourceWires = structuredClone(state.wires);
      const subsystem = buildSelectedSubsystem(state.branches);
      subsystem.sourceBranches = sourceBranches;
      subsystem.sourceWires = sourceWires;
      const shell = structuredClone(edit.packageShell);
      normalizePackageNetworkCases(shell);
      const mismatch = validatePackageCaseExternalSignature(shell, subsystem);
      if (mismatch) {
        alert(mismatch);
        return true;
      }
      const dummyErrors = validateDummyBranchesForPackCase(shell, subsystem);
      if (dummyErrors.length) {
        alert(dummyErrors.join("\n"));
        return true;
      }
      const dummyNodeBlockErrors = validateDummyNodeBlocksForPackCase(shell, subsystem);
      if (dummyNodeBlockErrors.length) {
        alert(dummyNodeBlockErrors.join("\n"));
        return true;
      }
      if (subsystem.warnings?.length) {
        alert(subsystem.warnings.map(item => tr(item)).join("\n"));
        return true;
      }
      const internalNames = new Set(subsystem.internalGroups.map(group => group.display));
      const observerEntries = sourceBranches.flatMap(branch => packagedObserverEntries({ packageOriginal: { branches: [branch] } }, subsystem.groupByTerminal, internalNames));
      const dummyAdjusted = buildDummyAdjustedPackReduction(shell, subsystem);
      const observerPayload = observerEntries.map(({ lhs, rhs }) => ({ lhs, rhs }));
      dummyAdjusted.superResult = await requestReduction({
        ...subsystem.payload,
        observers: observerPayload
      });
      if (dummyAdjusted.hasDummy) {
        const result = await requestReduction({
          ...dummyAdjusted.reductionPayload,
          observers: observerPayload
        });
        dummyAdjusted.trimmedResult = dummyAdjusted.trimResult(result);
      } else {
        dummyAdjusted.trimmedResult = dummyAdjusted.superResult;
      }
      const pkg = shell.packageOriginal;
      const index = Math.max(0, Math.min(pkg.networkCases.length - 1, Number(edit.caseIndex) || 0));
      const previousName = pkg.networkCases[index]?.name || `Case ${index + 1}`;
      pkg.networkCases[index] = packagedCaseFromReduction(
        shell,
        subsystem,
        dummyAdjusted.superResult,
        observerEntries,
        previousName,
        dummyAdjusted.hasDummy ? { subsystem: dummyAdjusted.finalSubsystem, result: dummyAdjusted.trimmedResult } : null
      );
      applyPackageNetworkCase(shell, index);
      restorePackageCaseEditOuterCanvas(edit);
      const target = state.branches.find(item => item.id === edit.packageBranchId);
      if (target) Object.assign(target, shell);
      selectBranch(edit.packageBranchId);
      saveActiveCanvas();
      invalidateMathCaches();
      render();
      return true;
    }

    function renderPackageCaseEditOverlay() {
      if (!packageCaseEditOverlay) return;
      const edit = state.packageCaseEdit;
      packageCaseEditOverlay.classList.toggle("open", Boolean(edit));
      if (!edit) {
        packageCaseEditOverlay.innerHTML = "";
        return;
      }
      const shell = edit.packageShell || {};
      const cases = shell.packageOriginal?.networkCases || [];
      const caseName = cases[edit.caseIndex]?.name || `Case ${Number(edit.caseIndex || 0) + 1}`;
      packageCaseEditOverlay.innerHTML = `
        <div class="package-case-overlay-title">${escapeHtml(tr("Pack 工况编辑"))}: ${escapeHtml(shell.name || shell.id || "")} / ${escapeHtml(caseName)}</div>
        <div class="package-case-overlay-text">${escapeHtml(tr("正在编辑 Pack 内部工况。完成前请保持外部端口数量、名字和顺序不变。"))}</div>
        ${renderPackageCasePortReminder(shell)}
        <div class="package-case-overlay-actions">
          <button class="text-button" type="button" data-package-case-overlay-action="dummy">${escapeHtml(tr("新增 Dummy 支路"))}</button>
          <button class="text-button" type="button" data-package-case-overlay-action="dummyNodeBlock">${escapeHtml(tr("新增 N-Dummy 节点块"))}</button>
          <button class="text-button primary" type="button" data-package-case-overlay-action="finish">${escapeHtml(tr("完成并保存 Pack 工况"))}</button>
          <button class="text-button" type="button" data-package-case-overlay-action="cancel">${escapeHtml(tr("取消 Pack 工况编辑"))}</button>
        </div>
      `;
      packageCaseEditOverlay.querySelectorAll("[data-package-case-overlay-action]").forEach(button => {
        const run = () => {
          if (button.dataset.packageCaseOverlayAction === "dummy") {
            createDummyDimensionBranch();
          } else if (button.dataset.packageCaseOverlayAction === "dummyNodeBlock") {
            createDummyNodeBlock();
          } else if (button.dataset.packageCaseOverlayAction === "finish") {
            finishPackageCaseEdit().catch(error => {
              alert(optText(
                `Pack 工况保存失败：${error.message || String(error)}`,
                `Pack case save failed: ${error.message || String(error)}`
              ));
            });
          } else {
            cancelPackageCaseEdit();
          }
        };
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();
          button.dataset.pointerHandled = "1";
          run();
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          if (button.dataset.pointerHandled === "1") {
            delete button.dataset.pointerHandled;
            return;
          }
          run();
        });
      });
    }

    function defaultCustomObserver(branch, index) {
      const ports = terminalSides(branch);
      return {
        name: `obs${index + 1}`,
        from: ports[0] || "P1",
        to: ports[Math.min(1, ports.length - 1)] || ports[0] || "P1",
        g: "0",
        ihis: "0",
        description: "",
        expression: "0"
      };
    }

    function resizeCustomObservers(branch, value) {
      const count = Math.max(0, Math.min(48, Math.floor(Number(value))));
      if (!Number.isFinite(count)) return;
      const next = (branch.currents || []).slice(0, count);
      while (next.length < count) next.push(defaultCustomObserver(branch, next.length));
      branch.currents = next;
    }

    function syncTransformerCurrentHistoryTerms(branch, oldIhisVector) {
      const sides = terminalSides(branch);
      const oldTerms = parseVectorLiteral(oldIhisVector || "", sides.length);
      const nextTerms = parseVectorLiteral(branch.ihisVector || "", sides.length);
      branch.currents.forEach(current => {
        const sideIndex = sides.indexOf(current.from);
        if (sideIndex < 0) return;
        const oldTerm = wrapExpr(oldTerms[sideIndex] || "0");
        const nextTerm = wrapExpr(nextTerms[sideIndex] || "0");
        if (oldTerm === nextTerm) return;
        current.expression = replaceCurrentHistoryTerm(current.expression, oldTerm, nextTerm);
      });
    }

    function replaceCurrentHistoryTerm(expression, oldTerm, nextTerm) {
      let result = String(expression || "");
      if (oldTerm && oldTerm !== "0") {
        const pattern = new RegExp(`(^|[^A-Za-z0-9_])${escapeRegExp(oldTerm)}(?=$|[^A-Za-z0-9_])`, "g");
        const replaced = result.replace(pattern, (_, prefix) => `${prefix}${nextTerm}`);
        if (replaced !== result) return replaced;
      }
      if (!nextTerm || nextTerm === "0") return result;
      return `${result} + ${nextTerm}`;
    }

    function renderAfterSidePanelEdit() {
      renderWires();
      renderBranches();
      renderNetList();
      renderOutput();
      document.getElementById("flipTool").disabled = !state.selectedId || !["two_node_branch", "current_source"].includes(findBranch(state.selectedId)?.kind);
      document.getElementById("rotateTool").disabled = !state.selectedId;
      document.getElementById("deleteTool").disabled = state.selectedIds.length === 0 && !state.selectedWireId;
      document.getElementById("copyTool").disabled = selectedBranchSet().size === 0;
      document.getElementById("pasteTool").disabled = !state.clipboard?.branches?.length;
      document.getElementById("groupTool").disabled = state.selectedIds.length < 2;
