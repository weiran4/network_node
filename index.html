    function renderOptimizedWarningBox(result = null, payload = null) {
      const warnings = state.language === "en"
        ? [
            "This tab assumes the eliminated block is symmetric positive definite, or at least suitable for symmetric Schur-style reduction. Treat results with controlled current sources or asymmetric black-box stamps as reference.",
            "Structured formulas are shown as matrices, vectors, and block matrices by default. Large scalar expressions are not expanded."
          ]
        : [
            "该优化消元页面假设待消元矩阵为对称正定，或至少适合对称舒尔消元；如果包含受控电流源、非对称黑盒等非对称元件贡献，请只作为参考。",
            "结构化公式默认显示矩阵、向量和块矩阵形式，不默认展开巨大的标量表达式。"
          ];
      const dummyNodes = optimizedDummyPrunedNodes(result, payload);
      if (dummyNodes.length) {
        const nodes = displayNodeList(dummyNodes, payload?.node_display_names || {}) || "-";
        warnings.push(optText(
          `N-Dummy 孤立节点已验证，并在 Schur 消元 / C 导出前裁掉：${nodes}。这些节点不会进入求解矩阵，也不会恢复电压。`,
          `N-Dummy isolated nodes were validated and pruned before Schur reduction / C export: ${nodes}. These nodes are not solver nodes and their voltages are not recovered.`
        ));
      }
      if (result?.warnings?.length) warnings.push(...result.warnings.map(localizedBackendWarning));
      return `
        <div class="formula-card validation-warning">
          <div class="formula-name">${optText("提示", "Warning")}</div>
          <div class="formula-empty">${warnings.map(escapeHtml).join("<br>")}</div>
        </div>
      `;
    }

    function localizedBackendWarning(message) {
      const text = String(message || "");
      if (text === "Info: active DummyBranch case is finalized before optimized C stamping; dummy leaf nodes are not solver nodes.") {
        return optText(
          "提示：当前 DummyBranch 工况会在优化 C stamp 前完成最终维度裁剪；dummy leaf 节点不会进入求解器节点。",
          "Info: active DummyBranch case is finalized before optimized C stamping; dummy leaf nodes are not solver nodes."
        );
      }
      if (text === "Info: DummyBranch profiles use case-specific final solver dimensions after the shared super reduction.") {
        return optText(
          "提示：DummyBranch profiles 会在共享 super reduction 后使用各自的最终求解器维度。",
          "Info: DummyBranch profiles use case-specific final solver dimensions after the shared super reduction."
        );
      }
      return text;
    }

    function displayNodeList(nodes, displayNames = {}) {
      return (nodes || []).map(node => displayNames[node] || nodeDisplayName(node)).join(", ");
    }

    function optimizedDummyPrunedNodeInfo(result = null, payload = null) {
      const displayNames = payload?.node_display_names || {};
      const displayToNode = new Map(
        Object.entries(displayNames).map(([node, name]) => [String(name), String(node)])
      );
      const aliases = new Set();
      const pushAlias = value => {
        if (value === undefined || value === null || value === "") return;
        aliases.add(String(value));
      };
      const pushNode = (nodes, seen, value) => {
        if (value === undefined || value === null || value === "") return;
        const raw = String(value);
        const node = displayToNode.get(raw) || raw;
        pushAlias(raw);
        pushAlias(node);
        pushAlias(displayNames[node]);
        if (seen.has(node)) return;
        seen.add(node);
        nodes.push(node);
      };
      const nodes = [];
      const seen = new Set();
      const dummyBlocks = result?.structured?.dummy_node_blocks || {};
      if (dummyBlocks.dropped_before_schur) {
        (dummyBlocks.nodes || []).forEach(node => pushNode(nodes, seen, node));
      }
      (dummyBlocks.common_internal_nodes || []).forEach(node => pushNode(nodes, seen, node));
      const structured = result?.structured || {};
      (structured.analysis?.dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
      (structured.details?.dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
      (structured.finalization_profiles || []).forEach(profile => {
        (profile?.dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
        (profile?.isolated_dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
      });
      const multi = result?.multi_case || {};
      (multi.dummy_node_blocks?.common_internal_nodes || []).forEach(node => pushNode(nodes, seen, node));
      (multi.finalization_profiles || []).forEach(profile => {
        (profile?.dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
        (profile?.isolated_dummy_nodes || []).forEach(node => pushNode(nodes, seen, node));
      });
      (multi.diagnostics?.mixed_physical_dummy_internal || []).forEach(node => pushNode(nodes, seen, node));
      const payloadBlocks = Array.isArray(payload?.dummy_node_blocks) ? payload.dummy_node_blocks : [];
      payloadBlocks.forEach(block => {
        (block?.dummy_nodes || []).forEach(node => {
          if (node && typeof node === "object") {
            pushNode(nodes, seen, node.node_id || node.display_name);
            pushAlias(node.display_name);
            pushAlias(node.node_id);
          } else {
            pushNode(nodes, seen, node);
          }
        });
      });
      return { nodes, matchSet: aliases };
    }

    function optimizedDummyPrunedNodes(result = null, payload = null) {
      return optimizedDummyPrunedNodeInfo(result, payload).nodes;
    }

    function renderDummyPrunedNotice(result = null, displayNames = {}, payload = null) {
      const nodes = optimizedDummyPrunedNodes(result, payload);
      if (!nodes.length) return "";
      const names = displayNodeList(nodes, displayNames) || "-";
      return `
        <div class="actual-block-dummy-pruned-notice">
          ${escapeHtml(optText(
            `这些 N-Dummy 行/列只用于验证原始矩阵，Schur 消元 / C 导出前会被裁掉：${names}`,
            `These N-Dummy rows/columns are shown for source-matrix validation and are pruned before Schur reduction / C export: ${names}`
          ))}
        </div>
      `;
    }

    function renderOptimizedPartition(payload, result = null) {
      const displayNames = payload.node_display_names || {};
      const external = result?.external_nodes || payload.external_nodes || [];
      const internal = result?.internal_nodes || payload.internal_nodes || [];
      const structuredOrder = result?.effective_internal_nodes || internal;
      return `
        <div class="formula-card">
          <div class="formula-name">Node partition</div>
          <div class="formula-line"><span class="formula-rhs">External: ${escapeHtml(displayNodeList(external, displayNames))}</span></div>
          <div class="formula-line"><span class="formula-rhs">Internal: ${escapeHtml(displayNodeList(internal, displayNames))}</span></div>
          <div class="formula-line"><span class="formula-rhs">Structured k order: ${escapeHtml(displayNodeList(structuredOrder, displayNames))}</span></div>
        </div>
      `;
    }

    function compactBlockEntries(nodes) {
      if (nodes.length <= 3) {
        return nodes.map(node => ({ type: "node", node }));
      }
      return [
        { type: "node", node: nodes[0] },
        { type: "ellipsis" },
        { type: "node", node: nodes[nodes.length - 1] }
      ];
    }

    function blockEntryLabel(entry, displayNames = {}) {
      if (entry.type === "ellipsis") return "…";
      return displayNames[entry.node] || nodeDisplayName(entry.node);
    }

    function blockMatrixCellValue(payload, rowEntry, colEntry, nodeIndex) {
      if (rowEntry.type === "ellipsis" && colEntry.type === "ellipsis") return "⋱";
      if (rowEntry.type === "ellipsis") return "⋮";
      if (colEntry.type === "ellipsis") return "⋯";
      const row = nodeIndex.get(rowEntry.node);
      const col = nodeIndex.get(colEntry.node);
      return payload.G_full?.[row]?.[col] ?? "0";
    }

    function blockMatrixCellTaggedValue(payload, rowEntry, colEntry, nodeIndex) {
      if (rowEntry.type === "ellipsis" || colEntry.type === "ellipsis") return null;
      const row = nodeIndex.get(rowEntry.node);
      const col = nodeIndex.get(colEntry.node);
      return payload.G_full_tagged?.[row]?.[col] ?? null;
    }

    function renderFormulaModeActualBlock(payload, result = null) {
      const displayNames = payload.node_display_names || {};
      const external = payload.external_nodes || [];
      const internal = payload.internal_nodes || [];
      if (!internal.length) return "";
      const dummyPrunedInfo = optimizedDummyPrunedNodeInfo(result, payload);
      const dummyPrunedSet = dummyPrunedInfo.matchSet;
      const orderTitle = optText("当前 G 矩阵节点顺序", "Current G Matrix Node Order");
      const orderNodeStack = nodes => (nodes || []).length
        ? nodes.map(node => `<span class="actual-block-order-node">${escapeHtml(displayNames[node] || nodeDisplayName(node))}</span>`).join("")
        : `<span class="actual-block-order-node">-</span>`;
      const rOrder = orderNodeStack(external);
      const kOrder = orderNodeStack(internal);
      const externalEntries = compactBlockEntries(external).map(entry => ({ ...entry, role: "external" }));
      const internalEntries = compactBlockEntries(internal).map(entry => ({ ...entry, role: "internal" }));
      const rowEntries = [...externalEntries, ...internalEntries];
      const colEntries = [...externalEntries, ...internalEntries];
      const nodeIndex = new Map((payload.all_nodes || []).map((node, index) => [node, index]));
      const gridColumns = `repeat(${colEntries.length}, minmax(180px, max-content))`;
      const gridRows = `repeat(${rowEntries.length}, minmax(42px, auto))`;
      const externalColSpan = Math.max(1, externalEntries.length);
      const internalColStart = externalEntries.length + 1;
      const internalColSpan = Math.max(1, internalEntries.length);
      const externalRowSpan = Math.max(1, externalEntries.length);
      const internalRowStart = externalEntries.length + 1;
      const internalRowSpan = Math.max(1, internalEntries.length);
      const cells = rowEntries.flatMap((rowEntry, rowIndex) => colEntries.map((colEntry, colIndex) => {
        const isInternalBoundaryRow = rowIndex === externalEntries.length;
        const isInternalBoundaryCol = colIndex === externalEntries.length;
        const value = blockMatrixCellValue(payload, rowEntry, colEntry, nodeIndex);
        const taggedValue = blockMatrixCellTaggedValue(payload, rowEntry, colEntry, nodeIndex);
        const classes = [
          "actual-block-cell",
          isInternalBoundaryCol ? "split-left" : "",
          isInternalBoundaryRow ? "split-top" : "",
          (dummyPrunedSet.has(String(rowEntry.node)) || dummyPrunedSet.has(String(colEntry.node))) ? "dummy-pruned-cell" : "",
          rowEntry.type === "ellipsis" || colEntry.type === "ellipsis" ? "block-ellipsis" : ""
        ].filter(Boolean).join(" ");
        return `<span class="${classes}" title="${escapeHtml(blockEntryLabel(rowEntry, displayNames))}, ${escapeHtml(blockEntryLabel(colEntry, displayNames))}">${formatMathWithTagged(value, taggedValue)}</span>`;
      })).join("");

      return `
        <div class="actual-block-preview" aria-label="${escapeHtml(optText("G 矩阵分块预览", "G matrix block preview"))}">
          ${renderDummyPrunedNotice(result, displayNames, payload)}
          <div class="actual-block-column-labels" style="grid-template-columns: ${gridColumns};">
            <span class="actual-block-label" style="grid-column: 1 / span ${externalColSpan};">Grr</span>
            <span class="actual-block-label" style="grid-column: ${internalColStart} / span ${internalColSpan};">Grk</span>
          </div>
          <div></div>
          <div class="actual-block-matrix-row">
            <div class="actual-block-matrix" style="grid-template-columns: ${gridColumns}; grid-template-rows: ${gridRows};">
              ${cells}
            </div>
            <div class="actual-block-side-labels" style="grid-template-rows: ${gridRows};">
              <div class="actual-block-side-label" style="grid-row: 1 / span ${externalRowSpan};">Grr / Grk</div>
              <div class="actual-block-side-label" style="grid-row: ${internalRowStart} / span ${internalRowSpan};">Gkr / Gkk</div>
            </div>
            <div class="actual-block-order-panel" style="grid-template-rows: auto ${gridRows};">
              <div class="actual-block-order-title" style="grid-row: 1;">${escapeHtml(orderTitle)}</div>
              <div class="actual-block-order-line" style="grid-row: 2 / span ${externalRowSpan};">
                <span class="actual-block-order-label">r</span>
                <span class="actual-block-order-value">${rOrder}</span>
              </div>
              <div class="actual-block-order-line" style="grid-row: ${externalRowSpan + 2} / span ${internalRowSpan};">
                <span class="actual-block-order-label">k</span>
                <span class="actual-block-order-value">${kOrder}</span>
              </div>
            </div>
          </div>
          <div></div>
          <div class="actual-block-bottom-labels" style="grid-template-columns: ${gridColumns};">
            <span class="actual-block-label" style="grid-column: 1 / span ${externalColSpan};">Gkr</span>
            <span class="actual-block-label" style="grid-column: ${internalColStart} / span ${internalColSpan};">Gkk</span>
          </div>
          <div></div>
          <div class="actual-block-caption">${optText("真实 G 矩阵按 r/k 整体分成四块；r 是保留节点，k 是所有内部节点组成的块。任一方向超过 3 个节点时用省略号压缩。", "The real G matrix is split into r/k blocks. r contains retained nodes; k contains all internal nodes. More than 3 nodes in one direction are compressed with ellipses.")}</div>
        </div>
      `;
    }

    function renderStructuredFormulaSummary(result = null) {
      const direct = result?.structured?.direct_retained || {};
      const hasDirectG = hasNonZeroMatrixValue(direct.Gred_direct);
      const hasDirectGRam = hasNonZeroMatrixValue(direct.Gred_direct_ram);
      const hasDirectGCode = hasNonZeroMatrixValue(direct.Gred_direct_code);
      const hasDirectIhis = hasNonZeroVectorValue(direct.Ihisred_direct);
      const hasDirectIhisRam = hasNonZeroVectorValue(direct.Ihisred_direct_ram);
      const hasDirectIhisCode = hasNonZeroVectorValue(direct.Ihisred_direct_code);
      const directBlock = (hasDirectG || hasDirectIhis) ? `
        <div class="formula-line"><span class="formula-lhs">${formatMath("Gred_final")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("Gred_schur + Gred_direct")}</span></div>
        <div class="formula-line"><span class="formula-lhs">${formatMath("Ihisred_final")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("Ihisred_schur + Ihisred_direct")}</span></div>
        ${hasDirectG ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Gred_direct")}</span><span class="formula-eq">=</span>${renderMatrix(direct.Gred_direct, null, direct.Gred_direct_tagged)}</div>` : ""}
        ${hasDirectGRam ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Gred_direct_RAM")}</span><span class="formula-eq">=</span>${renderMatrix(direct.Gred_direct_ram, null, direct.Gred_direct_ram_tagged)}</div>` : ""}
        ${hasDirectGCode ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Gred_direct_CODE")}</span><span class="formula-eq">=</span>${renderMatrix(direct.Gred_direct_code, null, direct.Gred_direct_code_tagged)}</div>` : ""}
        ${hasDirectIhis ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Ihisred_direct")}</span><span class="formula-eq">=</span>${renderMatrix((direct.Ihisred_direct || []).map(value => [value]), null, (direct.Ihisred_direct_tagged || []).map(value => [value]))}</div>` : ""}
        ${hasDirectIhisRam ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Ihisred_direct_RAM")}</span><span class="formula-eq">=</span>${renderMatrix((direct.Ihisred_direct_ram || []).map(value => [value]), null, (direct.Ihisred_direct_ram_tagged || []).map(value => [value]))}</div>` : ""}
        ${hasDirectIhisCode ? `<div class="matrix-equation"><span class="formula-lhs">${formatMath("Ihisred_direct_CODE")}</span><span class="formula-eq">=</span>${renderMatrix((direct.Ihisred_direct_code || []).map(value => [value]), null, (direct.Ihisred_direct_code_tagged || []).map(value => [value]))}</div>` : ""}
      ` : "";
      if (result?.structured?.block_type === "no_elimination") {
        return `
          <div class="formula-card">
            <div class="formula-name">${optText("最终紧凑公式", "Final Compact Formulas")}</div>
            <div class="formula-line"><span class="formula-lhs">${formatMath("G_red")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("G")}</span></div>
            <div class="formula-line"><span class="formula-lhs">${formatMath("Ihis_red")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("Ihis")}</span></div>
            ${directBlock}
          </div>
        `;
      }
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("最终紧凑公式", "Final Compact Formulas")}</div>
          <div class="formula-line"><span class="formula-lhs">${formatMath("G_red")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("G_rr - G_rk*W*G_kr")}</span></div>
          <div class="formula-line"><span class="formula-lhs">${formatMath("Ihis_red")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("Ihis_r - G_rk*W*Ihis_k")}</span></div>
          ${directBlock}
          <div class="formula-line"><span class="formula-lhs">${formatMath("V_k")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("-W*G_kr*V_r - W*Ihis_k")}</span></div>
        </div>
      `;
    }

    function renderStructuredAnalysis(result, payload = {}) {
      const structured = result.structured || {};
      const analysis = structured.analysis || {};
      const effective = structured.effective_analysis || analysis;
      const suggested = analysis.suggested_order || [];
      const user = result.internal_nodes || [];
      const displayNames = payload.node_display_names || {};
      const differs = JSON.stringify(suggested) !== JSON.stringify(user);
      const autoOrderNote = differs
        ? `<div class="actual-block-caption">${optText("已自动按结构建议顺序重排 k 节点。", "The k nodes have been automatically reordered using the suggested structured order.")}</div>`
        : "";
      return `
        <div>
          <div class="formula-name">${optText("分块分析", "Block Analysis")}</div>
          <table class="analysis-table">
            <tbody>
              <tr><th>${optText("块类型", "Block type")}</th><td>${escapeHtml(optimizedBlockTypeLabel(effective.block_type || structured.block_type))}</td></tr>
              <tr><th>${optText("用户顺序", "User order")}</th><td>${escapeHtml(displayNodeList(result.internal_nodes || [], displayNames))}</td></tr>
              <tr><th>${optText("建议顺序", "Suggested order")}</th><td>${escapeHtml(displayNodeList(suggested, displayNames))}</td></tr>
              <tr><th>${optText("对角节点", "Diagonal nodes")}</th><td>${escapeHtml(displayNodeList(effective.diagonal_nodes || [], displayNames) || "-")}</td></tr>
              <tr><th>${optText("耦合节点", "Coupled nodes")}</th><td>${escapeHtml(displayNodeList(effective.coupled_nodes || [], displayNames) || "-")}</td></tr>
              <tr><th>${optText("对称", "Symmetric")}</th><td>${escapeHtml(optimizedBooleanLabel(Boolean(effective.is_symmetric)))}</td></tr>
            </tbody>
          </table>
          ${autoOrderNote}
        </div>
      `;
    }

    function renderIhisPartition(result) {
      const blocks = result.structured?.blocks || {};
      const rRows = blocks.Ihis_r || [];
      const kRows = blocks.Ihis_i || [];
      const values = [...rRows, ...kRows];
      const rCount = rRows.length;
      const kCount = kRows.length;
      const cells = values.map((value, index) => {
        const isKStart = index === rCount && rCount > 0;
        return `<span class="ihis-block-cell ${isKStart ? "split-top" : ""}">${formatMath(value || "0")}</span>`;
      }).join("");
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("Ihis 分块预览", "Ihis Block Preview")}</div>
          <div class="ihis-block-preview">
            <span class="formula-lhs">${formatMath("Ihis")}</span>
            <span class="formula-eq">=</span>
            <div class="ihis-block-vector" style="grid-template-rows: repeat(${Math.max(1, values.length)}, minmax(34px, auto));">
              ${cells || `<span class="ihis-block-cell">0</span>`}
            </div>
            <div class="ihis-block-labels" style="grid-template-rows: repeat(${Math.max(1, values.length)}, minmax(34px, auto));">
              <div class="ihis-block-label" style="grid-row: 1 / span ${Math.max(1, rCount)};">Ihis<sub>r</sub></div>
              <div class="ihis-block-label" style="grid-row: ${rCount + 1} / span ${Math.max(1, kCount)};">Ihis<sub>k</sub></div>
            </div>
          </div>
          <div class="actual-block-caption">${optText("右端向量按保留节点 r 和待消去节点 k 分块。", "The right-hand vector is split into retained nodes r and eliminated nodes k.")}</div>
        </div>
      `;
    }

    function renderStructuredBlocks(result, payload) {
      const blocks = result.structured?.blocks || {};
      if (result.structured?.block_type === "no_elimination") {
        const displayNames = payload.node_display_names || {};
        const externalNames = (payload.external_nodes || []).map(node => displayNames[node] || nodeDisplayName(node));
        const dummyPrunedSet = optimizedDummyPrunedNodeInfo(result, payload).matchSet;
        const nodeOrder = payload.all_nodes || payload.external_nodes || [];
        const dummyPrunedIndexes = new Set(
          nodeOrder
            .map((node, index) => dummyPrunedSet.has(String(node)) ? index : -1)
            .filter(index => index >= 0)
        );
        const dummyCellClass = (row, col) => (
          dummyPrunedIndexes.has(row) || dummyPrunedIndexes.has(col)
        ) ? "dummy-pruned-cell" : "";
        return `
          <div class="formula-card">
            <div class="formula-name">${optText("原始 G/Ihis 预览", "Original G/Ihis Preview")}</div>
            <div class="formula-empty">${optText("当前没有内部节点，C 导出直接使用原始节点顺序生成导纳写入和注入。", "No internal nodes are selected, so C export uses the original retained-node order for stamping and injection.")}</div>
            ${renderDummyPrunedNotice(result, displayNames, payload)}
            <div class="formula-line"><span class="formula-lhs">${optText("节点顺序", "Node order")}</span><span class="formula-eq">=</span><span class="formula-rhs">${escapeHtml(externalNames.join(", ") || "-")}</span></div>
            <div class="matrix-equation">
              <span class="formula-lhs">${formatMath("G")}</span><span class="formula-eq">=</span>${renderMatrix(payload.G_full || [], null, null, dummyCellClass)}
              <span class="formula-lhs">${formatMath("Ihis")}</span><span class="formula-eq">=</span>${renderVectorMatrix(payload.Ihis_full || [])}
            </div>
          </div>
        `;
      }
      const dummyPrunedSet = optimizedDummyPrunedNodeInfo(result, payload).matchSet;
      const userOrder = result.internal_nodes || payload.internal_nodes || [];
      const effectiveOrder = result.effective_internal_nodes || userOrder;
      const sourceInternalOrder = payload.internal_nodes || [];
      const previewInternalOrder = sourceInternalOrder.some(node => dummyPrunedSet.has(String(node)))
        ? sourceInternalOrder
        : effectiveOrder;
      const blockPayload = { ...payload, internal_nodes: previewInternalOrder };
      const isReordered = JSON.stringify(userOrder) !== JSON.stringify(effectiveOrder);
      const orderNotice = isReordered
        ? `<div class="formula-empty">${optText("提示：优化消元会自动按结构重排内部 k 节点；下方 G 矩阵和 C 草稿使用右侧显示的重排顺序。", "Note: optimized elimination automatically reorders internal k nodes by structure; the G matrix below and the C draft use the reordered sequence shown on the right.")}</div>`
        : `<div class="formula-empty">${optText("提示：优化消元会自动检查并按结构重排内部 k 节点；当前顺序已适合，右侧显示的是实际使用顺序。", "Note: optimized elimination automatically checks and reorders internal k nodes by structure; the current order is already suitable, and the right side shows the sequence actually used.")}</div>`;
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("G 分块预览", "G Block Preview")}</div>
          ${orderNotice}
          ${renderFormulaModeActualBlock(blockPayload, result)}
        </div>
        ${renderIhisPartition(result)}
        <div class="formula-card">
          <div class="gkk-analysis-layout">
          <div>
            <div class="formula-name">${optText("Gkk 紧凑矩阵", "Gkk Compact Matrix")}</div>
            <div class="matrix-equation"><span class="formula-lhs">${formatMath("G_kk")}</span><span class="formula-eq">=</span>${renderCompactMatrix(blocks.G_ii || [], "Gkk")}</div>
            <div class="actual-block-caption">${optText("复杂元素默认用 Gkk[row][col] 代替；单个符号会直接保留，例如 AP。", "Complex entries are shown as Gkk[row][col]; simple symbols such as AP are kept.")}</div>
          </div>
          ${renderStructuredAnalysis(result, payload)}
          </div>
        </div>
      `;
    }

    function renderPureDiagonalStructured(result) {
      const details = result.structured?.details || {};
      const size = (details.W || []).length;
      const wRows = Array.from({ length: size }, (_, row) =>
        Array.from({ length: size }, (_, col) => row === col ? `1/Gkk[${row}][${col}]` : "0")
      );
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("纯对角 Gkk 的 W", "W for Pure Diagonal Gkk")}</div>
          <div class="formula-line"><span class="formula-lhs">${formatMath("G_kk")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("diag(Gkk[0][0], ..., Gkk[k][k])")}</span></div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("W")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("G_kk^{-1}")}</span><span class="formula-eq">=</span>${renderMatrix(wRows)}</div>
        </div>
      `;
    }

    function renderDiagonalCoupledStructured(result) {
      const details = result.structured?.details || {};
      const effectiveNodes = result.effective_internal_nodes || result.internal_nodes || [];
      const analysis = result.structured?.effective_analysis || {};
      const nodeToKIndex = new Map(effectiveNodes.map((node, index) => [node, index]));
      const diagonalIndices = (analysis.diagonal_nodes || []).map(node => nodeToKIndex.get(node)).filter(index => index !== undefined);
      const coupledIndices = (analysis.coupled_nodes || []).map(node => nodeToKIndex.get(node)).filter(index => index !== undefined);
      const M = details.M || [];
      const is2x2 = M.length === 2 && M[0]?.length === 2;
      const mSymbol = is2x2 ? [["M11", "M12"], ["M12", "M22"]] : compactMatrixRows(M, "M");
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("对角 + 耦合块结构", "Diagonal + Coupled Block Structure")}</div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("G_kk")}</span><span class="formula-eq">=</span>${renderMatrix([["D", "U"], ["U^T", "S"]])}</div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("D")}</span><span class="formula-eq">=</span>${renderCompactMatrixFromSource(details.D || [], "Gkk", diagonalIndices, diagonalIndices)}</div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("U")}</span><span class="formula-eq">=</span>${renderCompactMatrixFromSource(details.U || [], "Gkk", diagonalIndices, coupledIndices)}</div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("S")}</span><span class="formula-eq">=</span>${renderCompactMatrixFromSource(details.S || [], "Gkk", coupledIndices, coupledIndices)}</div>
          <div class="formula-line"><span class="formula-lhs">${formatMath("M")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("S - U^T*D^{-1}*U")}</span></div>
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("M")}</span><span class="formula-eq">=</span>${renderMatrix(mSymbol)}</div>
          ${is2x2 ? `
            <div class="formula-line"><span class="formula-lhs">${formatMath("detM")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("M11*M22 - M12^2")}</span></div>
            <div class="matrix-equation"><span class="formula-lhs">${formatMath("M^{-1}")}</span><span class="formula-eq">=</span>${renderMatrix([["M22/detM", "-M12/detM"], ["-M12/detM", "M11/detM"]])}</div>
          ` : `<div class="formula-line"><span class="formula-lhs">${formatMath("M^{-1}")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("M^{-1}")}</span></div>`}
          <div class="matrix-equation"><span class="formula-lhs">${formatMath("W")}</span><span class="formula-eq">=</span>${renderMatrix([["D^{-1}+D^{-1}*U*M^{-1}*U^T*D^{-1}", "-D^{-1}*U*M^{-1}"], ["-M^{-1}*U^T*D^{-1}", "M^{-1}"]])}</div>
        </div>
      `;
    }

    function renderGeneralStructured() {
      return `
        <div class="formula-card">
          <div class="formula-name">${optText("一般块结构", "General Block Structure")}</div>
          <div class="formula-line"><span class="formula-lhs">${formatMath("W")}</span><span class="formula-eq">=</span><span class="formula-rhs">${formatMath("G_kk^{-1}")}</span></div>
          <div class="formula-empty">${optText("无法识别简单对角块或对角+小耦合块结构，因此仅显示 W = Gkk^{-1} 的矩阵形式。若需要更简单的表达式，请调整内部节点排序或分组。", "No simple diagonal or diagonal-plus-small-coupled structure was detected, so only W = Gkk^{-1} is shown in matrix form. Adjust internal-node ordering or grouping for simpler expressions.")}</div>
        </div>
      `;
    }

    function renderStructuredByType(result) {
      const type = result.structured?.block_type;
      if (type === "no_elimination") {
        return `
          <div class="formula-card">
            <div class="formula-name">${optText("无内部节点", "No Internal Nodes")}</div>
            <div class="formula-empty">${optText("当前没有需要消去的内部节点；C 草稿会直接使用原始 G 和 Ihis 生成 RTDS 导纳写入与注入。", "There are no internal nodes to eliminate; the C draft uses the original G and Ihis directly for RTDS stamping and injection.")}</div>
          </div>
        `;
      }
      if (type === "pure_diagonal") return renderPureDiagonalStructured(result);
      if (type === "diagonal_plus_coupled") return renderDiagonalCoupledStructured(result);
      return renderGeneralStructured();
    }

    function renderDynamicSubblockAnalysis(result, payload) {
      const subblock = result.structured?.dynamic_subblock || {};
      const dep = result.structured?.dependency_analysis || {};
      const owner = subblock.owner_matrix || [];
      if (!owner.length) return "";
      const displayNames = payload.node_display_names || {};
      const nodes = result.external_nodes || payload.external_nodes || [];
      const nodeName = index => escapeHtml(displayNames[nodes[index]] || nodeDisplayName(nodes[index]) || `r${index}`);
      const entryLabel = entry => {
        const row = Number(entry?.[0]);
        const col = Number(entry?.[1]);
        return `${nodeName(row)}-${nodeName(col)}`;
      };
      const entryList = entries => (entries || []).map(entryLabel).join(", ") || "-";
      const stageLabel = stage => String(stage || "-")
        .replace("CODE_PER_STEP", "STEP")
        .replace("CODE_UPDATE", "CODE")
        .replace("RAM_INIT", "RAM");
      const compactNameList = names => {
        const clean = (names || []).filter(Boolean);
        if (!clean.length) return "-";
        if (clean.length <= 5) return clean.join(", ");

    function renderMultiCaseBlockMatrix(rows, label) {

      const rowCount = matrixRows.length;
      const colCount = Math.max(0, ...matrixRows.map(row => Array.isArray(row) ? row.length : 0));
      if (!rowCount || !colCount) {
        return `<span class="formula-rhs">${escapeHtml(optText("空矩阵", "empty matrix"))}</span>`;
      }
      const shouldCompact = rowCount > 6 || colCount > 6;
      return shouldCompact ? renderCompactMatrix(matrixRows, label, colCount) : renderMatrix(matrixRows, colCount);
    }

    function multiCaseCompactedEntryDefinitions(rows, label) {
      const matrixRows = Array.isArray(rows) ? rows : [];
      const rowCount = matrixRows.length;
      const colCount = Math.max(0, ...matrixRows.map(row => Array.isArray(row) ? row.length : 0));
      if (rowCount <= 6 && colCount <= 6) return "";
      const definitions = [];
      matrixRows.forEach((row, rowIndex) => {
        (row || []).forEach((value, colIndex) => {
          const token = compactMatrixToken(value, label, rowIndex, colIndex);
          if (token !== String(value ?? "0").trim()) {
            definitions.push(`
              <div class="formula-line">
                <span class="formula-lhs">${escapeHtml(token)}</span>
                <span class="formula-eq">=</span>
                <span class="formula-rhs">${formatMath(value || "0")}</span>
              </div>
            `);
          }
        });
      });
      if (!definitions.length) return "";
      return `
        <div class="actual-block-caption">${escapeHtml(optText("被折叠项定义", "Compacted entry definitions"))}</div>
        ${definitions.join("")}
      `;
    }

    function renderMultiCaseCExportResult(result) {
      const multiCase = result.multi_case || {};

      const diagnostics = multiCase.diagnostics || {};
      const runtimeSampleLabel = (caseIndex) => {
        const initCount = Number(diagnostics.init_time_case_count ?? multiCase.profile_count ?? 0);
        if (!initCount || runtimeGroups.length !== 1) return `case ${caseIndex}`;
        const group = runtimeGroups[0] || {};
        const runtimeCount = Number(group.case_count ?? 0);
        const stride = runtimeCount + 1;
        if (!runtimeCount || stride <= 1) return `case ${caseIndex}`;
        const numericIndex = Number(caseIndex);
        if (!Number.isInteger(numericIndex) || numericIndex < 0 || numericIndex >= initCount * stride) return `case ${caseIndex}`;
        const initIndex = Math.floor(numericIndex / stride);
        const sampleOffset = numericIndex % stride;
        if (sampleOffset === 0) {
          return `${optText("init case", "init case")} ${initIndex} / ${optText("runtime 默认 case 0", "runtime default case 0")}`;
        }
        return `${optText("init case", "init case")} ${initIndex} / ${group.name || group.branch_id || optText("runtime group", "runtime group")} ${optText("case", "case")} ${sampleOffset - 1}`;

        const group = runtimeGroups[0] || {};
        const runtimeCount = Number(group.case_count ?? 0);
        const stride = runtimeCount + 1;
        const numericIndex = Number(caseIndex);
        if (!runtimeCount || !Number.isInteger(numericIndex) || numericIndex % stride !== 0) return false;
        const nextIndex = String(numericIndex + 1);
        return Object.prototype.hasOwnProperty.call(caseValues, nextIndex)

    function multiCaseExportCacheKey(payload) {
      return JSON.stringify({
        version: "multi-case-runtime-mutable-v1",
        case_id_symbol: payload.case_id_symbol,
        eligible_branches: payload.eligible_branches,
        runtime_case_groups: payload.runtime_case_groups?.map(group => ({
          branch_id: group.branch_id,
          name: group.name,
          case_id_symbol: group.case_id_symbol,
          cases: (group.cases || []).map(item => ({
            index: item.index,
            name: item.name,
            payloads: item.payloads
          }))
        })),
        case_profiles: payload.case_profiles?.map(profile => ({
          name: profile.name,
          comment: profile.comment,
          case_map: profile.case_map,
          payload: profile.payload
        }))
      });
    }

    async function renderMultiCaseCExportAsync(token, payload) {
      const key = multiCaseExportCacheKey(payload);
      const cachedEntry = cacheGet(multiCaseExportCache, key);
      if (cachedEntry?.result) {
        if (token === multiCaseExportRenderToken) outputText.innerHTML = `<div class="formula-list">${renderMultiCaseProfileEditor(multiCaseEligibleBranches())}${renderMultiCaseCExportResult(cachedEntry.result)}</div>`;
        return;
      }
      const pending = requestMultiCaseCExport(payload).then(result => {
        const current = multiCaseExportCache.get(key);
        if (current?.pending === pending) cacheSet(multiCaseExportCache, key, { result, pending: null });
        return result;
      }).catch(error => {
        const current = multiCaseExportCache.get(key);
        if (current?.pending === pending) multiCaseExportCache.delete(key);
        throw error;
      });
      cacheSet(multiCaseExportCache, key, { result: null, pending });
      try {
        const result = await pending;
        if (token === multiCaseExportRenderToken) outputText.innerHTML = `<div class="formula-list">${renderMultiCaseProfileEditor(multiCaseEligibleBranches())}${renderMultiCaseCExportResult(result)}</div>`;
      } catch (error) {
        if (token === multiCaseExportRenderToken) outputText.innerHTML = `<div class="formula-list">${renderMultiCaseProfileEditor(multiCaseEligibleBranches())}<div class="formula-empty">${escapeHtml(optText("多Case C导出失败", "Multi-case C export failed"))}：${escapeHtml(error.message || String(error))}</div></div>`;
      }
    }

    async function renderOptimizedEliminationAsync(token, payload) {
      const staticHtml = optimizedStaticMessage(payload);
      if (staticHtml) {
        if (token === optimizedEliminationRenderToken) {
          outputText.innerHTML = `<div class="formula-list">${staticHtml}</div>`;
        }
        return;
      }

      const key = optimizedEliminationCacheKey(payload);
      const cachedEntry = cacheGet(optimizedEliminationCache, key);
      if (cachedEntry?.result) {
        if (token === optimizedEliminationRenderToken) outputText.innerHTML = renderOptimizedEliminationResult(cachedEntry.result, payload);
        return;
      }
      if (cachedEntry?.pending) {
        try {
          const result = await cachedEntry.pending;
          if (token === optimizedEliminationRenderToken) outputText.innerHTML = renderOptimizedEliminationResult(result, payload);
        } catch (error) {
          if (token === optimizedEliminationRenderToken) outputText.innerHTML = `<div class="formula-empty">${optText("优化消元失败", "Optimized elimination failed")}：${escapeHtml(error.message || String(error))}</div>`;
        }
        return;
      }

      const basePayload = payload;
      const pending = (async () => {
        const reducedDependency = await reducedDependencyAnalysisForOptimizedPayload(basePayload);
        const requestPayload = reducedDependency
          ? { ...basePayload, reduced_dependency_analysis: reducedDependency }
          : basePayload;
        return requestOptimizedElimination(requestPayload);
      })().then(result => {
        const current = optimizedEliminationCache.get(key);
        if (current?.pending === pending) cacheSet(optimizedEliminationCache, key, { result, pending: null });
        return result;
      }).catch(error => {
        const current = optimizedEliminationCache.get(key);
        if (current?.pending === pending) optimizedEliminationCache.delete(key);
        throw error;
      });
      cacheSet(optimizedEliminationCache, key, { result: null, pending });

      try {
        const result = await pending;
        if (token === optimizedEliminationRenderToken) outputText.innerHTML = renderOptimizedEliminationResult(result, payload);
      } catch (error) {
        if (token === optimizedEliminationRenderToken) outputText.innerHTML = `<div class="formula-empty">${optText("优化消元失败", "Optimized elimination failed")}：${escapeHtml(error.message || String(error))}</div>`;
      }
    }

    function packagedObserverEntries(branch, groupByTerminal, internalNames) {
      return (branch.packageOriginal?.branches || []).flatMap(inner => {
        if (inner.kind === "ground") return [];
        if (inner.kind === "dummy_node_block") return [];
        const displayForSide = side => groupByTerminal.get(terminalKey(inner.id, side))?.display || side;
        const lines = localCurrentFormula(inner, groupByTerminal).split("\n").filter(Boolean);
        if (inner.kind === "single_phase_transformer" || inner.kind === "custom_n_port") {
          return lines.map((line, index) => {
            const current = inner.currents?.[index] || {};
            const eqIndex = line.indexOf("=");
            const lhs = eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim();
            const rhs = eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "0";
            const fallbackEndpoints = observerEndpointLabelsFromLhs(lhs);
            const fromLabel = current.fromLabel || (current.from ? displayForSide(current.from) : fallbackEndpoints.from);
            const toLabel = current.toLabel || (current.to ? displayForSide(current.to) : fallbackEndpoints.to);
            return {
              lhs,
              rhs,
              fromLabel,
              toLabel,
              fromEliminated: internalNames.has(fromLabel),
              toEliminated: internalNames.has(toLabel)
            };
          });
        }
        const line = lines[0] || "";
        const eqIndex = line.indexOf("=");
        const lhs = eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim();
        const rhs = eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "0";
        const fromSide = inner.kind === "voltage_source_series_r" ? "P" : (inner.direction === "AtoB" ? "A" : "B");
        const toSide = inner.kind === "voltage_source_series_r" ? "N" : (inner.direction === "AtoB" ? "B" : "A");
        const fromLabel = displayForSide(fromSide);
        const toLabel = displayForSide(toSide);
        return [{
          lhs,
          rhs,
          fromLabel,
          toLabel,
          fromEliminated: internalNames.has(fromLabel),
          toEliminated: internalNames.has(toLabel)
        }];
      });
    }

    function buildPackagedReductionPayload(branch) {
      normalizePackageNetworkCases(branch);
      const pkg = branch.packageOriginal;
      if (!pkg) return null;
      const allGroups = [...(pkg.externalGroups || []), ...(pkg.internalGroups || [])];
      const groundGroupIds = new Set(groundNodesForBranchesInGroups(pkg.branches || [], allGroups));
      const externalGroups = (pkg.externalGroups || []).filter(group => !groundGroupIds.has(group.id));
      const internalGroups = (pkg.internalGroups || []).filter(group => !groundGroupIds.has(group.id));
      const groupByTerminal = new Map();
      allGroups.forEach(group => (group.members || []).forEach(member => groupByTerminal.set(member, group)));
      const groupIndex = new Map(allGroups.map((group, index) => [group.id, index]));
      const groupLookup = nodeLookupFromGroups(allGroups);
      const size = allGroups.length;
      const G = Array.from({ length: size }, () => Array.from({ length: size }, () => []));
      const Ihis = Array.from({ length: size }, () => []);
      const warnings = [];

      (pkg.branches || []).forEach(inner => {
        if (inner.kind === "ground") return;
        if (inner.kind === "current_source") {
          stampCurrentSourceBranch(inner, side => groupByTerminal.get(terminalKey(inner.id, side))?.id, groupLookup, groupIndex, G, Ihis, warnings);
          return;
        }
        const sourceId = inner.id;
        const sides = terminalSides(inner);
        const localG = localGMatrix(inner);
        const localIhis = localIhisVector(inner);
        sides.forEach((rowSide, r) => {
          const rowGroup = groupByTerminal.get(terminalKey(inner.id, rowSide));
          const row = groupIndex.get(rowGroup?.id);
          if (row === undefined) return;
          addTerm(Ihis[row], localIhis[r], sourceId);
          sides.forEach((colSide, c) => {
            const colGroup = groupByTerminal.get(terminalKey(inner.id, colSide));
            const col = groupIndex.get(colGroup?.id);
            if (col === undefined) return;
            addTerm(G[row][col], localG[r]?.[c] || "0", sourceId);
          });
        });
      });

      const internalNames = new Set(internalGroups.map(group => group.display));
      const observers = packagedObserverEntries(branch, groupByTerminal, internalNames);
      return {
        externalGroups,
        internalGroups,
        observers,
        warnings,
        payload: {
          all_nodes: allGroups.map(group => group.id),
          voltage_nodes: allGroups.map(group => group.display),
          external_nodes: externalGroups.map(group => group.id),
          internal_nodes: internalGroups.map(group => group.id),
          ground_nodes: [...groundGroupIds],
          G_full: G.map(row => row.map(sumTerms)),
          Ihis_full: Ihis.map(sumTerms)
        }
      };
    }

    async function recomputePackagedBox(branch) {
      const built = buildPackagedReductionPayload(branch);
      if (!built) return;
      if (built.warnings?.length) throw new Error(built.warnings.join("; "));
      const result = await requestReduction({
        ...built.payload,
        observers: built.observers.map(({ lhs, rhs }) => ({ lhs, rhs }))
      });
      const ports = branch.ports || [];
      branch.gMatrix = matrixLiteral(result.G_red);
      branch.ihisVector = vectorLiteral(result.Ihis_red);
      branch.packageOriginal.K_v = result.K_v;
      branch.packageOriginal.K_h = result.K_h;
      branch.currents = (result.reduced_observers || []).map((item, index) => {
        const source = built.observers[index] || {};
        return {
          name: observerNameFromLhs(source.lhs || item.lhs, index),
          from: ports[0],
          to: ports[Math.min(1, ports.length - 1)],
          fromLabel: source.fromLabel || ports[0],
          toLabel: source.toLabel || ports[Math.min(1, ports.length - 1)],
          fromEliminated: Boolean(source.fromEliminated),
          toEliminated: Boolean(source.toEliminated),
          expression: replaceExternalVoltages(item.rhs, built.externalGroups, ports)
        };
      });
      const pkg = branch.packageOriginal;
      const activeIndex = Number(pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0;
      if (pkg.networkCases?.[activeIndex]) {
        pkg.networkCases[activeIndex] = {
          ...pkg.networkCases[activeIndex],
          branches: structuredClone(pkg.branches || []),
          wires: structuredClone(packageInternalWiresForBranches(pkg.branches || [], pkg.wires || [])),
          nodeState: structuredClone(pkg.nodeState || []),
          nodeOrder: structuredClone(pkg.nodeOrder || []),
          externalGroups: structuredClone(pkg.externalGroups || []),
          internalGroups: structuredClone(pkg.internalGroups || []),
          K_v: structuredClone(pkg.K_v || []),
          K_h: structuredClone(pkg.K_h || []),
          gMatrix: branch.gMatrix,
          ihisVector: branch.ihisVector,
          currents: structuredClone(branch.currents || []),
          gIsConstant: branch.gIsConstant !== false,
          constantGSymbols: branch.constantGSymbols || ""
        };
      }
      invalidateMathCaches();
    }

    async function requestBlackBoxValidation(payload) {
      const body = { mode: "validate_blackbox_observers", ...payload };
      const urls = [...localApiUrls("/validate-blackbox-observers"), ...localApiUrls("/reduce-system")];
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const result = await response.json();
          if (!response.ok || result.ok === false) {
            throw Object.assign(new Error(result.error || "Black-box observer validation failed"), { backendError: true });
          }
          return result;
        } catch (error) {
          if (error.backendError) throw error;
          lastError = error;
        }
      }
      throw lastError || new Error("Black-box observer validation failed");
    }

    function buildSelectedSubsystem(branches) {
      const selectedIds = new Set(branches.map(branch => branch.id));
      const parent = new Map();
      const terminals = [];

      function add(key) {
        if (!parent.has(key)) parent.set(key, key);
      }

      function find(key) {
        add(key);
        const p = parent.get(key);
        if (p !== key) parent.set(key, find(p));
        return parent.get(key);
      }

      function union(a, b) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent.set(rb, ra);
      }

      branches.forEach(branch => terminalSides(branch).forEach(side => {
        const key = terminalKey(branch.id, side);
        terminals.push(key);
        add(key);
      }));

      state.wires.forEach(wire => {
        const fromId = parseTerminal(wire.from).branchId;
        const toId = parseTerminal(wire.to).branchId;
        if (selectedIds.has(fromId) && selectedIds.has(toId)) union(wire.from, wire.to);
      });
      const boundaryTerminals = new Set();
      state.wires.forEach(wire => {
        const fromSelected = selectedIds.has(parseTerminal(wire.from).branchId);
        const toSelected = selectedIds.has(parseTerminal(wire.to).branchId);
        if (fromSelected === toSelected) return;
        boundaryTerminals.add(fromSelected ? wire.from : wire.to);
      });

      const globalLookup = netLookup();
      const byRoot = new Map();
      terminals.forEach(key => {
        const root = find(key);
        if (!byRoot.has(root)) byRoot.set(root, []);
        byRoot.get(root).push(key);
      });

      const groups = Array.from(byRoot.values()).map((members, index) => {
        const globalNet = globalLookup.get(members[0]) || `N${index + 1}`;
        const boundary = members.some(member => boundaryTerminals.has(member));
        const isolatedDummyInternal = members.some(member => {
          const parsed = parseTerminal(member);
          return isDummyNodeBlockTerminal(findBranch(parsed.branchId), parsed.side);
        });
        return {
          id: `Y${index + 1}`,
          members,
          globalNet,
          display: nodeDisplayName(globalNet),
          internal: state.internalNodes.includes(globalNet),
          isolatedDummyInternal,
          boundary
        };
      });
      const globalOrder = new Map(orderedNetGroups().map((group, index) => [group.id, index]));
      groups.sort((a, b) => (globalOrder.get(a.globalNet) ?? 9999) - (globalOrder.get(b.globalNet) ?? 9999));
      const groupByTerminal = new Map();
      groups.forEach(group => group.members.forEach(key => groupByTerminal.set(key, group)));
      const allGroups = groups;
      const groundGroupIds = new Set(groundNodesForBranchesInGroups(branches, allGroups));
      const externalGroups = groups.filter(group => !groundGroupIds.has(group.id) && (!group.internal || group.boundary));
      const internalGroups = groups.filter(group => !groundGroupIds.has(group.id) && group.internal && !group.boundary);
      const groupIndex = new Map(allGroups.map((group, index) => [group.id, index]));
      const groupLookup = nodeLookupFromGroups(allGroups);
      const size = allGroups.length;
      const G = Array.from({ length: size }, () => Array.from({ length: size }, () => []));
      const Ihis = Array.from({ length: size }, () => []);
      const warnings = [];

      branches.forEach(branch => {
        if (branch.kind === "ground") return;
        if (branch.kind === "current_source") {
          stampCurrentSourceBranch(branch, side => groupByTerminal.get(terminalKey(branch.id, side))?.id, groupLookup, groupIndex, G, Ihis, warnings);
          return;
        }
        if (branch.kind === "voltage_source_series_r") {
          stampVoltageSourceSeriesRBranch(branch, side => groupByTerminal.get(terminalKey(branch.id, side))?.id, groupIndex, G, Ihis, warnings);
          return;
        }
        const sourceId = branch.id;
        const sides = terminalSides(branch);
        const localG = localGMatrix(branch);
        const localIhis = localIhisVector(branch);
        sides.forEach((rowSide, r) => {
          const rowGroup = groupByTerminal.get(terminalKey(branch.id, rowSide));
          const row = groupIndex.get(rowGroup.id);
          addTerm(Ihis[row], localIhis[r], sourceId);
          sides.forEach((colSide, c) => {
            const colGroup = groupByTerminal.get(terminalKey(branch.id, colSide));
            const col = groupIndex.get(colGroup.id);
            addTerm(G[row][col], localG[r]?.[c] || "0", sourceId);
          });
        });
      });

      return {
        groups,
        externalGroups,
        internalGroups,
        allGroups,
        groupByTerminal,
        selectedIds,
        warnings,
        payload: {
          all_nodes: allGroups.map(group => group.id),
          voltage_nodes: allGroups.map(group => group.display),
          external_nodes: externalGroups.map(group => group.id),
          internal_nodes: internalGroups.map(group => group.id),
          ground_nodes: [...groundGroupIds],
          G_full: G.map(row => row.map(sumTerms)),
          Ihis_full: Ihis.map(sumTerms)
        }
      };
    }

    function localCurrentFormula(branch, groupByTerminal) {
      const displayForSide = side => groupByTerminal.get(terminalKey(branch.id, side))?.display || side;
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") {
        const replacements = {};
        terminalSides(branch).forEach(side => {
          replacements[`V_${side}`] = `V_${displayForSide(side)}`;
        });
        return branch.currents.map(current => {
          const fromSide = branch.kind === "custom_n_port" && !branch.packageOriginal ? customObserverNodeId(branch, current.from) : current.from;
          const toSide = branch.kind === "custom_n_port" && !branch.packageOriginal ? customObserverNodeId(branch, current.to) : current.to;
          let expression = branch.kind === "custom_n_port" && !branch.packageOriginal
            ? `(${current.g || "0"}) * (V_${fromSide} - V_${toSide}) + ${current.ihis || "0"}`
            : (current.expression || "0");
          Object.entries(replacements).forEach(([key, value]) => {
            expression = expression.replace(new RegExp(`\\b${escapeRegExp(key)}\\b`, "g"), value);
          });
          const fromLabel = current.fromLabel || displayForSide(fromSide);
          const toLabel = current.toLabel || displayForSide(toSide);
          return `i_${branch.name}_${current.name}_${fromLabel}_to_${toLabel} = ${expression}`;
        }).join("\n");
      }
      if (branch.kind === "current_source") {
        const fromSide = branch.kind === "voltage_source_series_r" ? "P" : (branch.direction === "AtoB" ? "A" : "B");
        const toSide = branch.kind === "voltage_source_series_r" ? "N" : (branch.direction === "AtoB" ? "B" : "A");
        const fromLabel = displayForSide(fromSide);
        const toLabel = displayForSide(toSide);
        const displayByNode = new Map();
        groupByTerminal.forEach(group => {
          if (group?.display) displayByNode.set(group.display, group.display);
          if (group?.id) displayByNode.set(group.id, group.display || group.id);
        });
        return `i_${branch.name}_${fromLabel}_to_${toLabel} = ${currentSourceExpression(branch, displayByNode)}`;
      }
      if (branch.kind === "voltage_source_series_r") {
        const fromLabel = displayForSide("P");
        const toLabel = displayForSide("N");
        return `i_${branch.name}_${fromLabel}_to_${toLabel} = (${voltageSourceSeriesConductance(branch)}) * (V_${fromLabel} - V_${toLabel} - (${branch.voltage || "Vs"}))`;
      }

      const fromSide = branch.direction === "AtoB" ? "A" : "B";
      const toSide = branch.direction === "AtoB" ? "B" : "A";
      const fromLabel = displayForSide(fromSide);
      const toLabel = displayForSide(toSide);
      const ihis = branchValue(branch, "ihis");
      const sign = branch.direction === "AtoB" ? ihis : `-(${ihis})`;
      return `i_${branch.name}_${fromLabel}_to_${toLabel} = (${branchValue(branch, "g")}) * (V_${fromLabel} - V_${toLabel}) + ${sign}`;
    }

    function yBoxPortLayout(ports) {
      const half = Math.ceil(ports.length / 2);
      return ports.map((id, index) => ({
        id,
        side: index < half ? "left" : "right",
        t: ((index < half ? index : index - half) + 1) / ((index < half ? half : ports.length - half) + 1),
        order: index
      }));
    }

    function yBoxPortLayoutFromGroups(groups, ports, bounds) {
      const fallback = yBoxPortLayout(ports);
      const byPort = new Map();
      groups.forEach((group, index) => {
        const port = ports[index];
        const points = (group.members || []).map(member => {
          const parsed = parseTerminal(member);
          const item = findBranch(parsed.branchId);
          return item ? terminalPosition(item, parsed.side) : null;
        }).filter(Boolean);
        if (!points.length) {
          byPort.set(port, fallback[index]);
          return;
        }
        const x = points.reduce((sum, point) => sum + point.x, 0) / points.length;
        const y = points.reduce((sum, point) => sum + point.y, 0) / points.length;
        const distances = [
          { side: "left", value: Math.abs(x - bounds.left) },
          { side: "right", value: Math.abs(x - bounds.right) },
          { side: "top", value: Math.abs(y - bounds.top) },
          { side: "bottom", value: Math.abs(y - bounds.bottom) }
        ].sort((a, b) => a.value - b.value);
        const side = distances[0]?.side || fallback[index].side;
        const rawT = side === "left" || side === "right"
          ? (y - bounds.top) / Math.max(1, bounds.bottom - bounds.top)
          : (x - bounds.left) / Math.max(1, bounds.right - bounds.left);
        byPort.set(port, {
          id: port,
          side,
          t: Math.max(0.12, Math.min(0.88, rawT)),
          order: index
        });
      });
      const items = ports.map((port, index) => byPort.get(port) || fallback[index]);
      ["left", "right", "top", "bottom"].forEach(side => {
        items
          .filter(item => item.side === side)
          .sort((a, b) => a.t - b.t)
          .forEach((item, index) => { item.order = index; });
      });
      return items;
    }

    function observerNameFromLhs(lhs, index) {
      if (!lhs) return `obs${index + 1}`;
      const raw = lhs.replace(/^i_/, "").replace(/_red$/, "");
      const toIndex = raw.lastIndexOf("_to_");
      const beforeTo = toIndex >= 0 ? raw.slice(0, toIndex) : raw;
      const parts = beforeTo.split("_").filter(Boolean);
      if (parts.length > 1) parts.pop();
      return parts.join("_") || `obs${index + 1}`;
    }

    function observerEndpointLabelsFromLhs(lhs) {
      if (!lhs?.startsWith("i_")) return { from: "", to: "" };
      const raw = lhs.slice(2).replace(/_red$/, "");
      const toIndex = raw.lastIndexOf("_to_");
      if (toIndex < 0) return { from: "", to: "" };
      const beforeTo = raw.slice(0, toIndex);
      const to = raw.slice(toIndex + 4);
      const from = beforeTo.split("_").filter(Boolean).pop() || "";
      return { from, to };
    }

    function replaceExternalVoltages(expr, externalGroups, ports) {
      let out = String(expr || "0");
      externalGroups.forEach((group, index) => {
        out = out.replace(new RegExp(`\\bV_${escapeRegExp(group.display)}\\b`, "g"), `V_${ports[index]}`);
      });
      return out;
    }

    async function packSelectedAsYBox() {
      const branches = selectedBranches();
      if (!branches.length) return;
      const beforeNodeState = captureNodeDisplayState();
      const subsystem = buildSelectedSubsystem(branches);
      if (!subsystem.externalGroups.length) {
        alert(tr("选中的部分没有外部边界节点，不能打包成可连接的 Y 节点黑盒。"));
        return;
      }
      if (subsystem.warnings?.length) {
        alert(subsystem.warnings.map(item => tr(item)).join("\n"));
        return;
      }

      const internalNames = new Set(subsystem.internalGroups.map(group => group.display));
      const observerEntries = branches.flatMap(branch => {
        if (branch.kind === "ground") return [];
        if (branch.kind === "dummy_node_block") return [];
        const displayForSide = side => subsystem.groupByTerminal.get(terminalKey(branch.id, side))?.display || side;
        const lines = localCurrentFormula(branch, subsystem.groupByTerminal).split("\n").filter(Boolean);
        if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") {
          return lines.map((line, index) => {
            const current = branch.currents?.[index] || {};
            const eqIndex = line.indexOf("=");
            const lhs = eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim();
            const rhs = eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "0";
            const fallbackEndpoints = observerEndpointLabelsFromLhs(lhs);
            const fromLabel = current.fromLabel || (current.from ? displayForSide(current.from) : fallbackEndpoints.from);
            const toLabel = current.toLabel || (current.to ? displayForSide(current.to) : fallbackEndpoints.to);
            return {
              lhs,
              rhs,
              fromLabel,
              toLabel,
              fromEliminated: internalNames.has(fromLabel),
              toEliminated: internalNames.has(toLabel)
            };
          });
        }
        const line = lines[0] || "";
        const eqIndex = line.indexOf("=");
        const lhs = eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim();
        const rhs = eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "0";
        const fromSide = branch.direction === "AtoB" ? "A" : "B";
        const toSide = branch.direction === "AtoB" ? "B" : "A";
        const fromLabel = displayForSide(fromSide);
        const toLabel = displayForSide(toSide);
        return [{
          lhs,
          rhs,
          fromLabel,
          toLabel,
          fromEliminated: internalNames.has(fromLabel),
          toEliminated: internalNames.has(toLabel)
        }];
      });
      const payload = {
        ...subsystem.payload,
        observers: observerEntries.map(({ lhs, rhs }) => ({ lhs, rhs }))
      };
      const result = await requestReduction(payload);
      const before = snapshot();
      commitHistory();

      const bounds = combinedBounds(branches);
      const n = state.nextCustom++;
      const boxName = `YBox${n}`;
      const ports = subsystem.externalGroups.map((_, index) => `P${index + 1}`);
      const portForGroup = new Map(subsystem.externalGroups.map((group, index) => [group.id, ports[index]]));
      const selectedIds = subsystem.selectedIds;
      const touchingWires = state.wires.filter(wire => {
        const fromSelected = selectedIds.has(parseTerminal(wire.from).branchId);
        const toSelected = selectedIds.has(parseTerminal(wire.to).branchId);
        return fromSelected || toSelected;
      });
      const replacementWires = [];
      touchingWires.forEach(wire => {
        const fromSelected = selectedIds.has(parseTerminal(wire.from).branchId);
        const toSelected = selectedIds.has(parseTerminal(wire.to).branchId);
        if (fromSelected === toSelected) return;
        const selectedTerminal = fromSelected ? wire.from : wire.to;
        const outsideTerminal = fromSelected ? wire.to : wire.from;
        const group = subsystem.groupByTerminal.get(selectedTerminal);
        const port = group && portForGroup.get(group.id);
        if (!port) return;
        replacementWires.push({
          id: `W${state.nextWire++}`,
          from: fromSelected ? `C${n}.${port}` : outsideTerminal,
          to: fromSelected ? outsideTerminal : `C${n}.${port}`,
          mid: wire.mid ? structuredClone(wire.mid) : null
        });
      });

      const currents = (result.reduced_observers || []).map((item, index) => {
        const source = observerEntries[index] || {};
        return {
          name: observerNameFromLhs(source.lhs || item.lhs, index),
          from: ports[0],
          to: ports[Math.min(1, ports.length - 1)],
          fromLabel: source.fromLabel || ports[0],
          toLabel: source.toLabel || ports[Math.min(1, ports.length - 1)],
          fromEliminated: Boolean(source.fromEliminated),
          toEliminated: Boolean(source.toEliminated),
          expression: replaceExternalVoltages(item.rhs, subsystem.externalGroups, ports)
        };
      });
      const yBox = {
        id: `C${n}`,
        name: boxName,
        kind: "custom_n_port",
        x: Math.max(120, Math.min(WORLD.width - 120, (bounds.left + bounds.right) / 2)),
        y: Math.max(120, Math.min(WORLD.height - 120, (bounds.top + bounds.bottom) / 2)),
        width: Math.max(126, Math.min(240, 96 + ports.length * 4)),
        height: Math.max(82, Math.min(260, 48 + Math.ceil(ports.length / 2) * 18)),
        rotation: 0,
        ports,
        nodes: Object.fromEntries(ports.map((port, index) => [port, subsystem.externalGroups[index].display])),
        portLayout: yBoxPortLayoutFromGroups(subsystem.externalGroups, ports, bounds),
        gMatrix: matrixLiteral(result.G_red),
        ihisVector: vectorLiteral(result.Ihis_red),
        currents,
        packageOriginal: {
          snapshotBefore: before,
          branches: structuredClone(branches),
          wires: structuredClone(touchingWires),
          nodeState: structuredClone(beforeNodeState),
          nodeOrder: structuredClone(currentNodeOrder()),
          externalGroups: subsystem.externalGroups.map((group, index) => ({
            id: group.id,
            display: group.display,
            globalNet: group.globalNet,
            members: [...group.members],
            port: ports[index],
            internal: Boolean(group.internal),
            boundary: Boolean(group.boundary)
          })),
          internalGroups: subsystem.internalGroups.map(group => ({ id: group.id, display: group.display, globalNet: group.globalNet, members: [...group.members] })),
          K_v: result.K_v,
          K_h: result.K_h,
          activeNetworkCase: 0,
          networkCases: []
        }
      };
      yBox.packageOriginal.networkCases = [packageNetworkCaseFromBranch(yBox, 0)];

      state.branches = state.branches.filter(branch => !selectedIds.has(branch.id));
      state.wires = state.wires.filter(wire => {
        const fromSelected = selectedIds.has(parseTerminal(wire.from).branchId);
        const toSelected = selectedIds.has(parseTerminal(wire.to).branchId);
        return !fromSelected && !toSelected;
      });
      state.branches.push(yBox);
      state.wires.push(...replacementWires);
      state.internalNodes = state.internalNodes.filter(node => !subsystem.internalGroups.some(group => group.globalNet === node));
      applyNodeDisplayState(beforeNodeState, ports.map((port, index) => ({
        terminal: terminalKey(yBox.id, port),
        display: subsystem.externalGroups[index].display,
        color: state.nodeColors?.[subsystem.externalGroups[index].globalNet] || null,
        internal: Boolean(subsystem.externalGroups[index].internal)
      })));
      const nextLookup = netLookup();
      ports.forEach((port, index) => {
        const netId = nextLookup.get(terminalKey(yBox.id, port));
        if (netId && !subsystem.externalGroups[index].internal) state.internalNodes = state.internalNodes.filter(node => node !== netId);
      });
      const packageOrder = subsystem.groups
        .map(group => {
          const port = portForGroup.get(group.id);
          return port ? nextLookup.get(terminalKey(yBox.id, port)) : packagedHiddenNodeId(yBox, "internal", subsystem.internalGroups.findIndex(item => item.id === group.id));
        })
        .filter(Boolean);
      const originalPackageOrderSet = new Set(subsystem.groups.map(group => group.globalNet));
      const packageByOriginal = new Map(subsystem.groups.map((group, index) => [group.globalNet, packageOrder[index]]).filter(([, id]) => id));
      const usedPackageOrder = new Set();
      const nextOrder = [];
      state.nodeOrder.forEach(id => {
        if (!originalPackageOrderSet.has(id)) {
          if (!nextOrder.includes(id)) nextOrder.push(id);
          return;
        }
        const mapped = packageByOriginal.get(id);
        if (mapped && !usedPackageOrder.has(mapped)) {
          nextOrder.push(mapped);
          usedPackageOrder.add(mapped);
        }
      });
      packageOrder.forEach(id => {
        if (id && !usedPackageOrder.has(id) && !nextOrder.includes(id)) nextOrder.push(id);
      });
      state.nodeOrder = nextOrder;
      state.groups = state.groups
        .map(group => ({ ...group, ids: group.ids.filter(id => !selectedIds.has(id)) }))
        .filter(group => group.ids.length > 1);
      selectBranch(yBox.id);
      render();
    }

    function unpackSelectedYBox() {
      const branch = findBranch(state.selectedId);
      if (!branch?.packageOriginal) return;
      const beforeNodeState = captureNodeDisplayState();
      const beforeNodeRows = captureVisibleNodeOrderRows();
      commitHistory();
      const existingIds = new Set(state.branches.filter(item => item.id !== branch.id).map(item => item.id));
      const existingNames = new Set(state.branches.filter(item => item.id !== branch.id).map(item => item.name).filter(Boolean));
      const branchIdMap = new Map();
      const originalSelectedIds = new Set((branch.packageOriginal.branches || []).map(item => item.id));
      const originalBranches = (branch.packageOriginal.branches || []).map(source => {
        const restored = structuredClone(source);
        const oldId = restored.id;
        if (existingIds.has(restored.id)) {
          restored.id = nextUniqueIdForKind(restored.kind, existingIds);
        }
        existingIds.add(restored.id);
        ensureUniqueBranchName(restored, existingNames);
        branchIdMap.set(oldId, restored.id);
        return restored;
      });
      const availableBranchIds = new Set(state.branches.filter(item => item.id !== branch.id).map(item => item.id));
      originalBranches.forEach(item => availableBranchIds.add(item.id));
      const restoreTerminal = terminal => {
        const parsed = parseTerminal(terminal);
        if (branchIdMap.has(parsed.branchId)) return `${branchIdMap.get(parsed.branchId)}.${parsed.side}`;
        return availableBranchIds.has(parsed.branchId) ? terminal : null;
      };
      const restoreOriginalTerminal = terminal => {
        const parsed = parseTerminal(terminal);
        return branchIdMap.has(parsed.branchId) ? `${branchIdMap.get(parsed.branchId)}.${parsed.side}` : null;
      };
      const representativeOriginalTerminal = members => {
        for (const member of members || []) {
          const restored = restoreOriginalTerminal(member);
          if (restored) return restored;
        }
        return null;
      };
      const packageGroupForPort = port => {
        const external = (branch.packageOriginal.externalGroups || []).find(group => group.port === port);
        if (external) return external;
        const internal = (branch.packageOriginal.internalGroups || []).find(group => group.exposePort === port);
        if (internal) return internal;
        return null;
      };
      const originalTerminalForPackagePort = (port, outsideTerminal = null) => {
        const group = packageGroupForPort(port);
        if (!group) return null;
        if (outsideTerminal) {
          for (const source of branch.packageOriginal.wires || []) {
            const fromInGroup = (group.members || []).includes(source.from);
            const toInGroup = (group.members || []).includes(source.to);
            if (fromInGroup === toInGroup) continue;
            const selectedTerminal = fromInGroup ? source.from : source.to;
            const outside = restoreTerminal(fromInGroup ? source.to : source.from);
            const selected = restoreOriginalTerminal(selectedTerminal);
            if (selected && outside === outsideTerminal) return selected;
          }
        }
        return representativeOriginalTerminal(group.members);
      };
      const remapPackageTerminalToOriginal = terminal => {
        const parsed = parseTerminal(terminal);
        return parsed.branchId === branch.id ? originalTerminalForPackagePort(parsed.side) : restoreTerminal(terminal);
      };
      const remapNodeStateMembers = item => ({
        ...item,
        members: (item.members || []).map(remapPackageTerminalToOriginal).filter(Boolean)
      });
      const remapNodeOrderTerminal = terminal => {
        const parsed = parseTerminal(terminal);
        return parsed.branchId === branch.id ? originalTerminalForPackagePort(parsed.side) : restoreTerminal(terminal);
      };
      const existingWireIds = new Set(state.wires.map(wire => wire.id));
      const originalWires = (branch.packageOriginal.wires || []).map(source => {
        const sourceFromSelected = originalSelectedIds.has(parseTerminal(source.from).branchId);
        const sourceToSelected = originalSelectedIds.has(parseTerminal(source.to).branchId);
        if (!(sourceFromSelected && sourceToSelected)) return null;
        const from = restoreTerminal(source.from);
        const to = restoreTerminal(source.to);
        if (!from || !to) return null;
        const restored = structuredClone(source);
        restored.from = from;
        restored.to = to;
        if (existingWireIds.has(restored.id)) restored.id = `W${state.nextWire++}`;
        existingWireIds.add(restored.id);
        return restored;
      }).filter(Boolean);
      const currentPackageWires = state.wires.filter(wire => {
        const fromPackage = parseTerminal(wire.from).branchId === branch.id;
        const toPackage = parseTerminal(wire.to).branchId === branch.id;
        return fromPackage || toPackage;
      });
      const seenWirePairs = new Set(originalWires.map(wire => [wire.from, wire.to].sort().join("|")));
      const replacementWires = currentPackageWires.map(source => {
        const fromParsed = parseTerminal(source.from);
        const toParsed = parseTerminal(source.to);
        const from = fromParsed.branchId === branch.id ? originalTerminalForPackagePort(fromParsed.side, source.to) : source.from;
        const to = toParsed.branchId === branch.id ? originalTerminalForPackagePort(toParsed.side, source.from) : source.to;
        if (!from || !to || from === to) return null;
        const pairKey = [from, to].sort().join("|");
        if (seenWirePairs.has(pairKey)) return null;
        seenWirePairs.add(pairKey);
        const restored = structuredClone(source);
        restored.from = from;
        restored.to = to;
        if (existingWireIds.has(restored.id)) restored.id = `W${state.nextWire++}`;
        existingWireIds.add(restored.id);
        return restored;
      }).filter(Boolean);
      const restoredNodeState = (branch.packageOriginal.nodeState || []).map(item => ({
        ...item,
        members: (item.members || []).map(restoreTerminal).filter(Boolean)
      }));
      const remappedBeforeNodeState = beforeNodeState.map(remapNodeStateMembers);

      state.branches = state.branches.filter(item => item.id !== branch.id).concat(originalBranches);
      state.wires = state.wires
        .filter(wire => parseTerminal(wire.from).branchId !== branch.id && parseTerminal(wire.to).branchId !== branch.id)
        .concat(originalWires, replacementWires);
      state.groups = state.groups
        .map(group => ({ ...group, ids: group.ids.filter(id => id !== branch.id) }))
        .filter(group => group.ids.length > 1);
      applyNodeDisplayState([...remappedBeforeNodeState, ...restoredNodeState]);
      restoreNodeOrderFromRows(beforeNodeRows, remapNodeOrderTerminal);
      state.selectedIds = originalBranches.map(item => item.id);
      state.selectedId = state.selectedIds[0] || null;
      state.selectedWireId = null;
      syncNextCounters();
      render();
    }

    function renderReducedEquationsResult(result, displayNames = {}) {
      const externalNames = result.external_nodes.map(node => displayNames[node] || nodeDisplayName(node));
      const internalNames = result.internal_nodes.map(node => displayNames[node] || nodeDisplayName(node));
      const groundNames = (result.ground_nodes || []).map(node => displayNames[node] || nodeDisplayName(node));
      const displayResult = {
        ...result,
        G_red: result.G_red_simplified || result.G_red,
        Ihis_red: result.Ihis_red_simplified || result.Ihis_red,
        K_v: result.K_v_simplified || result.K_v,
        K_h: result.K_h_simplified || result.K_h,
        G_red_tagged: null,
        Ihis_red_tagged: null,
        K_v_tagged: null,
        K_h_tagged: null,
      };

      return `
        <div class="formula-list">
          ${renderReducedBackendWarnings(result)}
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("节点划分"))}</div>
            <div class="formula-line">
              <span class="formula-rhs">${escapeHtml(tr("外部"))}: ${escapeHtml(externalNames.join(", "))}; ${escapeHtml(tr("内部"))}: ${escapeHtml(internalNames.join(", "))}${groundNames.length ? `; ${escapeHtml(tr("Ground 节点"))}: ${escapeHtml(groundNames.join(", "))}` : ""}</span>
            </div>
          </div>
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("节点方程消去版本"))}</div>
            ${renderReducedEquationDisplay(displayResult, externalNames)}
          </div>
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("内部节点电压恢复公式"))}</div>
            ${renderRecoveryEquationDisplay(displayResult, externalNames, internalNames)}
          </div>
          ${result.internal_nodes.length === 1 ? renderSingleInternalFormula(displayResult, externalNames, internalNames[0]) : ""}
          ${renderReducedSourceHighlightVersion(result, externalNames, internalNames)}
        </div>
      `;
    }

    function renderReducedBackendWarnings(result) {
      const warnings = result?.warnings || [];
      if (!warnings.length) return "";
      return `
        <div class="formula-card validation-warning">
          <div class="formula-name">${escapeHtml(tr("提示"))}</div>
          <div class="formula-empty">${warnings.map(escapeHtml).join("<br>")}</div>
        </div>
      `;
    }

    function renderReducedEquationDisplay(result, externalNames) {
      return `
        <div class="matrix-equation">
          ${renderVectorMatrix(externalNames.map(name => `I_${name}`))}
          <span class="formula-eq">=</span>
          ${renderMatrix(result.G_red)}
          ${renderVectorMatrix(externalNames.map(name => `V_${name}`))}
          <span class="formula-eq">+</span>
          ${renderVectorMatrix(result.Ihis_red)}
        </div>
      `;
    }

    function renderRecoveryEquationDisplay(result, externalNames, internalNames) {
      return `
        <div class="matrix-equation">
          ${renderVectorMatrix(internalNames.map(name => `V_${name}`))}
          <span class="formula-eq">=</span>
