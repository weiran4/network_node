    function applyPackageNetworkCase(branch, caseIndex = null) {
      const pkg = branch?.packageOriginal;
      const cases = pkg?.networkCases || [];
      if (!pkg || !cases.length) return null;
      const index = Math.max(0, Math.min(cases.length - 1, Number(caseIndex ?? pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0));
      const active = cases[index];
      const packageOriginal = pkg;
      pkg.activeNetworkCase = index;
      branch.activeSwitchCase = index;
      pkg.branches = structuredClone(active.branches || []);
      pkg.wires = structuredClone(active.wires || []);
      pkg.nodeState = structuredClone(active.nodeState || []);
      pkg.nodeOrder = structuredClone(active.nodeOrder || []);
      packageOriginal.externalGroups = structuredClone(active.superExternalGroups || active.externalGroups || []);
      pkg.internalGroups = structuredClone(active.superInternalGroups || active.internalGroups || []);
      pkg.K_v = structuredClone(active.superK_v || active.K_v || []);
      pkg.K_h = structuredClone(active.superK_h || active.K_h || []);
      pkg.superExternalGroups = structuredClone(active.superExternalGroups || active.externalGroups || []);
      pkg.superInternalGroups = structuredClone(active.superInternalGroups || active.internalGroups || []);
      pkg.superK_v = structuredClone(active.superK_v || active.K_v || []);
      pkg.superK_h = structuredClone(active.superK_h || active.K_h || []);
      pkg.finalExternalGroups = structuredClone(active.finalExternalGroups || active.externalGroups || []);
      pkg.finalInternalGroups = structuredClone(active.finalInternalGroups || active.internalGroups || []);
      pkg.finalK_v = structuredClone(active.finalK_v || active.K_v || []);
      pkg.finalK_h = structuredClone(active.finalK_h || active.K_h || []);
      branch.gMatrix = active.superGMatrix || active.gMatrix || branch.gMatrix || "[]";
      branch.ihisVector = active.superIhisVector || active.ihisVector || branch.ihisVector || "[]";
      branch.superGMatrix = active.superGMatrix || active.gMatrix || branch.gMatrix || "[]";
      branch.superIhisVector = active.superIhisVector || active.ihisVector || branch.ihisVector || "[]";
      branch.finalGMatrix = active.finalGMatrix || active.gMatrix || branch.gMatrix || "[]";
      branch.finalIhisVector = active.finalIhisVector || active.ihisVector || branch.ihisVector || "[]";
      pkg.dummyNodeBlocks = structuredClone(active.dummyNodeBlocks || []);
      branch.currents = structuredClone(active.currents || branch.currents || []);
      branch.gIsConstant = active.gIsConstant !== false;
      branch.constantGSymbols = active.constantGSymbols || branch.constantGSymbols || "";
      return active;
    }

    function normalizePackageNetworkCases(branch) {
      const pkg = branch?.packageOriginal;
      if (!pkg) return;
      if (!Array.isArray(pkg.networkCases) || !pkg.networkCases.length) {
        pkg.networkCases = [packageNetworkCaseFromBranch(branch, 0)];
      }
      pkg.networkCases = pkg.networkCases.map((source, index) => ({
        ...packageNetworkCaseFromBranch(branch, index),
        ...(source || {}),
        name: String(source?.name || `Case ${index + 1}`)
      }));
      const activeIndex = Math.max(0, Math.min(pkg.networkCases.length - 1, Number(pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0));
      pkg.activeNetworkCase = activeIndex;
      branch.switchCases = pkg.networkCases.map((item, index) => ({
        name: item.name || `Case ${index + 1}`,
        gMatrix: item.gMatrix || "[]",
        ihisVector: item.ihisVector || "[]",
        gIsConstant: item.gIsConstant !== false,
        constantGSymbols: item.constantGSymbols || ""
      }));
      branch.activeSwitchCase = activeIndex;
      applyPackageNetworkCase(branch, activeIndex);
    }

    function activePackageNetworkCaseIndex(branch) {
      const pkg = branch?.packageOriginal;
      const count = pkg?.networkCases?.length || 1;
      return Math.max(0, Math.min(count - 1, Number(pkg?.activeNetworkCase ?? branch?.activeSwitchCase) || 0));
    }

    function activePackageNetworkCaseName(branch) {
      normalizePackageNetworkCases(branch);
      const pkg = branch?.packageOriginal;
      const index = activePackageNetworkCaseIndex(branch);
      return pkg?.networkCases?.[index]?.name || `Case ${index + 1}`;
    }

    function normalizeSwitchCases(branch) {
      if (branch?.kind === "current_source" || branch?.kind === "voltage_source_series_r") {
        delete branch.switchCases;
        branch.activeSwitchCase = 0;
        return;
      }
      if (branch?.packageOriginal) {
        normalizePackageNetworkCases(branch);
        return;
      }
      if (!Array.isArray(branch.switchCases) || branch.switchCases.length <= 1) {
        delete branch.switchCases;
        branch.activeSwitchCase = 0;
        return;
      }
      const fields = switchedValueFields(branch);
      branch.switchCases = branch.switchCases.map((source, index) => {
        const item = {
          ...switchCaseFromBranch(branch, index),
          ...(source || {}),
          name: String(source?.name || `Case ${index + 1}`)
        };
        fields.forEach(field => {
          if (!item[field]) item[field] = branch[field] || switchCaseFromBranch(branch, index)[field];
        });
        if (item.gIsConstant === undefined) item.gIsConstant = branch.gIsConstant !== false;
        if (item.constantGSymbols === undefined) item.constantGSymbols = branch.constantGSymbols || "";
        return item;
      });
      branch.activeSwitchCase = Math.max(0, Math.min(branch.switchCases.length - 1, Number(branch.activeSwitchCase) || 0));
    }

    function activeSwitchCase(branch) {
      normalizeSwitchCases(branch);
      return branch.switchCases?.[branch.activeSwitchCase || 0] || null;
    }

    function branchValue(branch, field) {
      return activeSwitchCase(branch)?.[field] ?? branch[field] ?? "";
    }

    function setBranchSwitchedValue(branch, field, value) {
      if (branch?.packageOriginal) return false;
      const activeCase = activeSwitchCase(branch);
      if (activeCase && switchedValueFields(branch).includes(field)) {
        activeCase[field] = value;
        return true;
      }
      return false;
    }

    function switchCaseLabel(branch) {
      const activeCase = activeSwitchCase(branch);
      if (!activeCase || !branch.switchCases?.length) return "";
      return activeCase.name || `Case ${(branch.activeSwitchCase || 0) + 1}`;
    }

    function switchCaseLabelSvg(branch, yOffset = 22) {
      const label = switchCaseLabel(branch);
      return label ? `<text class="switch-label" x="${branch.x}" y="${branch.y + yOffset}">${escapeSvg(label)}</text>` : "";
    }

    function currentSourceModeLabel(branch) {
      return branch.sourceMode === "node_voltage" ? tr("节点电压相关") : tr("独立电流源");
    }

    function currentSourceIhis(branch) {
      if (branch.sourceMode === "node_voltage") return branch.sourceIhis || "0";
      const expression = String(branch.currentExpression || "").trim();
      if (expression) return expression;
      const sourceIhis = String(branch.sourceIhis || "").trim();
      if (sourceIhis && sourceIhis !== "0") return sourceIhis;
      return branch.name || "0";
    }

    function currentSourceControlText(branch) {
      const rows = Array.isArray(branch.controlRows) ? branch.controlRows : [];
      const rowText = rows
        .map(row => ({
          node: String(row?.node || "").trim(),
          coefficient: String(row?.coefficient || "").trim()
        }))
        .filter(row => row.node && row.coefficient && row.coefficient !== "0")
        .map(row => `${row.node}: ${row.coefficient}`)
        .join("\n");
      if (rowText) return rowText;
      if (branch.controlPositive || branch.controlNegative) {
        return [
          branch.controlPositive ? `${branch.controlPositive}: ${branch.gain || "gm"}` : "",
          branch.controlNegative ? `${branch.controlNegative}: -(${branch.gain || "gm"})` : ""
        ].filter(Boolean).join("\n");
      }
      const text = String(branch.controlTerms || "").trim();
      if (text) return text;
      return "";
    }

    function currentSourceControlRows(branch) {
      const rows = Array.isArray(branch.controlRows) ? branch.controlRows : [];
      if (rows.length) {
        return rows.map(row => ({
          node: String(row?.node || "").trim(),
          coefficient: String(row?.coefficient || "").trim() || "0"
        }));
      }
      if (branch.controlPositive || branch.controlNegative) {
        return [
          { node: branch.controlPositive || "", coefficient: branch.gain || "gm" },
          { node: branch.controlNegative || "", coefficient: `-(${branch.gain || "gm"})` }
        ];
      }
      return parseCurrentSourceControlTerms({ ...branch, controlRows: [] })
        .filter(item => !item.error)
        .map(item => ({ node: item.node, coefficient: item.coefficient }));
    }

    function setCurrentSourceControlRowCount(branch, value) {
      const count = Math.max(0, Math.min(12, Math.floor(Number(value))));
      if (!Number.isFinite(count)) return;
      const next = currentSourceControlRows(branch).slice(0, count);
      while (next.length < count) next.push({ node: "", coefficient: next.length === 0 ? "gm" : "0" });
      branch.controlRows = next;
      branch.controlTerms = "";
      branch.controlPositive = "";
      branch.controlNegative = "";
    }

    function parseCurrentSourceControlTerms(branch) {
      if (branch.sourceMode !== "node_voltage") return [];
      const text = currentSourceControlText(branch);
      const trimmed = text.trim();
      if (!trimmed) return [];
      try {
        if (trimmed.startsWith("{")) {
          const parsed = JSON.parse(trimmed);
          return Object.entries(parsed)
            .map(([node, coefficient]) => ({ node: String(node).trim(), coefficient: String(coefficient).trim() || "0" }))
            .filter(item => item.node);
        }
      } catch {
        return [{ error: tr("控制项 JSON 解析失败。") }];
      }
      const matches = [...trimmed.matchAll(/([A-Za-z_]\w*)\s*:/g)];
      const rawItems = matches.length
        ? matches.map((match, index) => {
          const end = index + 1 < matches.length ? matches[index + 1].index : trimmed.length;
          return `${match[1]}:${trimmed.slice(match.index + match[0].length, end)}`;
        })
        : trimmed.split(/[\n,;]+/);
      return rawItems
        .map(item => item.trim().replace(/[,;]+$/g, ""))
        .filter(Boolean)
        .map(item => {
          const index = item.indexOf(":");
          if (index < 0) return { error: `${tr("控制项需要使用 节点:系数 格式。")} ${item}` };
          return {
            node: item.slice(0, index).trim(),
            coefficient: item.slice(index + 1).trim() || "0"
          };
        })
        .filter(item => item.error || item.node);
    }

    function formatControlTermExpression(term, index) {
      if (!term?.node || !term.coefficient || term.coefficient === "0") return "";
      const body = `(${term.coefficient}) * V_${term.node}`;
      return index === 0 ? body : ` + ${body}`;
    }

    function currentSourceExpression(branch, nodeLabelMap = null) {
      const ihis = currentSourceIhis(branch);
      if (branch.sourceMode !== "node_voltage") return ihis || "0";
      const terms = parseCurrentSourceControlTerms(branch).filter(item => !item.error);
      const body = terms.map(term => ({
        ...term,
        node: nodeLabelMap?.get(term.node) || term.node
      })).map(formatControlTermExpression).filter(Boolean).join("");
      if (body && ihis && ihis !== "0") return `${body} + ${ihis}`;
      return body || ihis || "0";
    }

    function currentSourceStampPreview(branch) {
      const fromSide = branch.direction === "AtoB" ? "A" : "B";
      const toSide = branch.direction === "AtoB" ? "B" : "A";
      const fromNode = terminalNetName(terminalKey(branch.id, fromSide));
      const toNode = terminalNetName(terminalKey(branch.id, toSide));
      const lines = [];
      if (branch.sourceMode === "node_voltage") {
        parseCurrentSourceControlTerms(branch)
          .filter(term => !term.error && term.node && term.coefficient && term.coefficient !== "0")
          .forEach(term => {
            lines.push(`G[${fromNode}, ${term.node}] += ${term.coefficient}`);
            lines.push(`G[${toNode}, ${term.node}] -= ${term.coefficient}`);
          });
      }
      const ihis = currentSourceIhis(branch) || "0";
      lines.push(`Ihis[${fromNode}] += ${ihis}`);
      lines.push(`Ihis[${toNode}] -= ${ihis}`);
      return lines.join("\n");
    }

    function voltageSourceSeriesConductance(branch) {
      if (branch.conductance !== undefined && String(branch.conductance).trim() !== "") return wrapExpr(branch.conductance);
      if (branch.resistance !== undefined && String(branch.resistance).trim() !== "") return exprDiv("1", branch.resistance);
      return "G";
    }

    function voltageSourceSeriesIhis(branch) {
      return negateExpr(exprMul(voltageSourceSeriesConductance(branch), branch.voltage || "Vs"));
    }

    function voltageSourceSeriesCurrentExpression(branch, groupByTerminal = null) {
      const netName = side => terminalNetNameFromMap(terminalKey(branch.id, side), groupByTerminal);
      const p = netName("P");
      const n = netName("N");
      const gs = voltageSourceSeriesConductance(branch);
      const vs = branch.voltage || "Vs";
      return `(${gs}) * (V_${p} - V_${n} - (${vs}))`;
    }

    function voltageSourceSeriesStampPreview(branch) {
      const pNode = terminalNetName(terminalKey(branch.id, "P"));
      const nNode = terminalNetName(terminalKey(branch.id, "N"));
      const gs = voltageSourceSeriesConductance(branch);
      const ihis = voltageSourceSeriesIhis(branch);
      return [
        `Gs = ${gs}`,
        `G[${pNode}, ${pNode}] += ${gs}`,
        `G[${pNode}, ${nNode}] -= ${gs}`,
        `G[${nNode}, ${pNode}] -= ${gs}`,
        `G[${nNode}, ${nNode}] += ${gs}`,
        `Ihis[${pNode}] += ${ihis}`,
        `Ihis[${nNode}] -= ${ihis}`
      ].join("\n");
    }

    function validateVoltageSourceSeriesR(branch) {
      const warnings = [];
      const conductance = String(branch.conductance || "").trim();
      if (!conductance) warnings.push(tr("串联导纳不能为空。"));
      const numeric = Number(conductance);
      if (conductance && Number.isFinite(numeric)) {
        if (numeric === 0) warnings.push(tr("串联导纳不能为 0。"));
        if (numeric < 0) warnings.push(tr("串联导纳不能为负数。"));
      }
      return warnings;
    }

    function validateCurrentSourceAgainstGroups(branch, groups) {
      if (branch.kind !== "current_source") return [];
      const warnings = [];
      const names = new Set();
      groups.forEach(group => {
        names.add(group.id);
        const display = group.display || nodeDisplayName(group.id);
        if (display) names.add(display);
      });
      const terms = parseCurrentSourceControlTerms(branch);
      terms.forEach(term => {
        if (term.error) {
          warnings.push(term.error);
        } else if (term.node && !names.has(term.node)) {
          warnings.push(`${tr("受控电流源控制节点不存在")}: ${term.node}`);
        }
      });
      return warnings;
    }

    function cycleCurrentSourceMode(branch) {
      commitHistory();
      branch.sourceMode = branch.sourceMode === "node_voltage" ? "independent" : "node_voltage";
      invalidateMathCaches();
      selectBranch(branch.id);
      statusEl.textContent = `${branch.name}: ${currentSourceModeLabel(branch)}`;
      render();
      return true;
    }

    function setSwitchCaseCount(branch, value) {
      const count = Math.max(1, Math.min(12, Math.floor(Number(value))));
      if (!Number.isFinite(count)) return;
      if (count <= 1) {
        const activeCase = activeSwitchCase(branch);
        if (activeCase) {
          switchedValueFields(branch).forEach(field => { branch[field] = activeCase[field] || branch[field]; });
          branch.gIsConstant = activeCase.gIsConstant !== false;
          branch.constantGSymbols = activeCase.constantGSymbols || "";
        }
        delete branch.switchCases;
        branch.activeSwitchCase = 0;
        return;
      }
      normalizeSwitchCases(branch);
      const next = branch.switchCases?.slice(0, count) || [switchCaseFromBranch(branch, 0)];
      while (next.length < count) next.push({ ...switchCaseFromBranch(branch, next.length), name: `Case ${next.length + 1}` });
      branch.switchCases = next;
      branch.activeSwitchCase = Math.max(0, Math.min(next.length - 1, Number(branch.activeSwitchCase) || 0));
    }

    function setActiveSwitchCase(branch, value) {
      normalizeSwitchCases(branch);
      if (!branch.switchCases?.length) return;
      branch.activeSwitchCase = Math.max(0, Math.min(branch.switchCases.length - 1, Number(value) || 0));
    }

    function isRuntimeMutableCaseGroup(branch) {
      normalizeSwitchCases(branch);
      return Boolean(branch?.runtimeMutableCaseGroup && Array.isArray(branch.switchCases) && branch.switchCases.length > 1);
    }

    function switchCaseEditor(branch, showCaption = true) {
      normalizeSwitchCases(branch);
      const count = branch.switchCases?.length || 1;
      const activeIndex = branch.activeSwitchCase || 0;
      const activeCase = activeSwitchCase(branch);
      const runtimeMutable = isRuntimeMutableCaseGroup(branch);
      return `
        ${showCaption ? `<div class="field-caption">${escapeHtml(tr("开关工况"))}</div>` : ""}
        <div class="row">
          <div class="field">
            <label>${escapeHtml(tr("工况数量"))}</label>
            <input data-field="switchCount" type="number" min="1" max="12" value="${count}">
          </div>
          <div class="field">
            <label>${escapeHtml(tr("当前工况"))}</label>
            <select data-field="switchActive" ${count <= 1 ? "disabled" : ""}>
              ${Array.from({ length: count }, (_, index) => `
                <option value="${index}" ${index === activeIndex ? "selected" : ""}>${escapeHtml(branch.switchCases?.[index]?.name || `Case ${index + 1}`)}</option>
              `).join("")}
            </select>
          </div>
        </div>
        ${activeCase ? editableField("工况名称", "switchCaseName", activeCase.name || `Case ${activeIndex + 1}`) : ""}
        ${count > 1 ? `
          <div class="runtime-case-card ${runtimeMutable ? "active" : ""}">
            <label class="runtime-case-card-toggle">
              <span class="runtime-case-card-copy">
                <span class="runtime-case-card-heading">
                  <span class="runtime-case-card-title">${escapeHtml(tr("运行时工况切换"))}</span>
                  <span class="runtime-case-card-pill">${escapeHtml(tr(runtimeMutable ? "已启用" : "未启用"))}</span>
                </span>
                <span class="runtime-case-card-help">
                  ${escapeHtml(tr(runtimeMutable
                    ? "只允许在 CODE 阶段切换数值表达式；拓扑、节点顺序、节点划分和矩阵维度必须保持不变。"
                    : "case id 可在 CODE 阶段改变"))}
                </span>
              </span>
              <input data-field="runtimeMutableCaseGroup" type="checkbox" ${runtimeMutable ? "checked" : ""}>
            </label>
          </div>
        ` : ""}
      `;
    }

    function packagedCaseBranches(branch) {
      return (branch.packageOriginal?.branches || [])
        .map((inner, index) => ({ inner, index }))
        .filter(({ inner }) => Array.isArray(inner.switchCases) && inner.switchCases.length > 1);
    }

    function packagedCaseEditor(branch, showCaption = true) {
      const items = packagedCaseBranches(branch);
      const networkCaseUi = packagedNetworkCaseEditor(branch);
      return `
        ${showCaption ? `<div class="field-caption">${escapeHtml(tr("内部工况"))}</div>` : ""}
        ${networkCaseUi}
        ${items.length ? `
          <div class="packaged-case-list">
            ${items.map(({ inner, index }) => {
              normalizeSwitchCases(inner);
              const activeIndex = Math.max(0, Math.min(inner.switchCases.length - 1, Number(inner.activeSwitchCase) || 0));
              return `
                <div class="packaged-case-row">
                  <label>${escapeHtml(inner.name || inner.id)}</label>
                  <select data-package-case-index="${index}">
                    ${inner.switchCases.map((item, caseIndex) => `
                      <option value="${caseIndex}" ${caseIndex === activeIndex ? "selected" : ""}>${escapeHtml(item.name || `Case ${caseIndex + 1}`)}</option>
                    `).join("")}
                  </select>
                </div>
              `;
            }).join("")}
          </div>
          <div class="modal-help">${escapeHtml(tr("切换内部支路工况后，会重新计算这个打包黑盒的 G/Ihis 和观测公式。"))}</div>
        ` : `<div class="modal-help">${escapeHtml(tr("没有内部支路包含多个工况。"))}</div>`}
      `;
    }

    function packagedNetworkCaseEditor(branch) {
      normalizePackageNetworkCases(branch);
      const pkg = branch.packageOriginal;
      const cases = pkg?.networkCases || [];
      const activeIndex = activePackageNetworkCaseIndex(branch);
      return `
        <div class="field-caption">${escapeHtml(tr("内部网络工况"))}</div>
        <div class="row">
          <div class="field">
            <label>${escapeHtml(tr("当前 Pack 工况"))}</label>
            <select data-package-network-case-active ${cases.length <= 1 ? "disabled" : ""}>
              ${cases.map((item, index) => `
                <option value="${index}" ${index === activeIndex ? "selected" : ""}>${escapeHtml(item.name || `Case ${index + 1}`)}</option>
              `).join("")}
            </select>
          </div>
        </div>
        ${cases[activeIndex] ? editableField("Pack 工况名称", "packageNetworkCaseName", cases[activeIndex].name || `Case ${activeIndex + 1}`) : ""}
        <div class="row">
          <button class="text-button" type="button" data-package-network-action="duplicate">${escapeHtml(tr("复制当前内部网络为新工况"))}</button>
          <button class="text-button" type="button" data-package-network-action="edit">${escapeHtml(tr("编辑当前内部网络工况"))}</button>
        </div>
        <div class="modal-help">${escapeHtml(tr("进入内部工况编辑后，画布会暂时显示该 Pack 的内部网络。点击“完成并保存 Pack 工况”重新等效并回到外层。"))}</div>
      `;
    }

    function isFixedDummyGElement(branch) {
      return branch?.kind === "dummy_node_block" || branch?.element_type === "dummy_node_block";
    }

    function packagedGBranches(branch) {
      return (branch.packageOriginal?.branches || [])
        .map((inner, index) => ({ inner, index }))
        .filter(({ inner }) => inner.kind !== "ground")
        .filter(({ inner }) => {
          if (isFixedDummyGElement(inner)) return false;
          return true;
        });
    }

    function packagedGConstEditor(branch, showCaption = true) {
      const items = packagedGBranches(branch);
      if (isRuntimeMutableCaseGroup(branch)) {
        return `
          ${showCaption ? `<div class="field-caption">${escapeHtml(tr("内部 G 常数属性"))}</div>` : ""}
          ${runtimeMutableGConstantNotice()}
        `;
      }
      return `
        ${showCaption ? `<div class="field-caption">${escapeHtml(tr("内部 G 常数属性"))}</div>` : ""}
        ${items.length ? `
          <div class="row">
            <button class="text-button" type="button" data-packaged-gconst-all="1">${escapeHtml(tr("全部设为常数"))}</button>
            <button class="text-button" type="button" data-packaged-gconst-all="0">${escapeHtml(tr("全部设为非常数"))}</button>
          </div>
          <div class="packaged-case-list">
            ${items.map(({ inner, index }) => {
              const isConstant = inner.gIsConstant !== false;
              const symbols = [...branchConstantGSymbols(inner)].sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
              return `
                <div class="packaged-case-row">
                  <label>${escapeHtml(inner.name || inner.id)}</label>
                  <select data-field="packedG.${index}.gIsConstant">
                    <option value="1" ${isConstant ? "selected" : ""}>${escapeHtml(tr("常数"))}</option>
                    <option value="0" ${!isConstant ? "selected" : ""}>${escapeHtml(tr("非常数"))}</option>
                  </select>
                </div>
                ${editableField(
                  state.language === "en"
                    ? `${inner.name || inner.id} Constant G Symbols`
                    : `${inner.name || inner.id} 常数 G 符号`,
                  `packedG.${index}.constantGSymbols`,
                  inner.constantGSymbols || "",
                  false
                )}
                <div class="modal-help">${escapeHtml(tr("可选：主要用于 G 表达式里常数和变量混合的情况；普通单支路通常不用填写。"))}</div>
                <div class="modal-help">${escapeHtml(tr("当前识别为常数的 G 符号"))}: ${escapeHtml(symbols.join(", ") || tr("无"))}</div>
              `;
            }).join("")}
          </div>
          <div class="modal-help">${escapeHtml(tr("打包黑盒会按内部支路变量名判断常数；批量按钮只改变内部支路 G 的常数/非常数标记。"))}</div>
        ` : `<div class="modal-help">${escapeHtml(tr("这个打包黑盒没有可设置 G 常数属性的内部支路。"))}</div>`}
      `;
    }

    function branchHighlightColor(branch) {
      const color = String(branch.formulaHighlightColor || "#ef4444").trim();
      return /^#[0-9A-Fa-f]{6}$/.test(color) ? color : "#ef4444";
    }

    function branchHighlightEditor(branch, showCaption = true) {
      const color = branchHighlightColor(branch);
      return `
        ${showCaption ? `<div class="field-caption">${escapeHtml(tr("高亮"))}</div>` : ""}
        <div class="highlight-controls">
          <label class="compact-check">
            <input data-field="formulaHighlightEnabled" type="checkbox" ${branch.formulaHighlightEnabled ? "checked" : ""}>
            <span>${escapeHtml(tr("公式高亮"))}</span>
          </label>
          <label class="compact-check">
            <input data-field="formulaHighlightCanvas" type="checkbox" ${branch.formulaHighlightCanvas ? "checked" : ""}>
            <span>${escapeHtml(tr("画布高亮"))}</span>
          </label>
          <div class="color-chip-field">
            <label>${escapeHtml(tr("颜色"))}</label>
            <div class="color-chip-row">
              <input class="color-chip" data-field="formulaHighlightColor" type="color" value="${escapeHtml(color)}">
              <span class="color-chip-value">${escapeHtml(color.toUpperCase())}</span>
            </div>
          </div>
        </div>
        <div class="modal-help">${escapeHtml(tr("公式高亮只改变匹配 G/Ihis 片段的字体颜色；画布高亮只标记画布里的元件。"))}</div>
      `;
    }

    function activeHighlightedBranches() {
      return state.branches.filter(branch => branch.formulaHighlightEnabled);
    }

    function branchHighlightSourceIds(branch) {
      const ids = new Set([branch?.id].filter(Boolean));
      if (branch?.packageOriginal?.branches) {
        branch.packageOriginal.branches.forEach(inner => ids.add(inner.id));
      }
      return ids;
    }

    function normalizeHighlightText(text) {
      return String(text || "")
        .replace(/\s+/g, "")
        .replace(/^\((.*)\)$/g, "$1");
    }

    function highlightSymbolsFromText(text) {
      const ignored = new Set(["Abs", "V", "I", "Ihis", "sin", "cos", "tan", "exp", "log", "sqrt"]);
      const out = new Set();
      String(text || "").replace(/\b[A-Za-z_]\w*\b/g, name => {
        if (!ignored.has(name)) out.add(name);
        return name;
      });
      return [...out];
    }

    function branchHighlightMarkers(branch) {
      const texts = [];
      if (branch.kind === "current_source") {
        parseCurrentSourceControlTerms(branch).forEach(term => {
          if (!term.error) texts.push(term.coefficient);
        });
        texts.push(currentSourceIhis(branch));
      } else if (branch.kind === "voltage_source_series_r") {
        texts.push(voltageSourceSeriesConductance(branch), voltageSourceSeriesIhis(branch));
      } else if (branchUsesMatrix(branch)) {
        parseMatrixRows(branchValue(branch, "gMatrix")).flat().forEach(item => texts.push(item));
        parseMatrixRows(branchValue(branch, "ihisVector")).flat().forEach(item => texts.push(item));
      } else {
        texts.push(branchValue(branch, "g"), branchValue(branch, "ihis"));
      }
      const raw = [];
      const symbols = new Set();
      texts.forEach(text => {
        const normalized = normalizeHighlightText(text);
        if (normalized && normalized !== "0") raw.push(normalized);
        highlightSymbolsFromText(text).forEach(name => symbols.add(name));
      });
      return { raw, symbols: [...symbols] };
    }

    function sourceTagForBranch(branchOrId) {
      const raw = typeof branchOrId === "string" ? branchOrId : branchOrId?.id;
      return `bbsrc_${String(raw || "unknown").replace(/[^A-Za-z0-9_]/g, "_")}`;
    }

    function sourceMarkerForBranch(branchOrId) {
      return `__${sourceTagForBranch(branchOrId)}`;
    }

    function activeSourceHighlightBranch(sourceIds) {
      const ids = new Set([].concat(sourceIds || []));
      return activeHighlightedBranches().find(branch => {
        const branchIds = branchHighlightSourceIds(branch);
        return [...ids].some(id => branchIds.has(id));
      }) || null;
    }

    function taggedExprMatchesBranch(expr, branch) {
      if (!branch) return false;
      const text = String(expr || "");
      return [...branchHighlightSourceIds(branch)].some(id => text.includes(sourceMarkerForBranch(id)));
    }

    function activeTaggedHighlightBranch(expr) {
      const text = String(expr || "");
      if (!text || text.trim() === "0") return null;
      return activeHighlightedBranches().find(branch => taggedExprMatchesBranch(text, branch)) || null;
    }

    function expressionMatchesBranchHighlight(expr, branch) {
      const text = String(expr || "0");
      if (!text || text.trim() === "0") return false;
      const normalized = normalizeHighlightText(text);
      const markers = branchHighlightMarkers(branch);
      if (markers.raw.some(item => item && item !== "0" && normalized.includes(item))) return true;
      return markers.symbols.some(symbol => new RegExp(`\\b${escapeRegExp(symbol)}\\b`).test(text));
    }

    function exactExpressionHighlightBranch(expr) {
      const normalized = normalizeHighlightText(expr);
      if (!normalized || normalized === "0") return null;
      return activeHighlightedBranches().find(branch =>
        branchHighlightMarkers(branch).raw.some(item => item && item !== "0" && normalizeHighlightText(item) === normalized)
      ) || null;
    }

    function wrapMathHighlight(expr, html) {
      const branch = exactExpressionHighlightBranch(expr);
      if (!branch) return null;
      const color = branchHighlightColor(branch);
      return `<span class="math-branch-highlight" style="--branch-highlight-color:${escapeHtml(color)}">${html}</span>`;
    }

    function wrapMathSourceHighlight(branch, html) {
      if (!branch) return html;
      const color = branchHighlightColor(branch);
      return `<span class="math-branch-highlight" style="--branch-highlight-color:${escapeHtml(color)}">${html}</span>`;
    }

    function branchCanvasHighlight(branch) {
      if (!branch?.formulaHighlightCanvas) return { className: "", style: "" };
      const color = branchHighlightColor(branch);
      return {
        className: " formula-highlight",
        style: `--branch-highlight-color:${escapeHtml(color)}`
      };
    }

    function currentFormula(branch, groupByTerminal = null) {
      const netName = side => terminalNetNameFromMap(terminalKey(branch.id, side), groupByTerminal);
      if (branch.kind === "dummy_node_block") return "";
      if (branch.kind === "ground") {
        return `V_${netName("G")} = 0`;
      }
      if (branch.kind === "current_source") {
        const leftKey = terminalKey(branch.id, "A");
        const rightKey = terminalKey(branch.id, "B");
        const fromKey = branch.direction === "AtoB" ? leftKey : rightKey;
        const toKey = branch.direction === "AtoB" ? rightKey : leftKey;
        const fromLabel = terminalNetNameFromMap(fromKey, groupByTerminal);
        const toLabel = terminalNetNameFromMap(toKey, groupByTerminal);
        const expression = currentSourceExpression(branch);
        return `i_${branch.name}_${fromLabel}_to_${toLabel} = ${expression}`;
      }
      if (branch.kind === "voltage_source_series_r") {
        const pLabel = terminalNetNameFromMap(terminalKey(branch.id, "P"), groupByTerminal);
        const nLabel = terminalNetNameFromMap(terminalKey(branch.id, "N"), groupByTerminal);
        return `i_${branch.name}_${pLabel}_to_${nLabel} = ${voltageSourceSeriesCurrentExpression(branch, groupByTerminal)}`;
      }
      if (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") {
        const replacements = {};
        terminalSides(branch).forEach(side => {
          replacements[`V_${side}`] = `V_${netName(side)}`;
        });
        return branch.currents.map(current => {
          const fromSide = branch.kind === "custom_n_port" && !branch.packageOriginal ? customObserverNodeId(branch, current.from) : current.from;
          const toSide = branch.kind === "custom_n_port" && !branch.packageOriginal ? customObserverNodeId(branch, current.to) : current.to;
          let expression = branch.kind === "custom_n_port" && !branch.packageOriginal
            ? `(${current.g || "0"}) * (V_${fromSide} - V_${toSide}) + ${current.ihis || "0"}`
            : current.expression;
          if (branch.packageOriginal) {
            expression = packagedExpressionForDisplay(branch, expression);
          } else {
            Object.entries(replacements).forEach(([key, value]) => {
              expression = expression.replace(new RegExp(`\\b${key}\\b`, "g"), value);
            });
          }
          const fromLabel = branch.kind === "custom_n_port" && !branch.packageOriginal
            ? customObserverDisplayName(branch, fromSide)
            : currentEndpointLabel(branch, current, "from", groupByTerminal);
          const toLabel = branch.kind === "custom_n_port" && !branch.packageOriginal
            ? customObserverDisplayName(branch, toSide)
            : currentEndpointLabel(branch, current, "to", groupByTerminal);
          return `i_${branch.name}_${current.name}_${fromLabel}_to_${toLabel} = ${expression}`;
        }).join("\n");
      }
      const leftKey = terminalKey(branch.id, "A");
      const rightKey = terminalKey(branch.id, "B");
      const fromKey = branch.direction === "AtoB" ? leftKey : rightKey;
      const toKey = branch.direction === "AtoB" ? rightKey : leftKey;
      const fromLabel = terminalNetNameFromMap(fromKey, groupByTerminal);
      const toLabel = terminalNetNameFromMap(toKey, groupByTerminal);
      const ihis = branchValue(branch, "ihis");
      const sign = branch.direction === "AtoB" ? ihis : `-(${ihis})`;
      return `i_${branch.name}_${fromLabel}_to_${toLabel} = (${branchValue(branch, "g")}) * (V_${fromLabel} - V_${toLabel}) + ${sign}`;
    }

    function currentFormulaEntries(branch, groupByTerminal = null) {
      if (branch.kind === "dummy_node_block") return [];
      const lines = currentFormula(branch, groupByTerminal).split("\n").filter(Boolean);
      if (branch.kind === "ground") {
        return lines.map(line => ({ line, branchId: branch.id, part: "ground" }));
      }
      if (branch.packageOriginal) {
        return lines.map((line, index) => ({
          line,
          branchId: branch.id,
          part: `current:${index}`,
          eliminated: Boolean(branch.currents?.[index]?.fromEliminated || branch.currents?.[index]?.toEliminated)
        }));
      }
      if (branch.kind === "custom_n_port") {
        if (!branch.currents?.length) {
          return [{
            note: tr("该黑盒未定义支路电流观测器，因此支路电流不可观测/悬空。"),
            name: branch.name
          }];
        }
        return lines.map((line, index) => ({
          line,
          branchId: branch.id,
          part: `current:${index}`
        }));
      }
      if (branch.kind === "single_phase_transformer") {
        return lines.map((line, index) => ({
          line,
          branchId: branch.id,
          part: branch.currents?.[index]?.name || ""
        }));
      }
      if (branch.kind === "current_source") {
        return lines.map(line => ({ line, branchId: branch.id, part: "source" }));
      }
      if (branch.kind === "voltage_source_series_r") {
        return lines.map(line => ({ line, branchId: branch.id, part: "voltage-source" }));
      }
      return lines.map(line => ({ line, branchId: branch.id, part: "whole" }));
    }

    function modelJson() {
      return {
        version: 1,
        kind: "two_node_branch_network",
        branches: state.branches.map(branch => ({
          id: branch.id,
          name: branch.name,
          type: branch.kind,
          terminals: Object.fromEntries(terminalSides(branch).map(side => [
            side,
            {
              node: branchNodeForSide(branch, side),
              net: terminalNetName(terminalKey(branch.id, side))
            }
          ])),
          switchCase: switchCaseLabel(branch) || null,
          switchCases: branch.switchCases || null,
          G: branch.kind === "current_source" ? "0" : (branch.kind === "voltage_source_series_r" ? matrixLiteral(localGMatrix(branch)) : ((branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") ? branchValue(branch, "gMatrix") : branchValue(branch, "g"))),
          Ihis: branch.kind === "current_source" ? "0" : (branch.kind === "voltage_source_series_r" ? vectorLiteral(localIhisVector(branch)) : ((branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") ? branchValue(branch, "ihisVector") : branchValue(branch, "ihis"))),
          source: branch.kind === "current_source" ? {
            mode: branch.sourceMode || "independent",
            currentExpression: branch.currentExpression || "",
            controlTerms: currentSourceControlText(branch),
            controlRows: currentSourceControlRows(branch),
            Ihis: currentSourceIhis(branch),
            sourceIhis: branch.sourceIhis || "",
            gain: branch.gain || "",
            controlPositive: branch.controlPositive || "",
            controlNegative: branch.controlNegative || "",
            description: branch.description || "",
            mathEnabled: Boolean(branch.mathEnabled)
          } : (branch.kind === "voltage_source_series_r" ? {
            kind: "VoltageSourceSeriesR",
            voltage: branch.voltage || "Vs",
            conductance: voltageSourceSeriesConductance(branch),
            nodeP: branch.nodes?.P || "",
            nodeN: branch.nodes?.N || ""
          } : null),
          current: {
            from: (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") ? branch.currents.map(item => item.from) : (branch.kind === "voltage_source_series_r" ? "P" : (branch.direction === "AtoB" ? "A" : "B")),
            to: (branch.kind === "single_phase_transformer" || branch.kind === "custom_n_port") ? branch.currents.map(item => item.to) : (branch.kind === "voltage_source_series_r" ? "N" : (branch.direction === "AtoB" ? "B" : "A")),
            formula: currentFormula(branch)
          },
          drawing: {
            x: Math.round(branch.x),
            y: Math.round(branch.y),
            rotation: branch.rotation
          }
        })),
        wires: state.wires.map(wire => ({ id: wire.id, from: wire.from, to: wire.to })),
        nets: netGroups()
      };
    }

    function circuitStateJson() {
      syncCanvasOrderFromTabs();
      saveActiveCanvas();
      const canvases = state.canvases.map(canvasState => ({
        id: canvasState.id,
        name: canvasState.name,
        data: structuredClone(canvasState.data || blankCanvasData(canvasState.name))
      }));
      return {
        fileType: "branch-builder-circuit",
        version: 3,
        savedAt: new Date().toISOString(),
        generator: "Branch Builder",
        world: WORLD,
        ui: {
          language: state.language,
          activeOutput: state.activeOutput,
          showLocalLabels: state.showLocalLabels,
          showReducedBranchCurrents: state.showReducedBranchCurrents,
          panelWidth: state.panelWidth,
          editorGroups: structuredClone(state.editorGroups || {}),
          multiCaseProfilesText: state.multiCaseProfilesText || "",
          multiCaseProfilesKey: state.multiCaseProfilesKey || "",
          multiCaseIdSymbol: state.multiCaseIdSymbol || "case_id"
        },
        canvasOrder: canvases.map(item => item.id),
        canvases,
        activeCanvasId: state.activeCanvasId,
        nextCanvas: state.nextCanvas,
        branches: structuredClone(state.branches),
        wires: structuredClone(state.wires),
        groups: structuredClone(state.groups),
        nodeOrder: structuredClone(state.nodeOrder),
        nodeLabels: structuredClone(state.nodeLabels),
        nodeColors: structuredClone(state.nodeColors),
        internalNodes: structuredClone(state.internalNodes),
        language: state.language,
        activeOutput: state.activeOutput,
        showLocalLabels: state.showLocalLabels,
        showReducedBranchCurrents: state.showReducedBranchCurrents,
        panelWidth: state.panelWidth,
        editorGroups: structuredClone(state.editorGroups || {}),
        multiCaseProfilesText: state.multiCaseProfilesText || "",
        multiCaseProfilesKey: state.multiCaseProfilesKey || "",
        multiCaseIdSymbol: state.multiCaseIdSymbol || "case_id",
        selectedId: state.selectedId,
        selectedIds: structuredClone(state.selectedIds || []),
        selectedNetIds: structuredClone(state.selectedNetIds || []),
        selectedWireId: state.selectedWireId,
        zoom: state.zoom,
        viewCenter: structuredClone(state.viewCenter),
        reducedEquationCache: currentReducedCacheSnapshot(),
        branchCurrentCache: currentCacheSnapshot(branchCurrentCache, ["html"]),
        pythonDraftCache: currentCacheSnapshot(pythonDraftCache, ["result"]),
        optimizedEliminationCache: currentCacheSnapshot(optimizedEliminationCache, ["result"]),
        multiCaseExportCache: currentCacheSnapshot(multiCaseExportCache, ["result"]),
        nextBranch: state.nextBranch,
        nextTransformer: state.nextTransformer,
        nextCustom: state.nextCustom,
        nextWire: state.nextWire,
        nextGroup: state.nextGroup
      };
    }

    function applyProjectUiState(data) {
      const ui = data?.ui || data || {};
      state.language = ui.language || data?.language || state.language || "zh";
      state.activeOutput = ui.activeOutput || data?.activeOutput || state.activeOutput || "formulas";
      state.showLocalLabels = ui.showLocalLabels ?? data?.showLocalLabels ?? state.showLocalLabels;
      state.showReducedBranchCurrents = ui.showReducedBranchCurrents ?? data?.showReducedBranchCurrents ?? state.showReducedBranchCurrents;
      state.panelWidth = ui.panelWidth ?? data?.panelWidth ?? state.panelWidth;
      state.editorGroups = structuredClone(ui.editorGroups || data?.editorGroups || state.editorGroups || {});
      state.multiCaseProfilesText = ui.multiCaseProfilesText ?? data?.multiCaseProfilesText ?? state.multiCaseProfilesText ?? "";
      state.multiCaseProfilesKey = ui.multiCaseProfilesKey ?? data?.multiCaseProfilesKey ?? state.multiCaseProfilesKey ?? "";
      state.multiCaseIdSymbol = ui.multiCaseIdSymbol ?? data?.multiCaseIdSymbol ?? state.multiCaseIdSymbol ?? "case_id";
      applyPanelWidth();
    }

    function loadCircuitState(data) {
      if (!isCircuitState(data)) {
        throw new Error("不是有效的 Branch Builder 电路组合文件。");
      }
      applyProjectUiState(data);
      if (data.world) {
        WORLD.width = Math.max(BASE_VIEW.width, Number(data.world.width) || BASE_VIEW.width);
        WORLD.height = Math.max(BASE_VIEW.height, Number(data.world.height) || BASE_VIEW.height);
      }
      if (Array.isArray(data.canvases) && data.canvases.length) {
        state.canvases = data.canvases.map(normalizeCanvasState);
        if (Array.isArray(data.canvasOrder) && data.canvasOrder.length) {
          const byId = new Map(state.canvases.map(item => [item.id, item]));
          state.canvases = [
            ...data.canvasOrder.map(id => byId.get(id)).filter(Boolean),
            ...state.canvases.filter(item => !data.canvasOrder.includes(item.id))
          ];
        }
        state.activeCanvasId = data.activeCanvasId || state.canvases[0].id;
        state.nextCanvas = data.nextCanvas || inferNextNumber(state.canvases, "canvas");
        const active = currentCanvas() || state.canvases[0];
        state.activeCanvasId = active.id;
        applyCanvasData(active.data || blankCanvasData(active.name));
        restoreReducedCacheSnapshot(data.reducedEquationCache || []);
        restoreCacheSnapshot(branchCurrentCache, data.branchCurrentCache || [], ["html"]);
        restoreCacheSnapshot(pythonDraftCache, data.pythonDraftCache || [], ["result"]);
        restoreCacheSnapshot(optimizedEliminationCache, data.optimizedEliminationCache || [], ["result"]);
        restoreCacheSnapshot(multiCaseExportCache, data.multiCaseExportCache || [], ["result"]);
        render();
        return;
      }
      state.branches = data.branches;
      state.wires = data.wires;
      state.groups = Array.isArray(data.groups) ? data.groups : [];
      state.nodeOrder = Array.isArray(data.nodeOrder) ? data.nodeOrder : [];
      state.nodeLabels = data.nodeLabels || {};
      state.nodeColors = data.nodeColors || {};
      cleanupAutoYBoxNodeLabels();
      state.internalNodes = data.internalNodes || [];
      state.nextBranch = data.nextBranch || inferNextNumber(state.branches, "B");
      state.nextTransformer = data.nextTransformer || inferNextNumber(state.branches, "T");
      state.nextCustom = data.nextCustom || inferNextNumber(state.branches, "C");
      state.nextWire = data.nextWire || inferNextNumber(state.wires, "W");
      state.nextGroup = data.nextGroup || inferNextNumber(state.groups, "G");
      syncNextCounters();
      state.selectedId = null;
      state.selectedIds = [];
      state.selectedNetIds = [];
      state.selectedWireId = null;
      state.pendingTerminal = null;
      state.drag = null;
      state.wireDrag = null;
      state.resizeDrag = null;
      state.marquee = null;
      state.autoGluePreview = null;
      state.autoGlueFlash = null;
      state.zoom = data.zoom || state.zoom || 1;
      state.viewCenter = structuredClone(data.viewCenter || state.viewCenter || { x: WORLD.width / 2, y: WORLD.height / 2 });
      restoreReducedCacheSnapshot(data.reducedEquationCache || []);
      restoreCacheSnapshot(branchCurrentCache, data.branchCurrentCache || [], ["html"]);
      restoreCacheSnapshot(pythonDraftCache, data.pythonDraftCache || [], ["result"]);
      restoreCacheSnapshot(optimizedEliminationCache, data.optimizedEliminationCache || [], ["result"]);
      restoreCacheSnapshot(multiCaseExportCache, data.multiCaseExportCache || [], ["result"]);
      render();
    }

    function appendCircuitState(data) {
      data = normalizeImportData(data);
      if (!isCircuitState(data)) {
        throw new Error("不是有效的 Branch Builder 电路组合文件。");
      }
      if (Array.isArray(data.canvases) && data.canvases.length) {
        const active = data.canvases.find(item => item.id === data.activeCanvasId) || data.canvases[0];
        data = {
          fileType: "branch-builder-circuit",
          branches: active.data?.branches || [],
          wires: active.data?.wires || [],
          groups: active.data?.groups || [],
          nodeOrder: active.data?.nodeOrder || [],
          nodeLabels: active.data?.nodeLabels || {},
          nodeColors: active.data?.nodeColors || {},
          internalNodes: active.data?.internalNodes || []
        };
      }

      const beforeNodeState = captureNodeDisplayState();
      const existingBounds = state.branches.length ? combinedBounds(state.branches) : null;
      const importedBounds = data.branches.length ? combinedBounds(data.branches) : null;
      const targetX = existingBounds ? Math.min(WORLD.width - 260, existingBounds.right + 220) : WORLD.width / 2;
      const targetY = existingBounds ? Math.min(WORLD.height - 180, existingBounds.top + 120) : WORLD.height / 2;
      const offset = importedBounds
        ? {
          x: targetX - importedBounds.left,
          y: targetY - importedBounds.top
        }
        : { x: 120, y: 120 };

      const branchIdMap = new Map();
      const importedBranches = data.branches.map(source => {
        const branch = structuredClone(source);
        branch.kind = branch.kind || branch.type || "two_node_branch";
        if (branch.drawing) {
          branch.x = typeof branch.x === "number" ? branch.x : branch.drawing.x;
          branch.y = typeof branch.y === "number" ? branch.y : branch.drawing.y;
          branch.rotation = typeof branch.rotation === "number" ? branch.rotation : (branch.drawing.rotation || 0);
        }
        if (typeof branch.x !== "number") branch.x = 300;
        if (typeof branch.y !== "number") branch.y = 240;
        if (typeof branch.rotation !== "number") branch.rotation = 0;
        const oldId = branch.id;

        if (branch.kind === "single_phase_transformer") {
          const n = state.nextTransformer++;
          branch.id = `T${n}`;
          branch.name = `Tr${n}`;
          branch.width = branch.width || 170;
          branch.height = branch.height || 112;
          branch.nodes = branch.nodes || {
            P: branch.terminals?.P?.node || `tr${n}p`,
            N: branch.terminals?.N?.node || `tr${n}n`,
            S: branch.terminals?.S?.node || `tr${n}s`,
            T: branch.terminals?.T?.node || `tr${n}t`
          };
          branch.gMatrix = branch.gMatrix || branch.G || "[[G11, -G11, G12, -G12], [-G11, G11, -G12, G12], [G12, -G12, G22, -G22], [-G12, G12, -G22, G22]]";
          branch.ihisVector = branch.ihisVector || branch.Ihis || "[[Ihis_p], [-Ihis_p], [Ihis_s], [-Ihis_s]]";
          branch.currents = branch.currents || [
            { name: "primary", from: "P", to: "N", expression: "G11*(V_P - V_N) + G12*(V_S - V_T) + Ihis_p" },
            { name: "secondary", from: "S", to: "T", expression: "G12*(V_P - V_N) + G22*(V_S - V_T) + Ihis_s" }
          ];
        } else if (branch.kind === "custom_n_port") {
          const n = state.nextCustom++;
          branch.id = `C${n}`;
          branch.name = branch.name || `Custom${n}`;
          branch.ports = branch.ports || Object.keys(branch.nodes || branch.terminals || {});
          if (!branch.ports.length) branch.ports = ["P1", "P2"];
          branch.width = branch.width || Math.max(170, Math.min(320, 120 + branch.ports.length * 8));
          branch.height = branch.height || Math.max(120, Math.min(360, 70 + Math.ceil(branch.ports.length / 2) * 24));
          branch.nodes = branch.nodes || Object.fromEntries(branch.ports.map(id => [id, branch.terminals?.[id]?.node || `c${n}_${id.toLowerCase()}`]));
          branch.portLayout = Array.isArray(branch.portLayout) ? branch.portLayout : customPortLayout(branch);
          branch.gMatrix = branch.gMatrix || branch.G || `[${branch.ports.map(() => `[${branch.ports.map(() => "0").join(", ")}]`).join(", ")}]`;
          branch.ihisVector = branch.ihisVector || branch.Ihis || `[${branch.ports.map(() => "[0]").join(", ")}]`;
          branch.currents = branch.currents || [];
        } else if (branch.kind === "current_source") {
          const n = state.nextBranch++;
          branch.id = `B${n}`;
          branch.name = branch.name || `I${n}`;
          branch.width = branch.width || 150;
          branch.height = branch.height || 56;
          branch.nodeA = branch.terminals?.A?.node || branch.nodeA || `n${n}a`;
          branch.nodeB = branch.terminals?.B?.node || branch.nodeB || `n${n}b`;
          branch.direction = branch.direction || "AtoB";
          branch.sourceMode = branch.source?.mode || branch.sourceMode || "independent";
          branch.currentExpression = branch.source?.currentExpression || branch.currentExpression || `I${n}`;
          branch.sourceIhis = branch.source?.sourceIhis || branch.source?.Ihis || branch.sourceIhis || "0";
          branch.controlTerms = branch.source?.controlTerms || branch.controlTerms || "";
          branch.controlRows = Array.isArray(branch.source?.controlRows)
            ? branch.source.controlRows
            : (Array.isArray(branch.controlRows) ? branch.controlRows : currentSourceControlRows(branch));
          branch.description = branch.source?.description || branch.description || "";
          branch.mathEnabled = true;
        } else if (branch.kind === "voltage_source_series_r") {
          const n = state.nextBranch++;
          branch.id = `B${n}`;
          branch.name = branch.name || `V${n}`;
          branch.width = branch.width || 160;
          branch.height = branch.height || 56;
          branch.nodes = branch.nodes || {
            P: branch.terminals?.P?.node || branch.nodeP || branch.source?.nodeP || `v${n}p`,
            N: branch.terminals?.N?.node || branch.nodeN || branch.source?.nodeN || `v${n}n`
          };
          branch.voltage = branch.voltage || branch.source?.voltage || "Vs";
          branch.conductance = branch.conductance || branch.source?.conductance || (branch.source?.resistance || branch.resistance ? exprDiv("1", branch.source?.resistance || branch.resistance) : "G");
          delete branch.resistance;
          branch.direction = "PtoN";
        } else if (branch.kind === "ground") {
          const n = state.nextBranch++;
          branch.id = `B${n}`;
          branch.name = branch.name || `GND${n}`;
          branch.width = branch.width || 56;
          branch.height = branch.height || 56;
          branch.nodeG = branch.terminals?.G?.node || branch.nodeG || `gnd${n}`;
        } else {
          const n = state.nextBranch++;
          branch.id = `B${n}`;
          branch.name = `R${n}`;
          branch.kind = "two_node_branch";
          branch.width = branch.width || 150;
          branch.nodeA = branch.nodeA || branch.terminals?.A?.node || `n${n}a`;
          branch.nodeB = branch.nodeB || branch.terminals?.B?.node || `n${n}b`;
          branch.g = branch.g || branch.G || "1/R";
          branch.ihis = branch.ihis || branch.Ihis || "0";
          branch.direction = branch.direction || "AtoB";
        }

        branch.x = Math.min(WORLD.width - 120, Math.max(120, branch.x + offset.x));
        branch.y = Math.min(WORLD.height - 120, Math.max(120, branch.y + offset.y));
        branchIdMap.set(oldId, branch.id);
        return branch;
      });

      const importedWires = (data.wires || []).map(source => {
        const from = remapTerminal(source.from, branchIdMap);
        const to = remapTerminal(source.to, branchIdMap);
        if (!from || !to) return null;
        return {
          id: `W${state.nextWire++}`,
          from,
          to,
          mid: source.mid ? {
            x: Math.min(WORLD.width - 28, Math.max(28, source.mid.x + offset.x)),
            y: Math.min(WORLD.height - 28, Math.max(28, source.mid.y + offset.y))
          } : null
        };
      }).filter(Boolean);

      const importedGroups = (data.groups || []).map(source => {
        const ids = source.ids.map(id => branchIdMap.get(id)).filter(Boolean);
        if (ids.length < 2) return null;
        return { id: `G${state.nextGroup++}`, ids };
      }).filter(Boolean);

      state.branches.push(...importedBranches);
      state.wires.push(...importedWires);
      state.groups.push(...importedGroups);
      syncNextCounters();
      const importedDisplays = importedNodeDisplays(data, branchIdMap);
      applyNodeDisplayState(beforeNodeState, importedDisplays);
      appendImportedNodeOrder(data, branchIdMap, beforeNodeState);
      state.selectedIds = importedBranches.map(branch => branch.id);
      state.selectedId = state.selectedIds[0] || null;
      state.selectedWireId = null;
      state.pendingTerminal = null;
      state.drag = null;
      state.wireDrag = null;
      state.resizeDrag = null;
      state.marquee = null;
      state.autoGluePreview = null;
      state.autoGlueFlash = null;
      render();
      return { branches: importedBranches.length, wires: importedWires.length, groups: importedGroups.length };
    }

    function isCircuitState(data) {
      return !!data &&
        ((Array.isArray(data.branches) && Array.isArray(data.wires)) || Array.isArray(data.canvases)) &&
        (!data.fileType || data.fileType === "branch-builder-circuit");
    }

    function normalizeImportData(data) {
      if (!data || !Array.isArray(data.branches)) return data;

      if (!data.fileType && data.kind === "two_node_branch_network") {
        return {
          fileType: "branch-builder-circuit",
          version: 1,
          branches: data.branches.map((branch, index) => ({
            id: branch.id || `B${index + 1}`,
            name: branch.name || `R${index + 1}`,
            kind: branch.type || "two_node_branch",
            x: branch.drawing?.x ?? 300 + index * 220,
            y: branch.drawing?.y ?? 240,
            width: branch.type === "single_phase_transformer" ? 170 : 150,
            height: branch.type === "single_phase_transformer" ? 112 : undefined,
            rotation: branch.drawing?.rotation ?? 0,
            terminals: branch.terminals,
            G: branch.G,
            Ihis: branch.Ihis,
            source: branch.source,
            voltage: branch.source?.voltage || branch.voltage,
            conductance: branch.source?.conductance || branch.conductance,
            resistance: branch.source?.resistance || branch.resistance,
            direction: "AtoB"
          })),
          wires: data.wires || [],
          groups: []
        };
      }

      return data;
    }

    function importedNodeDisplays(data, branchIdMap) {
      const labels = data.nodeLabels || {};
      const colors = data.nodeColors || {};
      const internalNodes = new Set(data.internalNodes || []);
      const groups = orderedSourceNetGroups(data);
      const explicit = [];
      groups.forEach(group => {
        const display = labels[group.id] || sourceGroupDisplay(data, group) || group.id;
        const color = colors[group.id] || null;
        const internal = internalNodes.has(group.id);
        if ((!display || display === group.id) && !color && !internal) return;
        group.members.forEach(member => {
          const terminal = remapTerminal(member, branchIdMap);
          if (terminal) explicit.push({ terminal, display, color, internal });
        });
      });
      return explicit;
    }

    function orderedSourceNetGroups(data) {
      const groups = sourceNetGroups(data);
      const byId = new Map(groups.map(group => [group.id, group]));
      const ordered = [];
      (data.nodeOrder || []).forEach(id => {
        if (byId.has(id)) {
          ordered.push(byId.get(id));
          byId.delete(id);
        }
      });
      return ordered.concat(Array.from(byId.values()).sort((a, b) => Number(a.id.slice(1)) - Number(b.id.slice(1))));
    }

    function sourceGroupDisplay(data, group) {
      for (const member of group.members || []) {
        const parsed = parseTerminal(member);
        const branch = (data.branches || []).find(item => item.id === parsed.branchId);
        if (!branch) continue;
        if (branch.kind === "custom_n_port" && branch.nodes?.[parsed.side]) return branch.nodes[parsed.side];
        if (branch.kind === "single_phase_transformer" && branch.nodes?.[parsed.side]) return branch.nodes[parsed.side];
        if (branch.kind === "voltage_source_series_r" && branch.nodes?.[parsed.side]) return branch.nodes[parsed.side];
        if (parsed.side === "A" && branch.nodeA) return branch.nodeA;
        if (parsed.side === "B" && branch.nodeB) return branch.nodeB;
      }
      return "";
    }

    function appendImportedNodeOrder(data, branchIdMap, beforeNodeState) {
      const oldMembers = new Set((beforeNodeState || []).flatMap(group => group.members || []));
      const currentGroups = netGroups();
      const groupForTerminal = terminal => currentGroups.find(group => group.members.includes(terminal));
      const importedIds = [];
      orderedSourceNetGroups(data).forEach(group => {
        const terminal = (group.members || []).map(member => remapTerminal(member, branchIdMap)).find(Boolean);
        if (!terminal) return;
        const currentGroup = groupForTerminal(terminal);
        if (!currentGroup) return;
        const touchesExisting = currentGroup.members.some(member => oldMembers.has(member));
        if (touchesExisting || importedIds.includes(currentGroup.id)) return;
        importedIds.push(currentGroup.id);
      });
      const allIds = currentGroups.map(group => group.id);
      const previousIds = state.nodeOrder.filter(id => allIds.includes(id) && !importedIds.includes(id));
      const remainingIds = allIds.filter(id => !previousIds.includes(id) && !importedIds.includes(id));
      state.nodeOrder = [...previousIds, ...importedIds, ...remainingIds];
    }

    function sourceNetGroups(data) {
      const parent = new Map();
      const add = key => {
        if (!parent.has(key)) parent.set(key, key);
      };
      const find = key => {
        add(key);
        const p = parent.get(key);
        if (p !== key) parent.set(key, find(p));
        return parent.get(key);
      };
      const union = (a, b) => {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent.set(rb, ra);
      };
      (data.branches || []).forEach(branch => terminalSides(branch).forEach(side => add(terminalKey(branch.id, side))));
      (data.wires || []).forEach(wire => {
        if (wire.from && wire.to) union(wire.from, wire.to);
      });
      const groups = new Map();
      Array.from(parent.keys()).forEach(key => {
        const root = find(key);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(key);
      });
      return Array.from(groups.values()).map((members, index) => ({ id: `N${index + 1}`, members }));
    }

    function combinedBounds(branches) {
      const boxes = branches.map(branch => {
        if (typeof branch.x !== "number" || typeof branch.y !== "number") {
          return { left: 0, right: 0, top: 0, bottom: 0 };
        }
        if (!state.branches.includes(branch)) {
          const halfW = branch.kind === "single_phase_transformer" ? 95 : 85;
          const halfH = branch.kind === "single_phase_transformer" ? 70 : 45;
          return {
            left: branch.x - halfW,
            right: branch.x + halfW,
            top: branch.y - halfH,
            bottom: branch.y + halfH
          };
        }
        return componentBounds(branch);
      });
      return {
        left: Math.min(...boxes.map(box => box.left)),
        right: Math.max(...boxes.map(box => box.right)),
        top: Math.min(...boxes.map(box => box.top)),
        bottom: Math.max(...boxes.map(box => box.bottom))
      };
    }

    function remapTerminal(terminal, branchIdMap) {
      const parsed = parseTerminal(terminal);
      const nextId = branchIdMap.get(parsed.branchId);
      return nextId ? `${nextId}.${parsed.side}` : null;
    }

    function matrixLiteral(rows) {
      return `[${rows.map(row => `[${row.join(", ")}]`).join(", ")}]`;
    }

    function vectorLiteral(items) {
      return `[${items.map(item => `[${item}]`).join(", ")}]`;
    }

    function escapeRegExp(text) {
      return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function cIdentifier(text) {
      const clean = String(text || "case").replace(/[^A-Za-z0-9_]/g, "_");
      return /^[A-Za-z_]/.test(clean) ? clean : `case_${clean}`;
    }

    function nextIdForKind(kind) {
      if (kind === "single_phase_transformer") return `T${state.nextTransformer++}`;
      if (kind === "custom_n_port") return `C${state.nextCustom++}`;
      return `B${state.nextBranch++}`;
    }

    function nextUniqueIdForKind(kind, existingIds) {
      let id = nextIdForKind(kind);
      while (existingIds.has(id)) id = nextIdForKind(kind);
      return id;
    }

    function nextNameForKind(kind) {
      if (kind === "single_phase_transformer") return `Tr${state.nextTransformer - 1}`;
      if (kind === "custom_n_port") return `Custom${state.nextCustom - 1}`;
      if (kind === "current_source") return `I${state.nextBranch - 1}`;
      if (kind === "voltage_source_series_r") return `V${state.nextBranch - 1}`;
      if (kind === "ground") return `GND${state.nextBranch - 1}`;
      return `R${state.nextBranch - 1}`;
    }

    function branchNamePrefix(kind) {
      if (kind === "single_phase_transformer") return "Tr";
      if (kind === "custom_n_port") return "Custom";
      if (kind === "current_source") return "I";
      if (kind === "voltage_source_series_r") return "V";
      if (kind === "ground") return "GND";
      return "R";
    }

    function ensureUniqueBranchName(branch, existingNames) {
      if (!existingNames.has(branch.name)) {
        existingNames.add(branch.name);
        return;
      }
      const prefix = branchNamePrefix(branch.kind || branch.type || "two_node_branch");
      let index = inferNextNameNumber(state.branches, prefix);
      let next = `${prefix}${index}`;
      while (existingNames.has(next)) {
        index += 1;
        next = `${prefix}${index}`;
      }
      branch.name = next;
      existingNames.add(next);
    }

    function syncNextCounters() {
      state.nextBranch = Math.max(Number(state.nextBranch) || 1, inferNextBranchNumber());
      state.nextTransformer = Math.max(Number(state.nextTransformer) || 1, inferNextTransformerNumber());
      state.nextCustom = Math.max(Number(state.nextCustom) || 1, inferNextCustomNumber());
      state.nextWire = Math.max(Number(state.nextWire) || 1, inferNextNumber(state.wires, "W"));
      state.nextGroup = Math.max(Number(state.nextGroup) || 1, inferNextNumber(state.groups, "G"));
    }

    function inferNextBranchNumber() {
      return Math.max(
        inferNextNumber(state.branches, "B"),
        inferNextNameNumber(state.branches.filter(item => (item.kind || item.type || "two_node_branch") === "two_node_branch"), "R")
      );
    }

    function inferNextTransformerNumber() {
      return Math.max(
        inferNextNumber(state.branches, "T"),
        inferNextNameNumber(state.branches.filter(item => (item.kind || item.type) === "single_phase_transformer"), "Tr")
      );
    }

    function inferNextCustomNumber() {
      return Math.max(
        inferNextNumber(state.branches, "C"),
        inferNextNameNumber(state.branches.filter(item => (item.kind || item.type) === "custom_n_port"), "Custom"),
        inferNextNameNumber(state.branches.filter(item => (item.kind || item.type) === "custom_n_port"), "YBox")
      );
    }

    function maxDisplayNodeNumber() {
      const names = new Set(netGroups().map(group => nodeDisplayName(group.id)));
      let max = 0;
      names.forEach(name => {
        const match = String(name || "").match(/^N(\d+)$/);
        if (match) max = Math.max(max, Number(match[1]));
      });
      return max;
    }

    function selectedInternalWires(ids) {
      return state.wires.filter(wire =>
        ids.has(parseTerminal(wire.from).branchId) && ids.has(parseTerminal(wire.to).branchId)
      );
    }

    function copySelectedBranches() {
      const ids = selectedBranchSet();
      if (!ids.size) return;
      const branches = state.branches.filter(branch => ids.has(branch.id));
      state.clipboard = {
        branches: structuredClone(branches),
        wires: structuredClone(selectedInternalWires(ids)),
        nodeState: captureNodeDisplayState(),
        copiedAt: Date.now()
      };
      state.pasteCount = 0;
      statusEl.textContent = optText(`已复制 ${branches.length} 个元件`, `Copied ${branches.length} elements`);
      document.getElementById("pasteTool").disabled = false;
    }

    function pasteCopiedBranches() {
      const clip = state.clipboard;
      if (!clip?.branches?.length) return;
      commitHistory();
      state.pasteCount += 1;
      const offset = 36 * state.pasteCount;
      const branchIdMap = new Map();
      const pastedBranches = clip.branches.map(source => {
        const branch = structuredClone(source);
        const oldId = branch.id;
        branch.id = nextIdForKind(branch.kind);
        branch.name = nextNameForKind(branch.kind);
        branch.x = Math.max(80, Math.min(WORLD.width - 80, Number(branch.x || 220) + offset));
        branch.y = Math.max(80, Math.min(WORLD.height - 80, Number(branch.y || 220) + offset));
        if (branch.kind === "two_node_branch" || branch.kind === "current_source") {
          const n = Number(branch.id.slice(1));
          branch.nodeA = `n${n}a`;
          branch.nodeB = `n${n}b`;
        } else if (branch.kind === "voltage_source_series_r") {
          const n = Number(branch.id.slice(1));
          branch.nodes = { P: `v${n}p`, N: `v${n}n` };
        } else if (branch.kind === "ground") {
          const n = Number(branch.id.slice(1));
          branch.nodeG = `gnd${n}`;
        } else if (branch.kind === "single_phase_transformer") {
          const n = Number(branch.id.slice(1));
          branch.nodes = { P: `tr${n}p`, N: `tr${n}n`, S: `tr${n}s`, T: `tr${n}t` };
        } else if (branch.kind === "custom_n_port") {
          const n = Number(branch.id.slice(1));
          const ports = terminalSides(branch);
          branch.nodes = Object.fromEntries(ports.map(port => [port, `c${n}_${port.toLowerCase()}`]));
        }
        branchIdMap.set(oldId, branch.id);
        return branch;
      });
      const pastedWires = (clip.wires || []).map(source => {
        const from = remapTerminal(source.from, branchIdMap);
        const to = remapTerminal(source.to, branchIdMap);
        if (!from || !to) return null;
        const wire = structuredClone(source);
        wire.id = `W${state.nextWire++}`;
        wire.from = from;
        wire.to = to;
        if (wire.mid) wire.mid = { x: wire.mid.x + offset, y: wire.mid.y + offset };
        return wire;
      }).filter(Boolean);

      const nextNode = { value: maxDisplayNodeNumber() + 1 };
      const explicitDisplays = [];
      const copiedStates = clip.nodeState || [];
      copiedStates.forEach(previous => {
        const pastedMembers = (previous.members || [])
          .map(member => remapTerminal(member, branchIdMap))
          .filter(Boolean);
        if (!pastedMembers.length) return;
        const name = `N${nextNode.value++}`;
        pastedMembers.forEach(terminal => explicitDisplays.push({ terminal, display: name }));
      });

      const beforeNodeState = captureNodeDisplayState();
      state.branches.push(...pastedBranches);
      state.wires.push(...pastedWires);
      syncNextCounters();
      applyNodeDisplayState(beforeNodeState, explicitDisplays);
      state.selectedIds = pastedBranches.map(branch => branch.id);
      state.selectedId = state.selectedIds[0] || null;
      state.selectedWireId = null;
      state.pendingTerminal = null;
      render();
    }

    function deleteSelection() {
      if (state.selectedId) {
        const beforeNodeState = captureNodeDisplayState();
        commitHistory();
        const ids = new Set(state.selectedIds.length ? state.selectedIds : [state.selectedId]);
        state.wires = state.wires.filter(wire => {
          const from = parseTerminal(wire.from).branchId;
          const to = parseTerminal(wire.to).branchId;
          return !ids.has(from) && !ids.has(to);
        });
        state.branches = state.branches.filter(branch => !ids.has(branch.id));
        state.groups = state.groups
          .map(group => ({ ...group, ids: group.ids.filter(id => !ids.has(id)) }))
          .filter(group => group.ids.length > 1);
        applyNodeDisplayState(beforeNodeState);
        state.selectedId = null;
        state.selectedIds = [];
        state.selectedNetIds = [];
      } else if (state.selectedWireId) {
        const beforeNodeState = captureNodeDisplayState();
        commitHistory();
        state.wires = state.wires.filter(wire => wire.id !== state.selectedWireId);
        applyNodeDisplayState(beforeNodeState);
        state.selectedWireId = null;
      } else {
        return;
      }
      render();
    }

    function rotateSelectedBranches() {
      const ids = selectedBranchSet();
      if (!ids.size && state.selectedId) ids.add(state.selectedId);
      if (!ids.size) return;
      commitHistory();
      ids.forEach(id => {
        const branch = findBranch(id);
        if (!branch) return;
        branch.rotation = ((branch.rotation || 0) + 90) % 360;
        clampComponent(branch);
      });
      render();
    }

    function inferNextNumber(items, prefix) {
      const max = items.reduce((best, item) => {
        const id = item.id || "";
        if (!id.startsWith(prefix)) return best;
        const n = Number(id.slice(prefix.length));
        return Number.isFinite(n) ? Math.max(best, n) : best;
      }, 0);
      return max + 1;
    }

    function inferNextNameNumber(items, prefix) {
      const pattern = new RegExp(`^${escapeRegExp(prefix)}(\\d+)$`);
      const max = items.reduce((best, item) => {
        const match = String(item.name || "").match(pattern);
        return match ? Math.max(best, Number(match[1])) : best;
      }, 0);
      return max + 1;
    }

    function totalCircuitBranches() {
      syncCanvasOrderFromTabs();
      saveActiveCanvas();
      return state.canvases.reduce((sum, canvasState) => {
        return sum + (canvasState.data?.branches?.length || 0);
      }, 0);
    }

    async function exportCircuit() {
      const data = JSON.stringify(circuitStateJson(), null, 2);
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      const suggestedName = `branch-builder-circuit-${stamp}.json`;
      const bytes = new Blob([data]).size;
      const totalBranches = totalCircuitBranches();

      if (!totalBranches) {
        statusEl.textContent = optText("所有画布都没有可导出的元件", "No elements to export on any canvas");
        return;
      }

      exportText.value = data;
      exportFileName.value = suggestedName;
      await refreshExistingExportFiles();
      exportDialog.classList.add("open");
      exportFileName.focus();
      exportFileName.select();
      statusEl.textContent = optText("准备保存" + ` ${state.canvases.length} 个画布、全部 ${totalBranches} 个元件 (${bytes} bytes)`,
        `Ready to save ${state.canvases.length} canvases with ${totalBranches} total elements (${bytes} bytes)`
      );
    }

    async function saveViaLocalServer(data, filename, bytes) {
      for (const url of localApiUrls("/save-circuit")) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename, data })
          });
          if (!response.ok) continue;
          const result = await response.json();
          if (!result.ok || !result.bytes) continue;
          statusEl.textContent = optText(
            `已保存 ${totalCircuitBranches()} 个元件 (${result.bytes} bytes) 到 ${result.path}`,
            `Saved ${totalCircuitBranches()} elements (${result.bytes} bytes) to ${result.path}`
          );
          return true;
        } catch (error) {}
      }
      return false;
    }

    async function refreshExistingExportFiles() {
      existingExportFiles.innerHTML = `<option value="">${escapeHtml(tr("不覆盖已有文件"))}</option>`;
      for (const url of localApiUrls("/list-circuits")) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          const result = await response.json();
          (result.files || []).forEach(file => {
            const option = document.createElement("option");
            option.value = file.name;
            option.textContent = `${file.name} (${file.size} bytes)`;
            existingExportFiles.appendChild(option);
          });
          return;
        } catch (error) {}
      }
    }

    function downloadExportText() {
      const data = exportText.value || JSON.stringify(circuitStateJson(), null, 2);
      let filename = exportFileName.value.trim();
      if (!filename.toLowerCase().endsWith(".json")) filename += ".json";
      const bytes = new Blob([data]).size;
      saveViaLocalServer(data, filename, bytes).then(saved => {
        if (saved) {
          closeExportDialog();
        } else {
          statusEl.textContent = optText("保存失败：本地保存服务不可用", "Save failed: local save service is unavailable");
        }
      });
    }

    function downloadJson(data, filename) {
      const url = `data:application/json;charset=utf-8,${encodeURIComponent(data)}`;
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function saveViaNativeDialog(data, filename) {
      for (const url of localApiUrls("/save-circuit-as")) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename, data })
          });
          if (!response.ok) continue;
          const result = await response.json();
          if (result.canceled) {
            statusEl.textContent = optText("已取消另存为", "Save As canceled");
            return { handled: true, saved: false };
          }
          if (!result.ok || !result.bytes) continue;
          statusEl.textContent = optText(
            `已另存 JSON (${result.bytes} bytes) 到 ${result.path}`,
            `JSON saved (${result.bytes} bytes) to ${result.path}`
          );
          return { handled: true, saved: true };
        } catch (error) {}
      }
      return { handled: false, saved: false };
    }

    async function saveExportTextAsFile() {
      const data = exportText.value || JSON.stringify(circuitStateJson(), null, 2);
      let filename = exportFileName.value.trim() || "branch-builder-circuit.json";
      if (!filename.toLowerCase().endsWith(".json")) filename += ".json";
      const bytes = new Blob([data], { type: "application/json" }).size;
      if (!window.showSaveFilePicker) {
        const localSaved = await saveViaNativeDialog(data, filename);
        if (localSaved.saved) closeExportDialog();
        if (localSaved.handled) return;
        downloadJson(data, filename);
        statusEl.textContent = optText("当前浏览器和本地保存服务都无法打开保存路径选择器，已改用浏览器下载。", "Neither this browser nor the local save service can open a save-path picker, so the JSON was downloaded instead.");
        closeExportDialog();
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [
            {
              description: "JSON",
              accept: { "application/json": [".json"] }
            }
          ]
        });
        const writable = await handle.createWritable();
        await writable.write(data);
        await writable.close();
        statusEl.textContent = optText(`已另存 JSON (${bytes} bytes)`, `JSON saved (${bytes} bytes)`);
        closeExportDialog();
      } catch (error) {
        if (error?.name === "AbortError") {
          statusEl.textContent = optText("已取消另存为", "Save As canceled");
          return;
        }
        const localSaved = await saveViaNativeDialog(data, filename);
        if (localSaved.saved) closeExportDialog();
        if (localSaved.handled) return;
