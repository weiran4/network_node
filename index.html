    function pythonDraft(reducedResult = null, payload = buildReducedPayload()) {
      const lines = [];
      lines.push("# Generated from Branch Builder");
      lines.push("# Each two-node branch stamps [[G, -G], [-G, G]] and [Ihis, -Ihis].");
      lines.push("import sympy as sp");
      lines.push("");
      appendPythonSymbolDeclarations(lines, collectPythonDraftSymbolNames(payload, reducedResult));
      state.branches.forEach(branch => {
        if (branch.kind === "single_phase_transformer") {
          if (switchCaseLabel(branch)) lines.push(`# Active switch case: ${switchCaseLabel(branch)}`);
          lines.push(`G_${branch.name} = sp.Matrix(${branchValue(branch, "gMatrix")})`);
          lines.push(`Ihis_${branch.name} = sp.Matrix(${branchValue(branch, "ihisVector")})`);
          lines.push(`${branch.name} = SubNetwork(name="${branch.name}", local_nodes=["P", "N", "S", "T"], G_local=G_${branch.name}, Ihis_local=Ihis_${branch.name})`);
        } else if (branch.kind === "custom_n_port") {
          if (switchCaseLabel(branch)) lines.push(`# Active switch case: ${switchCaseLabel(branch)}`);
          lines.push(`G_${branch.name} = sp.Matrix(${branchValue(branch, "gMatrix")})`);
          lines.push(`Ihis_${branch.name} = sp.Matrix(${branchValue(branch, "ihisVector")})`);
          lines.push(`${branch.name} = SubNetwork(name="${branch.name}", local_nodes=${pythonStringList(terminalSides(branch))}, G_local=G_${branch.name}, Ihis_local=Ihis_${branch.name})`);
        } else if (branch.kind === "current_source") {
          lines.push(`# ${branch.name} is a linear current source stamped directly into global G/Ihis.`);
          lines.push(`# Output direction: ${branch.direction === "AtoB" ? "A -> B" : "B -> A"}`);
          lines.push(`# ${currentFormula(branch)}`);
        } else if (branch.kind === "voltage_source_series_r") {
          const gs = voltageSourceSeriesConductance(branch);
          const ihis = voltageSourceSeriesIhis(branch);
          lines.push(`# ${branch.name} is a voltage source with series conductance, stamped as a Norton equivalent.`);
          lines.push(`# Direction: P -> N; i = Gs*(V_P - V_N - Vs); Gs = ${gs}; Ihis_P = ${ihis}; Ihis_N = -(${ihis})`);
          lines.push(`G_${branch.name} = sp.Matrix(${matrixLiteral(localGMatrix(branch))})`);
          lines.push(`Ihis_${branch.name} = sp.Matrix(${vectorLiteral(localIhisVector(branch))})`);
          lines.push(`${branch.name} = SubNetwork(name="${branch.name}", local_nodes=["P", "N"], G_local=G_${branch.name}, Ihis_local=Ihis_${branch.name})`);
        } else if (branch.kind === "ground") {
          lines.push(`# ${branch.name} is a ground constraint: ${currentFormula(branch)}`);
          lines.push(`# Ground is applied after full stamping by removing its row/column because V_ground = 0.`);
        } else {
          if (switchCaseLabel(branch)) lines.push(`# Active switch case: ${switchCaseLabel(branch)}`);
          const g = branchValue(branch, "g");
          const ihis = branchValue(branch, "ihis");
          lines.push(`G_${branch.name} = sp.Matrix([[${g}, -(${g})], [-(${g}), ${g}]])`);
          lines.push(`Ihis_${branch.name} = sp.Matrix([[${ihis}], [-(${ihis})]])`);
          lines.push(`${branch.name} = SubNetwork(name="${branch.name}", local_nodes=["A", "B"], G_local=G_${branch.name}, Ihis_local=Ihis_${branch.name})`);
        }
        lines.push("");
      });
      lines.push("asm = NetworkAssembler()");
      state.branches.forEach(branch => {
        if (branch.kind !== "current_source" && branch.kind !== "ground") lines.push(`asm.add_subnetwork(${branch.name})`);
      });
      state.wires.forEach(wire => {
        const a = parseTerminal(wire.from);
        const b = parseTerminal(wire.to);
        const branchA = findBranch(a.branchId);
        const branchB = findBranch(b.branchId);
        lines.push(`asm.connect("${branchA.name}.${a.side}", "${branchB.name}.${b.side}")`);
      });
      lines.push("");
      lines.push("# Branch current formulas:");
      state.branches.forEach(branch => lines.push(`# ${currentFormula(branch)}`));
      lines.push("");
      appendPythonReductionSection(lines, payload, reducedResult);
      return lines.join("\n");
    }

    async function renderPythonDraftAsync(token, payload) {
      const staticHtml = reducedStaticMessage(payload);
      if (staticHtml) return;
      const key = reducedCacheKey(payload);
      const cachedEntry = cacheGet(pythonDraftCache, key);
      if (cachedEntry?.result) {
        if (token === pythonDraftRenderToken && state.activeOutput === "python") {
          outputText.textContent = pythonDraft(cachedEntry.result, payload);
        }
        return;
      }
      if (cachedEntry?.pending) {
        try {
          const result = await cachedEntry.pending;
          if (token === pythonDraftRenderToken && state.activeOutput === "python") {
            outputText.textContent = pythonDraft(result, payload);
          }
        } catch (error) {
          if (token === pythonDraftRenderToken && state.activeOutput === "python") {
            outputText.textContent = `${pythonDraft(null, payload)}\n# Node reduction failed: ${error.message || String(error)}\n`;
          }
        }
        return;
      }

      const pending = requestReduction(payload).then(result => {
        const current = pythonDraftCache.get(key);
        if (current?.pending === pending) cacheSet(pythonDraftCache, key, { result, pending: null });
        return result;
      }).catch(error => {
        const current = pythonDraftCache.get(key);
        if (current?.pending === pending) pythonDraftCache.delete(key);
        throw error;
      });
      cacheSet(pythonDraftCache, key, { result: null, pending });

      try {
        const result = await pending;
        if (token === pythonDraftRenderToken && state.activeOutput === "python") {
          outputText.textContent = pythonDraft(result, payload);
        }
      } catch (error) {
        if (token === pythonDraftRenderToken && state.activeOutput === "python") {
          outputText.textContent = `${pythonDraft(null, payload)}\n# Node reduction failed: ${error.message || String(error)}\n`;
        }
      }
    }

    function renderOutput() {
      sanitizeDummyProtectedInternalNodes();
      if (state.activeOutput === "model") {
        outputText.className = "output-body code";
        outputText.textContent = JSON.stringify(modelJson(), null, 2);
        return;
      }
      if (state.activeOutput === "python") {
        outputText.className = "output-body code";
        const token = ++pythonDraftRenderToken;
        const payload = buildReducedPayload();
        outputText.textContent = pythonDraft(null, payload);
        renderPythonDraftAsync(token, payload);
        return;
      }
      if (state.activeOutput === "nodeEquations") {
        outputText.className = "output-body";
        outputText.innerHTML = renderNodeEquations();
        return;
      }
      if (state.activeOutput === "reducedEquations") {
        outputText.className = "output-body";
        const token = ++reducedRenderToken;
        const cached = currentReducedHtml();
        outputText.innerHTML = cached || `<div class="formula-empty">${escapeHtml(tr("正在用 SymPy 化简节点消去方程..."))}</div>`;
        renderReducedEquationsAsync(token);
        return;
      }
      if (state.activeOutput === "optimizedElimination") {
        outputText.className = "output-body";
        const token = ++optimizedEliminationRenderToken;
        const payload = optimizedEliminationPayload();
        outputText.innerHTML = `<div class="formula-list"><div class="formula-empty">${optText("正在计算优化消元 / C导出...", "Computing optimized elimination / C export...")}</div></div>`;
        renderOptimizedEliminationAsync(token, payload);
        return;
      }
      if (state.activeOutput === "multiCaseCExport") {
        outputText.className = "output-body";
        const branches = multiCaseEligibleBranches();
        if (!branches.length) {
          outputText.innerHTML = `<div class="formula-list"><div class="formula-empty">${escapeHtml(optText("当前电路没有可导出的多 case 支路或黑盒。", "The current circuit has no multi-case branches or black boxes to export."))}</div></div>`;
          return;
        }
        try {
          ensureMultiCaseProfilesText(branches);
          const payload = multiCaseExportPayload();
          const token = ++multiCaseExportRenderToken;
          outputText.innerHTML = `<div class="formula-list">${renderMultiCaseProfileEditor(branches)}<div class="formula-empty">${escapeHtml(optText("正在生成多Case集合 C导出...", "Generating multi-case collection C export..."))}</div></div>`;
          renderMultiCaseCExportAsync(token, payload);
        } catch (error) {
          outputText.innerHTML = `<div class="formula-list">${renderMultiCaseProfileEditor(branches)}<div class="formula-empty">${escapeHtml(error.message || String(error))}</div></div>`;
        }
        return;
      }
      outputText.className = "output-body output-body-formulas";
      if (!state.branches.length) {
        outputText.innerHTML = `<div class="formula-empty">尚未创建支路。</div>`;
        return;
      }
      const formulas = currentFormulaEntriesForCanvas();
      const token = ++branchCurrentRenderToken;
      const reducedHtml = state.showReducedBranchCurrents
        ? (currentReducedBranchCurrentHtml() || renderReducedBranchCurrentPlaceholder())
        : renderReducedBranchCurrentDisabledNote();
      outputText.innerHTML = `<div class="formula-list">${formulas.map(renderFormulaCard).join("")}${reducedHtml}</div>`;
      if (state.showReducedBranchCurrents) renderReducedBranchCurrentsAsync(token);
    }

    function renderReducedBranchCurrentDisabledNote() {
      return `
        <div class="formula-card" id="reducedBranchCurrents">
          <div class="formula-name">${escapeHtml(tr("支路电流消去版本"))}</div>
          <div class="formula-empty">${escapeHtml(tr("支路电流消去版本默认关闭。可用内部节点电压恢复公式代入原始支路电流；需要完全展开时再打开。"))}</div>
        </div>
      `;
    }

    function renderReducedBranchCurrentPlaceholder() {
      const branchPayload = buildReducedBranchCurrentPayload();
      if (!branchPayload) return "";
      return `
        <div class="formula-card" id="reducedBranchCurrents">
          <div class="formula-name">${escapeHtml(tr("支路电流消去版本"))}</div>
          <div class="formula-empty">${escapeHtml(tr("正在用 SymPy 化简支路电流..."))}</div>
        </div>
      `;
    }

    async function renderReducedBranchCurrentsAsync(token) {
      const branchPayload = buildReducedBranchCurrentPayload();
      if (!branchPayload) return;
      const { payload, internal, external, formulas, displayNames } = branchPayload;
      const key = reducedCacheKey(payload);
      const cachedEntry = cacheGet(branchCurrentCache, key);
      if (cachedEntry?.html) {
        replaceReducedBranchCurrentHtml(token, cachedEntry.html);
        return;
      }
      if (cachedEntry?.pending) {
        try {
          const html = await cachedEntry.pending;
          replaceReducedBranchCurrentHtml(token, html);
        } catch (error) {
          renderReducedBranchCurrentError(token, error);
        }
        return;
      }

      const pending = requestReduction(payload).then(result => {
        const internalNames = internal.map(node => displayNames?.[node] || nodeDisplayName(node));
        const hoverByName = hoverSourceByIdentity(formulas);
        const lines = (result.reduced_observers || []).map((item, index) => {
          const lhs = sourceObserverLhs(formulas[index], item.lhs);
          const source = hoverByName.get(formulaIdentity(lhs)) || formulas[index] || {};
          return {
            lhs,
            rhs: item.rhs,
            branchId: source.branchId,
            part: source.part,
            eliminated: observerTouchesInternalNode(formulas[index], internalNames),
            lightweight: true
          };
        });
        const html = `
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("支路电流消去版本"))}</div>
            <div class="formula-empty">${escapeHtml(reducedBranchCurrentNote(internalNames))}</div>
          </div>
          ${lines.map(item => renderFormulaCard({
            line: `${item.lhs} = ${item.rhs}`,
            branchId: item.branchId,
            part: item.part,
            eliminated: item.eliminated,
            lightweight: item.lightweight
          }, { lightweight: true })).join("")}
        `;
        const current = branchCurrentCache.get(key);
        if (current?.pending === pending) cacheSet(branchCurrentCache, key, { html, pending: null });
        return html;
      }).catch(error => {
        const current = branchCurrentCache.get(key);
        if (current?.pending === pending) branchCurrentCache.delete(key);
        throw error;
      });
      cacheSet(branchCurrentCache, key, { html: null, pending });

      try {
        const html = await pending;
        replaceReducedBranchCurrentHtml(token, html);
      } catch (error) {
        renderReducedBranchCurrentError(token, error);
      }
    }

    function buildReducedBranchCurrentPayload() {
      const payload = buildReducedPayload();
      const displayNames = payload.node_display_names || {};
      const internal = payload.internal_nodes || [];
      const external = payload.external_nodes || [];
      const formulas = currentFormulaEntriesForCanvas().filter(entry => entry.line && !entry.placeholder && entry.part !== "ground");
      if (!internal.length || !external.length || !formulas.length) return null;
      return {
        internal,
        external,
        displayNames,
        formulas,
        payload: {
          ...payload,
          observers: formulas.map(entry => {
            const line = entry.line;
            const eqIndex = line.indexOf("=");
            return {
              lhs: eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim(),
              rhs: eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "0"
            };
          })
        }
      };
    }

    function currentFormulaEntriesForCanvas() {
      const formulaGroupMap = groupByTerminalMap();
      return state.branches.flatMap(branch => currentFormulaEntries(branch, formulaGroupMap));
    }

    function formulaIdentity(lhs) {
      return String(lhs || "")
        .replace(/^i_/, "")
        .replace(/_red$/, "")
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function hoverSourceByIdentity(formulas) {
      const map = new Map();
      formulas.forEach(entry => {
        if (!entry?.line || !entry.branchId) return;
        const eqIndex = entry.line.indexOf("=");
        const lhs = eqIndex >= 0 ? entry.line.slice(0, eqIndex).trim() : entry.line.trim();
        map.set(formulaIdentity(lhs), {
          branchId: entry.branchId,
          part: entry.part,
          eliminated: entry.eliminated
        });
      });
      return map;
    }

    function currentReducedBranchCurrentHtml() {
      const branchPayload = buildReducedBranchCurrentPayload();
      if (!branchPayload) return "";
      const key = JSON.stringify({ language: state.language, payload: branchPayload.payload });
      return cacheGet(branchCurrentCache, key)?.html || "";
    }

    function replaceReducedBranchCurrentHtml(token, html) {
      if (token !== branchCurrentRenderToken || state.activeOutput !== "formulas") return;
      const target = document.getElementById("reducedBranchCurrents");
      if (target) target.outerHTML = html;
    }

    function renderReducedBranchCurrentError(token, error) {
      if (token !== branchCurrentRenderToken || state.activeOutput !== "formulas") return;
      const target = document.getElementById("reducedBranchCurrents");
      if (target) {
        const prefix = state.language === "en" ? "Reduced branch current failed" : "支路电流消去失败";
        target.innerHTML = `<div class="formula-name">${escapeHtml(tr("支路电流消去版本"))}</div><div class="formula-empty">${escapeHtml(prefix)}：${escapeHtml(error.message || String(error))}</div>`;
      }
    }

    function sourceObserverLhs(entry, fallbackLhs) {
      if (!entry?.line) return fallbackLhs || "i_obs";
      const eqIndex = entry.line.indexOf("=");
      return eqIndex >= 0 ? entry.line.slice(0, eqIndex).trim() : entry.line.trim();
    }

    function observerTouchesInternalNode(entry, internalNames) {
      const lhs = sourceObserverLhs(entry, "");
      if (!lhs.startsWith("i_")) return false;
      const raw = lhs.slice(2);
      const toIndex = raw.lastIndexOf("_to_");
      if (toIndex < 0) return false;
      const before = raw.slice(0, toIndex);
      const to = raw.slice(toIndex + 4);
      const from = before.split("_").pop();
      return internalNames.includes(from) || internalNames.includes(to);
    }

    function reducedBranchCurrentNote(internalNames) {
      const nodes = internalNames.join(", ");
      return state.language === "en"
        ? `Internal node${internalNames.length > 1 ? "s" : ""} ${nodes} substituted by voltage recovery formula. Original observer directions are kept; eliminated endpoint names are marked.`
        : `内部节点 ${nodes} 已代入电压恢复公式。支路观测方向保留原始元件方向，若端点已被消去会标注“消去情况”。`;
    }

    function renderFormulaCard(entry, options = {}) {
      if (typeof entry !== "string" && entry.note) {
        return `
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(entry.name || tr("支路电流"))}</div>
            <div class="formula-empty">${escapeHtml(entry.note)}</div>
          </div>
        `;
      }
      const line = typeof entry === "string" ? entry : entry.line;
      const eqIndex = line.indexOf("=");
      const lhs = eqIndex >= 0 ? line.slice(0, eqIndex).trim() : line.trim();
      const rhs = eqIndex >= 0 ? line.slice(eqIndex + 1).trim() : "";
      const lightweight = Boolean(options.lightweight || (typeof entry !== "string" && entry.lightweight));
      const hoverBranchId = typeof entry === "string" ? "" : entry.branchId;
      const hoverPart = typeof entry === "string" ? "" : entry.part;
      const eliminated = typeof entry === "string" ? false : Boolean(entry.eliminated);
      const hoverMatches = state.hoverCurrent?.branchId === hoverBranchId &&
        state.hoverCurrent?.part === (hoverPart || "whole");
      const hoverAttrs = hoverBranchId
        ? ` data-hover-branch-id="${escapeHtml(hoverBranchId)}" data-hover-part="${escapeHtml(hoverPart || "")}"`
        : "";
      return `
        <div class="formula-card${hoverBranchId && hoverMatches ? " current-hover" : ""}"${hoverAttrs}>
          <div class="formula-name">${escapeHtml(formulaTitle(lhs, eliminated))}</div>
          <div class="formula-line">
            <span class="formula-lhs">${formatLhs(lhs, eliminated)}</span>
            <span class="formula-eq">=</span>
            <span class="formula-rhs">${formatFormulaRhs(rhs, lightweight)}</span>
          </div>
        </div>
      `;
    }

    const FORMULA_CARD_FORMAT_LIMIT = 1600;

    function formatFormulaRhs(rhs, lightweight = false) {
      const text = String(rhs ?? "0");
      return lightweight || text.length > FORMULA_CARD_FORMAT_LIMIT ? formatPlainMath(text) : formatMath(text);
    }

    function handleFormulaHover(event) {
      const card = event.target.closest(".formula-card[data-hover-branch-id]");
      if (!card) return;
      const next = {
        branchId: card.dataset.hoverBranchId,
        part: card.dataset.hoverPart || "whole"
      };
      if (state.hoverCurrent?.branchId === next.branchId && state.hoverCurrent?.part === next.part) return;
      state.hoverCurrent = next;
      document.querySelectorAll(".formula-card.current-hover").forEach(item => item.classList.remove("current-hover"));
      document.querySelectorAll(`.formula-card[data-hover-branch-id="${CSS.escape(next.branchId)}"][data-hover-part="${CSS.escape(next.part)}"]`)
        .forEach(item => item.classList.add("current-hover"));
      renderBranches();
    }

    function handleFormulaHoverOut(event) {
      const card = event.target.closest(".formula-card[data-hover-branch-id]");
      if (!card || card.contains(event.relatedTarget)) return;
      state.hoverCurrent = null;
      document.querySelectorAll(".formula-card.current-hover").forEach(item => item.classList.remove("current-hover"));
      renderBranches();
    }

    function eliminatedSuffix() {
      return state.language === "en" ? "eliminated" : "消去情况";
    }

    function formulaTitle(lhs, eliminated = false) {
      if (!lhs.startsWith("i_")) return lhs;
      return `${lhs.slice(2).replaceAll("_to_", " -> ").replaceAll("_", " ")}${eliminated ? ` (${eliminatedSuffix()})` : ""}`;
    }

    function formatLhs(lhs, eliminated = false) {
      if (!lhs.startsWith("i_")) return formatMath(lhs);
      const raw = lhs.slice(2);
      const toIndex = raw.lastIndexOf("_to_");
      if (toIndex < 0) return `i<sub>${escapeHtml(raw.replaceAll("_", ","))}</sub>`;
      const before = raw.slice(0, toIndex);
      const to = raw.slice(toIndex + 4);
      const parts = before.split("_");
      const from = parts.pop();
      const name = parts.join(",");
      return `i<sub>${escapeHtml(name)}, ${escapeHtml(from)}→${escapeHtml(to)}${eliminated ? ` (${escapeHtml(eliminatedSuffix())})` : ""}</sub>`;
    }

    const MATH_FORMAT_MAX_DEPTH = 80;
    const MATH_FORMAT_MAX_EXPR_LENGTH = 9000;

    function normalizeMathPowers(text) {
      return String(text ?? "0")
        .replace(/\^\{([^{}]+)\}/g, "**($1)")
        .replace(/\^([A-Za-z0-9_]+)/g, "**$1");
    }

    function formatMath(text) {
      return formatExpr(normalizeMathPowers(text).trim() || "0", 0, true);
    }

    function formatMathNoHighlight(text) {
      return formatExpr(normalizeMathPowers(text).trim() || "0", 0, false);
    }

    function formatMathWithTagged(displayText, taggedText = null) {
      if (taggedText === null || taggedText === undefined) return formatMath(displayText);
      const display = String(displayText ?? "0").trim() || "0";
      const tagged = String(taggedText ?? display).trim() || "0";
      if (taggedExprHasActiveSource(tagged)) return formatTaggedSourceExpr(tagged, 0);
      return formatTaggedExpr(display, tagged, 0, tagged);
    }

    function sourceMarkerRegex() {
      return /__bbsrc_[A-Za-z0-9_]+/g;
    }

    function stripSourceMarkers(text) {
      return String(text || "").replace(sourceMarkerRegex(), "");
    }

    function taggedExprHasActiveSource(taggedExpr) {
      const tagged = String(taggedExpr || "");
      return activeHighlightedBranches().some(branch =>
        [...branchHighlightSourceIds(branch)].some(sourceId => tagged.includes(sourceMarkerForBranch(sourceId)))
      );
    }

    function taggedAtomHighlightBranch(taggedAtom) {
      const tagged = String(taggedAtom || "");
      return activeHighlightedBranches().find(branch =>
        [...branchHighlightSourceIds(branch)].some(sourceId => tagged.includes(sourceMarkerForBranch(sourceId)))
      ) || null;
    }

    function formatTaggedSourceExpr(taggedExpr, depth = 0) {
      const tagged = stripOuterParens(String(taggedExpr || "0").trim()) || "0";
      const display = stripSourceMarkers(tagged);
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      const terms = splitAddSub(tagged);
      if (terms.length > 1) {
        return terms.map((part, index) => {
          const body = formatTaggedSourceTerm(part.term, depth + 1);
          if (index === 0) return part.sign === "-" ? `-${body}` : body;
          return ` <span class="math-op">${part.sign}</span> ${body}`;
        }).join("");
      }
      return formatTaggedSourceTerm(tagged, depth + 1);
    }

    function formatTaggedSourceTerm(taggedExpr, depth = 0) {
      const tagged = stripOuterParens(String(taggedExpr || "0").trim()) || "0";
      const display = stripSourceMarkers(tagged);
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      if (hasTopLevelAddSub(tagged)) return `(${formatTaggedSourceExpr(tagged, depth + 1)})`;
      if (tagged.startsWith("-")) return `-${formatTaggedSourceTerm(tagged.slice(1), depth + 1)}`;

      const divIndex = findTopLevelOperator(tagged, "/");
      if (divIndex > 0) {
        const numerator = stripOuterParens(tagged.slice(0, divIndex).trim());
        const denominator = stripOuterParens(tagged.slice(divIndex + 1).trim());
        return `<span class="math-frac"><span class="math-frac-num">${formatTaggedSourceExpr(numerator, depth + 1)}</span><span class="math-frac-den">${formatTaggedSourceExpr(denominator, depth + 1)}</span></span>`;
      }

      const factors = splitTopLevelBy(tagged, "*");
      if (factors.length > 1) {
        return factors.map(factor => formatTaggedSourceTerm(factor, depth + 1)).join(" · ");
      }

      return formatTaggedSourceAtom(tagged, depth + 1);
    }

    function formatTaggedSourceAtom(taggedExpr, depth = 0) {
      const tagged = stripOuterParens(String(taggedExpr || "0").trim()) || "0";
      const display = stripSourceMarkers(tagged);
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      if (hasTopLevelAddSub(tagged)) return `(${formatTaggedSourceExpr(tagged, depth + 1)})`;
      const powerIndex = findTopLevelPower(tagged);
      if (powerIndex > 0) {
        const base = stripOuterParens(tagged.slice(0, powerIndex).trim());
        const exponent = stripOuterParens(tagged.slice(powerIndex + 2).trim());
        return `${formatTaggedSourceTerm(base, depth + 1)}<sup>${formatTaggedSourceExpr(exponent, depth + 1)}</sup>`;
      }
      return wrapMathSourceHighlight(taggedAtomHighlightBranch(tagged), formatMathNoHighlight(display));
    }

    function splitTaggedAddSub(displayText, taggedText) {
      const displayParts = splitAddSub(stripOuterParens(String(displayText || "0").trim()));
      const taggedParts = splitAddSub(stripOuterParens(String(taggedText || "0").trim()));
      if (!displayParts.length || displayParts.length !== taggedParts.length) return null;
      return displayParts.map((part, index) => ({
        sign: part.sign,
        display: part.term,
        tagged: `${taggedParts[index].sign === "-" ? "-" : ""}${taggedParts[index].term}`
      }));
    }

    function formatTaggedExpr(displayExpr, taggedExpr, depth = 0, sourceTaggedExpr = taggedExpr) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      const tagged = stripOuterParens(String(taggedExpr || display).trim()) || "0";
      const sourceTagged = String(sourceTaggedExpr ?? taggedExpr ?? display).trim() || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatTaggedBySymbol(display, sourceTagged, depth + 1);
      }
      const parts = splitTaggedAddSub(display, tagged);
      if (parts && parts.length > 1) {
        return parts.map((part, index) => {
          const body = formatTaggedTerm(part.display, part.tagged, depth + 1, sourceTagged);
          if (index === 0) return part.sign === "-" ? `-${body}` : body;
          return ` <span class="math-op">${part.sign}</span> ${body}`;
        }).join("");
      }
      if (hasTopLevelAddSub(display) && !parts) {
        return formatTaggedBySymbol(display, sourceTagged, depth + 1);
      }
      return formatTaggedTerm(display, tagged, depth + 1, sourceTagged);
    }

    function formatTaggedTerm(displayExpr, taggedExpr, depth = 0, sourceTaggedExpr = taggedExpr) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      const tagged = stripOuterParens(String(taggedExpr || display).trim()) || "0";
      const sourceTagged = String(sourceTaggedExpr ?? taggedExpr ?? display).trim() || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatTaggedBySymbol(display, sourceTagged, depth + 1);
      }
      if (hasTopLevelAddSub(display)) {
        return `(${formatTaggedBySymbol(display, sourceTagged, depth + 1)})`;
      }
      if (display.startsWith("-")) {
        const nextTagged = tagged.startsWith("-") ? tagged.slice(1) : tagged;
        return `-${formatTaggedTerm(display.slice(1), nextTagged, depth + 1, sourceTagged)}`;
      }

      const displayDiv = findTopLevelOperator(display, "/");
      const taggedDiv = findTopLevelOperator(tagged, "/");
      if (displayDiv > 0 && taggedDiv > 0) {
        const displayNumerator = stripOuterParens(display.slice(0, displayDiv).trim());
        const displayDenominator = stripOuterParens(display.slice(displayDiv + 1).trim());
        const taggedNumerator = stripOuterParens(tagged.slice(0, taggedDiv).trim());
        const taggedDenominator = stripOuterParens(tagged.slice(taggedDiv + 1).trim());
        return `<span class="math-frac"><span class="math-frac-num">${formatTaggedExpr(displayNumerator, taggedNumerator, depth + 1, sourceTagged)}</span><span class="math-frac-den">${formatTaggedExpr(displayDenominator, taggedDenominator, depth + 1, sourceTagged)}</span></span>`;
      }

      const displayFactors = splitTopLevelBy(display, "*");
      const taggedFactors = splitTopLevelBy(tagged, "*");
      if (displayFactors.length > 1 && displayFactors.length === taggedFactors.length) {
        return displayFactors.map((factor, index) => formatTaggedTerm(factor, taggedFactors[index], depth + 1, sourceTagged)).join(" · ");
      }

      return formatTaggedAtom(display, tagged, depth + 1, sourceTagged);
    }

    function formatTaggedAtom(displayExpr, taggedExpr, depth = 0, sourceTaggedExpr = taggedExpr) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      const tagged = stripOuterParens(String(taggedExpr || display).trim()) || "0";
      const sourceTagged = String(sourceTaggedExpr ?? taggedExpr ?? display).trim() || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatTaggedBySymbol(display, sourceTagged, depth + 1);
      }
      if (hasTopLevelAddSub(display)) {
        return `(${formatTaggedBySymbol(display, sourceTagged, depth + 1)})`;
      }
      const displayPower = findTopLevelPower(display);
      const taggedPower = findTopLevelPower(tagged);
      if (displayPower > 0 && taggedPower > 0) {
        const displayBase = stripOuterParens(display.slice(0, displayPower).trim());
        const displayExponent = stripOuterParens(display.slice(displayPower + 2).trim());
        const taggedBase = stripOuterParens(tagged.slice(0, taggedPower).trim());
        const taggedExponent = stripOuterParens(tagged.slice(taggedPower + 2).trim());
        return `${formatTaggedTerm(displayBase, taggedBase, depth + 1, sourceTagged)}<sup>${formatTaggedExpr(displayExponent, taggedExponent, depth + 1, sourceTagged)}</sup>`;
      }
      const branch = symbolHighlightBranch(display, tagged) || symbolHighlightBranch(display, sourceTagged);
      return wrapMathSourceHighlight(branch, formatMathNoHighlight(display));
    }

    function taggedSymbolHighlights(taggedExpr) {
      const tagged = String(taggedExpr || "");
      const matches = [];
      activeHighlightedBranches().forEach(branch => {
        branchHighlightSourceIds(branch).forEach(sourceId => {
          const marker = sourceMarkerForBranch(sourceId);
          const regex = new RegExp(`\\b([A-Za-z_]\\w*)${escapeRegExp(marker)}\\b`, "g");
          let match;
          while ((match = regex.exec(tagged))) {
            matches.push({ symbol: match[1], branch });
          }
        });
      });
      return matches;
    }

    function symbolHighlightBranch(symbol, taggedExpr) {
      const clean = String(symbol || "").trim();
      return taggedSymbolHighlights(taggedExpr).find(item => item.symbol === clean)?.branch || null;
    }

    function formatTaggedBySymbol(displayExpr, taggedExpr, depth = 0) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      const terms = splitAddSub(display);
      if (terms.length > 1) {
        return terms.map((part, index) => {
          const body = formatTaggedBySymbolTerm(part.term, taggedExpr, depth + 1);
          if (index === 0) return part.sign === "-" ? `-${body}` : body;
          return ` <span class="math-op">${part.sign}</span> ${body}`;
        }).join("");
      }
      return formatTaggedBySymbolTerm(display, taggedExpr, depth + 1);
    }

    function formatTaggedBySymbolTerm(displayExpr, taggedExpr, depth = 0) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      if (hasTopLevelAddSub(display)) return `(${formatTaggedBySymbol(display, taggedExpr, depth + 1)})`;
      if (display.startsWith("-")) return `-${formatTaggedBySymbolTerm(display.slice(1), taggedExpr, depth + 1)}`;
      const divIndex = findTopLevelOperator(display, "/");
      if (divIndex > 0) {
        const numerator = stripOuterParens(display.slice(0, divIndex).trim());
        const denominator = stripOuterParens(display.slice(divIndex + 1).trim());
        return `<span class="math-frac"><span class="math-frac-num">${formatTaggedBySymbol(numerator, taggedExpr, depth + 1)}</span><span class="math-frac-den">${formatTaggedBySymbol(denominator, taggedExpr, depth + 1)}</span></span>`;
      }
      const factors = splitTopLevelBy(display, "*");
      if (factors.length > 1) {
        return factors.map(factor => formatTaggedBySymbolTerm(factor, taggedExpr, depth + 1)).join(" · ");
      }
      return formatTaggedBySymbolAtom(display, taggedExpr, depth + 1);
    }

    function formatTaggedBySymbolAtom(displayExpr, taggedExpr, depth = 0) {
      const display = stripOuterParens(String(displayExpr || "0").trim()) || "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || display.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        return formatMathNoHighlight(display);
      }
      if (hasTopLevelAddSub(display)) return `(${formatTaggedBySymbol(display, taggedExpr, depth + 1)})`;
      const powerIndex = findTopLevelPower(display);
      if (powerIndex > 0) {
        const base = stripOuterParens(display.slice(0, powerIndex).trim());
        const exponent = stripOuterParens(display.slice(powerIndex + 2).trim());
        return `${formatTaggedBySymbolTerm(base, taggedExpr, depth + 1)}<sup>${formatTaggedBySymbol(exponent, taggedExpr, depth + 1)}</sup>`;
      }
      return wrapMathSourceHighlight(symbolHighlightBranch(display, taggedExpr), formatMathNoHighlight(display));
    }

    function formatExpr(expr, depth = 0, allowHighlight = true) {
      expr = stripOuterParens(String(expr || "0").trim());
      if (!expr) return "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || expr.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        const html = formatPlainMath(expr);
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }

      let html;
      const terms = splitAddSub(expr);
      if (terms.length > 1) {
        html = terms.map((part, index) => {
          const body = formatTerm(part.term, depth + 1, allowHighlight);
          if (index === 0) return part.sign === "-" ? `-${body}` : body;
          return ` <span class="math-op">${part.sign}</span> ${body}`;
        }).join("");
      } else {
        html = formatTerm(expr, depth + 1, allowHighlight);
      }
      return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
    }

    function formatTerm(expr, depth = 0, allowHighlight = true) {
      expr = stripOuterParens(String(expr || "0").trim());
      if (!expr) return "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || expr.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        const html = formatPlainMath(expr);
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }
      let html;
      if (hasTopLevelAddSub(expr)) {
        html = `(${formatExpr(expr, depth + 1, allowHighlight)})`;
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }
      if (expr.startsWith("-")) {
        html = `-${formatTerm(expr.slice(1), depth + 1, allowHighlight)}`;
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }

      const divIndex = findTopLevelOperator(expr, "/");
      if (divIndex > 0) {
        const numerator = stripOuterParens(expr.slice(0, divIndex).trim());
        const denominator = stripOuterParens(expr.slice(divIndex + 1).trim());
        html = `<span class="math-frac"><span class="math-frac-num">${formatExpr(numerator, depth + 1, allowHighlight)}</span><span class="math-frac-den">${formatExpr(denominator, depth + 1, allowHighlight)}</span></span>`;
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }

      const factors = splitTopLevelBy(expr, "*");
      if (factors.length > 1) {
        html = factors.map(factor => formatTerm(factor, depth + 1, allowHighlight)).join(" · ");
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }

      html = formatAtom(expr, depth + 1, allowHighlight);
      return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
    }

    function hasTopLevelAddSub(expr) {
      let depth = 0;
      for (let i = 0; i < expr.length; i++) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        else if (ch === ")") depth -= 1;
        else if ((ch === "+" || ch === "-") && depth === 0 && i > 0) return true;
      }
      return false;
    }

    function formatAtom(expr, depth = 0, allowHighlight = true) {
      expr = stripOuterParens(String(expr || "0").trim());
      if (!expr) return "0";
      if (depth > MATH_FORMAT_MAX_DEPTH || expr.length > MATH_FORMAT_MAX_EXPR_LENGTH) {
        const html = formatPlainMath(expr);
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }
      let html;
      if (hasTopLevelAddSub(expr)) {
        html = `(${formatExpr(expr, depth + 1, allowHighlight)})`;
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }
      const powerIndex = findTopLevelPower(expr);
      if (powerIndex > 0) {
        const base = stripOuterParens(expr.slice(0, powerIndex).trim());
        const exponent = stripOuterParens(expr.slice(powerIndex + 2).trim());
        html = `${formatTerm(base, depth + 1, allowHighlight)}<sup>${formatExpr(exponent, depth + 1, allowHighlight)}</sup>`;
        return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
      }
      html = formatPlainMath(expr);
      return allowHighlight ? (wrapMathHighlight(expr, html) || html) : html;
    }

    function formatPlainMath(expr) {
      let html = escapeHtml(String(expr || "0").trim() || "0");
      html = html.replace(/\b([A-Za-z]+)([0-9]+|_[A-Za-z0-9_]+)\b/g, (_, base, suffix) => {
        const sub = suffix.startsWith("_") ? suffix.slice(1).replaceAll("_", ",") : suffix;
        return `${base}<sub>${sub}</sub>`;
      });
      html = html.replace(/\*\*([A-Za-z0-9_]+)/g, "<sup>$1</sup>");
      html = html.replace(/\bV_N([0-9]+)\b/g, "V<sub>N$1</sub>");
      return html;
    }

    function stripOuterParens(expr) {
      let out = String(expr || "").trim();
      while (out.startsWith("(") && out.endsWith(")") && enclosesWholeExpression(out)) {
        out = out.slice(1, -1).trim();
      }
      return out;
    }

    function enclosesWholeExpression(expr) {
      let depth = 0;
      for (let i = 0; i < expr.length; i++) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        if (ch === ")") depth -= 1;
        if (depth === 0 && i < expr.length - 1) return false;
      }
      return depth === 0;
    }

    function findTopLevelOperator(expr, operator) {
      let depth = 0;
      for (let i = 0; i < expr.length; i++) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        else if (ch === ")") depth -= 1;
        else if (operator === "*" && ch === "*" && expr[i + 1] === "*" && depth === 0) {
          i += 1;
        }
        else if (ch === operator && depth === 0) return i;
      }
      return -1;
    }

    function findTopLevelPower(expr) {
      let depth = 0;
      for (let i = 0; i < expr.length - 1; i++) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        else if (ch === ")") depth -= 1;
        else if (ch === "*" && expr[i + 1] === "*" && depth === 0) return i;
      }
      return -1;
    }

    function splitTopLevelBy(expr, separator) {
      const parts = [];
      let depth = 0;
      let current = "";
      for (let i = 0; i < expr.length; i += 1) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        if (ch === ")") depth -= 1;
        if (separator === "*" && ch === "*" && expr[i + 1] === "*" && depth === 0) {
          current += "**";
          i += 1;
          continue;
        }
        if (ch === separator && depth === 0) {
          parts.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      if (current.trim()) parts.push(current.trim());
      return parts;
    }

    function splitAddSub(expr) {
      const parts = [];
      let depth = 0;
      let current = "";
      let sign = "+";
      for (let i = 0; i < expr.length; i++) {
        const ch = expr[i];
        if (ch === "(") depth += 1;
        if (ch === ")") depth -= 1;
        const isSign = (ch === "+" || ch === "-") && depth === 0;
        if (isSign && i > 0) {
          if (current.trim()) parts.push({ sign, term: current.trim() });
          sign = ch;
          current = "";
        } else if (isSign && i === 0) {
          sign = ch;
        } else {
          current += ch;
        }
      }
      if (current.trim()) parts.push({ sign, term: current.trim() });
      return parts;
    }

    function renderNodeEquations() {
      const assembled = constrainedAssembledSystem(assembleGlobalSystem({ expandPackaged: true }));
      if (!assembled.nodes.length) {
        return `<div class="formula-empty">${escapeHtml(tr("尚未创建节点。"))}</div>`;
      }

      const displayNodes = assembled.nodes.map(node => displayNameForAssembledNode(assembled, node));
      const nodeList = displayNodes.join(", ");
      const groundList = (assembled.groundNodes || []).map(node => displayNameForAssembledNode(assembled.originalAssembled || assembled, node)).join(", ");
      const warnings = assembled.warnings?.length
        ? `<div class="validation-warning">${assembled.warnings.map(escapeHtml).join("<br>")}</div>`
        : "";
      return `
        <div class="formula-list">
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("节点顺序"))}</div>
            <div class="formula-line"><span class="formula-rhs">${escapeHtml(nodeList)}</span></div>
            ${groundList ? `<div class="formula-line"><span class="formula-rhs">${escapeHtml(tr("Ground 节点"))}: ${escapeHtml(groundList)} = 0</span></div>` : ""}
          </div>
          <div class="formula-card">
            <div class="formula-name">${escapeHtml(tr("全局节点方程"))}</div>
            ${warnings}
            <div class="matrix-equation">
              ${renderVectorMatrix(displayNodes.map(node => `I_${node}`))}
              <span class="formula-eq">=</span>
              ${renderGMatrix(assembled)}
              ${renderVectorMatrix(displayNodes.map(node => `V_${node}`))}
              <span class="formula-eq">+</span>
              ${renderTermVectorMatrix(assembled.Ihis)}
            </div>
          </div>
        </div>
      `;
    }

    function renderVectorMatrix(items, taggedItems = null) {
      return `<span class="matrix" style="grid-template-columns: 1fr;">${
        items.map((item, index) => `<span class="matrix-cell">${formatMathWithTagged(item, taggedItems?.[index])}</span>`).join("")
      }</span>`;
    }

    function renderTermVectorMatrix(termRows) {
      return `<span class="matrix" style="grid-template-columns: 1fr;">${
        termRows.map(terms => `<span class="matrix-cell">${renderTermSum(terms)}</span>`).join("")
      }</span>`;
    }

    function renderGMatrix(assembled) {
      const n = assembled.nodes.length;
      return renderTermMatrix(assembled.G, n);
    }

    function renderTermMatrix(rows, cols = null) {
      const columnCount = cols || Math.max(1, ...rows.map(row => row.length));
      return `<span class="matrix" style="grid-template-columns: repeat(${columnCount}, minmax(58px, auto));">${
        rows.flatMap(row => {
          const filled = [...row];
          while (filled.length < columnCount) filled.push([]);
          return filled;
        }).map(item => `<span class="matrix-cell">${renderTermSum(item)}</span>`).join("")
      }</span>`;
    }

    function renderMatrix(rows, cols = null, taggedRows = null, cellClassFor = null) {
      const columnCount = cols || Math.max(1, ...rows.map(row => row.length));
      return `<span class="matrix" style="grid-template-columns: repeat(${columnCount}, minmax(58px, auto));">${
        rows.flatMap((row, rowIndex) => {
          const filled = [...row];
          const taggedFilled = taggedRows?.[rowIndex] ? [...taggedRows[rowIndex]] : null;
          while (filled.length < columnCount) filled.push("");
          while (taggedFilled && taggedFilled.length < columnCount) taggedFilled.push("");
          return filled.map((item, colIndex) => ({
            item,
            tagged: taggedFilled?.[colIndex],
            rowIndex,
            colIndex,
          }));
        }).map(({ item, tagged, rowIndex, colIndex }) => {
          const extraClass = cellClassFor ? String(cellClassFor(rowIndex, colIndex, item) || "") : "";
          const className = ["matrix-cell", extraClass].filter(Boolean).join(" ");
          return `<span class="${className}">${formatMathWithTagged(item || "0", tagged)}</span>`;
        }).join("")
      }</span>`;
    }

    function hasNonZeroMatrixValue(matrix) {
      return (matrix || []).some(row => (row || []).some(value => String(value || "0") !== "0"));
    }

    function hasNonZeroVectorValue(vector) {
      return (vector || []).some(value => String(value || "0") !== "0");
    }

    function isZeroText(value) {
      return /^(?:0|0\.0+)$/.test(String(value ?? "").trim());
    }

    function isSimpleSymbolText(value) {
      const text = String(value ?? "").trim();
      return /^-?[A-Za-z][A-Za-z0-9_]*(?:\^\{?\d+\}?)?$/.test(text);
    }

    function compactMatrixToken(value, prefix, rowIndex, colIndex) {
      const text = String(value ?? "0").trim() || "0";
      if (isZeroText(text) || isSimpleSymbolText(text)) return text;
      return `${prefix}[${rowIndex}][${colIndex}]`;
    }

    function compactMatrixRows(rows, prefix) {
      return (rows || []).map((row, rowIndex) =>
        (row || []).map((value, colIndex) => compactMatrixToken(value, prefix, rowIndex, colIndex))
      );
    }

    function renderCompactMatrix(rows, prefix, cols = null) {
      return renderMatrix(compactMatrixRows(rows || [], prefix), cols);
    }

    function compactMatrixRowsFromSource(rows, sourcePrefix, rowSourceIndices, colSourceIndices) {
      return (rows || []).map((row, rowIndex) =>
        (row || []).map((value, colIndex) => {
          const sourceRow = rowSourceIndices?.[rowIndex] ?? rowIndex;
          const sourceCol = colSourceIndices?.[colIndex] ?? colIndex;
          return compactMatrixToken(value, sourcePrefix, sourceRow, sourceCol);
        })
      );
    }

    function renderCompactMatrixFromSource(rows, sourcePrefix, rowSourceIndices, colSourceIndices, cols = null) {
      return renderMatrix(compactMatrixRowsFromSource(rows || [], sourcePrefix, rowSourceIndices, colSourceIndices), cols);
    }

    function renderCompactVector(items, prefix) {
      return renderVectorMatrix((items || []).map((value, index) => compactMatrixToken(value, prefix, index, 0)));
    }

    function optText(zh, en) {
      return state.language === "en" ? en : zh;
    }

    function optimizedBlockTypeLabel(type) {
      const labels = {
        pure_diagonal: optText("纯对角", "pure diagonal"),
        diagonal_plus_coupled: optText("对角 + 耦合", "diagonal + coupled"),
        general: optText("一般", "general")
      };
      return labels[type] || type || optText("未知", "unknown");
    }

    function optimizedBooleanLabel(value) {
      return value ? optText("是", "true") : optText("否", "false");
    }

    async function renderReducedEquationsAsync(token) {
      const payload = buildReducedPayload();
      const staticHtml = reducedStaticMessage(payload);
      if (staticHtml) {
        if (token === reducedRenderToken) outputText.innerHTML = staticHtml;
        return;
      }

      const key = reducedCacheKey(payload);
      const cachedEntry = cacheGet(reducedCache, key);
      if (cachedEntry?.html) {
        if (token === reducedRenderToken) {
          outputText.innerHTML = cachedEntry.result
            ? renderReducedEquationsResult(cachedEntry.result, payload.node_display_names || {})
            : cachedEntry.html;
        }
        return;
      }

      if (cachedEntry?.pending) {
        try {
          const html = await cachedEntry.pending;
          if (token === reducedRenderToken) outputText.innerHTML = html;
        } catch (error) {
          if (token === reducedRenderToken) {
            outputText.innerHTML = `<div class="formula-empty">节点消去失败：${escapeHtml(error.message || String(error))}</div>`;
          }
        }
        return;
      }

      const pending = requestReduction(payload).then(result => {
        let html;
        try {
          html = renderReducedEquationsResult(result, payload.node_display_names || {});
        } catch (error) {
          const message = state.language === "en"
            ? "SymPy returned the reduced equations, but the browser could not render the full formatted expression. Showing compact text instead."
            : "SymPy 已返回节点消去结果，但浏览器无法完整排版这个超长公式；下面改用紧凑文本显示。";
          html = `
            <div class="formula-list">
              <div class="formula-card">
                <div class="formula-name">${escapeHtml(tr("节点方程消去版本"))}</div>
                <div class="formula-empty">${escapeHtml(message)} ${escapeHtml(error.message || String(error))}</div>
                <pre class="code">${escapeHtml(JSON.stringify(result, null, 2))}</pre>
              </div>
            </div>
          `;
        }
        const current = reducedCache.get(key);
        if (current?.pending === pending) cacheSet(reducedCache, key, { html, result, pending: null });
        return html;
      }).catch(error => {
        const current = reducedCache.get(key);
        if (current?.pending === pending) reducedCache.delete(key);
        throw error;
      });
      cacheSet(reducedCache, key, { html: null, pending });

      try {
        const html = await pending;
        if (token === reducedRenderToken) {
          outputText.innerHTML = html;
        }
      } catch (error) {
        if (token === reducedRenderToken) {
          outputText.innerHTML = `<div class="formula-empty">节点消去失败：${escapeHtml(error.message || String(error))}</div>`;
        }
      }
    }

    function currentReducedHtml() {
      const payload = buildReducedPayload();
      const staticHtml = reducedStaticMessage(payload);
      if (staticHtml) return staticHtml;
      const key = reducedCacheKey(payload);
      const cached = cacheGet(reducedCache, key);
      if (cached?.result) return renderReducedEquationsResult(cached.result, payload.node_display_names || {});
      return cached?.html || null;
    }

    function buildReducedPayload(options = {}) {
      const deferDummyNodeBlocks = Boolean(options.deferDummyNodeBlocks);
      const assembled = assembleGlobalSystem({ expandPackaged: true });
      const groundSet = new Set(assembled.groundNodes || []);
      const forcedInternal = new Set(assembled.forcedInternalNodes || []);
      const nodeDisplayNames = Object.fromEntries(assembled.nodes.map(node => [node, displayNameForAssembledNode(assembled, node)]));
      const dummyNodeBlocks = dummyNodeBlocksForReducedPayload({
        all_nodes: assembled.nodes,
        node_display_names: nodeDisplayNames
      });
      if (!deferDummyNodeBlocks) {
        dummyNodeBlocks.forEach(block => {
          (block.dummy_nodes || []).forEach(node => {
            if (node?.node_id) forcedInternal.add(node.node_id);
          });
        });
      }
      const internal = assembled.nodes.filter(node => !groundSet.has(node) && (state.internalNodes.includes(node) || forcedInternal.has(node)));
      const external = assembled.nodes.filter(node => !groundSet.has(node) && !state.internalNodes.includes(node));
      const externalVisible = external.filter(node => !forcedInternal.has(node));
      const retainedSet = new Set(externalVisible);

      const payload = {
        all_nodes: assembled.nodes,
        voltage_nodes: assembled.nodes.map(node => displayNameForAssembledNode(assembled, node)),
        node_display_names: nodeDisplayNames,
        external_nodes: externalVisible,
        internal_nodes: internal,
        ground_nodes: [...groundSet],
        warnings: assembled.warnings || [],
        G_full: assembled.G.map(row => row.map(sumTerms)),
        Ihis_full: assembled.Ihis.map(sumTerms),
        G_full_tagged: assembled.G.map(row => row.map(taggedSumTerms)),
        Ihis_full_tagged: assembled.Ihis.map(taggedSumTerms),
        direct_retained_stamps: directRetainedStampsForPayload(assembled.elementStamps || [], retainedSet, groundSet),
        G_symbol_usage: assembled.GSymbolUsage || [],
        G_constant_symbols: globallyConstantGSymbols(assembled.GSymbolUsage || [])
      };
      payload.symbol_dependency_table = buildSymbolDependencyTable(payload);
      payload.symbol_dependency_table_tagged = buildTaggedSymbolDependencyTable(payload);
      if (dummyNodeBlocks.length) {
        payload.dummy_node_blocks = dummyNodeBlocks;
        if (deferDummyNodeBlocks) payload.defer_dummy_node_blocks = true;
      }
      return payload;
    }

    function directRetainedStampsForPayload(elementStamps, retainedSet, groundSet) {
      return (elementStamps || [])
        .filter(stamp => {
          const support = stamp.support_nodes || [];
          return support.length && support.every(node => retainedSet.has(node) && !groundSet.has(node));
        })
        .map(stamp => ({
          id: stamp.id,
          name: stamp.name,
          support_nodes: [...stamp.support_nodes],
          G: (stamp.G || []).map(entry => ({ ...entry })),
          Ihis: (stamp.Ihis || []).map(entry => ({ ...entry }))
        }));
    }

    function reducedStaticMessage(payload) {
      if (!payload.internal_nodes.length) {
        return `<div class="formula-empty">${escapeHtml(tr("请在右侧网络节点列表中勾选至少一个“内部”节点。"))}</div>`;
      }
      if (payload.warnings?.length) {
        return `<div class="formula-empty">${payload.warnings.map(escapeHtml).join("<br>")}</div>`;
      }
      if (!payload.external_nodes.length) {
        return `<div class="formula-empty">${escapeHtml(tr("至少需要保留一个外部节点。"))}</div>`;
      }
      return null;
    }

    function optimizedStaticMessage(payload) {
      if (payload.warnings?.length) {
        return `<div class="formula-empty">${payload.warnings.map(escapeHtml).join("<br>")}</div>`;
      }
      if (!payload.external_nodes.length) {
        return `<div class="formula-empty">${escapeHtml(tr("至少需要保留一个外部节点。"))}</div>`;
      }
      return null;
    }

    async function requestReduction(payload) {
      const urls = localApiUrls("/reduce-system");
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || result.ok === false) {
            throw Object.assign(new Error(result.error || "节点消去失败"), { backendError: true });
          }
          return result;
        } catch (error) {
          if (error.backendError) throw error;
          lastError = error;
        }
      }
      throw lastError || new Error("节点消去失败");
    }

    async function ensureReducedResult(payload) {
      const staticHtml = reducedStaticMessage(payload);
      if (staticHtml) return null;
      const key = reducedCacheKey(payload);
      const cachedEntry = cacheGet(reducedCache, key);
      if (cachedEntry?.result) return cachedEntry.result;
      if (cachedEntry?.pending) return cachedEntry.pending;

      const pending = requestReduction(payload).then(result => {
        const current = reducedCache.get(key);
        const html = current?.html || null;
        if (current?.pending === pending) cacheSet(reducedCache, key, { html, result, pending: null });
        return result;
      }).catch(error => {
        const current = reducedCache.get(key);
        if (current?.pending === pending) reducedCache.delete(key);
        throw error;
      });
      cacheSet(reducedCache, key, { html: cachedEntry?.html || null, result: null, pending });
      return pending;
    }

    function reducedDependencyAnalysisFromResult(result) {
      if (!result?.G_red || !result?.Ihis_red || !result?.G_red_tagged || !result?.Ihis_red_tagged) return null;
      return {
        external_nodes: result.external_nodes || [],
        G_red: result.G_red,
        Ihis_red: result.Ihis_red,
        G_red_tagged: result.G_red_tagged,
        Ihis_red_tagged: result.Ihis_red_tagged
      };
    }

    function cachedReducedDependencyAnalysis(payload) {
      const key = reducedCacheKey(payload);
      const cachedEntry = cacheGet(reducedCache, key);
      return reducedDependencyAnalysisFromResult(cachedEntry?.result);
    }

    async function reducedDependencyAnalysisForOptimizedPayload(payload) {
      const cached = cachedReducedDependencyAnalysis(payload);
      if (cached) return cached;
      const result = await ensureReducedResult(payload);
      return reducedDependencyAnalysisFromResult(result);
    }

    function optimizedEliminationPayload(options = {}) {
      const payload = {
        ...buildReducedPayload(options),
        mode: "structured_formula",
        display_mode: state.optimizedEliminationDisplay || "compact",
        simplify_level: state.optimizedEliminationSimplify || "light",
        assume_spd: state.optimizedEliminationAssumeSpd !== false,
        use_suggested_order: state.optimizedEliminationUseSuggestedOrder !== false
      };
      const dummy_finalization = dummyFinalizationForCaseProfile(activeDummyFinalizationProfile(), payload);
      return {
        ...payload,
        ...(dummy_finalization ? { dummy_finalization } : {})
      };
    }

    function optimizedEliminationCacheKey(payload) {
      return JSON.stringify({
        language: state.language,
        display_mode: payload.display_mode,
        simplify_level: payload.simplify_level,
        assume_spd: payload.assume_spd,
        use_suggested_order: payload.use_suggested_order,
        all_nodes: payload.all_nodes,
        external_nodes: payload.external_nodes,
        internal_nodes: payload.internal_nodes,
        node_display_names: payload.node_display_names,
        ground_nodes: payload.ground_nodes,
        G_full: payload.G_full,
        Ihis_full: payload.Ihis_full,
        G_symbol_usage: payload.G_symbol_usage,
        G_constant_symbols: payload.G_constant_symbols,
        direct_retained_stamps: payload.direct_retained_stamps,
        symbol_dependency_table: payload.symbol_dependency_table,
        symbol_dependency_table_tagged: payload.symbol_dependency_table_tagged,
        G_full_tagged: payload.G_full_tagged,
        Ihis_full_tagged: payload.Ihis_full_tagged,
        dummy_finalization: payload.dummy_finalization
      });
    }

    async function requestOptimizedElimination(payload) {
      const urls = localApiUrls("/optimized-elimination");
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || result.ok === false) {
            throw Object.assign(new Error(result.error || optText("优化消元失败", "Optimized elimination failed")), { backendError: true });
          }
          return result;
        } catch (error) {
          if (error.backendError) throw error;
          lastError = error;
        }
      }
      throw lastError || new Error(optText("优化消元失败", "Optimized elimination failed"));
    }

    function multiCaseEligibleBranches() {
      return state.branches.filter(branch => {
        normalizeSwitchCases(branch);
        return Array.isArray(branch.switchCases) && branch.switchCases.length > 1;
      });
    }

    function initTimeMultiCaseBranches(branches = multiCaseEligibleBranches()) {
      return branches.filter(branch => !isRuntimeMutableCaseGroup(branch));
    }

    function runtimeMutableCaseBranches(branches = multiCaseEligibleBranches()) {
      return branches.filter(branch => isRuntimeMutableCaseGroup(branch));
    }

    function defaultMultiCaseProfiles(branches = initTimeMultiCaseBranches()) {
      if (!branches.length) return multiCaseEligibleBranches().length ? [{
        name: "case 0",
        comment: "init-time base profile",
        case_map: {}
      }] : [];
      const profiles = [];
      const caseName = (branch, index) => branch.switchCases?.[index]?.name || `Case ${index + 1}`;
      const buildProfile = (branchIndex, caseMap, labels) => {
        if (branchIndex >= branches.length) {
          profiles.push({
            name: `case ${profiles.length}`,
            comment: labels.join("; "),
            case_map: { ...caseMap }
          });
          return;
        }
        const branch = branches[branchIndex];
        const branchName = branch.name || branch.id;
        (branch.switchCases || []).forEach((_item, index) => {
          buildProfile(
            branchIndex + 1,
            { ...caseMap, [branch.id]: index },
            [...labels, `${branchName} = ${caseName(branch, index)}`]
          );
        });
      };
      buildProfile(0, {}, []);
      return profiles;
    }

    function multiCaseProfilesKey(branches = multiCaseEligibleBranches()) {
      return JSON.stringify({
        version: "alias-template-cartesian-profiles-runtime-v1",
        branches: branches.map(branch => ({
          id: branch.id,
          name: branch.name,
          caseCount: branch.switchCases?.length || 0,
          caseNames: (branch.switchCases || []).map(item => item.name || ""),
          runtimeMutableCaseGroup: isRuntimeMutableCaseGroup(branch)
        }))
      });
    }

    function ensureMultiCaseProfilesText(branches = multiCaseEligibleBranches()) {
      const initBranches = initTimeMultiCaseBranches(branches);
      const key = multiCaseProfilesKey(branches);
      const generated = JSON.stringify(defaultMultiCaseProfiles(initBranches), null, 2);
      if (state.multiCaseProfilesText !== generated || state.multiCaseProfilesKey !== key) {
        state.multiCaseProfilesText = generated;
        state.multiCaseProfilesKey = key;
      }
      return state.multiCaseProfilesText;
    }

    function parseMultiCaseProfiles() {
      const text = state.multiCaseProfilesText?.trim() || "[]";
      const profiles = JSON.parse(text);
      if (!Array.isArray(profiles)) throw new Error(optText("case profiles 必须是数组。", "case profiles must be an array."));
      return profiles.map((profile, index) => ({
        name: String(profile?.name || `Case ${index + 1}`),
        comment: String(profile?.comment || ""),
        case_map: profile?.case_map && typeof profile.case_map === "object" ? profile.case_map : {}
      }));
    }

    function payloadForCaseProfile(profile, runtimeCaseMap = {}) {
      const originals = state.branches.map(branch => [branch, Number(branch.activeSwitchCase) || 0, Number(branch.packageOriginal?.activeNetworkCase) || 0]);
      try {
        Object.entries({ ...(profile.case_map || {}), ...(runtimeCaseMap || {}) }).forEach(([branchId, caseIndex]) => {
          const branch = findBranch(branchId);
          if (!branch) return;
          normalizeSwitchCases(branch);
          if (!branch.switchCases?.length) return;
          branch.activeSwitchCase = Math.max(0, Math.min(branch.switchCases.length - 1, Number(caseIndex) || 0));
          if (branch.packageOriginal) applyPackageNetworkCase(branch, branch.activeSwitchCase);
        });
        return optimizedEliminationPayload({ deferDummyNodeBlocks: true });
      } finally {
        originals.forEach(([branch, activeSwitchCase, activeNetworkCase]) => {
          branch.activeSwitchCase = activeSwitchCase;
          if (branch.packageOriginal) applyPackageNetworkCase(branch, activeNetworkCase);
        });
      }
    }

    function dummyFinalizationForCaseProfile(profile, payload) {
      const leaves = [];
      const lookup = netLookup();
      const nodeForPackPort = (branch, port, fallback = "") => {
        const supportNodes = (payload?.direct_retained_stamps || [])
          .find(stamp => stamp.id === branch.id)
          ?.support_nodes || [];
        const portIndex = (branch.ports || []).indexOf(port);
        if (portIndex >= 0 && supportNodes[portIndex]) return supportNodes[portIndex];
        if (!port) return fallback;
        const netId = lookup.get(terminalKey(branch.id, port));
        return nodeDisplayName(netId) || branch.nodes?.[port] || fallback || port;
      };
      Object.entries(profile.case_map || {}).forEach(([branchId, caseIndex]) => {
        const branch = findBranch(branchId);
        if (!branch?.packageOriginal) return;
        normalizePackageNetworkCases(branch);
        const cases = branch.packageOriginal.networkCases || [];
        const index = Math.max(0, Math.min(cases.length - 1, Number(caseIndex) || 0));
        const active = cases[index] || {};
        const groups = active.superExternalGroups || active.externalGroups || [];
        const sourceBranches = active.branches || [];
        dummyBranchesForPackCase(sourceBranches).forEach(dummy => {
          const dummySide = dummy.dummyTerminalSide || "B";
          const anchorSide = dummy.anchorTerminalSide || "A";
          const dummyKey = terminalKey(dummy.id, dummySide);
          const anchorKey = terminalKey(dummy.id, anchorSide);
          const dummyGroup = groups.find(group => (group.members || []).includes(dummyKey));
          const anchorGroup = groups.find(group => (group.members || []).includes(anchorKey));
          if (!dummyGroup || !anchorGroup) return;
          leaves.push({
            dummy_node: nodeForPackPort(branch, dummyGroup.port, dummyGroup.display),
            anchor_node: nodeForPackPort(branch, anchorGroup.port, anchorGroup.display),
            branch_id: dummy.name || dummy.id || "DummyBranch",
            conductance: dummy.g || "G_EPSILON"
          });
        });
      });
      return leaves.length ? { dummy_leaves: leaves } : null;
    }

    function activeDummyFinalizationProfile() {
      const case_map = {};
      state.branches.forEach(branch => {
        if (!branch?.packageOriginal) return;
        normalizePackageNetworkCases(branch);
        const active = branch.packageOriginal.activeNetworkCase ?? branch.activeSwitchCase ?? 0;
        case_map[branch.id] = Math.max(0, Number(active) || 0);
      });
      return { name: "Active case", case_map };
    }

    function dummyNodeBlocksForReducedPayload(payload) {
      const blocks = [];
      const allNodes = new Set(payload?.all_nodes || []);
      const lookup = netLookup();

      dummyNodeBlocksForPackCase(state.branches).forEach(branch => {
        const dummy_nodes = terminalSides(branch)
          .map(side => {
            const node = lookup.get(terminalKey(branch.id, side));
            if (!node || !allNodes.has(node)) return null;
            return {
              side,
              node_id: node,
              display_name: nodeDisplayName(node),
              dummy_role: "isolated_dummy_internal"
            };
          })
          .filter(Boolean);
        if (dummy_nodes.length) {
          blocks.push({
            element_type: "dummy_node_block",
            block_id: branch.name || branch.id || "N-Dummy",
            dimension: dummy_nodes.length,
            fixed_conductance: branch.fixedConductance || "G_EPSILON",
            forced_elimination: true,
            recoverable: false,
            dummy_nodes
          });
        }
      });

      state.branches.forEach(branch => {
        if (!branch?.packageOriginal) return;
        normalizePackageNetworkCases(branch);
        const pkg = branch.packageOriginal;
        const index = Math.max(0, Math.min((pkg.networkCases || []).length - 1, Number(pkg.activeNetworkCase ?? branch.activeSwitchCase) || 0));
        const active = pkg.networkCases?.[index] || {};
        const groupRefs = [
          ...((active.superExternalGroups || active.externalGroups || []).map((group, groupIndex) => ({ group, groupIndex, kind: "external" }))),
          ...((active.superInternalGroups || active.internalGroups || []).map((group, groupIndex) => ({ group, groupIndex, kind: "internal" })))
        ];
        const groups = [...(active.superExternalGroups || active.externalGroups || []), ...(active.superInternalGroups || active.internalGroups || [])];
        const sourceBranches = active.branches || pkg.branches || [];
        const derivedBlocks = dummyNodeBlockPayloadForCase(sourceBranches, groups);
        (derivedBlocks.length ? derivedBlocks : (active.dummyNodeBlocks || pkg.dummyNodeBlocks || [])).forEach(block => {
          const dummy_nodes = (block.dummy_nodes || []).map(node => {
            const sourceBranchId = block.source_branch_id || block.sourceBranchId || block.block_id || "";
            const match = groupRefs.find(item => item.group.id === node.node_id)
              || groupRefs.find(item => node.side && (item.group.members || []).includes(terminalKey(sourceBranchId, node.side)))
              || groupRefs.find(item => item.group.display === node.display_name);
            if (!match) return null;
            const { group, groupIndex, kind } = match;
            const exposedPort = kind === "external"
              ? group.port
              : (group.exposePort || packagedNodeExposePort(branch, "internal", groupIndex));
            const payloadNode = exposedPort && terminalSides(branch).includes(exposedPort)
              ? lookup.get(terminalKey(branch.id, exposedPort))
              : (kind === "internal"
                ? packagedInternalNodeId(branch, group, groupIndex)
                : packagedHiddenNodeId(branch, "external", groupIndex));
            if (!payloadNode || !allNodes.has(payloadNode)) return null;
            return {
              side: node.side || `D${groupIndex + 1}`,
              node_id: payloadNode,
              display_name: nodeDisplayName(payloadNode) || group.display || node.display_name || payloadNode,
              dummy_role: "isolated_dummy_internal"
            };
          }).filter(Boolean);
          if (dummy_nodes.length) {
            blocks.push({
              element_type: "dummy_node_block",
              block_id: `${branch.name || branch.id}:${block.block_id || "N-Dummy"}`,
              dimension: dummy_nodes.length,
              fixed_conductance: block.fixed_conductance || "G_EPSILON",
              forced_elimination: true,
              recoverable: false,
              dummy_nodes
            });
          }
        });
      });

      return blocks;
    }

    function multiCaseExportPayload() {
      const branches = multiCaseEligibleBranches();
      ensureMultiCaseProfilesText(branches);
      const runtimeBranches = runtimeMutableCaseBranches(branches);
      const runtimeBaseCaseMap = Object.fromEntries(runtimeBranches.map(branch => [branch.id, 0]));
      const profiles = parseMultiCaseProfiles();
      const case_profiles = profiles.map((profile, index) => {
        const payload = payloadForCaseProfile(profile, runtimeBaseCaseMap);
        const dummy_finalization = dummyFinalizationForCaseProfile(profile, payload);
        return {
          name: profile.name || `Case ${index + 1}`,
          comment: profile.comment || "",
          case_map: profile.case_map || {},
          payload,
          ...(dummy_finalization ? { dummy_finalization } : {})
        };
      });
      const runtime_case_groups = runtimeBranches.map(branch => ({
        branch_id: branch.id,
        name: branch.name || branch.id,
        kind: branch.kind,
        case_id_symbol: `runtime_${cIdentifier(branch.name || branch.id || "case")}_case_id`,
        cases: (branch.switchCases || []).map((item, index) => ({
          index,
          name: item.name || `Case ${index + 1}`,
          payloads: profiles.map(profile => payloadForCaseProfile(profile, { [branch.id]: index }))
        }))
      }));
      const common_dummy_internal_nodes = [...new Set(case_profiles.flatMap(profile =>
        (profile.payload?.dummy_node_blocks || []).flatMap(block =>
          (block.dummy_nodes || []).map(node => node.node_id).filter(Boolean)
        )
      ))];
      return {
        mode: "multi_case_c_export",
        case_id_symbol: state.multiCaseIdSymbol || "case_id",
        runtime_case_groups,
        display_mode: state.optimizedEliminationDisplay || "compact",
        simplify_level: state.optimizedEliminationSimplify || "light",
        assume_spd: state.optimizedEliminationAssumeSpd !== false,
        use_suggested_order: state.optimizedEliminationUseSuggestedOrder !== false,
        eligible_branches: branches.map(branch => ({
          id: branch.id,
          name: branch.name,
          kind: branch.kind,
          case_count: branch.switchCases?.length || 0
        })),
        common_dummy_internal_nodes,
        case_profiles
      };
    }

    async function requestMultiCaseCExport(payload) {
      const urls = [
        ...localApiUrls("/multi-case-c-export"),
        ...localApiUrls("/optimized-elimination")
      ];
      let lastError = null;
      for (const url of urls) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || result.ok === false) {
            const message = result.error || optText("多Case C导出失败", "Multi-case C export failed");
            const isMissingRoute = response.status === 404 || String(message).toLowerCase() === "not found";
            throw Object.assign(new Error(message), { backendError: !isMissingRoute });
          }
          return result;
        } catch (error) {
          if (error.backendError) throw error;
          lastError = error;
        }
      }
      throw lastError || new Error(optText("多Case C导出失败", "Multi-case C export failed"));
    }

    function scheduleMathPrecompute() {
      if (mathPrecomputeTimer) window.clearTimeout(mathPrecomputeTimer);
      const token = mathPrecomputeToken;
      mathPrecomputeTimer = window.setTimeout(() => {
        mathPrecomputeTimer = null;
        precomputeReducedAndOptimized(token).catch(() => {});
      }, 250);
    }

    async function precomputeReducedAndOptimized(token) {
      const basePayload = optimizedEliminationPayload();
      if (optimizedStaticMessage(basePayload)) return;
      const key = optimizedEliminationCacheKey(basePayload);
      const cachedEntry = cacheGet(optimizedEliminationCache, key);
      if (cachedEntry?.result || cachedEntry?.pending) return;
      const reducedDependency = cachedReducedDependencyAnalysis(basePayload);
      if (!reducedDependency) return;
      const optimizedPayload = reducedDependency
        ? { ...basePayload, reduced_dependency_analysis: reducedDependency }
        : basePayload;
      const pending = requestOptimizedElimination(optimizedPayload).then(result => {
        const current = optimizedEliminationCache.get(key);
        if (current?.pending === pending) cacheSet(optimizedEliminationCache, key, { result, pending: null });
        return result;
      }).catch(error => {
        const current = optimizedEliminationCache.get(key);
        if (current?.pending === pending) optimizedEliminationCache.delete(key);
        throw error;
      });
      cacheSet(optimizedEliminationCache, key, { result: null, pending });
      await pending;
    }
