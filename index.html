        downloadJson(data, filename);
        statusEl.textContent = optText(
          "保存路径选择器不可用，已改用浏览器下载。",
          "The save-path picker is unavailable, so the JSON was downloaded instead."
        );
      }
    }

    async function copyTextToClipboard(text, fallbackElement = null) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (error) {
        if (fallbackElement) {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(fallbackElement);
          selection.removeAllRanges();
          selection.addRange(range);
          document.execCommand("copy");
          selection.removeAllRanges();
          return true;
        }
        return false;
      }
    }

    function updateOutputMinimapFor(panel, body, minimap, content, thumb) {
      const enabled = outputMinimapEnabled(body);
      panel.classList.toggle("has-minimap", enabled);
      if (!enabled) {
        content.innerHTML = "";
        thumb.style.display = "none";
        return;
      }

      const scrollHeight = Math.max(1, body.scrollHeight);
      const minimapHeight = Math.max(1, content.clientHeight);
      const cards = Array.from(body.querySelectorAll(".formula-card"));
      const marks = cards.length ? cards : Array.from(body.querySelectorAll("pre, .code"));
      content.innerHTML = marks.map(item => {
        const top = Math.max(0, (item.offsetTop / scrollHeight) * minimapHeight);
        const height = Math.max(3, (item.offsetHeight / scrollHeight) * minimapHeight);
        const isMatrix = Boolean(item.querySelector?.(".matrix-equation, .actual-block-preview, .ihis-block-preview"));
        const isWarning = item.classList?.contains("validation-warning");
        const classes = ["output-minimap-mark", isMatrix ? "matrix" : "", isWarning ? "warning" : ""].filter(Boolean).join(" ");
        return `<div class="${classes}" style="top:${top.toFixed(2)}px;height:${height.toFixed(2)}px"></div>`;
      }).join("");
      updateOutputMinimapThumbFor(panel, body, minimap, thumb);
    }

    function updateOutputMinimapThumbFor(panel, body, minimap, thumb) {
      if (!panel.classList.contains("has-minimap")) return;
      const trackHeight = Math.max(1, minimap.clientHeight - 4);
      const trackWidth = Math.max(1, minimap.clientWidth - 4);
      const scrollHeight = Math.max(1, body.scrollHeight);
      const scrollWidth = Math.max(1, body.scrollWidth);
      const viewportRatio = Math.min(1, body.clientHeight / scrollHeight);
      const viewportRatioX = Math.min(1, body.clientWidth / scrollWidth);
      const thumbHeight = Math.max(20, trackHeight * viewportRatio);
      const thumbWidth = Math.max(16, trackWidth * viewportRatioX);
      const maxTop = Math.max(0, trackHeight - thumbHeight);
      const maxLeft = Math.max(0, trackWidth - thumbWidth);
      const maxScroll = Math.max(1, body.scrollHeight - body.clientHeight);
      const maxScrollX = Math.max(1, body.scrollWidth - body.clientWidth);
      const thumbTop = Math.min(maxTop, (body.scrollTop / maxScroll) * maxTop);
      const thumbLeft = Math.min(maxLeft, (body.scrollLeft / maxScrollX) * maxLeft);
      thumb.style.display = "block";
      thumb.style.height = `${thumbHeight}px`;
      thumb.style.width = `${thumbWidth}px`;
      thumb.style.transform = `translate(${thumbLeft + 2}px, ${thumbTop + 2}px)`;
    }

    function scrollOutputFromMinimap(clientX, clientY, panel = outputPanel, body = outputText, minimap = outputMinimap) {
      if (!panel.classList.contains("has-minimap")) return;
      const rect = minimap.getBoundingClientRect();
      const ratioX = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
      const ratioY = Math.max(0, Math.min(1, (clientY - rect.top) / Math.max(1, rect.height)));
      body.scrollLeft = ratioX * Math.max(0, body.scrollWidth - body.clientWidth);
      body.scrollTop = ratioY * Math.max(0, body.scrollHeight - body.clientHeight);
    }

    function pythonStringList(items) {
      return `[${items.map(item => JSON.stringify(String(item))).join(", ")}]`;
    }

    function pythonRecoveryExpression(row, history, externalNames) {
      const terms = row
        .map((coeff, index) => isZero(coeff) ? "" : `(${coeff})*V_${externalNames[index]}`)
        .filter(Boolean);
      if (!isZero(history)) terms.push(`(${history})`);
      return terms.length ? terms.join(" + ") : "0";
    }

    function appendPythonReductionSection(lines, payload, result = null) {
      const displayNames = payload.node_display_names || {};
      const allNames = payload.all_nodes.map(node => displayNames[node] || nodeDisplayName(node));
      const externalNames = payload.external_nodes.map(node => displayNames[node] || nodeDisplayName(node));
      const internalNames = payload.internal_nodes.map(node => displayNames[node] || nodeDisplayName(node));

      lines.push("# Global system before node reduction");
      lines.push(`all_nodes = ${pythonStringList(allNames)}`);
      lines.push(`external_nodes = ${pythonStringList(externalNames)}`);
      lines.push(`internal_nodes = ${pythonStringList(internalNames)}`);
      lines.push(`G_full = sp.Matrix(${matrixLiteral(payload.G_full)})`);
      lines.push(`Ihis_full = sp.Matrix(${vectorLiteral(payload.Ihis_full)})`);
      lines.push("");
      lines.push('print("Before reduction: G_full")');
      lines.push("print(G_full)");
      lines.push('print("Before reduction: Ihis_full")');
      lines.push("print(Ihis_full)");
      lines.push("");

      if (!payload.internal_nodes.length) {
        lines.push("# No internal nodes are selected, so there is no reduced system yet.");
        lines.push("");
        return;
      }
      if (!payload.external_nodes.length) {
        lines.push("# At least one external node must remain before reduction can be computed.");
        lines.push("");
        return;
      }
      if (!result) {
        lines.push("# Reduced system is being computed by the local SymPy backend...");
        lines.push("");
        return;
      }

      const reducedExternalNames = result.external_nodes.map(node => displayNames[node] || nodeDisplayName(node));
      const reducedInternalNames = result.internal_nodes.map(node => displayNames[node] || nodeDisplayName(node));

      lines.push("# Global system after eliminating internal nodes");
      lines.push(`reduced_external_nodes = ${pythonStringList(reducedExternalNames)}`);
      lines.push(`eliminated_internal_nodes = ${pythonStringList(reducedInternalNames)}`);
      lines.push(`G_red = sp.Matrix(${matrixLiteral(result.G_red)})`);
      lines.push(`Ihis_red = sp.Matrix(${vectorLiteral(result.Ihis_red)})`);
      lines.push("");
      lines.push('print("After reduction: G_red")');
      lines.push("print(G_red)");
      lines.push('print("After reduction: Ihis_red")');
      lines.push("print(Ihis_red)");
      lines.push("");
      lines.push("# Eliminated internal-node voltage recovery");
      lines.push("# V_internal = K_v * V_external + K_h");
      lines.push(`K_v = sp.Matrix(${matrixLiteral(result.K_v)})`);
      lines.push(`K_h = sp.Matrix(${vectorLiteral(result.K_h)})`);
      lines.push("internal_voltage_recovery = {");
      reducedInternalNames.forEach((name, index) => {
        const expression = pythonRecoveryExpression(result.K_v[index] || [], result.K_h[index], reducedExternalNames);
        lines.push(`    ${JSON.stringify(`V_${name}`)}: ${JSON.stringify(expression)},`);
      });
      lines.push("}");
      lines.push('print("Eliminated internal-node voltage recovery")');
      lines.push("for node, expression in internal_voltage_recovery.items():");
      lines.push('    print(f"{node} = {expression}")');
      lines.push("");
    }

    function collectPythonDraftSymbolNames(payload, result = null) {
      const reserved = new Set([
        "Abs", "False", "None", "True", "acos", "asin", "atan", "cos", "cosh",
        "def", "elif", "else", "exp", "for", "from", "if", "import", "in",
        "lambda", "log", "not", "or", "print", "return", "sin", "sinh", "sp",
        "sqrt", "tan", "tanh"
      ]);
      const names = new Set();
      const addText = text => {
        String(text || "").replace(/\b[A-Za-z_]\w*\b/g, name => {
          if (!reserved.has(name)) names.add(name);
          return name;
        });
      };
      state.branches.forEach(branch => {
        addText(branchValue(branch, "g"));
        addText(branchValue(branch, "ihis"));
        addText(branchValue(branch, "gMatrix"));
        addText(branchValue(branch, "ihisVector"));
        if (branch.kind === "current_source") {
          parseCurrentSourceControlTerms(branch).forEach(term => {
            if (!term.error) addText(term.coefficient);
          });
          addText(currentSourceIhis(branch));
        } else if (branch.kind === "voltage_source_series_r") {
          addText(branch.voltage);
          addText(voltageSourceSeriesConductance(branch));
        }
        (branch.switchCases || []).forEach(item => {
          switchedValueFields(branch).forEach(field => addText(item[field]));
        });
        (branch.currents || []).forEach(current => {
          addText(current.g);
          addText(current.ihis);
        });
      });
      (payload.G_full || []).forEach(row => row.forEach(addText));
      (payload.Ihis_full || []).forEach(addText);
      if (result) {
        (result.G_red || []).forEach(row => row.forEach(addText));
        (result.Ihis_red || []).forEach(addText);
        (result.K_v || []).forEach(row => row.forEach(addText));
        (result.K_h || []).forEach(addText);
      }
      return [...names].sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
    }

    function appendPythonSymbolDeclarations(lines, symbolNames) {
      if (!symbolNames.length) return;
      lines.push("# Symbol declarations inferred from the current circuit");
      if (symbolNames.length === 1) {
        lines.push(`${symbolNames[0]} = sp.symbols(${JSON.stringify(symbolNames[0])})`);
      } else {
        lines.push(`${symbolNames.join(", ")} = sp.symbols(${JSON.stringify(symbolNames.join(" "))})`);
      }
      lines.push("");
    }
